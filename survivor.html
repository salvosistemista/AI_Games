<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terra Desolata - Survival Idle</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --accent: #d4a373;
      --danger: #e63946;
      --success: #2a9d8f;
      --sleep-color: #4a6fa5;
      --hp-bar: #e63946;
      --food-bar: #e76f51;
      --energy-current: #2a9d8f;
      --energy-max-cap: #7d6b38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    /* Area FISSA Superiore */
    .top-fixed-section {
      flex-shrink: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Barre di stato */
    .status-panel {
      padding: 8px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .stat-label {
      width: 75px;
      font-weight: 500;
    }

    .bar-bg {
      flex: 1;
      height: 9px;
      background: #2b2b2b;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .fill-hp { background: var(--hp-bar); width: 100%; }
    .fill-food { background: var(--food-bar); width: 100%; }

    .bar-energy-container {
      flex: 1;
      height: 9px;
      background: #202020;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
      position: relative;
    }

    #bar-energy-max {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--energy-max-cap);
      transition: width 0.3s ease;
      z-index: 1;
    }

    #bar-energy-cur {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--energy-current);
      transition: width 0.3s ease;
      z-index: 2;
    }

    .stat-val {
      width: 55px;
      text-align: right;
      font-size: 0.75rem;
    }

    .condition-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .condition-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2b2b2b;
      color: var(--text-muted);
    }

    .condition-tag.sick { background: #541212; color: #ff9999; }
    .condition-tag.sleeping { background: #1c2b42; color: #8da9c4; }

    .time-tracker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(0,0,0,0.25);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Diario di bordo */
    #log-container {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 0.88rem;
      line-height: 1.4;
      background: var(--bg-color);
      -webkit-overflow-scrolling: touch;
    }

    .log-entry {
      border-left: 2px solid var(--border-color);
      padding-left: 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .log-entry.danger { border-color: var(--danger); color: #ffadad; }
    .log-entry.success { border-color: var(--success); color: #b7e4c7; }
    .log-entry.idle { border-color: #666; color: var(--text-muted); }
    .log-entry.sleep { border-color: var(--sleep-color); color: #a4c2f4; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Area FISSA Inferiore */
    .bottom-fixed-section {
      flex-shrink: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      z-index: 10;
    }

    .inventory-section {
      padding: 10px 16px;
    }

    .inventory-header {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: bold;
    }

    .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 105px;
      overflow-y: auto;
    }

    .inv-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #262626;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    .inv-item-actions button {
      background: #3a3a3a;
      border: none;
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 5px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .inv-item-actions button:hover { background: #505050; }

    /* Comandi */
    .controls {
      padding: 10px 16px 14px 16px;
      background: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .main-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-main {
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 11px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-main:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-main:active:not(:disabled) {
      background: #383838;
    }

    .btn-move {
      background: #1f3b34;
      border-color: #2a9d8f;
      color: #b7e4c7;
    }

    .btn-sleep {
      background: #1a2636;
      border-color: var(--sleep-color);
      color: #8da9c4;
    }

    .btn-danger-opt {
      background: #3a1c1c;
      border-color: var(--danger);
      color: #ff9999;
    }

    .action-sub-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-sub-grid button {
      font-size: 0.8rem;
      padding: 8px 10px;
    }

    /* Finestre Modali */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-content h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    /* Tabella Classifica */
    .leaderboard-table-container {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #181818;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: left;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #282828;
    }

    .leaderboard-table th {
      background: #242424;
      color: var(--accent);
      position: sticky;
      top: 0;
    }

    .leaderboard-empty {
      padding: 16px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div id="game-container">
  
  <!-- SEZIONE FISSA IN ALTO -->
  <div class="top-fixed-section">
    <header>
      <h1>Terra Desolata</h1>
      <button class="btn-icon" id="btn-options" title="Opzioni">⚙ Opzioni</button>
    </header>

    <div class="status-panel">
      <!-- Riga Tempo Trascorso -->
      <div class="time-tracker-row">
        <span>Sopravvissuto:</span>
        <strong id="val-time-elapsed">0g 0h 0m</strong>
      </div>

      <div class="stat-row">
        <span class="stat-label">Salute</span>
        <div class="bar-bg"><div id="bar-hp" class="bar-fill fill-hp"></div></div>
        <span id="val-hp" class="stat-val">100/100</span>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">Sazietà</span>
        <div class="bar-bg"><div id="bar-food" class="bar-fill fill-food"></div></div>
        <span id="val-food" class="stat-val">80/100</span>
      </div>

      <div class="stat-row">
        <span class="stat-label">Energia</span>
        <div class="bar-energy-container" title="Verde: attuale, Ocra: limite massimo">
          <div id="bar-energy-max"></div>
          <div id="bar-energy-cur"></div>
        </div>
        <span id="val-energy" class="stat-val">100/100</span>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
        <div class="condition-badges">
          <span id="condition-tag" class="condition-tag">In salute</span>
          <span id="sleep-tag" class="condition-tag sleeping" style="display:none;">Addormentato</span>
        </div>
        <span style="font-size:0.8rem; color:var(--text-muted);">Km percorsi: <strong id="val-km" style="color:var(--text-main);">0</strong></span>
      </div>
    </div>
  </div>

  <!-- AREA CENTRALE DIARIO/LOG -->
  <div id="log-container"></div>

  <!-- SEZIONE FISSA IN BASSO -->
  <div class="bottom-fixed-section">
    <div class="inventory-section">
      <div class="inventory-header">
        <span>Zaino</span>
        <span id="val-inventory-slots">0 / 10 Slot</span>
      </div>
      <div class="inventory-list" id="inventory-list"></div>
    </div>

    <div class="controls">
      <div id="context-actions" class="action-sub-grid" style="display:none; margin-bottom: 4px;"></div>
      <div class="main-actions-grid">
        <button id="btn-sleep-toggle" class="btn-main btn-sleep">Dormi</button>
        <button id="btn-move" class="btn-main btn-move">Avanza (+1 Km)</button>
      </div>
    </div>
  </div>

</div>

<!-- Finestra Menu Opzioni -->
<div id="modal-options" class="modal">
  <div class="modal-content">
    <h2>Opzioni</h2>
    <button class="btn-main" id="btn-open-leaderboard">🏆 Classifica</button>
    <button class="btn-main" id="btn-fullscreen">Schermo Intero</button>
    <button class="btn-main btn-danger-opt" id="btn-reset-game">Ricomincia Partita</button>
    <button class="btn-main" id="btn-close-options">Chiudi</button>
  </div>
</div>

<!-- Finestra Schermata Classifica -->
<div id="modal-leaderboard" class="modal">
  <div class="modal-content">
    <h2>🏆 Migliori 10 Sopravvissuti</h2>
    <div class="leaderboard-table-container">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Durata</th>
            <th>Km</th>
            <th>Data Morte</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <div id="leaderboard-empty" class="leaderboard-empty" style="display:none;">Nessun decesso memorizzato finora.</div>
    </div>
    <button class="btn-main" id="btn-close-leaderboard">Indietro</button>
  </div>
</div>

<script>
  /* =========================================================================
     CONFIGURAZIONE COSTANTI & TEMPISTICHE (IN SECONDI)
     ========================================================================= */
  const STORAGE_KEY = "terra_desolata_save_v4";
  const LEADERBOARD_KEY = "terra_desolata_leaderboard";

  const FOOD_TICK_SEC = 480;
  const AWAKE_CUR_ENERGY_DECAY_SEC = 540;
  const AWAKE_MAX_ENERGY_DECAY_SEC = 600;
  const SLEEP_MAX_ENERGY_GAIN_SEC = 240;
  const SLEEP_CUR_ENERGY_GAIN_SEC = 360;

  const defaultPlayerState = {
    hp: 100,
    maxHp: 100,
    food: 80,
    maxFood: 100,
    energy: 100,
    maxEnergy: 100,
    km: 0,
    sick: false,
    isSleeping: false,
    maxSlots: 10,
    survivalSeconds: 0, // Tempo totale sopravvissuto in secondi
    isDead: false,
    lastActiveTimestamp: Date.now(),
    secFood: 0,
    secAwakeCur: 0,
    secAwakeMax: 0,
    secSleepCur: 0,
    secSleepMax: 0,
    inventory: [
      { id: "canned_food", name: "Cibo in scatola", type: "food", val: 35, qty: 2 },
      { id: "medkit", name: "Bende e disinfettante", type: "cure", val: 30, qty: 1 },
      { id: "scrap", name: "Rottami metallici", type: "material", qty: 3 }
    ]
  };

  let player = JSON.parse(JSON.stringify(defaultPlayerState));
  let currentLocation = null;

  /* =========================================================================
     FORMATTAZIONE TEMPO
     ========================================================================= */
  function formatDuration(totalSeconds) {
    const d = Math.floor(totalSeconds / 86400);
    const h = Math.floor((totalSeconds % 86400) / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    return `${d}g ${h}h ${m}m`;
  }

  /* =========================================================================
     REGOLE ENERGIA
     ========================================================================= */
  function enforceEnergyCaps() {
    player.maxEnergy = Math.max(0, Math.min(100, player.maxEnergy));
    if (player.energy > player.maxEnergy) {
      player.energy = player.maxEnergy;
    }
    player.energy = Math.max(0, player.energy);
  }

  /* =========================================================================
     LOGICA DI SCHIVATA (SALUTE 85-100 & ENERGIA > 70 => 50% SCHIVATA)
     ========================================================================= */
  function canAttemptDodge() {
    return player.hp >= 85 && player.hp <= 100 && player.energy > 70;
  }

  function tryDodgeAttack(enemyType) {
    if (canAttemptDodge() && Math.random() < 0.5) {
      log(`I tuoi riflessi sono pronti (Salute ed Energia ottimali): schivi agilmente l'attacco di ${enemyType}!`, "success");
      return true;
    }
    return false;
  }

  /* =========================================================================
     SALVATAGGIO & CARICAMENTO OFFLINE
     ========================================================================= */
  function saveGame() {
    player.lastActiveTimestamp = Date.now();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
    } catch (e) {
      console.warn("Impossibile salvare su LocalStorage", e);
    }
  }

  function loadGameAndSimulateOffline() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      log("Ti trovi in una landa desolata. La sopravvivenza dipenderà dalle tue scelte.");
      log("Riposare dormendo ripristina la resistenza massima e corrente, bloccando la fame.");
      saveGame();
      return;
    }

    try {
      const loaded = JSON.parse(saved);
      player = Object.assign({}, defaultPlayerState, loaded);
      player.maxSlots = 10;

      const now = Date.now();
      const elapsedSeconds = Math.max(0, Math.floor((now - (player.lastActiveTimestamp || now)) / 1000));
      player.lastActiveTimestamp = now;

      if (!player.isDead && elapsedSeconds > 10) {
        simulateOfflineProgress(elapsedSeconds);
      } else if (!player.isDead) {
        log("Bentornato nelle rovine.");
      }
    } catch (e) {
      console.error("Errore nel caricamento del salvataggio", e);
      player = JSON.parse(JSON.stringify(defaultPlayerState));
    }
    enforceEnergyCaps();
  }

  function simulateOfflineProgress(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    log(`Sei rimasto via per circa ${minutes > 0 ? minutes + " minuti" : totalSeconds + " secondi"}.`, "idle");

    // Incrementa il tempo complessivo di sopravvivenza
    player.survivalSeconds = (player.survivalSeconds || 0) + totalSeconds;

    if (player.isSleeping) {
      const totalSleepMaxSec = (player.secSleepMax || 0) + totalSeconds;
      const maxGains = Math.floor(totalSleepMaxSec / SLEEP_MAX_ENERGY_GAIN_SEC);
      player.secSleepMax = totalSleepMaxSec % SLEEP_MAX_ENERGY_GAIN_SEC;
      player.maxEnergy = Math.min(100, player.maxEnergy + maxGains);

      const totalSleepCurSec = (player.secSleepCur || 0) + totalSeconds;
      const curGains = Math.floor(totalSleepCurSec / SLEEP_CUR_ENERGY_GAIN_SEC);
      player.secSleepCur = totalSleepCurSec % SLEEP_CUR_ENERGY_GAIN_SEC;
      player.energy = Math.min(player.maxEnergy, player.energy + curGains);

      enforceEnergyCaps();
      log(`Durante il sonno hai recuperato energie (Massima: ${Math.round(player.maxEnergy)}, Attuale: ${Math.round(player.energy)}).`, "sleep");

      if (player.sick) {
        const sickDmg = totalSeconds * 0.15;
        player.hp = Math.max(0, player.hp - sickDmg);
        log(`L'infezione ha continuato a debilitarti durante la notte (-${Math.round(sickDmg)} HP).`, "danger");
      }
    } else {
      const totalFoodSec = (player.secFood || 0) + totalSeconds;
      const foodLoss = Math.floor(totalFoodSec / FOOD_TICK_SEC);
      player.secFood = totalFoodSec % FOOD_TICK_SEC;

      if (foodLoss > 0) {
        const foodBefore = player.food;
        player.food = Math.max(0, player.food - foodLoss);
        const actualLoss = foodBefore - player.food;
        log(`Il tempo trascorso ti ha affamato (-${actualLoss} Sazietà).`, "idle");

        if (player.food <= 0) {
          const starvedUnits = foodLoss - actualLoss;
          const starvationDamage = starvedUnits * 10;
          player.hp = Math.max(0, player.hp - starvationDamage);
          log(`Sei rimasto a lungo senza provviste! (-${Math.round(starvationDamage)} HP per inedia).`, "danger");
        }
      }

      const totalAwakeMaxSec = (player.secAwakeMax || 0) + totalSeconds;
      const maxLoss = Math.floor(totalAwakeMaxSec / AWAKE_MAX_ENERGY_DECAY_SEC);
      player.secAwakeMax = totalAwakeMaxSec % AWAKE_MAX_ENERGY_DECAY_SEC;
      player.maxEnergy = Math.max(0, player.maxEnergy - maxLoss);

      const totalAwakeCurSec = (player.secAwakeCur || 0) + totalSeconds;
      const curLoss = Math.floor(totalAwakeCurSec / AWAKE_CUR_ENERGY_DECAY_SEC);
      player.secAwakeCur = totalAwakeCurSec % AWAKE_CUR_ENERGY_DECAY_SEC;
      player.energy = Math.max(0, player.energy - curLoss);

      enforceEnergyCaps();

      if (player.sick) {
        const sickDmg = totalSeconds * 0.2;
        player.hp = Math.max(0, player.hp - sickDmg);
        log(`La malattia si è aggravata (-${Math.round(sickDmg)} HP).`, "danger");
      }
    }

    checkDeath();
    saveGame();
  }

  /* =========================================================================
     LOOP DI GIOCO REAL-TIME (OGNI SECONDO)
     ========================================================================= */
  setInterval(() => {
    gameTick();
  }, 1000);

  function gameTick() {
    if (player.hp <= 0) return;

    player.survivalSeconds = (player.survivalSeconds || 0) + 1;

    if (player.isSleeping) {
      player.secSleepMax = (player.secSleepMax || 0) + 1;
      if (player.secSleepMax >= SLEEP_MAX_ENERGY_GAIN_SEC) {
        if (player.maxEnergy < 100) {
          player.maxEnergy = Math.min(100, player.maxEnergy + 1);
        }
        player.secSleepMax = 0;
      }

      player.secSleepCur = (player.secSleepCur || 0) + 1;
      if (player.secSleepCur >= SLEEP_CUR_ENERGY_GAIN_SEC) {
        if (player.energy < player.maxEnergy) {
          player.energy = Math.min(player.maxEnergy, player.energy + 1);
        }
        player.secSleepCur = 0;
      }

      player.secAwakeCur = 0;
      player.secAwakeMax = 0;
      player.secFood = 0;

    } else {
      if (player.food > 0) {
        player.secFood = (player.secFood || 0) + 1;
        if (player.secFood >= FOOD_TICK_SEC) {
          player.food = Math.max(0, player.food - 1);
          player.secFood = 0;
        }
      } else {
        player.hp = Math.max(0, player.hp - 0.2);
        if (Math.random() < 0.04) log("Stai morendo di fame! Trova cibo al più presto.", "danger");
      }

      player.secAwakeMax = (player.secAwakeMax || 0) + 1;
      if (player.secAwakeMax >= AWAKE_MAX_ENERGY_DECAY_SEC) {
        player.maxEnergy = Math.max(0, player.maxEnergy - 1);
        player.secAwakeMax = 0;
      }

      player.secAwakeCur = (player.secAwakeCur || 0) + 1;
      if (player.secAwakeCur >= AWAKE_CUR_ENERGY_DECAY_SEC) {
        player.energy = Math.max(0, player.energy - 1);
        player.secAwakeCur = 0;
      }

      player.secSleepCur = 0;
      player.secSleepMax = 0;
    }

    enforceEnergyCaps();

    if (player.sick) {
      player.hp = Math.max(0, player.hp - 0.2);
      if (Math.random() < 0.02) log("L'infezione ti fa tremare e perdere forze...", "danger");
    } else if (player.food > 50 && player.energy > 50 && player.hp < player.maxHp) {
      player.hp = Math.min(player.maxHp, player.hp + 0.2);
    }

    checkDeath();
    updateUI();
    saveGame();
  }

  /* =========================================================================
     MECCANICA DEL SONNO
     ========================================================================= */
  function toggleSleep() {
    if (player.hp <= 0) return;

    player.isSleeping = !player.isSleeping;

    if (player.isSleeping) {
      log("Ti corichi per dormire: la fame si ferma, l'energia massima e corrente iniziano a rigenerarsi.", "sleep");
      clearContextActions();
    } else {
      log("Ti svegli pronto all'azione.", "idle");
    }

    saveGame();
    updateUI();
  }

  /* =========================================================================
     MOVIMENTO ED EVENTI
     ========================================================================= */
  function move() {
    if (player.isSleeping) {
      log("Non puoi camminare mentre stai dormendo!", "idle");
      return;
    }

    if (player.energy < 5) {
      log("Non hai abbastanza energia corrente per camminare (richiesti 5). Dormi o mangia per recuperare.", "danger");
      return;
    }

    player.km += 1;
    player.maxEnergy = Math.max(0, player.maxEnergy - 5);
    player.energy = Math.max(0, player.energy - 5);
    enforceEnergyCaps();

    currentLocation = null;
    clearContextActions();

    log(`Avanzi tra le rovine. Chilometro ${player.km} (-5 En. Max, -5 En. Corrente).`);

    const dice = Math.random();
    if (dice < 0.28) {
      handleLocationDiscovery();
    } else if (dice < 0.48) {
      handleAnimalEncounter();
    } else if (dice < 0.68) {
      handleHumanEncounter();
    } else if (dice < 0.80) {
      handleHazardEncounter();
    } else {
      log("Solo macerie e vento freddo lungo la via desolata.", "idle");
    }

    checkDeath();
    saveGame();
    updateUI();
  }

  function handleLocationDiscovery() {
    const locs = [
      { name: "una vecchia casa abbandonata", type: "casa" },
      { name: "i resti di un accampamento improvvisato", type: "campo" },
      { name: "una discarica a cielo aperto", type: "discarica" }
    ];
    const loc = locs[Math.floor(Math.random() * locs.length)];
    loc.searchesDone = 0;
    loc.maxSearches = Math.random() < 0.5 ? 2 : 1;

    currentLocation = loc;
    log(`Scorgi ${loc.name}. Puoi perlustrare la zona.`, "success");

    setContextActions([
      { label: "Perquisisci zona", action: () => scavengeLocation() }
    ]);
  }

  function scavengeLocation() {
    if (player.isSleeping || !currentLocation) return;
    if (player.energy < 3) {
      log("Sei troppo stanco per frugare a fondo (richiesti 3 Energia Corrente).", "danger");
      return;
    }
    player.energy = Math.max(0, player.energy - 3);

    const lootRoll = Math.random();
    if (lootRoll < 0.35) {
      addItem("scrap", "Rottami metallici", "material", 1);
      log("Hai recuperato del metallo utile dai rottami.", "success");
    } else if (lootRoll < 0.65) {
      addItem("canned_food", "Cibo in scatola", "food", 35, 1);
      log("Hai scovato cibo in scatola ben sigillato!", "success");
    } else if (lootRoll < 0.85) {
      addItem("medkit", "Bende e disinfettante", "cure", 30, 1);
      log("Trovi una cassetta di pronto soccorso integra.", "success");
    } else {
      log("Hai frugato ovunque ma non è rimasto niente di utile.", "idle");
    }

    currentLocation.searchesDone += 1;

    if (currentLocation.searchesDone < currentLocation.maxSearches) {
      log("Sembra esserci un'altra area non ancora esplorata in questo posto. Puoi perlustrare di nuovo!", "idle");
      setContextActions([
        { label: "Perquisisci ancora", action: () => scavengeLocation() }
      ]);
    } else {
      clearContextActions();
      currentLocation = null;
    }

    saveGame();
    updateUI();
  }

  function handleAnimalEncounter() {
    if (Math.random() < 0.5) {
      if (tryDodgeAttack("un predatore selvatico")) {
        return;
      }
      const dmg = Math.floor(Math.random() * 15) + 10;
      player.hp = Math.max(0, player.hp - dmg);
      log(`Un predatore selvatico ti assale! Subisci ${dmg} danni prima di respingerlo.`, "danger");
    } else {
      log("Una volpe magra ti osserva cauta per poi fuggire tra i calcinacci.", "idle");
    }
  }

  function handleHumanEncounter() {
    if (Math.random() < 0.5) {
      if (tryDodgeAttack("un predone armato")) {
        return;
      }
      const dmg = Math.floor(Math.random() * 20) + 10;
      player.hp = Math.max(0, player.hp - dmg);
      log(`Un predone armato ti aggredisce! Nello scontro subisci ${dmg} danni prima di fuggire.`, "danger");
    } else {
      log("Incontri un viandante disposto a fare affari. Cosa vuoi scambiare?", "success");
      renderTradeOptions();
    }
  }

  function renderTradeOptions() {
    setContextActions([
      { label: "Baratta: 2 Rottami ➔ 1 Cibo", action: () => executeTrade("scrap", 2, "canned_food", "Cibo in scatola", "food", 35, 1) },
      { label: "Baratta: 2 Cibo ➔ 1 Bende e disinfettante", action: () => executeTrade("canned_food", 2, "medkit", "Bende e disinfettante", "cure", 30, 1) },
      { label: "Baratta: 1 Bende e disinfettante ➔ 2 Cibo", action: () => executeTrade("medkit", 1, "canned_food", "Cibo in scatola", "food", 35, 2) }
    ]);
  }

  function executeTrade(giveId, giveQty, receiveId, receiveName, receiveType, receiveVal, receiveQty) {
    if (player.isSleeping) return;

    const sourceItem = player.inventory.find(i => i.id === giveId);
    if (!sourceItem || sourceItem.qty < giveQty) {
      log(`Non hai abbastanza oggetti per questo baratto (richiesti: ${giveQty}x ${giveId === 'scrap' ? 'Rottami' : giveId === 'canned_food' ? 'Cibo' : 'Bende'}).`, "danger");
      return;
    }

    const projectedSlots = (getTotalItemsCount() - giveQty) + receiveQty;
    if (projectedSlots > player.maxSlots) {
      log("Zaino colmo! Non hai abbastanza spazio per ricevere gli oggetti di questo scambio.", "danger");
      return;
    }

    removeItem(giveId, giveQty);
    addItem(receiveId, receiveName, receiveType, receiveVal, receiveQty);

    log(`Scambio completato: hai ceduto ${giveQty}x per ricevere ${receiveQty}x ${receiveName}.`, "success");
    clearContextActions();
    saveGame();
    updateUI();
  }

  function handleHazardEncounter() {
    if (!player.sick && Math.random() < 0.5) {
      player.sick = true;
      log("Inali esalazioni tossiche o polvere infetta: sei MALATO.", "danger");
    } else {
      const dmg = 8;
      player.hp = Math.max(0, player.hp - dmg);
      log(`Inciampi su lamiere arrugginite e ti procuri un taglio profondo (-${dmg} HP).`, "danger");
    }
  }

  /* =========================================================================
     INVENTARIO
     ========================================================================= */
  function getTotalItemsCount() {
    return player.inventory.reduce((sum, item) => sum + item.qty, 0);
  }

  function addItem(id, name, type, param1, param2) {
    let val = 0, qty = 1;
    if (type === "food" || type === "cure") {
      val = param1;
      qty = param2 || 1;
    } else {
      qty = param1 || 1;
    }

    if (getTotalItemsCount() + qty > player.maxSlots) {
      log("Zaino colmo! Impossibile raccogliere altro.", "danger");
      return;
    }

    const existing = player.inventory.find(i => i.id === id);
    if (existing) {
      existing.qty += qty;
    } else {
      player.inventory.push({ id, name, type, val, qty });
    }
  }

  function removeItem(id, qty = 1) {
    const item = player.inventory.find(i => i.id === id);
    if (!item) return;
    item.qty -= qty;
    if (item.qty <= 0) {
      player.inventory = player.inventory.filter(i => i.id !== id);
    }
  }

  function useItem(id) {
    if (player.isSleeping) {
      log("Devi prima svegliarti per usare gli oggetti!", "idle");
      return;
    }

    const item = player.inventory.find(i => i.id === id);
    if (!item) return;

    if (item.type === "food") {
      player.food = Math.min(player.maxFood, player.food + item.val);
      player.maxEnergy = Math.min(100, player.maxEnergy + 5);
      player.energy = Math.min(player.maxEnergy, player.energy + 30);
      enforceEnergyCaps();

      log(`Mangi ${item.name}. Sazietà +${item.val}, Energia Corrente +30, Energia Massima +5.`, "success");
      removeItem(id, 1);
    } else if (item.type === "cure") {
      let used = false;
      if (player.sick) {
        player.sick = false;
        used = true;
        log("Hai usato le medicine: infezione debellata!", "success");
      }
      if (player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + item.val);
        used = true;
        log(`Hai fasciato le ferite (+${item.val} HP).`, "success");
      }
      if (used) {
        removeItem(id, 1);
      } else {
        log("Sei già in salute, non occorre usarlo adesso.", "idle");
      }
    }
    saveGame();
    updateUI();
  }

  /* =========================================================================
     RENDERING INTERFACCIA
     ========================================================================= */
  function log(msg, type = "normal") {
    const logBox = document.getElementById("log-container");
    const entry = document.createElement("div");
    entry.className = `log-entry ${type}`;
    entry.textContent = msg;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function setContextActions(actions) {
    const box = document.getElementById("context-actions");
    box.innerHTML = "";
    if (!actions || actions.length === 0 || player.isSleeping) {
      box.style.display = "none";
      return;
    }
    actions.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "btn-main";
      btn.textContent = a.label;
      btn.onclick = a.action;
      box.appendChild(btn);
    });
    box.style.display = "flex";
  }

  function clearContextActions() {
    setContextActions([]);
  }

  function updateUI() {
    // Aggiorna tempo trascorso
    document.getElementById("val-time-elapsed").textContent = formatDuration(player.survivalSeconds || 0);

    // Salute & Sazietà
    document.getElementById("bar-hp").style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById("val-hp").textContent = `${Math.round(player.hp)}/${player.maxHp}`;

    document.getElementById("bar-food").style.width = `${(player.food / player.maxFood) * 100}%`;
    document.getElementById("val-food").textContent = `${Math.round(player.food)}/${player.maxFood}`;

    // Energia Doppia Barra
    document.getElementById("bar-energy-max").style.width = `${player.maxEnergy}%`;
    document.getElementById("bar-energy-cur").style.width = `${player.energy}%`;
    document.getElementById("val-energy").textContent = `${Math.round(player.energy)}/${Math.round(player.maxEnergy)}`;

    document.getElementById("val-km").textContent = player.km;

    // Badge
    const condTag = document.getElementById("condition-tag");
    if (player.sick) {
      condTag.textContent = "Malato";
      condTag.className = "condition-tag sick";
    } else {
      condTag.textContent = "In salute";
      condTag.className = "condition-tag";
    }

    const sleepTag = document.getElementById("sleep-tag");
    sleepTag.style.display = player.isSleeping ? "inline-block" : "none";

    const btnMove = document.getElementById("btn-move");
    const btnSleep = document.getElementById("btn-sleep-toggle");

    if (player.isDead) {
      btnMove.disabled = true;
      btnSleep.disabled = true;
      btnMove.textContent = "Deceduto";
    } else if (player.isSleeping) {
      btnMove.disabled = true;
      btnSleep.textContent = "Svegliati";
      btnSleep.style.background = "#2b3d54";
    } else {
      btnMove.disabled = player.energy < 5;
      btnSleep.textContent = "Dormi";
      btnSleep.style.background = "#1a2636";
    }

    // Zaino
    const currentSlots = getTotalItemsCount();
    document.getElementById("val-inventory-slots").textContent = `${currentSlots} / ${player.maxSlots} Slot`;

    const invList = document.getElementById("inventory-list");
    invList.innerHTML = "";

    if (player.inventory.length === 0) {
      invList.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted); padding:4px;">Lo zaino è vuoto.</span>`;
    } else {
      player.inventory.forEach(item => {
        const row = document.createElement("div");
        row.className = "inv-item";

        const nameSpan = document.createElement("span");
        nameSpan.textContent = `${item.name} x${item.qty}`;
        row.appendChild(nameSpan);

        const actions = document.createElement("div");
        actions.className = "inv-item-actions";

        if (item.type === "food" || item.type === "cure") {
          const btnUse = document.createElement("button");
          btnUse.textContent = "Usa";
          btnUse.onclick = () => useItem(item.id);
          if (player.isSleeping || player.isDead) btnUse.disabled = true;
          actions.appendChild(btnUse);
        }

        row.appendChild(actions);
        invList.appendChild(row);
      });
    }
  }

  /* =========================================================================
     GESTIONE DELLA MORTE & CLASSIFICA
     ========================================================================= */
  function recordDeathLeaderboard() {
    let leaderboard = [];
    try {
      const stored = localStorage.getItem(LEADERBOARD_KEY);
      if (stored) leaderboard = JSON.parse(stored);
    } catch (e) {
      leaderboard = [];
    }

    const deathDate = new Date().toLocaleDateString("it-IT", {
      day: "2-digit",
      month: "2-digit",
      year: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });

    leaderboard.push({
      duration: player.survivalSeconds || 0,
      km: player.km || 0,
      date: deathDate
    });

    // Ordina per durata decrescente e conserva solo le migliori 10
    leaderboard.sort((a, b) => b.duration - a.duration);
    leaderboard = leaderboard.slice(0, 10);

    try {
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
    } catch (e) {
      console.warn("Impossibile salvare la classifica", e);
    }
  }

  function checkDeath() {
    if (player.hp <= 0 && !player.isDead) {
      player.isDead = true;
      log("SEI MORTO. Le tue spoglie rimangono nella desolazione.", "danger");
      recordDeathLeaderboard();
      clearContextActions();
      saveGame();
      updateUI();
    }
  }

  function renderLeaderboard() {
    let leaderboard = [];
    try {
      const stored = localStorage.getItem(LEADERBOARD_KEY);
      if (stored) leaderboard = JSON.parse(stored);
    } catch (e) {
      leaderboard = [];
    }

    const tbody = document.getElementById("leaderboard-body");
    const emptyMsg = document.getElementById("leaderboard-empty");
    tbody.innerHTML = "";

    if (leaderboard.length === 0) {
      emptyMsg.style.display = "block";
    } else {
      emptyMsg.style.display = "none";
      leaderboard.forEach((run, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${idx + 1}</strong></td>
          <td>${formatDuration(run.duration)}</td>
          <td>${run.km} km</td>
          <td>${run.date}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  }

  function resetGame() {
    if (confirm("Vuoi azzerare la partita e ricominciare da capo? La classifica resterà salvata.")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  /* =========================================================================
     INIZIALIZZAZIONE & EVENTI
     ========================================================================= */
  document.getElementById("btn-move").addEventListener("click", move);
  document.getElementById("btn-sleep-toggle").addEventListener("click", toggleSleep);

  const modalOptions = document.getElementById("modal-options");
  const modalLeaderboard = document.getElementById("modal-leaderboard");

  document.getElementById("btn-options").onclick = () => { modalOptions.style.display = "flex"; };
  document.getElementById("btn-close-options").onclick = () => { modalOptions.style.display = "none"; };
  document.getElementById("btn-reset-game").onclick = resetGame;

  // Gestione schermata classifica
  document.getElementById("btn-open-leaderboard").onclick = () => {
    renderLeaderboard();
    modalOptions.style.display = "none";
    modalLeaderboard.style.display = "flex";
  };
  document.getElementById("btn-close-leaderboard").onclick = () => {
    modalLeaderboard.style.display = "none";
    modalOptions.style.display = "flex";
  };

  document.getElementById("btn-fullscreen").onclick = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
    modalOptions.style.display = "none";
  };

  loadGameAndSimulateOffline();
  updateUI();
</script>
</body>
