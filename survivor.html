<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terra Desolata - Survival Idle</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --accent: #d4a373;
      --danger: #e63946;
      --success: #2a9d8f;
      --sleep-color: #4a6fa5;
      --hp-bar: #e63946;
      --food-bar: #e76f51;
      --energy-current: #2a9d8f;
      --energy-max-cap: #7d6b38;
      --weapon-color: #e9c46a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    .top-fixed-section {
      flex-shrink: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .status-panel {
      padding: 8px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .stat-label {
      width: 75px;
      font-weight: 500;
    }

    .bar-bg {
      flex: 1;
      height: 9px;
      background: #2b2b2b;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .fill-hp { background: var(--hp-bar); width: 100%; }
    .fill-food { background: var(--food-bar); width: 100%; }

    .bar-energy-container {
      flex: 1;
      height: 9px;
      background: #202020;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
      position: relative;
    }

    #bar-energy-max {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--energy-max-cap);
      transition: width 0.3s ease;
      z-index: 1;
    }

    #bar-energy-cur {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--energy-current);
      transition: width 0.3s ease;
      z-index: 2;
    }

    .stat-val {
      width: 55px;
      text-align: right;
      font-size: 0.75rem;
    }

    .condition-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .condition-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2b2b2b;
      color: var(--text-muted);
    }

    .condition-tag.sick { background: #541212; color: #ff9999; }
    .condition-tag.sleeping { background: #1c2b42; color: #8da9c4; }

    .time-tracker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(0,0,0,0.25);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Slot Arma Attiva */
    .weapon-slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      background: #1a1a1a;
      border: 1px dashed var(--border-color);
      border-radius: 4px;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    .weapon-slot-row strong {
      color: var(--weapon-color);
    }

    /* Diario di bordo */
    #log-container {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 0.88rem;
      line-height: 1.4;
      background: var(--bg-color);
      -webkit-overflow-scrolling: touch;
    }

    .log-entry {
      border-left: 2px solid var(--border-color);
      padding-left: 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .log-entry.danger { border-color: var(--danger); color: #ffadad; }
    .log-entry.success { border-color: var(--success); color: #b7e4c7; }
    .log-entry.idle { border-color: #666; color: var(--text-muted); }
    .log-entry.sleep { border-color: var(--sleep-color); color: #a4c2f4; }
    .log-entry.combat { border-color: var(--weapon-color); color: #ffe6a7; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bottom-fixed-section {
      flex-shrink: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      z-index: 10;
    }

    .inventory-section {
      padding: 8px 16px;
    }

    .inventory-header {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: bold;
    }

    .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 95px;
      overflow-y: auto;
    }

    .inv-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #262626;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .inv-item-actions button {
      background: #3a3a3a;
      border: none;
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 5px;
      cursor: pointer;
      font-size: 0.74rem;
    }

    .inv-item-actions button:hover { background: #505050; }

    .controls {
      padding: 8px 16px 12px 16px;
      background: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .main-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-main {
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-main:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-main:active:not(:disabled) {
      background: #383838;
    }

    .btn-move {
      background: #1f3b34;
      border-color: #2a9d8f;
      color: #b7e4c7;
    }

    .btn-sleep {
      background: #1a2636;
      border-color: var(--sleep-color);
      color: #8da9c4;
    }

    .btn-hour-sleep {
      background: #23344d;
      border-color: #5c84b8;
      color: #c0d8f8;
      margin-bottom: 2px;
    }

    .btn-danger-opt {
      background: #3a1c1c;
      border-color: var(--danger);
      color: #ff9999;
    }

    .action-sub-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .action-sub-grid button {
      font-size: 0.8rem;
      padding: 7px 10px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-content h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .leaderboard-table-container {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #181818;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: left;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #282828;
    }

    .leaderboard-table th {
      background: #242424;
      color: var(--accent);
      position: sticky;
      top: 0;
    }

    .leaderboard-empty {
      padding: 16px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div id="game-container">
  
  <div class="top-fixed-section">
    <header>
      <h1>Terra Desolata</h1>
      <button class="btn-icon" id="btn-options" title="Opzioni">⚙ Opzioni</button>
    </header>

    <div class="status-panel">
      <div class="time-tracker-row">
        <span>Tempo di sopravvivenza:</span>
        <strong id="val-time-elapsed">0g 0h 0m</strong>
      </div>

      <div class="stat-row">
        <span class="stat-label">Salute</span>
        <div class="bar-bg"><div id="bar-hp" class="bar-fill fill-hp"></div></div>
        <span id="val-hp" class="stat-val">100/100</span>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">Sazietà</span>
        <div class="bar-bg"><div id="bar-food" class="bar-fill fill-food"></div></div>
        <span id="val-food" class="stat-val">80/100</span>
      </div>

      <div class="stat-row">
        <span class="stat-label">Energia</span>
        <div class="bar-energy-container" title="Verde: attuale, Ocra: limite massimo">
          <div id="bar-energy-max"></div>
          <div id="bar-energy-cur"></div>
        </div>
        <span id="val-energy" class="stat-val">100/100</span>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
        <div class="condition-badges">
          <span id="condition-tag" class="condition-tag">In salute</span>
          <span id="sleep-tag" class="condition-tag sleeping" style="display:none;">Addormentato</span>
        </div>
        <span style="font-size:0.8rem; color:var(--text-muted);">Km percorsi: <strong id="val-km" style="color:var(--text-main);">0</strong></span>
      </div>
    </div>
  </div>

  <div id="log-container"></div>

  <div class="bottom-fixed-section">
    <div class="inventory-section">
      <!-- Slot Arma Unica Equipaggiata -->
      <div class="weapon-slot-row">
        <span>Arma impugnata: <strong id="val-weapon-name">Nessuna</strong></span>
        <span id="val-weapon-durability" style="color:var(--text-muted);">0 usi</span>
      </div>

      <div class="inventory-header">
        <span>Zaino</span>
        <span id="val-inventory-slots">0 / 10 Slot</span>
      </div>
      <div class="inventory-list" id="inventory-list"></div>
    </div>

    <div class="controls">
      <div id="context-actions" class="action-sub-grid" style="display:none; margin-bottom: 2px;"></div>
      
      <button id="btn-sleep-hour" class="btn-main btn-hour-sleep" style="display:none;">Dormi 1 Ora (+60 min)</button>

      <div class="main-actions-grid">
        <button id="btn-sleep-toggle" class="btn-main btn-sleep">Dormi</button>
        <button id="btn-move" class="btn-main btn-move">Avanza (+1 Km)</button>
      </div>
    </div>
  </div>

</div>

<!-- Modal Opzioni -->
<div id="modal-options" class="modal">
  <div class="modal-content">
    <h2>Opzioni</h2>
    <button class="btn-main" id="btn-open-leaderboard">🏆 Classifica</button>
    <button class="btn-main" id="btn-fullscreen">Schermo Intero</button>
    <button class="btn-main btn-danger-opt" id="btn-reset-game">Ricomincia Partita</button>
    <button class="btn-main" id="btn-close-options">Chiudi</button>
  </div>
</div>

<!-- Modal Classifica -->
<div id="modal-leaderboard" class="modal">
  <div class="modal-content">
    <h2>🏆 Migliori 10 Sopravvissuti</h2>
    <div class="leaderboard-table-container">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Durata</th>
            <th>Km</th>
            <th>Data Morte</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <div id="leaderboard-empty" class="leaderboard-empty" style="display:none;">Nessun decesso registrato.</div>
    </div>
    <button class="btn-main" id="btn-close-leaderboard">Indietro</button>
  </div>
</div>

<script>
  /* =========================================================================
     CONFIGURAZIONE COSTANTI & TEMPISTICHE (IN SECONDI)
     ========================================================================= */
  const STORAGE_KEY = "terra_desolata_save_v8";
  const LEADERBOARD_KEY = "terra_desolata_leaderboard";

  const FOOD_TICK_SEC = 480;              // 1 sazietà ogni 8 min (480s)
  const AWAKE_CUR_ENERGY_DECAY_SEC = 540; // 1 energia corr ogni 9 min (540s)
  const AWAKE_MAX_ENERGY_DECAY_SEC = 600; // 1 energia max ogni 10 min (600s)
  const SLEEP_MAX_ENERGY_GAIN_SEC = 240;  // +1 energia max ogni 4 min (240s)
  const SLEEP_CUR_ENERGY_GAIN_SEC = 360;  // +1 energia corr ogni 6 min (360s)
  const FOOD_PERISH_LIMIT_SEC = 86400;    // 24 ore di orologio interno

  const defaultPlayerState = {
    hp: 100,
    maxHp: 100,
    food: 80,
    maxFood: 100,
    energy: 100,
    maxEnergy: 100,
    km: 0,
    sick: false,
    isSleeping: false,
    consecutiveSleepHours: 0,
    maxSlots: 10,
    survivalSeconds: 0,
    isDead: false,
    lastActiveTimestamp: Date.now(),
    secFood: 0,
    secAwakeCur: 0,
    secAwakeMax: 0,
    secSleepCur: 0,
    secSleepMax: 0,
    equippedWeapon: null, // { name: "Tubo arrugginito", maxUses: 4, uses: 4, dmgReduction: 0.5 }
    inventory: [
      { id: "canned_food", name: "Cibo in scatola", type: "food", val: 35, qty: 2 },
      { id: "raw_meat", name: "Carne cruda", type: "perishable_food", val: 20, qty: 1, acquiredAt: 0 },
      { id: "medkit", name: "Bende e disinfettante", type: "cure", val: 30, qty: 1 },
      { id: "scrap", name: "Rottami metallici", type: "material", qty: 3 }
    ]
  };

  let player = JSON.parse(JSON.stringify(defaultPlayerState));
  let currentLocation = null;
  let currentEncounter = null; // Memorizza lo stato del bivio attivo

  function formatDuration(totalSeconds) {
    const d = Math.floor(totalSeconds / 86400);
    const h = Math.floor((totalSeconds % 86400) / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    return `${d}g ${h}h ${m}m`;
  }

  function enforceEnergyCaps() {
    player.maxEnergy = Math.max(0, Math.min(100, player.maxEnergy));
    if (player.energy > player.maxEnergy) {
      player.energy = player.maxEnergy;
    }
    player.energy = Math.max(0, player.energy);
  }

  /* =========================================================================
     GESTIONE CIBO DEPERIBILE (24 ORE INTERNE)
     ========================================================================= */
  function checkPerishableFood() {
    if (!player.inventory) return;
    const initialCount = player.inventory.length;
    player.inventory = player.inventory.filter(item => {
      if (item.type === "perishable_food") {
        const age = (player.survivalSeconds || 0) - (item.acquiredAt || 0);
        if (age >= FOOD_PERISH_LIMIT_SEC) {
          log(`La confezione di ${item.name} è andata a male ed è immangiabile. L'hai gettata via.`, "danger");
          return false;
        }
      }
      return true;
    });
    if (player.inventory.length !== initialCount) {
      updateUI();
    }
  }

  /* =========================================================================
     SIMULAZIONE TEMPORALE
     ========================================================================= */
  function advanceTime(secondsToAdd, silent = false) {
    if (player.hp <= 0 || secondsToAdd <= 0) return;

    player.survivalSeconds = (player.survivalSeconds || 0) + secondsToAdd;
    checkPerishableFood();

    if (player.isSleeping) {
      const totalSleepMaxSec = (player.secSleepMax || 0) + secondsToAdd;
      const maxGains = Math.floor(totalSleepMaxSec / SLEEP_MAX_ENERGY_GAIN_SEC);
      player.secSleepMax = totalSleepMaxSec % SLEEP_MAX_ENERGY_GAIN_SEC;
      player.maxEnergy = Math.min(100, player.maxEnergy + maxGains);

      const totalSleepCurSec = (player.secSleepCur || 0) + secondsToAdd;
      const curGains = Math.floor(totalSleepCurSec / SLEEP_CUR_ENERGY_GAIN_SEC);
      player.secSleepCur = totalSleepCurSec % SLEEP_CUR_ENERGY_GAIN_SEC;
      player.energy = Math.min(player.maxEnergy, player.energy + curGains);

      if (player.sick) {
        const sickDmg = secondsToAdd * 0.15;
        player.hp = Math.max(0, player.hp - sickDmg);
        if (!silent) log(`La malattia ha peggiorato le tue condizioni durante il sonno (-${Math.round(sickDmg)} HP).`, "danger");
      }
    } else {
      const totalFoodSec = (player.secFood || 0) + secondsToAdd;
      const foodLoss = Math.floor(totalFoodSec / FOOD_TICK_SEC);
      player.secFood = totalFoodSec % FOOD_TICK_SEC;

      if (foodLoss > 0) {
        const foodBefore = player.food;
        player.food = Math.max(0, player.food - foodLoss);
        const actualLoss = foodBefore - player.food;

        if (player.food <= 0) {
          const starvedUnits = foodLoss - actualLoss;
          const starvationDamage = Math.max(1, starvedUnits * 10);
          player.hp = Math.max(0, player.hp - starvationDamage);
          if (!silent) log(`Sei rimasto a digiuno! Subisci ${Math.round(starvationDamage)} danni per inedia.`, "danger");
        }
      }

      const totalAwakeMaxSec = (player.secAwakeMax || 0) + secondsToAdd;
      const maxLoss = Math.floor(totalAwakeMaxSec / AWAKE_MAX_ENERGY_DECAY_SEC);
      player.secAwakeMax = totalAwakeMaxSec % AWAKE_MAX_ENERGY_DECAY_SEC;
      player.maxEnergy = Math.max(0, player.maxEnergy - maxLoss);

      const totalAwakeCurSec = (player.secAwakeCur || 0) + secondsToAdd;
      const curLoss = Math.floor(totalAwakeCurSec / AWAKE_CUR_ENERGY_DECAY_SEC);
      player.secAwakeCur = totalAwakeCurSec % AWAKE_CUR_ENERGY_DECAY_SEC;
      player.energy = Math.max(0, player.energy - curLoss);

      if (player.sick) {
        const sickDmg = secondsToAdd * 0.2;
        player.hp = Math.max(0, player.hp - sickDmg);
        if (!silent) log(`L'infezione si è aggravata col passare del tempo (-${Math.round(sickDmg)} HP).`, "danger");
      }
    }

    enforceEnergyCaps();
    checkDeath();
    saveGame();
    updateUI();
  }

  function canAttemptDodge() {
    return player.hp >= 85 && player.hp <= 100 && player.energy > 70;
  }

  function tryDodgeAttack(enemyType) {
    if (canAttemptDodge() && Math.random() < 0.5) {
      log(`I tuoi riflessi sono impeccabili: schivi l'assalto di ${enemyType}!`, "success");
      return true;
    }
    return false;
  }

  /* =========================================================================
     GESTIONE ARMA
     ========================================================================= */
  function promptEquipWeapon(newWeapon) {
    const currentName = player.equippedWeapon ? `${player.equippedWeapon.name} (${player.equippedWeapon.uses} usi)` : "Nessuna";
    log(`Hai trovato: ${newWeapon.name} (${newWeapon.uses} utilizzi, protezione ${Math.round(newWeapon.dmgReduction * 100)}%). Arma attuale: ${currentName}.`, "combat");

    setContextActions([
      {
        label: `Impugna ${newWeapon.name}`,
        action: () => {
          player.equippedWeapon = newWeapon;
          log(`Hai impugnato ${newWeapon.name}.`, "success");
          clearContextActions();
          saveGame();
          updateUI();
        }
      },
      {
        label: "Lascia a terra",
        action: () => {
          log(`Decidi di non raccogliere ${newWeapon.name}.`, "idle");
          clearContextActions();
          saveGame();
          updateUI();
        }
      }
    ]);
  }

  function useEquippedWeapon() {
    if (!player.equippedWeapon) return false;

    player.equippedWeapon.uses -= 1;
    log(`Usi ${player.equippedWeapon.name} per difenderti! Usi rimasti: ${player.equippedWeapon.uses}.`, "combat");

    if (player.equippedWeapon.uses <= 0) {
      log(`CRACK! ${player.equippedWeapon.name} si è spezzata durante lo scontro!`, "danger");
      player.equippedWeapon = null;
    }
    return true;
  }

  /* =========================================================================
     SALVATAGGIO & CARICAMENTO
     ========================================================================= */
  function saveGame() {
    player.lastActiveTimestamp = Date.now();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
    } catch (e) {
      console.warn("Impossibile salvare", e);
    }
  }

  function loadGameAndSimulateOffline() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      log("Ti svegli tra le rovine. Usa le tue risorse con saggezza.");
      log("Gli incontri ora offrono scelte contestuali. Tieni d'occhio armi e cibo fresco.");
      saveGame();
      return;
    }

    try {
      const loaded = JSON.parse(saved);
      player = Object.assign({}, defaultPlayerState, loaded);
      player.maxSlots = 10;

      const now = Date.now();
      const elapsedSeconds = Math.max(0, Math.floor((now - (player.lastActiveTimestamp || now)) / 1000));
      player.lastActiveTimestamp = now;

      if (!player.isDead && elapsedSeconds > 5) {
        const mins = Math.floor(elapsedSeconds / 60);
        log(`Sei rimasto assente per circa ${mins > 0 ? mins + " minuti" : elapsedSeconds + " secondi"}.`, "idle");
        advanceTime(elapsedSeconds, true);
      } else if (!player.isDead) {
        log("Bentornato nelle rovine.");
      }
    } catch (e) {
      console.error("Errore di caricamento salvataggio", e);
      player = JSON.parse(JSON.stringify(defaultPlayerState));
    }
    enforceEnergyCaps();
  }

  setInterval(() => {
    if (player.hp <= 0) return;
    advanceTime(1, true);

    if (!player.sick && player.food > 60 && player.energy > 60 && player.hp < player.maxHp) {
      player.hp = Math.min(player.maxHp, player.hp + 0.1);
      updateUI();
    }
  }, 1000);

  /* =========================================================================
     COMANDI DI GIOCO
     ========================================================================= */
  function toggleSleep() {
    if (player.hp <= 0) return;
    if (currentEncounter) {
      log("Non puoi addormentarti durante un incontro!", "danger");
      return;
    }

    player.isSleeping = !player.isSleeping;

    if (player.isSleeping) {
      player.consecutiveSleepHours = 0;
      log("Ti accovacci in un angolo riparato e ti addormenti.", "sleep");
      clearContextActions();
    } else {
      player.consecutiveSleepHours = 0;
      log("Riapri gli occhi e ti rimetti in piedi.", "idle");
    }

    saveGame();
    updateUI();
  }

  function sleepOneHour() {
    if (!player.isSleeping || player.hp <= 0) return;
    player.consecutiveSleepHours = (player.consecutiveSleepHours || 0) + 1;
    advanceTime(3600);
    const oreTesto = player.consecutiveSleepHours === 1 ? "1 ora" : `${player.consecutiveSleepHours} ore`;
    log(`Stai dormendo da ${oreTesto}. Energia: ${Math.round(player.energy)}/${Math.round(player.maxEnergy)}.`, "sleep");
  }

  function move() {
    if (player.isSleeping) {
      log("Non puoi camminare mentre stai dormendo!", "idle");
      return;
    }

    if (currentEncounter) {
      log("Devi prima risolvere l'incontro prima di avanzare!", "danger");
      return;
    }

    if (player.energy < 5) {
      log("Non hai abbastanza energia corrente per camminare (minimo 5).", "danger");
      return;
    }

    player.km += 1;
    player.maxEnergy = Math.max(0, player.maxEnergy - 5);
    player.energy = Math.max(0, player.energy - 5);
    enforceEnergyCaps();

    currentLocation = null;
    clearContextActions();

    log(`Avanzi di 1 Km attraverso la desolazione (+12 min).`, "idle");
    advanceTime(720);

    const dice = Math.random();
    if (dice < 0.28) {
      handleLocationDiscovery();
    } else if (dice < 0.48) {
      handleAnimalEncounter();
    } else if (dice < 0.68) {
      handleHumanEncounter();
    } else if (dice < 0.80) {
      handleHazardEncounter();
    } else {
      log("Solo silenzi e macerie lungo il cammino.", "idle");
    }

    checkDeath();
    saveGame();
    updateUI();
  }

  /* =========================================================================
     PERLUSTRATURA
     ========================================================================= */
  function handleLocationDiscovery() {
    const locs = [
      { name: "una vecchia casa abbandonata", type: "casa" },
      { name: "i resti di un accampamento improvvisato", type: "campo" },
      { name: "una discarica a cielo aperto", type: "discarica" }
    ];
    const loc = locs[Math.floor(Math.random() * locs.length)];
    loc.searchesDone = 0;
    loc.maxSearches = Math.random() < 0.5 ? 2 : 1;

    currentLocation = loc;
    log(`Scorgi ${loc.name}. Puoi perlustrare la zona.`, "success");

    setContextActions([
      { label: "Perquisisci zona", action: () => scavengeLocation() }
    ]);
  }

  function scavengeLocation() {
    if (player.isSleeping || !currentLocation) return;
    if (player.energy < 3) {
      log("Troppo esausto per cercare con cura (richiesti 3 Energia Corrente).", "danger");
      return;
    }
    player.energy = Math.max(0, player.energy - 3);

    const minutesPassed = Math.floor(Math.random() * 16) + 15;
    log(`Frughi con cura tra le macerie per ${minutesPassed} minuti...`, "idle");
    advanceTime(minutesPassed * 60);

    const lootRoll = Math.random();
    if (lootRoll < 0.25) {
      addItem("scrap", "Rottami metallici", "material", 1);
      log("Hai recuperato del metallo utile dai rottami.", "success");
    } else if (lootRoll < 0.45) {
      addItem("canned_food", "Cibo in scatola", "food", 35, 1);
      log("Hai trovato una latta di cibo intatta!", "success");
    } else if (lootRoll < 0.60) {
      // Cibo fresco deperibile
      addPerishableFood("raw_meat", "Carne cruda", 20);
      log("Trovi della carne fresca commestibile (si deteriora entro 24 ore!).", "success");
    } else if (lootRoll < 0.75) {
      // Arma
      const weapons = [
        { name: "Ramo nodoso rinforzato", maxUses: 3, uses: 3, dmgReduction: 0.4 },
        { name: "Tubo di ferro acuminato", maxUses: 5, uses: 5, dmgReduction: 0.6 },
        { name: "Lama di lamiera sagomata", maxUses: 4, uses: 4, dmgReduction: 0.5 }
      ];
      const foundWp = weapons[Math.floor(Math.random() * weapons.length)];
      promptEquipWeapon(foundWp);
      return;
    } else if (lootRoll < 0.88) {
      addItem("medkit", "Bende e disinfettante", "cure", 30, 1);
      log("Trovi una cassetta di pronto soccorso con bende.", "success");
    } else {
      log("Hai frugato ovunque ma non c'era niente di utile.", "idle");
    }

    currentLocation.searchesDone += 1;

    if (currentLocation.searchesDone < currentLocation.maxSearches) {
      log("Un'altra zona dell'edificio sembra accessibile. Puoi perlustrare di nuovo!", "idle");
      setContextActions([
        { label: "Perquisisci ancora", action: () => scavengeLocation() }
      ]);
    } else {
      clearContextActions();
      currentLocation = null;
    }

    saveGame();
    updateUI();
  }

  /* =========================================================================
     INCONTRI CON MICRO-BIVI DECISIONALI
     ========================================================================= */
  function handleAnimalEncounter() {
    if (Math.random() < 0.45) {
      log("Una volpe magra ti osserva con cautela e si dilegua tra le rocce.", "idle");
      return;
    }

    // Animale selvatico aggressivo
    currentEncounter = "animal";
    log("Un predatore selvatico ringhia e sbarra il tuo cammino con fare aggressivo!", "danger");

    const actions = [
      {
        label: "Combatti",
        action: () => resolveCombat("animal", 12, 22, "l'animale selvatico")
      }
    ];

    // Se il giocatore ha carne deperibile può lanciarla
    const perishableItem = player.inventory.find(i => i.type === "perishable_food");
    if (perishableItem) {
      actions.push({
        label: `Getta ${perishableItem.name}`,
        action: () => {
          log(`Lanci prontamente ${perishableItem.name} lontano: l'animale si fionda sul cibo e ti ignora!`, "success");
          removeItem(perishableItem.id, 1);
          endEncounter();
        }
      });
    }

    actions.push({
      label: "Fuggi (-15 Energia)",
      action: () => fleeEncounter("animal")
    });

    setContextActions(actions);
  }

  function handleHumanEncounter() {
    if (Math.random() < 0.5) {
      log("Incontri un viaggiatore pacifico disposto a barattare risorse.", "success");
      renderTradeOptions();
      return;
    }

    // Predone ostile
    currentEncounter = "human";
    log("Un predone sbuca da dietro un relitto brandendo un'arma improvvisata!", "danger");

    const actions = [
      {
        label: "Combatti",
        action: () => resolveCombat("human", 14, 28, "il predone")
      }
    ];

    // Cedere cibo per salvarsi
    const foodItem = player.inventory.find(i => i.type === "food" || i.type === "perishable_food");
    if (foodItem) {
      actions.push({
        label: `Cedi 1x ${foodItem.name}`,
        action: () => {
          log(`Cedi 1x ${foodItem.name}. Il predone arraffa il cibo con un grugnito e si allontana.`, "idle");
          removeItem(foodItem.id, 1);
          endEncounter();
        }
      });
    }

    actions.push({
      label: "Fuggi (-15 Energia)",
      action: () => fleeEncounter("human")
    });

    setContextActions(actions);
  }

  function resolveCombat(type, minDmg, maxDmg, enemyName) {
    if (tryDodgeAttack(enemyName)) {
      endEncounter();
      return;
    }

    let baseDmg = Math.floor(Math.random() * (maxDmg - minDmg + 1)) + minDmg;

    if (player.equippedWeapon) {
      const reduction = player.equippedWeapon.dmgReduction || 0.5;
      const absorbedDmg = Math.round(baseDmg * reduction);
      baseDmg = Math.max(2, baseDmg - absorbedDmg);
      useEquippedWeapon();
      log(`Ti difendi con la tua arma assorbendo parte dell'impatto!`, "combat");
    }

    player.hp = Math.max(0, player.hp - baseDmg);
    log(`Nello scontro contro ${enemyName} subisci ${baseDmg} danni.`, "danger");

    endEncounter();
    checkDeath();
  }

  function fleeEncounter(type) {
    if (player.energy < 15) {
      log("Non hai abbastanza energia corrente per fuggire a gambe levate (richiesti 15)! Sei costretto ad affrontarlo!", "danger");
      return;
    }

    player.energy = Math.max(0, player.energy - 15);
    enforceEnergyCaps();
    log("Scatti a perdifiato e riesci a seminare il pericolo (-15 Energia Corrente).", "idle");
    endEncounter();
  }

  function endEncounter() {
    currentEncounter = null;
    clearContextActions();
    saveGame();
    updateUI();
  }

  function renderTradeOptions() {
    setContextActions([
      { label: "Baratta: 2 Rottami ➔ 1 Cibo", action: () => executeTrade("scrap", 2, "canned_food", "Cibo in scatola", "food", 35, 1) },
      { label: "Baratta: 4 Rottami ➔ 1 Bende e disinfettante", action: () => executeTrade("scrap", 4, "medkit", "Bende e disinfettante", "cure", 30, 1) },
      { label: "Baratta: 2 Cibo ➔ 1 Bende e disinfettante", action: () => executeTrade("canned_food", 2, "medkit", "Bende e disinfettante", "cure", 30, 1) },
      { label: "Baratta: 1 Bende e disinfettante ➔ 2 Cibo", action: () => executeTrade("medkit", 1, "canned_food", "Cibo in scatola", "food", 35, 2) }
    ]);
  }

  function executeTrade(giveId, giveQty, receiveId, receiveName, receiveType, receiveVal, receiveQty) {
    if (player.isSleeping) return;

    const sourceItem = player.inventory.find(i => i.id === giveId);
    if (!sourceItem || sourceItem.qty < giveQty) {
      log(`Non hai abbastanza oggetti per questo baratto (richiesti: ${giveQty}x).`, "danger");
      return;
    }

    const projectedSlots = (getTotalItemsCount() - giveQty) + receiveQty;
    if (projectedSlots > player.maxSlots) {
      log("Zaino colmo! Spazio insufficiente per lo scambio.", "danger");
      return;
    }

    removeItem(giveId, giveQty);
    addItem(receiveId, receiveName, receiveType, receiveVal, receiveQty);

    log(`Scambio completato: ceduti ${giveQty}x per ricevere ${receiveQty}x ${receiveName}.`, "success");
    clearContextActions();
    saveGame();
    updateUI();
  }

  function handleHazardEncounter() {
    if (!player.sick && Math.random() < 0.5) {
      player.sick = true;
      log("Inali esalazioni tossiche da una cavità: sei MALATO.", "danger");
    } else {
      const dmg = 8;
      player.hp = Math.max(0, player.hp - dmg);
      log(`Un crollo improvviso di ferraglia ti ferisce (-${dmg} HP).`, "danger");
    }
  }

  /* =========================================================================
     INVENTARIO
     ========================================================================= */
  function getTotalItemsCount() {
    return player.inventory.reduce((sum, item) => sum + item.qty, 0);
  }

  function addPerishableFood(id, name, val) {
    if (getTotalItemsCount() + 1 > player.maxSlots) {
      log("Zaino colmo! Impossibile raccogliere la risorsa.", "danger");
      return;
    }
    player.inventory.push({
      id: id + "_" + Date.now(),
      name: name,
      type: "perishable_food",
      val: val,
      qty: 1,
      acquiredAt: player.survivalSeconds || 0
    });
  }

  function addItem(id, name, type, param1, param2) {
    let val = 0, qty = 1;
    if (type === "food" || type === "cure") {
      val = param1;
      qty = param2 || 1;
    } else {
      qty = param1 || 1;
    }

    if (getTotalItemsCount() + qty > player.maxSlots) {
      log("Zaino colmo! Impossibile raccogliere altro.", "danger");
      return;
    }

    const existing = player.inventory.find(i => i.id === id);
    if (existing) {
      existing.qty += qty;
    } else {
      player.inventory.push({ id, name, type, val, qty });
    }
  }

  function removeItem(id, qty = 1) {
    const item = player.inventory.find(i => i.id === id);
    if (!item) return;
    item.qty -= qty;
    if (item.qty <= 0) {
      player.inventory = player.inventory.filter(i => i.id !== id);
    }
  }

  function useItem(id) {
    if (player.isSleeping) {
      log("Devi prima svegliarti per usare gli oggetti!", "idle");
      return;
    }

    const item = player.inventory.find(i => i.id === id);
    if (!item) return;

    if (item.type === "food" || item.type === "perishable_food") {
      player.food = Math.min(player.maxFood, player.food + item.val);
      player.maxEnergy = Math.min(100, player.maxEnergy + (item.type === "perishable_food" ? 2 : 5));
      player.energy = Math.min(player.maxEnergy, player.energy + (item.type === "perishable_food" ? 15 : 30));
      enforceEnergyCaps();

      log(`Consumi ${item.name}. Sazietà +${item.val}.`, "success");
      removeItem(id, 1);
    } else if (item.type === "cure") {
      let used = false;
      if (player.sick) {
        player.sick = false;
        used = true;
        log("Hai usato le medicine: infezione debellata!", "success");
      }
      if (player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + item.val);
        used = true;
        log(`Hai medicato le ferite (+${item.val} HP).`, "success");
      }
      if (used) {
        removeItem(id, 1);
      } else {
        log("Sei già in salute, non serve usarlo adesso.", "idle");
      }
    }
    saveGame();
    updateUI();
  }

  /* =========================================================================
     RENDERING
     ========================================================================= */
  function log(msg, type = "normal") {
    const logBox = document.getElementById("log-container");
    const entry = document.createElement("div");
    entry.className = `log-entry ${type}`;
    entry.textContent = msg;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function setContextActions(actions) {
    const box = document.getElementById("context-actions");
    box.innerHTML = "";
    if (!actions || actions.length === 0 || player.isSleeping) {
      box.style.display = "none";
      return;
    }
    actions.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "btn-main";
      btn.textContent = a.label;
      btn.onclick = a.action;
      box.appendChild(btn);
    });
    box.style.display = "flex";
  }

  function clearContextActions() {
    setContextActions([]);
  }

  function updateUI() {
    document.getElementById("val-time-elapsed").textContent = formatDuration(player.survivalSeconds || 0);

    document.getElementById("bar-hp").style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById("val-hp").textContent = `${Math.round(player.hp)}/${player.maxHp}`;

    document.getElementById("bar-food").style.width = `${(player.food / player.maxFood) * 100}%`;
    document.getElementById("val-food").textContent = `${Math.round(player.food)}/${player.maxFood}`;

    document.getElementById("bar-energy-max").style.width = `${player.maxEnergy}%`;
    document.getElementById("bar-energy-cur").style.width = `${player.energy}%`;
    document.getElementById("val-energy").textContent = `${Math.round(player.energy)}/${Math.round(player.maxEnergy)}`;

    document.getElementById("val-km").textContent = player.km;

    // Arma equipaggiata
    const weaponNameEl = document.getElementById("val-weapon-name");
    const weaponDurEl = document.getElementById("val-weapon-durability");
    if (player.equippedWeapon) {
      weaponNameEl.textContent = player.equippedWeapon.name;
      weaponDurEl.textContent = `${player.equippedWeapon.uses}/${player.equippedWeapon.maxUses} usi`;
    } else {
      weaponNameEl.textContent = "Nessuna";
      weaponDurEl.textContent = "0 usi";
    }

    const condTag = document.getElementById("condition-tag");
    if (player.sick) {
      condTag.textContent = "Malato";
      condTag.className = "condition-tag sick";
    } else {
      condTag.textContent = "In salute";
      condTag.className = "condition-tag";
    }

    const sleepTag = document.getElementById("sleep-tag");
    sleepTag.style.display = player.isSleeping ? "inline-block" : "none";

    const btnMove = document.getElementById("btn-move");
    const btnSleep = document.getElementById("btn-sleep-toggle");
    const btnSleepHour = document.getElementById("btn-sleep-hour");

    if (player.isDead) {
      btnMove.disabled = true;
      btnSleep.disabled = true;
      btnSleepHour.style.display = "none";
      btnMove.textContent = "Deceduto";
    } else if (player.isSleeping) {
      btnMove.disabled = true;
      btnSleep.textContent = "Svegliati";
      btnSleep.style.background = "#2b3d54";
      btnSleepHour.style.display = "block";
    } else {
      btnMove.disabled = player.energy < 5 || currentEncounter !== null;
      btnSleep.disabled = currentEncounter !== null;
      btnSleep.textContent = "Dormi";
      btnSleep.style.background = "#1a2636";
      btnSleepHour.style.display = "none";
    }

    const currentSlots = getTotalItemsCount();
    document.getElementById("val-inventory-slots").textContent = `${currentSlots} / ${player.maxSlots} Slot`;

    const invList = document.getElementById("inventory-list");
    invList.innerHTML = "";

    if (player.inventory.length === 0) {
      invList.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted); padding:4px;">Lo zaino è vuoto.</span>`;
    } else {
      player.inventory.forEach(item => {
        const row = document.createElement("div");
        row.className = "inv-item";

        let labelText = `${item.name} x${item.qty}`;
        if (item.type === "perishable_food") {
          const age = (player.survivalSeconds || 0) - (item.acquiredAt || 0);
          const remainSec = Math.max(0, FOOD_PERISH_LIMIT_SEC - age);
          const remainH = Math.floor(remainSec / 3600);
          labelText += ` (${remainH}h rimaste)`;
        }

        const nameSpan = document.createElement("span");
        nameSpan.textContent = labelText;
        row.appendChild(nameSpan);

        const actions = document.createElement("div");
        actions.className = "inv-item-actions";

        if (item.type === "food" || item.type === "perishable_food" || item.type === "cure") {
          const btnUse = document.createElement("button");
          btnUse.textContent = "Usa";
          btnUse.onclick = () => useItem(item.id);
          if (player.isSleeping || player.isDead) btnUse.disabled = true;
          actions.appendChild(btnUse);
        }

        row.appendChild(actions);
        invList.appendChild(row);
      });
    }
  }

  /* =========================================================================
     CLASSIFICA & MORTE
     ========================================================================= */
  function recordDeathLeaderboard() {
    let leaderboard = [];
    try {
      const stored = localStorage.getItem(LEADERBOARD_KEY);
      if (stored) leaderboard = JSON.parse(stored);
    } catch (e) {
      leaderboard = [];
    }

    const deathDate = new Date().toLocaleDateString("it-IT", {
      day: "2-digit",
      month: "2-digit",
      year: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });

    leaderboard.push({
      duration: player.survivalSeconds || 0,
      km: player.km || 0,
      date: deathDate
    });

    leaderboard.sort((a, b) => b.duration - a.duration);
    leaderboard = leaderboard.slice(0, 10);

    try {
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
    } catch (e) {
      console.warn("Impossibile salvare classifica", e);
    }
  }

  function checkDeath() {
    if (player.hp <= 0 && !player.isDead) {
      player.isDead = true;
      log("SEI MORTO. Il tuo cammino nella desolazione finisce qui.", "danger");
      recordDeathLeaderboard();
      clearContextActions();
      saveGame();
      updateUI();
    }
  }

  function renderLeaderboard() {
    let leaderboard = [];
    try {
      const stored = localStorage.getItem(LEADERBOARD_KEY);
      if (stored) leaderboard = JSON.parse(stored);
    } catch (e) {
      leaderboard = [];
    }

    const tbody = document.getElementById("leaderboard-body");
    const emptyMsg = document.getElementById("leaderboard-empty");
    tbody.innerHTML = "";

    if (leaderboard.length === 0) {
      emptyMsg.style.display = "block";
    } else {
      emptyMsg.style.display = "none";
      leaderboard.forEach((run, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${idx + 1}</strong></td>
          <td>${formatDuration(run.duration)}</td>
          <td>${run.km} km</td>
          <td>${run.date}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  }

  function resetGame() {
    if (confirm("Vuoi azzerare la partita e ricominciare da capo? La classifica resterà salvata.")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  document.getElementById("btn-move").addEventListener("click", move);
  document.getElementById("btn-sleep-toggle").addEventListener("click", toggleSleep);
  document.getElementById("btn-sleep-hour").addEventListener("click", sleepOneHour);

  const modalOptions = document.getElementById("modal-options");
  const modalLeaderboard = document.getElementById("modal-leaderboard");

  document.getElementById("btn-options").onclick = () => { modalOptions.style.display = "flex"; };
  document.getElementById("btn-close-options").onclick = () => { modalOptions.style.display = "none"; };
  document.getElementById("btn-reset-game").onclick = resetGame;

  document.getElementById("btn-open-leaderboard").onclick = () => {
    renderLeaderboard();
    modalOptions.style.display = "none";
    modalLeaderboard.style.display = "flex";
  };
  document.getElementById("btn-close-leaderboard").onclick = () => {
    modalLeaderboard.style.display = "none";
    modalOptions.style.display = "flex";
  };

  document.getElementById("btn-fullscreen").onclick = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
    modalOptions.style.display = "none";
  };

  loadGameAndSimulateOffline();
  updateUI();
</script>
</body>
