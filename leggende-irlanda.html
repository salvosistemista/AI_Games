  {
    id:"moher", title:"Mal e le Scogliere di Moher", place:"Scogliere di Moher — Clare",
    cats:["creature","misteri"], x:91.6, y:315.9,
    scene:{mood:"mist", main:"cliff", second:"hag", accent:"#2d4a44", accent2:"#241d12", tx2:80, ty2:2, scale2:0.4},
    text:"Le scogliere di Moher, che precipitano per oltre duecento metri a strapiombo sull'Atlantico, devono il proprio nome, secondo la leggenda, a una strega di mare chiamata Mal, innamorata non corrisposta dell'eroe Cú Chulainn. Quando questi la respinse, Mal lo inseguì per tutta l'Irlanda trasformandosi infine in un enorme mostro marino pur di raggiungerlo lungo la costa del Clare. Cú Chulainn, vistala emergere dalle onde, balzò da una sporgenza di roccia all'altra lungo la scogliera per sfuggirle, finché Mal, saltando a sua volta per raggiungerlo, mancò l'appiglio e precipitò sugli scogli sottostanti, morendo sul colpo: quel punto della costa è ancora oggi chiamato 'Hag's Head', la Testa della Strega, primo promontorio della celebre scogliera, e nelle giornate di foschia marina qualcuno giura di scorgerne ancora il profilo tra la nebbia.",
    en:{"title": "Mal and the Cliffs of Moher", "place": "Cliffs of Moher — Clare", "text": "The Cliffs of Moher, plunging over two hundred metres straight down into the Atlantic, owe their name, according to legend, to a sea-witch called Mal, hopelessly in love with the hero Cú Chulainn. When he rejected her, Mal pursued him across all of Ireland, finally transforming into an enormous sea monster just to reach him along the Clare coast. Seeing her rise from the waves, Cú Chulainn leapt from one rocky ledge to another along the cliff to escape her, until Mal, leaping in turn to catch him, missed her footing and plunged onto the rocks below, dying instantly: that point of the coast is still called 'Hag's Head' today, the first headland of the famous cliffs, and on misty sea days some say they can still make out her outline in the fog."}

/* ---------- Rendering mappa ---------- */
const svg = document.getElementById('mapSvg');
svg.innerHTML = `
  <path class="isle" d="${ISLAND_PATH}"/>
  <path class="isle-texture" d="M60,77 Q150,116 240,90"/>
  <path class="isle-texture" d="M40,231 Q150,270 260,244"/>
  <path class="isle-texture" d="M60,386 Q150,411 230,386"/>
`;
STORIES.forEach(s=>{
  const primary = s.cats[0];
  const color = CATS[primary].color;
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","marker");
  g.setAttribute("data-id", s.id);
  g.setAttribute("data-cats", s.cats.join(","));
  g.innerHTML = `
    <circle class="pulse" cx="${s.x}" cy="${s.y}" r="3.5" style="stroke:${color}"></circle>
    <circle class="dot" cx="${s.x}" cy="${s.y}" r="3.5" style="fill:${color}"></circle>
    <text x="${s.x+6}" y="${s.y+2.5}">${s.title}</text>
  `;
  g.addEventListener('click', ()=>{
    if(itineraryActive){
      const idx = ROUTE.indexOf(s.id);
      if(idx>=0) goToStop(idx);
    }
    openStory(s.id);
  });
  svg.appendChild(g);
});

/* ---------- Filtri ---------- */
const filtersEl = document.getElementById('filters');
let activeCat = "all";
function renderFilters(){
  let html = `<div class="chip" data-cat="all" data-active="1">Tutte</div>`;
  for(const k in CATS){
    html += `<div class="chip" data-cat="${k}">${CATS[k].label}</div>`;
  }
  filtersEl.innerHTML = html;
  filtersEl.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      activeCat = ch.getAttribute('data-cat');
      filtersEl.querySelectorAll('.chip').forEach(c=>c.removeAttribute('data-active'));
      ch.setAttribute('data-active','1');
      applyFilter();
    });
  });
}
function applyFilter(){
  document.querySelectorAll('.marker').forEach(m=>{
    const cats = m.getAttribute('data-cats').split(",");
    const show = activeCat==="all" || cats.includes(activeCat);
    m.classList.toggle('dim', !show);
  });
  document.querySelectorAll('.story-item').forEach(it=>{
    const cats = it.getAttribute('data-cats').split(",");
    const show = activeCat==="all" || cats.includes(activeCat);
    it.classList.toggle('hidden', !show);
  });
}
renderFilters();
function updateStats(){
  const txt = visited.size>0
    ? `${STORIES.length} leggende · ${visited.size} scoperte in questa visita`
    : `${STORIES.length} leggende da tutte le province d'Irlanda`;
  document.getElementById('statsLine').textContent = txt;
}
updateStats();

/* ---------- Elenco leggende ---------- */
const listEl = document.getElementById('list');
listEl.innerHTML = STORIES.map(s=>{
  const primary = s.cats[0];
  return `<div class="story-item" data-id="${s.id}" data-cats="${s.cats.join(",")}">
    <div class="dotcat" style="background:${CATS[primary].color}"></div>
    <div class="meta">
      <div class="t">${s.title}</div>
      <div class="p">${s.place}</div>
    </div>
  </div>`;
}).join("");
listEl.querySelectorAll('.story-item').forEach(it=>{
  it.addEventListener('click', ()=>{
    const id = it.getAttribute('data-id');
    if(itineraryActive){
      const idx = ROUTE.indexOf(id);
      if(idx>=0) goToStop(idx);
    }
    openStory(id);
  });
});

/* ---------- Dettaglio leggenda ---------- */
const overlay = document.getElementById('overlay');
const cardInner = document.getElementById('cardInner');
let currentStoryId = null;
let currentLang = 'it';

function openStory(id){
  const s = STORIES.find(x=>x.id===id);
  if(!s) return;
  currentStoryId = id;
  visited.add(id);
  const m = svg.querySelector(`.marker[data-id="${id}"]`);
  if(m) m.classList.add('visited');
  updateStats();

  const useEn = currentLang === 'en';
  const title = useEn ? s.en.title : s.title;
  const place = useEn ? s.en.place : s.place;
  const text  = useEn ? s.en.text  : s.text;
  const tags = s.cats.map(c=>`<span class="tag" style="background:${CATS[c].color}">${useEn?CATS[c].label_en:CATS[c].label}</span>`).join("");
  let nav = "";
  if(itineraryActive){
    const idx = itineraryIndex;
    const prevLabel = useEn ? "◀ Previous" : "◀ Precedente";
    const nextLabel = useEn ? "Next ▶" : "Successiva ▶";
    const stopLabel = useEn ? `Stop ${idx+1} of ${ROUTE.length}` : `Tappa ${idx+1} di ${ROUTE.length}`;
    nav = `<div class="modalNav">
      <button id="modalPrev" ${idx===0?'disabled':''}>${prevLabel}</button>
      <span class="stopn">${stopLabel}</span>
      <button id="modalNext" ${idx===ROUTE.length-1?'disabled':''}>${nextLabel}</button>
    </div>`;
  }
  cardInner.innerHTML = `
    <button class="langBtn" id="langBtn" title="${useEn?'Passa all\'italiano':'Switch to English'}">${useEn?'IT':'EN'}</button>
    <button class="closeBtn" id="closeBtn">✕</button>
    <div class="illus">${buildScene(s.scene)}</div>
    <div class="content">
      <div class="tagrow">${tags}</div>
      <h3>${title}</h3>
      <div class="place">${place}</div>
      <p>${text}</p>
      ${nav}
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('closeBtn').addEventListener('click', closeStory);
  document.getElementById('langBtn').addEventListener('click', ()=>{
    currentLang = currentLang === 'it' ? 'en' : 'it';
    openStory(currentStoryId);
  });
  if(itineraryActive){
    const mp = document.getElementById('modalPrev');
    const mn = document.getElementById('modalNext');
    if(mp) mp.addEventListener('click', ()=>{ prevStop(); openStory(ROUTE[itineraryIndex]); });
    if(mn) mn.addEventListener('click', ()=>{ nextStop(); openStory(ROUTE[itineraryIndex]); });
  }
}
function closeStory(){ overlay.classList.remove('show'); }
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeStory(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape') closeStory();
  if(itineraryActive && overlay.classList.contains('show')){
    if(e.key==='ArrowRight' && itineraryIndex<ROUTE.length-1){ nextStop(); openStory(ROUTE[itineraryIndex]); }
    if(e.key==='ArrowLeft' && itineraryIndex>0){ prevStop(); openStory(ROUTE[itineraryIndex]); }
  }
});

/* ---------- Modalità Itinerario ---------- */
let itineraryActive = false;
let itineraryIndex = 0;

function drawRouteLine(){
  let line = svg.querySelector('#routeLine');
  if(!line){
    line = document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("id","routeLine");
    line.setAttribute("class","route-line");
    const firstMarker = svg.querySelector('.marker');
    svg.insertBefore(line, firstMarker);
  }
  const d = "M" + ROUTE.map(id=>{
    const s = STORIES.find(x=>x.id===id);
    return `${s.x},${s.y}`;
  }).join(" L");
  line.setAttribute("d", d);
}
function removeRouteLine(){
  const line = svg.querySelector('#routeLine');
  if(line) line.remove();
}
function renderStopNumbers(){
  ROUTE.forEach((id,i)=>{
    const m = svg.querySelector(`.marker[data-id="${id}"]`);
    if(!m || m.querySelector('.stopnum')) return;
    const s = STORIES.find(x=>x.id===id);
    const bg = document.createElementNS("http://www.w3.org/2000/svg","circle");
    bg.setAttribute("class","stopnum-bg");
    bg.setAttribute("cx", s.x); bg.setAttribute("cy", s.y-8); bg.setAttribute("r","5");
    const txt = document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute("class","stopnum");
    txt.setAttribute("x", s.x); txt.setAttribute("y", s.y-6);
    txt.textContent = i+1;
    m.appendChild(bg);
    m.appendChild(txt);
  });
}
function updateCurrentHighlight(){
  document.querySelectorAll('.marker').forEach(m=>m.classList.remove('current'));
  const m = svg.querySelector(`.marker[data-id="${ROUTE[itineraryIndex]}"]`);
  if(m) m.classList.add('current');
}
function updateItineraryBar(){
  const s = STORIES.find(x=>x.id===ROUTE[itineraryIndex]);
  document.getElementById('stopCounter').textContent = `Tappa ${itineraryIndex+1} di ${ROUTE.length}`;
  document.getElementById('stopTitle').textContent = `${s.title} — ${s.place}`;
  document.getElementById('prevStopBtn').disabled = itineraryIndex===0;
  document.getElementById('nextStopBtn').disabled = itineraryIndex===ROUTE.length-1;
}
function goToStop(i){
  itineraryIndex = Math.max(0, Math.min(ROUTE.length-1, i));
  updateCurrentHighlight();
  updateItineraryBar();
}
function nextStop(){ if(itineraryIndex<ROUTE.length-1) goToStop(itineraryIndex+1); }
function prevStop(){ if(itineraryIndex>0) goToStop(itineraryIndex-1); }

function startItinerary(){
  itineraryActive = true;
  itineraryIndex = 0;
  document.body.classList.add('itinerary-mode');
  drawRouteLine();
  renderStopNumbers();
  updateCurrentHighlight();
  updateItineraryBar();
  document.getElementById('itineraryBar').classList.add('show');
  document.getElementById('startItineraryBtn').style.display = 'none';
  document.getElementById('mapSvg').scrollIntoView({behavior:'smooth', block:'start'});
}
function exitItinerary(){
  itineraryActive = false;
  document.body.classList.remove('itinerary-mode');
  removeRouteLine();
  document.querySelectorAll('.marker').forEach(m=>m.classList.remove('current'));
  document.getElementById('itineraryBar').classList.remove('show');
  document.getElementById('startItineraryBtn').style.display = '';
}

document.getElementById('startItineraryBtn').addEventListener('click', startItinerary);
document.getElementById('exitItineraryBtn').addEventListener('click', exitItinerary);
document.getElementById('prevStopBtn').addEventListener('click', prevStop);
document.getElementById('nextStopBtn').addEventListener('click', nextStop);
document.getElementById('readStopBtn').addEventListener('click', ()=>openStory(ROUTE[itineraryIndex]));
</script>
