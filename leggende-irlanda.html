<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leggende d'Irlanda — Atlante Incantato</title>
<style>
  :root{
    --bg:#0e1a15;
    --bg2:#0a1310;
    --parchment:#e9dcbb;
    --parchment2:#ddccA0;
    --ink:#241d12;
    --gold:#c9a341;
    --gold-dim:#8a7431;
    --ghost:#9a4a68;
    --mystery:#3f8079;
    --treasure:#c9a341;
    --royal:#7b5cb8;
    --magic:#5a76b8;
    --creature:#c2712f;
    --line: rgba(201,163,65,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, #16261f 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #142621 0%, transparent 55%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    color:var(--parchment);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100%;
  }
  header{
    padding:26px 20px 16px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  header h1{
    margin:0;
    font-size:clamp(22px,4.5vw,36px);
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.14em;
    text-shadow:0 0 18px rgba(201,163,65,0.35);
  }
  header p{
    margin:8px 0 0;
    font-style:italic;
    color:var(--parchment2);
    opacity:0.85;
    font-size:14px;
  }
  .knot{ width:36px;height:36px;margin:10px auto 0;opacity:0.7; }
  .stats{
    text-align:center;font-size:11.5px;color:var(--gold-dim);
    letter-spacing:0.08em;margin-top:8px;text-transform:uppercase;
  }

  .filters{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .chip{
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment2);
    padding:6px 14px;border-radius:20px;
    font-size:12.5px;letter-spacing:0.04em;
    cursor:pointer;user-select:none;
    transition:all .2s ease;
    font-family: Georgia, serif;
  }
  .chip[data-active="1"]{
    background:var(--gold);
    color:#1a1408;
    border-color:var(--gold);
    font-weight:bold;
  }
  .chip:hover{border-color:var(--gold);}

  .layout{
    display:grid;
    grid-template-columns: 1fr;
    gap:0;
    max-width:1150px;
    margin:0 auto;
  }
  @media(min-width:880px){
    .layout{grid-template-columns: 1.05fr 0.95fr;}
  }

  .map-wrap{
    padding:18px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  #mapSvg{
    width:100%;
    max-width:460px;
    height:auto;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.5));
  }
  .isle{
    fill:#16281f;
    stroke:var(--gold-dim);
    stroke-width:1;
    stroke-linejoin:round;
  }
  .isle-texture{
    fill:none;
    stroke:rgba(201,163,65,0.08);
    stroke-width:0.6;
  }
  .marker circle.dot{
    fill:var(--gold);
    stroke:#1a1408;
    stroke-width:0.8;
    transition:r .15s ease;
  }
  .marker circle.pulse{
    fill:none;
    stroke:var(--gold);
    stroke-width:1;
    opacity:0.6;
    animation:pulse 2.6s ease-out infinite;
  }
  .marker{cursor:pointer;}
  .marker:hover circle.dot{ r:5.5; }
  .marker.dim{ opacity:0.15; }
  .marker.dim:hover{opacity:0.5;}
  @keyframes pulse{
    0%{r:3.5;opacity:0.7;}
    100%{r:11;opacity:0;}
  }
  .marker text{
    font-size:6px;
    fill:var(--parchment2);
    font-family:Georgia,serif;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s ease;
  }
  .marker:hover text{opacity:1;}

  .list-wrap{
    padding:14px 18px 40px;
    border-left:1px solid var(--line);
    max-height:none;
  }
  .list-wrap h2{
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin:6px 0 12px;
  }
  .story-item{
    display:flex;gap:10px;align-items:center;
    padding:9px 8px;
    border-bottom:1px dashed var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .story-item:hover{background:rgba(201,163,65,0.06);}
  .story-item .dotcat{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  }
  .story-item .meta{flex:1;}
  .story-item .meta .t{
    font-size:14.5px;color:var(--parchment);
  }
  .story-item .meta .p{
    font-size:11.5px;color:var(--parchment2);opacity:0.7;font-style:italic;
  }
  .story-item.hidden{display:none;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(6,10,8,0.78);
    display:none;
    align-items:flex-start;justify-content:center;
    padding:24px 14px;
    overflow-y:auto;
    z-index:50;
    backdrop-filter: blur(2px);
  }
  .overlay.show{display:flex;}
  .card{
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment2) 100%);
    color:var(--ink);
    max-width:620px;width:100%;
    border-radius:4px;
    box-shadow:0 30px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.15);
    position:relative;
    margin:auto;
    overflow:hidden;
  }
  .card .illus{ width:100%; display:block; background:#111; }
  .card .content{ padding:22px 26px 28px; }
  .card .tagrow{ display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px; }
  .tag{
    font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    padding:3px 9px;border-radius:12px;color:#fff;
    opacity:0.92;
  }
  .card h3{ margin:0 0 2px; font-size:24px; letter-spacing:0.02em; color:#241d12; }
  .card .place{ font-size:13px;font-style:italic;color:#5a4c2e;margin-bottom:14px; }
  .card p{ line-height:1.62; font-size:15.5px; margin:0 0 12px; }
  .card .closeBtn{
    position:absolute;top:10px;right:10px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(20,15,5,0.55);
    color:#e9dcbb;border:none;font-size:18px;
    cursor:pointer;line-height:32px;text-align:center;
    z-index:2;
  }
  .card .closeBtn:hover{background:rgba(20,15,5,0.8);}

  .langBtn{
    position:absolute;top:10px;left:10px;
    min-width:32px;height:32px;border-radius:16px;
    background:rgba(20,15,5,0.55);
    color:#e9dcbb;border:none;font-size:12px;font-weight:bold;letter-spacing:0.03em;
    cursor:pointer;padding:0 10px;line-height:32px;text-align:center;
    z-index:2;font-family:Georgia,serif;
  }
  .langBtn:hover{background:rgba(20,15,5,0.8);}

  .modalNav{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:16px;padding-top:14px;border-top:1px dashed rgba(36,29,18,0.25);
  }
  .modalNav button{
    background:rgba(36,29,18,0.08);border:1px solid rgba(36,29,18,0.25);
    color:#241d12;padding:7px 12px;border-radius:18px;font-family:Georgia,serif;
    font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .modalNav button:hover{background:rgba(36,29,18,0.16);}
  .modalNav button:disabled{opacity:0.3;cursor:default;}
  .modalNav .stopn{font-size:11.5px;color:#5a4c2e;font-style:italic;text-align:center;flex:1;}

  .startBtn{
    display:block;margin:12px auto 0;
    background:rgba(201,163,65,0.14);
    border:1px solid var(--gold);
    color:var(--gold);
    padding:9px 20px;border-radius:22px;
    font-family:Georgia,serif;font-size:13.5px;letter-spacing:0.05em;
    cursor:pointer;
  }
  .startBtn:hover{background:rgba(201,163,65,0.26);}

  .itinerary-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(14,26,21,0.85), rgba(9,17,14,0.98));
    border-top:1px solid var(--line);
    padding:10px 16px;
    display:none;
    align-items:center;justify-content:center;
    gap:14px;flex-wrap:wrap;
    z-index:60;
    backdrop-filter:blur(3px);
  }
  .itinerary-bar.show{display:flex;}
  .itinerary-bar button{
    background:rgba(201,163,65,0.12);border:1px solid var(--gold-dim);color:var(--gold);
    padding:7px 14px;border-radius:20px;font-family:Georgia,serif;font-size:13px;cursor:pointer;
  }
  .itinerary-bar button:hover{background:rgba(201,163,65,0.24);}
  .itinerary-bar button:disabled{opacity:0.3;cursor:default;}
  .itinerary-bar .stopinfo{text-align:center;font-size:12px;color:var(--parchment2);line-height:1.3;}
  .itinerary-bar .stopinfo b{color:var(--gold);display:block;font-size:14px;}
  .itinerary-bar .exitBtn{background:none;border:none;color:var(--parchment2);font-size:20px;cursor:pointer;padding:2px 8px;}
  .itinerary-bar .exitBtn:hover{color:var(--gold);}

  .route-line{ fill:none; stroke:var(--gold); stroke-width:1.1; stroke-dasharray:3,3; opacity:0.5; }
  .stopnum-bg{ fill:var(--gold); opacity:0; transition:opacity .2s ease; }
  .stopnum{ font-size:5.2px; font-weight:bold; fill:#1a1408; text-anchor:middle; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  body.itinerary-mode .stopnum-bg,
  body.itinerary-mode .stopnum{ opacity:1; }
  .marker.current circle.dot{ fill:#fff !important; r:6; }
  .marker.current circle.pulse{ stroke:#fff !important; }
  .marker.visited circle.dot{ stroke:#fff; stroke-width:1.6; }
  body{ padding-bottom:0; }
  body.itinerary-mode .layout{ padding-bottom:74px; }

  footer{ text-align:center;padding:18px; font-size:11.5px;color:var(--parchment2);opacity:0.5; }
</style>
</head>
<body>

<header>
  <svg class="knot" viewBox="0 0 40 40"><path d="M20,4 C10,4 4,10 4,20 C4,30 10,36 20,36 C30,36 36,30 36,20 C36,10 30,4 20,4 M20,4 C26,10 26,30 20,36 M20,4 C14,10 14,30 20,36" fill="none" stroke="#c9a341" stroke-width="1.4"/></svg>
  <h1>Éire Incantata</h1>
  <p>Un atlante di fantasmi, re, maghi e tesori sepolti nella terra d'Irlanda</p>
  <div class="stats" id="statsLine"></div>
  <button class="startBtn" id="startItineraryBtn">🧭 Inizia l'itinerario completo</button>
</header>

<div class="filters" id="filters"></div>

<div class="layout">
  <div class="map-wrap">
    <svg id="mapSvg" viewBox="0 0 400 514.5" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="list-wrap">
    <h2>Le leggende</h2>
    <div id="list"></div>
  </div>
</div>

<footer>Contorno costruito da dati geografici reali del confine costiero d'Irlanda · Tocca un punto dorato o una voce dell'elenco per leggere</footer>

<div class="overlay" id="overlay">
  <div class="card" id="cardInner"></div>
</div>

<div class="itinerary-bar" id="itineraryBar">
  <button id="prevStopBtn">◀ Precedente</button>
  <div class="stopinfo">
    <b id="stopCounter">Tappa 1 di 33</b>
    <span id="stopTitle"></span>
  </div>
  <button id="nextStopBtn">Successiva ▶</button>
  <button id="readStopBtn">Leggi la leggenda</button>
  <button class="exitBtn" id="exitItineraryBtn" title="Esci dall'itinerario">✕</button>
</div>

<script>
/* ---------- Categorie ---------- */
const CATS = {
  fantasmi:  {label:"Fantasmi",     label_en:"Ghosts",              color:"var(--ghost)"},
  misteri:   {label:"Misteri",      label_en:"Mysteries",           color:"var(--mystery)"},
  tesori:    {label:"Tesori",       label_en:"Treasures",           color:"var(--treasure)"},
  reali:     {label:"Re & Regine",  label_en:"Kings & Queens",      color:"var(--royal)"},
  maghi:     {label:"Maghi",        label_en:"Wizards",             color:"var(--magic)"},
  creature:  {label:"Personaggi & Creature", label_en:"Characters & Creatures", color:"var(--creature)"}
};

/* ---------- Libreria icone (silhouette, stile linocut) ---------- */
const ICON = {
  castle:(c)=>`<path d="M8,82 L8,42 L18,42 L18,26 L28,26 L28,42 L38,42 L38,20 L50,20 L50,42 L60,42 L60,26 L70,26 L70,42 L82,42 L82,82 Z" fill="${c}"/><rect x="30" y="58" width="9" height="16" fill="#1c130a"/><rect x="52" y="52" width="6" height="11" fill="#f4d27a" opacity="0.75"/>`,
  ruin:(c)=>`<path d="M8,82 L8,50 L18,50 L18,30 L28,34 L28,50 L40,50 L40,44 L52,50 L60,36 L64,50 L82,50 L82,82 Z" fill="${c}" opacity="0.9"/>`,
  dolmen:(c)=>`<rect x="14" y="40" width="10" height="42" fill="${c}"/><rect x="66" y="40" width="10" height="42" fill="${c}"/><rect x="6" y="30" width="78" height="13" fill="${c}" transform="rotate(-3 45 36)"/>`,
  stones:(c)=>{let s='';for(let i=0;i<7;i++){const a=(i/7)*Math.PI*2;const x=45+32*Math.cos(a);const y=58+15*Math.sin(a);s+=`<rect x="${x-4}" y="${y-15}" width="8" height="19" fill="${c}"/>`;}return s;},
  spiral:(c)=>`<circle cx="45" cy="52" r="27" fill="none" stroke="${c}" stroke-width="4"/><circle cx="45" cy="52" r="17" fill="none" stroke="${c}" stroke-width="4"/><circle cx="45" cy="52" r="7" fill="${c}"/>`,
  swans:(c)=>`<ellipse cx="28" cy="66" rx="16" ry="10" fill="${c}"/><path d="M28,59 C26,46 39,39 46,43" stroke="${c}" stroke-width="3" fill="none"/><ellipse cx="63" cy="72" rx="14" ry="9" fill="${c}"/><path d="M63,66 C61,54 73,48 78,52" stroke="${c}" stroke-width="3" fill="none"/>`,
  salmon:(c)=>`<path d="M18,54 C32,18 66,18 80,44 C71,39 60,41 55,49 C61,50 65,55 65,62 C55,58 46,60 41,68 C45,60 35,58 30,62 C25,58 21,58 18,54 Z" fill="${c}"/><ellipse cx="35" cy="80" rx="32" ry="5" fill="${c}" opacity="0.28"/>`,
  boar:(c)=>`<ellipse cx="46" cy="55" rx="28" ry="16" fill="${c}"/><path d="M18,55 L5,49 L9,60 Z" fill="${c}"/><path d="M10,47 L16,42 L15,50 Z" fill="#e9dcbb"/><rect x="13" y="66" width="6" height="15" fill="${c}"/><rect x="36" y="69" width="6" height="15" fill="${c}"/><rect x="56" y="69" width="6" height="15" fill="${c}"/><rect x="71" y="66" width="6" height="15" fill="${c}"/>`,
  hound:(c)=>`<path d="M8,64 C14,48 42,46 57,53 C67,57 76,54 83,46 L81,54 C90,54 93,60 90,66 C85,70 78,68 75,63 C64,72 40,74 24,68 C16,72 10,72 8,64 Z" fill="${c}"/>`,
  goat:(c)=>`<ellipse cx="44" cy="60" rx="20" ry="14" fill="${c}"/><rect x="19" y="70" width="6" height="14" fill="${c}"/><rect x="62" y="70" width="6" height="14" fill="${c}"/><circle cx="65" cy="45" r="10" fill="${c}"/><path d="M69,38 C74,27 81,25 82,29 C75,31 73,37 71,42 Z" fill="${c}"/><path d="M60,38 C55,27 48,25 47,29 C54,31 56,37 58,42 Z" fill="${c}"/>`,
  monkboat:(c)=>`<path d="M12,72 C12,60 78,60 78,72 C78,79 12,79 12,72 Z" fill="${c}"/><ellipse cx="34" cy="55" rx="6" ry="11" fill="${c}"/><ellipse cx="56" cy="55" rx="6" ry="11" fill="${c}"/><path d="M62,84 L78,10 L88,84 Z" fill="${c}" opacity="0.45"/>`,
  wave:(c)=>`<path d="M0,72 C14,56 26,56 40,72 C54,88 66,88 80,72 C94,56 100,56 110,66 L110,92 L0,92 Z" fill="${c}"/>`,
  devil:(c)=>`<ellipse cx="45" cy="62" rx="15" ry="17" fill="${c}"/><path d="M35,51 L29,42 L38,47 Z" fill="${c}"/><path d="M55,51 L61,42 L52,47 Z" fill="${c}"/><path d="M18,28 L46,56 L62,12 Z" fill="${c}" opacity="0.5"/>`,
  wisp:(c)=>`<path d="M45,82 C34,71 34,54 45,44 C56,33 56,18 45,8 C61,13 67,34 56,44 C67,49 67,66 56,76 C51,73 49,78 45,82 Z" fill="${c}" opacity="0.75"/>`,
  crown:(c)=>`<path d="M20,60 L26,38 L38,50 L45,32 L52,50 L64,38 L70,60 Z" fill="${c}"/><rect x="18" y="60" width="54" height="10" fill="${c}"/>`,
  cauldron:(c)=>`<path d="M15,45 C15,68 30,80 45,80 C60,80 75,68 75,45 Z" fill="${c}"/><rect x="10" y="40" width="70" height="7" rx="3" fill="${c}"/><path d="M20,40 C20,28 30,22 30,22" stroke="${c}" stroke-width="3" fill="none"/><path d="M70,40 C70,28 60,22 60,22" stroke="${c}" stroke-width="3" fill="none"/>`,
  ship:(c)=>`<path d="M10,70 C10,78 80,78 80,70 L72,60 L18,60 Z" fill="${c}"/><rect x="42" y="20" width="4" height="42" fill="${c}"/><path d="M46,24 L70,50 L46,50 Z" fill="${c}"/><path d="M42,30 L20,50 L42,50 Z" fill="${c}" opacity="0.85"/>`,
  raven:(c)=>`<path d="M20,60 C25,45 40,40 50,45 C55,35 65,32 72,38 C68,42 65,46 68,50 C60,48 55,52 58,58 C48,54 40,58 38,66 C32,60 25,60 20,60 Z" fill="${c}"/>`,
  mountain:(c)=>`<path d="M10,80 L45,20 L60,45 L75,25 L90,80 Z" fill="${c}"/><rect x="43.5" y="10" width="2.5" height="12" fill="#e9dcbb"/><rect x="40" y="14" width="10" height="2.5" fill="#e9dcbb"/>`,
  horse:(c)=>`<path d="M15,65 C15,50 30,40 40,42 C42,32 52,28 58,34 C56,38 58,42 62,42 L70,50 L64,52 L66,60 L58,58 C55,64 48,66 42,64 C40,70 30,72 15,65 Z" fill="${c}"/><rect x="20" y="64" width="4" height="14" fill="${c}"/><rect x="34" y="66" width="4" height="14" fill="${c}"/>`,
  cats:(c)=>`<ellipse cx="30" cy="65" rx="14" ry="9" fill="${c}"/><path d="M20,58 L14,48 L24,54 Z" fill="${c}"/><path d="M32,58 L38,48 L34,55 Z" fill="${c}"/><path d="M42,66 Q60,60 62,45" stroke="${c}" stroke-width="3" fill="none"/><ellipse cx="70" cy="65" rx="14" ry="9" fill="${c}"/><path d="M78,58 L84,48 L74,54 Z" fill="${c}"/><path d="M66,58 L60,48 L64,55 Z" fill="${c}"/>`,
  lighthouse:(c)=>`<path d="M38,80 L42,20 L58,20 L62,80 Z" fill="${c}"/><rect x="34" y="78" width="32" height="6" fill="${c}"/><rect x="40" y="12" width="20" height="10" fill="${c}"/><path d="M60,17 L78,8 M60,17 L78,17 M60,17 L78,26" stroke="#f4d27a" stroke-width="2" opacity="0.8"/>`,
  bat:(c)=>`<path d="M45,50 C40,40 20,35 10,45 C20,42 30,48 35,55 C30,50 15,50 8,60 C22,55 32,58 38,64 C34,58 40,52 45,58 C50,52 56,58 52,64 C58,58 68,55 82,60 C75,50 60,50 55,55 C60,48 70,42 80,45 C70,35 50,40 45,50 Z" fill="${c}"/>`,
  sword:(c)=>`<rect x="43" y="12" width="5" height="46" fill="${c}"/><path d="M43,12 L45.5,4 L48,12 Z" fill="${c}"/><rect x="32" y="55" width="27" height="5" fill="${c}"/><rect x="41" y="58" width="9" height="18" fill="${c}"/>`,
  cliff:(c)=>`<path d="M0,55 L20,35 L35,45 L50,20 L65,40 L80,30 L100,50 L130,60 L130,92 L0,92 Z" fill="${c}"/>`,
  hag:(c)=>`<path d="M45,25 C35,25 28,35 28,48 L24,80 L66,80 L62,48 C62,35 55,25 45,25 Z" fill="${c}"/><ellipse cx="45" cy="24" rx="9" ry="7" fill="${c}"/>`,
  cave:(c)=>`<path d="M0,92 L0,60 C10,30 40,15 65,15 C90,15 120,30 130,60 L130,92 Z" fill="#050805"/><path d="M15,92 L15,65 C22,42 45,28 65,28 C85,28 108,42 115,65 L115,92 Z" fill="${c}"/>`
};

function moodColors(mood){
  return {
    night:['#0a1220','#1c2c44'],
    duskghost:['#241226','#5c2a4a'],
    gold:['#241a08','#6b4a16'],
    mist:['#0f201c','#2d4a44'],
    dawn:['#1a1430','#4a3560']
  }[mood];
}

function buildScene(cfg){
  const [c1,c2] = moodColors(cfg.mood);
  const celestial = (cfg.mood==='gold')
    ? `<circle cx="102" cy="20" r="11" fill="#f4d98a" opacity="0.9"/><circle cx="102" cy="20" r="20" fill="#f4d98a" opacity="0.15"/>`
    : `<circle cx="100" cy="18" r="8" fill="#e9e4d0" opacity="0.85"/><circle cx="100" cy="18" r="17" fill="#e9e4d0" opacity="0.12"/>`;
  const mist = (cfg.mood==='mist'||cfg.mood==='duskghost')

    : '';

  return `
  <svg viewBox="0 0 130 92" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:220px;display:block;">

const STORIES = [
  {
    id:"newgrange", title:"Il Tumulo di Luce", place:"Newgrange, Valle del Boyne — Meath",
    cats:["misteri","maghi"], x:309.2, y:222.8,
    scene:{mood:"dawn", main:"spiral", accent:"#e9d9a0"},
    text:"Sotto un tumulo di pietra bianca, vecchio più delle piramidi, dormono gli dèi del Popolo della Dea Danu. Si dice che il grande Dagda vi nascose il figlio Aengus Óg con un inganno: gli cedette la dimora 'per un giorno e una notte', ma nella lingua degli dèi ogni giorno è eterno, così il tumulo divenne suo per sempre. Una volta l'anno, all'alba del solstizio d'inverno, un raggio di sole scivola lungo lo stretto corridoio di pietra e incendia la camera più interna per soli diciassette minuti: gli antichi costruttori calcolarono quel varco di luce migliaia di anni prima che esistesse una parola per astronomia. I contadini della valle giurano che in quel momento i Sidhe, il popolo fatato, escono a danzare sui prati intorno al fiume, e chi li vede non racconta mai più la stessa storia due volte.",
    en:{"title": "The Mound of Light", "place": "Newgrange, Boyne Valley — Meath", "text": "Beneath a mound of white stone, older than the pyramids, sleep the gods of the People of the goddess Danu. It is said the great Dagda hid his son Aengus Óg there through a trick: he lent him the dwelling 'for a day and a night', but in the language of the gods every day is eternal, so the mound became his forever. Once a year, at dawn on the winter solstice, a beam of sunlight slips down the narrow stone passage and sets the innermost chamber alight for just seventeen minutes: the ancient builders calculated that gap of light thousands of years before the word astronomy existed. Farmers in the valley swear that at that moment the Sídhe, the fairy folk, come out to dance on the meadows around the river, and whoever sees them never tells the story the same way twice."}

  {

    cats:["reali","misteri"], x:299.2, y:237.4,
    scene:{mood:"gold", main:"crown", second:"stones", accent:"#c9a341", accent2:"#8a7431", tx2:35, ty2:30, scale2:0.3},
    text:"Sulla collina più sacra d'Irlanda, sede dei centoquarantadue Sommi Re, si erge ancora la Lia Fáil, la Pietra del Destino. Non è una pietra qualsiasi: quando il legittimo re d'Irlanda vi posava il piede, la pietra emetteva un grido che si udiva fino ai confini dell'isola, riconoscendo il sovrano scelto dagli dèi. Nessun pretendente falso osava avvicinarvisi, temendo il silenzio che ne avrebbe svelato l'inganno davanti a tutti i clan riuniti. Si narra che l'ultima volta che la pietra gridò fu per Conn dei Cento Battaglie, e che da allora, con l'arrivo di re stranieri e fedi nuove, la Lia Fáil abbia scelto il silenzio, aspettando ancora oggi, tra l'erba e il vento, un sovrano degno del suo antico giudizio.",
    en:{"title": "The Stone That Screams", "place": "Hill of Tara — Meath", "text": "On Ireland's most sacred hill, seat of one hundred and forty-two High Kings, the Lia Fáil still stands: the Stone of Destiny. It was no ordinary stone — when the rightful King of Ireland set foot upon it, the stone let out a cry heard to the very edges of the island, recognising the sovereign chosen by the gods. No false pretender dared approach it, fearing the silence that would expose the deception before all the assembled clans. It is said the last time the stone cried out was for Conn of the Hundred Battles, and that ever since, with the coming of foreign kings and new faiths, the Lia Fáil has chosen silence, still waiting today, among the grass and the wind, for a sovereign worthy of its ancient judgement."}
  },
  {
    id:"causeway", title:"Fionn e il Gigante Benandonner", place:"Selciato del Gigante — Antrim",
    cats:["creature","maghi"], x:306.5, y:31.7,
    scene:{mood:"night", main:"stones", accent:"#5a76b8"},
    text:"Fionn mac Cumhaill, guerriero e mago capo dei Fianna, costruì un ponte di colonne esagonali di basalto attraverso il mare per sfidare a duello il gigante scozzese Benandonner. Ma quando lo vide avvicinarsi, alto come una torre, Fionn capì di aver sottovalutato il rivale. Corse dalla moglie Oonagh, che lo travestì da neonato e lo adagiò in un'enorme culla. Quando Benandonner bussò alla porta, Oonagh gli mostrò il 'bambino' di Fionn, spiegando con calma che il padre era fuori a caccia. Il gigante, terrorizzato all'idea di dover affrontare un padre capace di generare una simile creatura, fuggì distruggendo il ponte alle sue spalle per impedire l'inseguimento. Restano oggi, ai due capi del mare, i frammenti di quella strada: il Selciato del Gigante in Irlanda e la Grotta di Fingal in Scozia.",
    en:{"title": "Fionn and the Giant Benandonner", "place": "Giant's Causeway — Antrim", "text": "Fionn mac Cumhaill, warrior and wizard-chief of the Fianna, built a bridge of hexagonal basalt columns across the sea to challenge the Scottish giant Benandonner to a duel. But when he saw him approaching, tall as a tower, Fionn realised he had badly underestimated his rival. He ran to his wife Oonagh, who disguised him as a baby and laid him in an enormous cradle. When Benandonner knocked at the door, Oonagh calmly showed him Fionn's 'child', explaining the father was out hunting. Terrified at the thought of facing a father capable of fathering such a creature, the giant fled, tearing up the bridge behind him to stop any pursuit. What remains today, at either end of the sea, are the fragments of that road: the Giant's Causeway in Ireland and Fingal's Cave in Scotland."}
  },
  {
    id:"lir", title:"I Figli di Lir", place:"Lough Derravaragh — Westmeath",
    cats:["maghi","fantasmi"], x:243.6, y:230.3,
    scene:{mood:"duskghost", main:"swans", accent:"#e9dcbb"},
    text:"Il dio del mare Lir ebbe quattro figli dalla sua seconda moglie Aoife, che presto li invidiò per l'amore che il padre riversava su di loro. Portatili a un lago con l'inganno, Aoife pronunciò un incantesimo di druida oscuro e li mutò in cigni, condannandoli a novecento anni d'esilio sulle acque d'Irlanda, pur lasciando loro voce e memoria umane. Per secoli i quattro cigni cantarono canzoni tanto belle da far addormentare chiunque le udisse, aspettando invano la fine della maledizione. Quando infine tornarono umani, all'arrivo del cristianesimo, erano ormai vecchissimi, la pelle rugosa come corteccia, e si spensero pochi istanti dopo aver ricevuto il battesimo, felici finalmente di poter morire insieme.",
    en:{"title": "The Children of Lir", "place": "Lough Derravaragh — Westmeath", "text": "The sea god Lir had four children by his second wife Aoife, who soon grew jealous of the love their father poured on them. Luring them to a lake, Aoife spoke a dark druid's spell and turned them into swans, condemning them to nine hundred years of exile on the waters of Ireland, though she left them their human voices and memory. For centuries the four swans sang songs so beautiful they lulled anyone who heard them to sleep, waiting in vain for the curse to end. When they finally became human again, with the coming of Christianity, they were impossibly old, their skin wrinkled like bark, and they died only moments after receiving baptism, happy at last to be able to die together."}
  },
  {
    id:"maeve", title:"Medb, Regina di Cnoc na Rí", place:"Knocknarea — Sligo",
    cats:["reali"], x:155.2, y:152.1,
    scene:{mood:"gold", main:"stones", accent:"#7b5cb8"},
    text:"Sulla cima di Knocknarea, contro il cielo del Connacht, si staglia un cairn di pietre alto quanto una casa: si dice sia la tomba della regina Medb, la più temuta e ambiziosa sovrana d'Irlanda. Fu lei a scatenare la grande guerra del Táin Bó Cúailnge, l'invasione dell'Ulster, solo per possedere un toro pari a quello del marito Ailill, non sopportando di essere considerata meno ricca di lui. Guerriera, stratega e amante quanto le serviva per costruire alleanze, Medb volle essere sepolta in piedi, rivolta verso nord, con l'armatura indosso, così da poter tenere d'occhio in eterno i suoi vecchi nemici dell'Ulster. Nessuno, per rispetto o per timore, ha mai osato scavare quel cairn per verificarlo.",
    en:{"title": "Medb, Queen of Cnoc na Rí", "place": "Knocknarea — Sligo", "text": "Atop Knocknarea, against the sky of Connacht, stands a cairn of stones as tall as a house: it is said to be the tomb of Queen Medb, the most feared and ambitious sovereign in Ireland. It was she who unleashed the great war of the Táin Bó Cúailnge, the invasion of Ulster, simply to own a bull equal to her husband Ailill's, unable to bear being thought less wealthy than him. Warrior, strategist, and lover whenever it served her alliances, Medb chose to be buried standing upright, facing north, in full armour, so she could forever keep watch over her old enemies in Ulster. No one, out of respect or fear, has ever dared dig into that cairn to find out."}
  },
  {
    id:"leap", title:"L'Elementale di Leap Castle", place:"Leap Castle — Offaly",
    cats:["fantasmi"], x:201.9, y:309.7,
    scene:{mood:"duskghost", main:"ruin", second:"wisp", accent:"#4a3020", accent2:"#9a4a68", tx2:30, ty2:0, scale2:0.55},
    text:"Chiamato il castello più infestato d'Irlanda, Leap Castle custodisce una cappella-oubliette dove i nemici del clan O'Carroll venivano gettati su pali di ferro e dimenticati a morire. Fu lì, durante lavori di restauro nell'Ottocento, che un operaio scoprì tra i detriti un vero e proprio strato umano compattato: ossa di generazioni di prigionieri. Da allora nel castello si manifesta 'l'Elementale', una presenza descritta come una massa grigia e putrescente con un volto simile a quello di una capra, un odore insopportabile di carne marcia, e uno sguardo che lascia chi lo incrocia svuotato per giorni. Diversi testimoni, tra cui membri della stessa famiglia proprietaria, hanno giurato di averlo visto muoversi lungo le scale, come se il dolore accumulato in quelle pietre non trovasse mai pace.",
    en:{"title": "The Elemental of Leap Castle", "place": "Leap Castle — Offaly", "text": "Called the most haunted castle in Ireland, Leap Castle holds an oubliette-chapel where enemies of the O'Carroll clan were thrown onto iron spikes and left to die. It was there, during nineteenth-century restoration work, that a labourer discovered among the rubble a solid layer of compacted human remains: the bones of generations of prisoners. Ever since, the castle has been haunted by 'the Elemental', a presence described as a grey, rotting mass with a face resembling a goat's, an unbearable stench of decaying flesh, and a stare that leaves anyone who meets it drained for days. Several witnesses, including members of the family who own the castle, have sworn to seeing it move along the stairs, as if the pain accumulated in those stones could never find rest."}

  {
    id:"blarney", title:"La Pietra dell'Eloquenza", place:"Castello di Blarney — Cork",
    cats:["tesori","misteri"], x:154.9, y:440.8,
    scene:{mood:"gold", main:"castle", accent:"#c9a341"},
    text:"In cima al castello di Blarney è incastonata una pietra grigia dai poteri leggendari: chi la bacia, sporgendosi a testa in giù da un'apertura nelle mura, riceve in dono una lingua incantata, capace di persuadere chiunque con parole dolci come il miele. Le origini della pietra si perdono tra mille racconti: c'è chi dice fosse la pietra su cui Giacobbe posò il capo nella Bibbia, chi la lega alla dea Clíodhna, regina delle fate del Munster, che l'avrebbe donata al signore del castello per aiutarlo a vincere una disputa legale con parole anziché con la spada. Da secoli nobili, avvocati e politici irlandesi hanno affrontato la scomoda posizione a testa in giù pur di ottenere quel dono, dando origine all'espressione inglese 'blarney' per indicare un'eloquenza tanto affascinante quanto poco sincera.",
    en:{"title": "The Stone of Eloquence", "place": "Blarney Castle — Cork", "text": "Set into the top of Blarney Castle is a grey stone with legendary powers: whoever kisses it, leaning backwards head-first through a gap in the battlements, is granted an enchanted tongue, able to persuade anyone with words as sweet as honey. The stone's origins are lost among a thousand tales: some say it was the very stone on which Jacob rested his head in the Bible, others link it to Clíodhna, fairy queen of Munster, who supposedly gave it to the castle's lord to help him win a legal dispute with words rather than the sword. For centuries, nobles, lawyers and Irish politicians have braved that awkward upside-down position just to receive that gift, giving rise to the English expression 'blarney', meaning talk as charming as it is insincere."}
  },
  {
    id:"skellig", title:"L'Isola dei Monaci del Cielo", place:"Skellig Michael — Kerry",
    cats:["misteri"], x:10.0, y:460.4,
    scene:{mood:"mist", main:"monkboat", accent:"#e9dcbb"},
    text:"A quasi tredici chilometri dalla costa più occidentale d'Europa, uno scoglio di roccia nera emerge dall'Atlantico come la spina dorsale di un mostro sommerso. Per seicento anni, a partire dal VI secolo, una piccola comunità di monaci visse su Skellig Michael in celle di pietra a forma di alveare, arrampicate su seicento gradini scavati a mano nella roccia, pregando in un silenzio interrotto solo dal vento e dal grido delle sule. Si narra che l'isola fosse già sacra prima dei monaci, dedicata all'arcangelo Michele proprio perché lì, secondo la leggenda, egli sarebbe apparso per aiutare San Patrizio a scacciare gli ultimi serpenti e demoni d'Irlanda in mare aperto. Ancora oggi, chi vi approda nelle giornate di nebbia giura di sentire un canto sommesso salire dalle celle vuote.",
    en:{"title": "The Island of the Sky Monks", "place": "Skellig Michael — Kerry", "text": "Almost thirteen kilometres off Europe's westernmost coast, a black rock rises out of the Atlantic like the spine of a sunken monster. For six hundred years, beginning in the sixth century, a small community of monks lived on Skellig Michael in beehive-shaped stone cells, climbing six hundred steps carved by hand into the rock, praying in a silence broken only by the wind and the cry of gannets. It is said the island was already sacred before the monks arrived, dedicated to the Archangel Michael because, according to legend, he appeared there to help Saint Patrick drive the last serpents and demons of Ireland out into the open sea. Even today, those who land there on foggy days swear they can hear a low chant rising from the empty cells."}
  },
  {
    id:"poulnabrone", title:"La Tomba di Pietra del Burren", place:"Dolmen di Poulnabrone — Clare",
    cats:["misteri","tesori"], x:112.8, y:302.1,
    scene:{mood:"dawn", main:"dolmen", accent:"#c9a341"},
    text:"Nel paesaggio lunare di pietra calcarea del Burren, dove quasi nulla cresce, si erge da cinquemilaseicento anni un portale di tre grandi lastre di pietra: il dolmen di Poulnabrone, 'il foro della quercia dolente'. Quando fu scavato nel secolo scorso, gli archeologi vi trovarono i resti di oltre venti persone, tra cui un neonato, sepolti insieme ad asce, perline e monili, segno che quel luogo fu per secoli una porta tra il mondo dei vivi e quello degli antenati. Gli abitanti della zona raccontano che nelle notti senza luna il dolmen si illumini di una luce fredda propria, e che le pietre stesse custodiscano un tesoro non fatto d'oro, ma di ossa e memoria: il primo patto mai scritto tra gli irlandesi e la loro terra.",
    en:{"title": "The Stone Tomb of the Burren", "place": "Poulnabrone Dolmen — Clare", "text": "In the moon-like limestone landscape of the Burren, where almost nothing grows, a portal of three great stone slabs has stood for five thousand six hundred years: the Poulnabrone dolmen, 'the hole of the sorrowful oak'. When it was excavated last century, archaeologists found within it the remains of more than twenty people, including an infant, buried alongside axes, beads and ornaments, a sign the place served for centuries as a doorway between the world of the living and that of the ancestors. Locals say that on moonless nights the dolmen glows with its own cold light, and that the stones themselves guard a treasure made not of gold, but of bone and memory: the first pact ever written between the Irish and their land."}
  },
  {
    id:"dunluce", title:"La Cucina Inghiottita dal Mare", place:"Castello di Dunluce — Antrim",
    cats:["fantasmi","misteri"], x:294.0, y:40.0,
    scene:{mood:"night", main:"ruin", second:"wave", accent:"#3a3a3a", accent2:"#3f8079", tx2:5, ty2:40, scale2:0.9},
    text:"Arroccato su uno sperone di roccia basaltica sospeso sull'oceano, il castello di Dunluce sembra parte della scogliera stessa, tanto che una sua porzione, nel 1639, crollò davvero in mare durante una tempesta, trascinando con sé l'intera cucina e i servitori che vi lavoravano: solo un ragazzo di cucina, aggrappato per caso a un angolo di muro rimasto in piedi, sopravvisse. Da quella notte, dicono i pescatori della baia, nelle sere di burrasca si odono ancora grida e il tintinnio di pentole levarsi dalle onde sotto le rovine. Ancora prima di quella tragedia, il castello era detto infestato da Maeve Roe, figlia di un signore locale rinchiusa in una torre per impedirle di sposare l'uomo amato: si narra sia morta di dolore in quella stanza, e che il suo pianto sottile si confonda ancora con il vento marino.",
    en:{"title": "The Kitchen Swallowed by the Sea", "place": "Dunluce Castle — Antrim", "text": "Perched on a spur of basalt rock suspended over the ocean, Dunluce Castle seems part of the cliff itself — so much so that in 1639 a section of it truly did collapse into the sea during a storm, dragging down the entire kitchen along with the servants working in it: only a kitchen boy, clinging by chance to a corner of wall left standing, survived. Since that night, fishermen in the bay say that on stormy evenings screams and the clatter of pots can still be heard rising from the waves beneath the ruins. Even before that tragedy, the castle was said to be haunted by Maeve Roe, a local lord's daughter locked in a tower to stop her marrying the man she loved: she is said to have died of grief in that room, her thin cry still blending with the sea wind."}
  },
  {
    id:"cashel", title:"Il Diavolo e la Rocca del Re", place:"Rocca di Cashel — Tipperary",
    cats:["reali","fantasmi"], x:204.9, y:367.7,
    scene:{mood:"duskghost", main:"castle", second:"devil", accent:"#e9dcbb", accent2:"#9a4a68", tx2:70, ty2:5, scale2:0.4},
    text:"La Rocca di Cashel, un colle di roccia calcarea coronato di torri e cattedrali in rovina, fu per secoli sede dei re di Munster. La leggenda narra che quello sperone di pietra non fosse sempre lì: San Patrizio, predicando ai piedi delle montagne di Devil's Bit a nord, avrebbe fatto infuriare così tanto il demonio che questi, con un morso di rabbia, strappò un boccone di montagna e lo sputò via, facendolo atterrare proprio a Cashel, dove poi sarebbe sorta la roccia dei re. È qui che il re Aenghus, il primo sovrano cristiano di Munster, ricevette il battesimo da San Patrizio in persona: durante il rito il santo, appoggiandosi al suo bastone appuntito, trafisse per errore il piede del re, che sopportò il dolore in silenzio, credendolo parte necessaria del sacramento.",
    en:{"title": "The Devil and the King's Rock", "place": "Rock of Cashel — Tipperary", "text": "The Rock of Cashel, a limestone hill crowned with towers and ruined cathedrals, was for centuries the seat of the kings of Munster. Legend says that spur of stone was not always there: Saint Patrick, preaching at the foot of the Devil's Bit mountains to the north, so enraged the devil that he tore a mouthful out of the mountain in fury and spat it out, landing it right at Cashel, where the rock of the kings would later rise. It was here that King Aenghus, the first Christian king of Munster, was baptised by Saint Patrick himself: during the rite, the saint, leaning on his pointed staff, accidentally pierced the king's foot, who bore the pain in silence, believing it a necessary part of the sacrament."}
  },
  {
    id:"salmon", title:"Il Salmone della Conoscenza", place:"Fiume Boyne — Meath",
    cats:["maghi","tesori"], x:291.0, y:231.0,
    scene:{mood:"mist", main:"salmon", accent:"#3f8079"},
    text:"Per sette anni il druido Finegas pescò lungo le rive del Boyne, cercando il leggendario Salmone della Conoscenza, un pesce che aveva mangiato le nocciole cadute dall'Albero della Sapienza e racchiudeva in sé tutta la saggezza del mondo. Quando finalmente lo catturò, affidò al giovane apprendista Fionn il compito di cuocerlo, con l'unico ordine severo di non assaggiarne nemmeno un boccone. Ma mentre girava il pesce sul fuoco, una goccia di grasso bollente schizzò sul pollice di Fionn, che se lo portò istintivamente alla bocca per lenire il bruciore. In quell'istante tutta la conoscenza del salmone passò in lui: da allora, ogni volta che Fionn mac Cumhaill si succhiava il pollice, poteva vedere il passato, il presente e il futuro, un dono che lo avrebbe reso il più saggio condottiero dei Fianna.",
    en:{"title": "The Salmon of Knowledge", "place": "River Boyne — Meath", "text": "For seven years the druid Finegas fished along the banks of the Boyne, seeking the legendary Salmon of Knowledge, a fish that had eaten the hazelnuts fallen from the Tree of Wisdom and held within it all the knowledge of the world. When he finally caught it, he entrusted the young apprentice Fionn with cooking it, under one strict order: not to taste even a single bite. But as he turned the fish over the fire, a drop of hot fat splashed onto Fionn's thumb, which he instinctively put in his mouth to soothe the burn. In that instant, all the salmon's knowledge passed into him: from then on, whenever Fionn mac Cumhaill sucked his thumb, he could see the past, present and future, a gift that made him the wisest leader of the Fianna."}
  },
  {
    id:"diarmuid", title:"La Fuga sotto Ben Bulben", place:"Ben Bulben — Sligo",
    cats:["reali","tesori"], x:166.2, y:139.7,
    scene:{mood:"dawn", main:"boar", accent:"#c2712f"},
    text:"Gráinne, promessa sposa del vecchio Fionn mac Cumhaill, si innamorò invece del giovane guerriero Diarmuid e, con un incantesimo d'amore da cui egli non poté difendersi, lo costrinse a fuggire con lei attraverso tutta l'Irlanda. Per un anno e un giorno i due amanti dormirono in luoghi diversi ogni notte, inseguiti dai Fianna: ancora oggi centinaia di dolmen sparsi per il paese sono chiamati 'i letti di Diarmuid e Gráinne'. Alla fine Fionn finse di perdonarli, ma quando un cinghiale magico ferì mortalmente Diarmuid proprio sotto la montagna di Ben Bulben, Fionn, che possedeva il potere di guarire chiunque bevesse acqua dalle sue mani, lasciò che l'acqua gli scivolasse tra le dita non una, ma due volte, prima di decidersi troppo tardi a salvarlo, vendicando così, goccia dopo goccia, il proprio antico onore ferito.",
    en:{"title": "The Flight Beneath Ben Bulben", "place": "Ben Bulben — Sligo", "text": "Gráinne, promised bride of the aging Fionn mac Cumhaill, fell in love instead with the young warrior Diarmuid, and with a love spell he could not resist, forced him to flee with her across all of Ireland. For a year and a day the two lovers slept in a different place every night, pursued by the Fianna: to this day hundreds of dolmens scattered across the country are called 'the beds of Diarmuid and Gráinne'. In the end Fionn pretended to forgive them, but when a magic boar mortally wounded Diarmuid right beneath Ben Bulben, Fionn — who had the power to heal anyone who drank water from his cupped hands — let the water slip through his fingers not once, but twice, before deciding too late to save him, avenging, drop by drop, his own old wounded pride."}
  },
  {

    cats:["creature","misteri"], x:182.2, y:139.7,
    scene:{mood:"mist", main:"hound", accent:"#0c140f"},
    text:"Nel 1722, secondo la lapide ancora visibile nel cimitero di Conwal, una giovane donna di nome Grace Connolly stava lavando i panni sulla riva di Glenade Lough quando fu trascinata sott'acqua e uccisa da una creatura mai vista prima: metà lontra, metà segugio, ricoperta di un pelo grigio scuro e dotata di zanne enormi. Il marito, trovato il corpo dilaniato, inseguì la bestia a cavallo per chilometri fino a trafiggerla con un pugnale, ma nell'istante della sua morte un secondo Dobhar-chú, forse il compagno, emerse ruggendo dal lago per vendicarlo, costringendo l'uomo a una fuga disperata. Da allora i pescatori della zona evitano di lavare i panni da soli sulla riva al crepuscolo, e qualcuno giura che nelle acque più profonde del lago viva ancora l'ultimo discendente di quella stirpe.",
    en:{"title": "The Dobhar-chú of the Lake", "place": "Glenade Lough — Leitrim", "text": "In 1722, according to the gravestone still visible in Conwal cemetery, a young woman named Grace Connolly was washing clothes on the shore of Glenade Lough when she was dragged underwater and killed by a creature never seen before: half otter, half hound, covered in dark grey fur and armed with enormous fangs. Her husband, finding the mauled body, chased the beast on horseback for miles until he stabbed it with a dagger, but at the instant of its death a second Dobhar-chú, perhaps its mate, rose roaring from the lake to avenge it, forcing the man into a desperate flight. Ever since, local fishermen avoid washing clothes alone on the shore at dusk, and some swear the last descendant of that bloodline still lives in the deepest waters of the lake."}
  },
  {
    id:"dunamase", title:"La Banshee degli O'Moore", place:"Rock of Dunamase — Laois",
    cats:["fantasmi","reali"], x:256.9, y:307.1,
    scene:{mood:"night", main:"ruin", second:"wisp", accent:"#241d12", accent2:"#9a4a68", tx2:30, ty2:0, scale2:0.6},
    text:"Le rovine sospese sulla Rock of Dunamase furono per secoli fortezza del clan O'Moore, signori del Laois, prima che Oliver Cromwell la riducesse in macerie. Si dice che ogni famiglia nobile d'Irlanda abbia la propria banshee, uno spirito femminile il cui pianto acuto annuncia la morte imminente di un membro del casato, e quella degli O'Moore fu tra le più temute: la si udiva gemere lungo le mura la notte prima che un capoclan cadesse in battaglia. I contadini della zona raccontano che, ancora oggi, se ci si ferma soli tra le pietre crollate al calar della sera, si possa avvertire un freddo improvviso e un lamento sottile portato dal vento, come se la banshee, priva ormai di una famiglia da avvisare, continuasse comunque la sua veglia per abitudine antica.",
    en:{"title": "The Banshee of the O'Moores", "place": "Rock of Dunamase — Laois", "text": "The ruins perched on the Rock of Dunamase were for centuries the stronghold of the O'Moore clan, lords of Laois, before Oliver Cromwell reduced it to rubble. It is said every noble family in Ireland has its own banshee, a female spirit whose sharp cry announces the imminent death of a member of the household, and the O'Moores' was among the most feared: she was heard wailing along the walls the night before a clan chief fell in battle. Locals say that even today, if you stand alone among the fallen stones at dusk, you may feel a sudden chill and a thin lament carried on the wind, as if the banshee, with no family left to warn, still keeps her ancient vigil out of habit."}
  },
  {
    id:"puck", title:"Il Re Pooka di Killorglin", place:"Killorglin — Kerry",
    cats:["creature"], x:65.6, y:420.0,
    scene:{mood:"gold", main:"goat", accent:"#c2712f"},
    text:"Il Pooka è uno degli spiriti più imprevedibili del folklore irlandese: una creatura mutaforma capace di apparire come cavallo nero, capra o folletto, che può portare fortuna o rovina secondo il proprio capriccio. Nella cittadina di Killorglin si racconta che, secoli fa, un branco di capre selvatiche in fuga dalle truppe di Cromwell avvertì gli abitanti dell'arrivo dei soldati correndo impazzita per le strade: da allora, ogni agosto, la città cattura una capra di montagna e la incorona 'Re Puck' su un trono innalzato in piazza per tre giorni di festa, in onore di quell'antico avvertimento. Alcuni anziani del posto, però, sussurrano che quella prima capra non fosse una capra qualunque, ma il Pooka stesso, apparso in quella forma per un suo scopo misterioso, e che il vero re della festa non sieda mai davvero sul trono, ma osservi la folla nascosto tra la gente.",
    en:{"title": "The Puck King of Killorglin", "place": "Killorglin — Kerry", "text": "The Pooka is one of the most unpredictable spirits in Irish folklore: a shapeshifting creature that can appear as a black horse, a goat, or a small imp, capable of bringing luck or ruin according to its own whim. In the town of Killorglin, it is said that centuries ago a herd of wild goats fleeing Cromwell's troops warned the townspeople of the soldiers' approach by rushing wildly through the streets: ever since, every August, the town captures a mountain goat and crowns it 'King Puck' on a raised throne in the square for three days of festival, honouring that ancient warning. Some of the town's elders, though, whisper that the first goat was no ordinary goat at all, but the Pooka itself, appearing in that form for some mysterious purpose of its own — and that the festival's true king never really sits on the throne, but watches the crowd hidden among the people."}
  },
  {
    id:"cuchulainn", title:"Setanta e il Cane di Culann", place:"Dún Dealgan, Dundalk — Louth",
    cats:["creature","reali"], x:312.7, y:185.3,
    scene:{mood:"night", main:"hound", accent:"#c2712f"},
    text:"Da bambino il piccolo Setanta, nipote del re dell'Ulster, si presentò da solo al banchetto del fabbro Culann, arrivando in ritardo. Non sapeva che Culann avesse lasciato libero il proprio cane, una bestia enorme e feroce allevata apposta per sbranare chiunque si avvicinasse senza permesso. Quando il cane gli si scagliò contro, Setanta lo uccise a mani nude, lanciandogli contro una palla con tale forza da conficcargliela in gola. Vedendo la disperazione di Culann, rimasto senza guardiano, il ragazzo si offrì di allevare un nuovo cucciolo e, nel frattempo, di fare lui stesso da guardiano alla casa. Da quel giorno fu chiamato Cú Chulainn, 'il Cane di Culann', e crebbe fino a diventare il più temuto guerriero dell'Ulster, capace, in battaglia, di entrare in un delirio di furia chiamato ríastrad che gli deformava il corpo in una forma quasi mostruosa.",
    en:{"title": "Setanta and Culann's Hound", "place": "Dún Dealgan, Dundalk — Louth", "text": "As a boy, young Setanta, nephew of the King of Ulster, arrived alone and late to a feast at the smith Culann's house. He did not know Culann had let loose his guard dog, an enormous, ferocious beast bred specifically to tear apart anyone approaching without permission. When the hound charged at him, Setanta killed it with his bare hands, hurling a ball at it with such force that it lodged in its throat. Seeing Culann's despair at losing his guardian, the boy offered to raise a new pup and, in the meantime, to guard the house himself. From that day he was called Cú Chulainn, 'the Hound of Culann', and grew to become Ulster's most feared warrior, capable in battle of entering a berserk fury called the ríastrad that twisted his body into an almost monstrous shape."}
  },
  {
    id:"graceomalley", title:"Granuaile, Regina dei Mari", place:"Clare Island, Clew Bay — Mayo",
    cats:["reali"], x:53.3, y:207.7,
    scene:{mood:"mist", main:"ship", accent:"#e9dcbb"},
    text:"Grace O'Malley, Gráinne Mhaol nella sua lingua, comandò per decenni una flotta di navi da guerra e da commercio lungo la costa selvaggia del Mayo, imponendo pedaggi ai mercanti che attraversavano le sue acque e non esitando a saccheggiare chi si rifiutava di pagare. Si narra che, tornata da un lungo viaggio e trovata la porta del castello di Howth chiusa perché la famiglia era a cena, rapisse per rappresaglia il giovane erede della casata, restituendolo solo dopo che il signore locale promise di tenere per sempre la propria tavola aperta agli ospiti inattesi, promessa che la famiglia Howth rispetta ancora oggi. Nel 1593 Granuaile navigò fino a Londra per incontrare di persona la regina Elisabetta I, rifiutandosi di inchinarsi perché, disse, non riconosceva in lei alcuna regina superiore a se stessa.",
    en:{"title": "Granuaile, Queen of the Seas", "place": "Clare Island, Clew Bay — Mayo", "text": "Grace O'Malley — Gráinne Mhaol in her own tongue — commanded a fleet of warships and trading vessels along the wild Mayo coast for decades, levying tolls on merchants who crossed her waters and never hesitating to raid those who refused to pay. It is said that once, returning from a long voyage and finding the gates of Howth Castle shut because the family was at dinner, she took revenge by kidnapping the young heir of the household, returning him only after the local lord promised to always keep his table open to unexpected guests — a promise the Howth family still honours today. In 1593 Granuaile sailed all the way to London to meet Queen Elizabeth I in person, refusing to bow, because, she said, she recognised no queen above herself."}
  },
  {
    id:"brianboru", title:"Il Corvo di Clontarf", place:"Clontarf — Dublino",
    cats:["reali","fantasmi"], x:329.3, y:263.8,
    scene:{mood:"night", main:"raven", accent:"#241d12"},
    text:"Nel Venerdì Santo del 1014, il vecchio Alto Re Brian Boru, che aveva unito sotto di sé quasi tutta l'Irlanda, affrontò a Clontarf un'alleanza di re vichinghi e ribelli irlandesi. Troppo anziano per combattere in prima persona, Brian pregò nella propria tenda mentre la battaglia infuriava sulla spiaggia, e fu proprio lì che un guerriero vichingo in fuga, Brodir, lo sorprese e lo uccise con l'ascia. Gli irlandesi vinsero comunque la battaglia, spezzando per sempre il potere vichingo sull'isola, ma pagarono la vittoria con la vita del loro re. Si dice che nella notte prima dello scontro, sopra l'accampamento di Brian, i corvi della dea della guerra Mórrígan volassero in cerchi silenziosi, presagio che i veterani lessero fin troppo bene, e che ancora oggi, ogni Venerdì Santo, uno stormo scuro si raduni sulla baia di Dublino.",
    en:{"title": "The Raven of Clontarf", "place": "Clontarf — Dublin", "text": "On Good Friday in 1014, the aging High King Brian Boru, who had united nearly all of Ireland under his rule, faced an alliance of Viking kings and Irish rebels at Clontarf. Too old to fight in person, Brian prayed in his tent while the battle raged on the shore, and it was there that a fleeing Viking warrior, Brodir, surprised and killed him with an axe. The Irish won the battle anyway, breaking Viking power over the island forever, but paid for the victory with their king's life. It is said that the night before the battle, ravens belonging to Mórrígan, goddess of war, circled silently above Brian's camp — an omen the veterans read all too well — and that even today, every Good Friday, a dark flock still gathers over Dublin Bay."}
  },
  {
    id:"croagh", title:"San Patrizio e i Serpenti", place:"Croagh Patrick — Mayo",
    cats:["maghi","misteri"], x:74.8, y:214.7,
    scene:{mood:"dawn", main:"mountain", accent:"#3f8079"},
    text:"Sulla cima della 'montagna sacra' che domina la baia di Clew, San Patrizio digiunò per quaranta giorni e quaranta notti nel 441, come Mosè sul Sinai, per ottenere da Dio la grazia di giudicare personalmente gli irlandesi nel giorno del Giudizio. Fu lì, secondo la leggenda più famosa dell'isola, che suonò una campana d'argento e scacciò in mare tutti i serpenti d'Irlanda, liberando per sempre la terra da ogni creatura velenosa: i naturalisti spiegano oggi che l'Irlanda non ebbe mai serpenti nemmeno prima dell'ultima era glaciale, ma i pellegrini preferiscono la versione del santo. Ogni anno, l'ultima domenica di luglio, decine di migliaia di persone salgono ancora il sentiero roccioso fino alla vetta, molti scalzi per penitenza, ripetendo un cammino di fede che si intreccia con riti pre-cristiani legati al dio Lugh assai più antichi dello stesso Patrizio.",
    en:{"title": "Saint Patrick and the Serpents", "place": "Croagh Patrick — Mayo", "text": "On the summit of the 'holy mountain' overlooking Clew Bay, Saint Patrick fasted for forty days and forty nights in 441, like Moses on Sinai, to win from God the grace of personally judging the Irish on Judgement Day. It was there, according to the island's most famous legend, that he rang a silver bell and drove every serpent in Ireland into the sea, freeing the land forever from any venomous creature: naturalists today explain that Ireland never had snakes even before the last ice age, but pilgrims prefer the saint's version. Every year, on the last Sunday of July, tens of thousands still climb the rocky path to the summit, many barefoot as penance, retracing a path of faith intertwined with pre-Christian rites tied to the god Lugh, far older than Patrick himself."}
  },
  {
    id:"cailleach_loughcrew", title:"Il Trono della Cailleach", place:"Loughcrew, Sliabh na Caillí — Meath",
    cats:["maghi","creature"], x:259.5, y:218.0,
    scene:{mood:"mist", main:"stones", second:"wisp", accent:"#5a76b8", accent2:"#e9dcbb", tx2:60, ty2:0, scale2:0.4},
    text:"Sulle colline di Loughcrew, disseminate di tombe a corridoio ancora più antiche di Newgrange, si racconta che la Cailleach, l'antica dea-strega creatrice del paesaggio irlandese, volasse da un colle all'altro con un grembiule pieno di massi, lasciandone cadere uno a ogni passo per costruire il mondo con le proprie mani. Sulla cima più alta, chiamata ancora oggi Sliabh na Caillí, resta una grande pietra scavata a forma di sedile: il 'Trono della Strega'. Chi vi si siede, dicono gli anziani della zona, riceve in dono un desiderio, ma deve fare attenzione a formularlo con cura, perché la Cailleach concede sempre esattamente ciò che le viene chiesto, parola per parola, e mai un briciolo di più di quanto richiesto, punendo con la lettera del desiderio chi ne aveva frainteso lo spirito.",
    en:{"title": "The Hag's Throne", "place": "Loughcrew, Sliabh na Caillí — Meath", "text": "On the hills of Loughcrew, scattered with passage tombs even older than Newgrange, it is said the Cailleach, the ancient witch-goddess who shaped the Irish landscape, flew from hill to hill with an apron full of boulders, dropping one with every step to build the world with her own hands. On the highest summit, still called Sliabh na Caillí, a great stone carved into a seat remains: the 'Hag's Chair'. Whoever sits upon it, the elders of the area say, is granted a wish — but must word it with great care, for the Cailleach always grants exactly what is asked, word for word, never a crumb more than requested, punishing with the letter of the wish anyone who had misunderstood its spirit."}
  },
  {
    id:"rathcroghan", title:"La Grotta dei Gatti", place:"Oweynagat, Rathcroghan — Roscommon",
    cats:["misteri","creature"], x:166.2, y:218.0,
    scene:{mood:"night", main:"cave", accent:"#3a2a4a"},
    text:"Sotto la pianura reale di Rathcroghan, antica capitale della regina Medb, si apre una fenditura naturale nella roccia chiamata Oweynagat, 'la grotta dei gatti': è considerata da secoli una delle porte dell'Otherworld, il regno degli spiriti e degli dèi. Da questa fenditura, narra la tradizione, ogni anno alla vigilia di Samhain, l'antico capodanno celtico che diede origine a Halloween, emergevano creature mostruose, uccelli dal fiato velenoso e la stessa dea della guerra Mórrígan, per riversarsi sul mondo dei vivi durante la notte in cui il confine tra i due regni si assottigliava fino a scomparire. I contadini della zona, ancora oggi, evitano di avvicinarsi troppo all'imboccatura della grotta dopo il tramonto del 31 ottobre, per timore di incrociare ciò che ne esce.",
    en:{"title": "The Cave of the Cats", "place": "Oweynagat, Rathcroghan — Roscommon", "text": "Beneath the royal plain of Rathcroghan, ancient capital of Queen Medb, a natural fissure in the rock called Oweynagat, 'the cave of the cats', opens into the earth: for centuries it has been considered one of the gateways to the Otherworld, the realm of spirits and gods. From this fissure, tradition says, every year on the eve of Samhain, the ancient Celtic new year that gave rise to Halloween, monstrous creatures emerged, birds with poisonous breath, and even the war goddess Mórrígan herself, pouring into the world of the living during the one night when the border between the two realms grew thin enough to vanish. Local farmers, even today, avoid going near the cave's mouth after sunset on the thirty-first of October, for fear of meeting whatever comes out of it."}
  },
  {
    id:"oisin", title:"Oisín e Niamh dai Capelli d'Oro", place:"Verso il mare d'occidente — Sligo",
    cats:["maghi","misteri"], x:126.0, y:160.0,
    scene:{mood:"dawn", main:"horse", second:"wave", accent:"#e9d9a0", accent2:"#3f8079", tx2:10, ty2:45, scale2:0.9},
    text:"Niamh dai Capelli d'Oro, principessa di Tír na nÓg, la Terra dell'Eterna Giovinezza, cavalcò fuori dal mare su un cavallo bianco per portare con sé il poeta guerriero Oisín, figlio di Fionn mac Cumhaill, di cui si era innamorata. Vissero insieme felici per quelli che a Oisín sembravano tre anni, finché la nostalgia dell'Irlanda non lo spinse a chiedere di tornare, solo per un breve saluto ai vecchi compagni. Niamh acconsentì, ma lo avvertì di non toccare mai terra con i piedi. Tornato in Irlanda, Oisín scoprì che erano trascorsi trecento anni: i Fianna erano polvere, il mondo irriconoscibile. Cadendo per caso da cavallo mentre aiutava alcuni uomini a spostare un macigno, toccò il suolo e invecchiò all'istante di trecento anni, diventando un vecchio cieco che raccontò le proprie storie a San Patrizio in persona.",
    en:{"title": "Oisín and Niamh of the Golden Hair", "place": "Toward the Western Sea — Sligo", "text": "Niamh of the Golden Hair, princess of Tír na nÓg, the Land of Eternal Youth, rode out of the sea on a white horse to carry off the poet-warrior Oisín, son of Fionn mac Cumhaill, with whom she had fallen in love. They lived happily together for what felt to Oisín like three years, until homesickness for Ireland drove him to ask to return, just for a brief farewell to his old companions. Niamh agreed, but warned him never to let his feet touch the ground. Back in Ireland, Oisín discovered three hundred years had passed: the Fianna were dust, the world unrecognisable. Falling by accident from his horse while helping some men move a boulder, he touched the earth and instantly aged three hundred years, becoming a blind old man who told his stories to Saint Patrick himself."}
  },
  {
    id:"loughgur", title:"Il Cerchio di Pietra sul Lago", place:"Lough Gur — Limerick",
    cats:["misteri","tesori"], x:157.7, y:368.3,
    scene:{mood:"mist", main:"stones", accent:"#c9a341"},
    text:"Lough Gur, un lago a forma di ferro di cavallo circondato dal più grande cerchio di pietre d'Irlanda, è considerato uno dei luoghi abitati senza interruzione più a lungo dell'intera isola, per oltre seimila anni. La leggenda locale narra che sul fondo del lago dorma ancora Gearóid Iarla, un conte normanno-irlandese e mago capace di trasformarsi in uccello, che vi fu imprigionato da un incantesimo dopo aver spaventato a morte la propria giovane sposa con una delle sue metamorfosi. Si dice che ogni sette anni Gearóid emerga dalle acque cavalcando un cavallo bianco ferrato d'argento, e che il giorno in cui i ferri di quel cavallo si saranno del tutto consumati sul fondale, il conte tornerà definitivamente a governare la valle, riportando con sé un'epoca di abbondanza dimenticata.",
    en:{"title": "The Stone Circle on the Lake", "place": "Lough Gur — Limerick", "text": "Lough Gur, a horseshoe-shaped lake ringed by Ireland's largest stone circle, is considered one of the longest continuously inhabited places on the whole island, for over six thousand years. Local legend says that at the bottom of the lake still sleeps Gearóid Iarla, a Norman-Irish earl and wizard able to transform into a bird, who was trapped there by a spell after one of his shapeshifting tricks frightened his young bride to death. It is said that every seven years Gearóid rises from the waters riding a white horse shod with silver, and that the day those horseshoes finally wear away on the lakebed, the earl will return for good to rule the valley, bringing with him a forgotten age of abundance."}
  },
  {
    id:"cailleach_beara", title:"La Vecchia di Beara", place:"Penisola di Beara — Cork",
    cats:["maghi","creature"], x:57.0, y:475.4,
    scene:{mood:"dawn", main:"hag", accent:"#5a76b8"},
    text:"All'estremità della selvaggia penisola di Beara, una roccia dal profilo simile a un volto di donna incappucciata guarda immobile verso l'oceano da tempo immemorabile: è la Cailleach Bhéara, la Vecchia di Beara, una delle incarnazioni più antiche della dea-strega che avrebbe modellato l'intera Irlanda. Si narra che abbia vissuto sette vite umane, sposando e seppellendo sette mariti, ringiovanendo ogni volta che lo desiderava semplicemente bevendo a una particolare sorgente segreta, finché un giorno, stanca di un'eternità di perdite, scelse di trasformarsi in pietra proprio lì, sulla costa, per continuare a vegliare sul mare in eterno senza più dover soffrire. I pescatori della zona lasciano ancora piccole offerte ai suoi piedi prima di salpare, chiedendole di placare le tempeste che lei stessa, si dice, può scatenare con un solo sospiro.",
    en:{"title": "The Hag of Beara", "place": "Beara Peninsula — Cork", "text": "At the far tip of the wild Beara Peninsula, a rock shaped like a hooded woman's face has stared unmoving out to sea since time immemorial: this is the Cailleach Bhéara, the Hag of Beara, one of the oldest incarnations of the witch-goddess said to have shaped the whole of Ireland. Legend says she lived seven human lifetimes, marrying and burying seven husbands, growing young again each time she wished simply by drinking from a certain secret spring, until one day, weary of an eternity of loss, she chose to turn to stone right there on the coast, so she could keep watch over the sea forever without having to suffer any more. Local fishermen still leave small offerings at her feet before setting sail, asking her to calm the storms she herself, it is said, can summon with a single sigh."}
  },
  {
    id:"kilkenny", title:"I Gatti di Kilkenny", place:"Kilkenny",
    cats:["creature"], x:252.5, y:351.3,
    scene:{mood:"night", main:"cats", accent:"#0c140f"},
    text:"Durante una rivolta del 1798, si racconta, un gruppo di soldati annoiati di stanza a Kilkenny prese l'abitudine crudele di legare per la coda due gatti e appenderli a un filo per farli combattere. Quando un ufficiale, avvertito del gioco, si avvicinò per fermarlo, un soldato ebbe appena il tempo di tagliare il filo con la sciabola per evitare la punizione: i due animali, secondo la leggenda diventata poi filastrocca popolare, avevano già combattuto con tale ferocia da divorarsi a vicenda quasi per intero, lasciando sul terreno soltanto le due code recise. Da questo racconto macabro nacque il detto dei 'Kilkenny cats', usato ancora oggi in inglese per descrivere due rivali che si combattono fino alla reciproca rovina totale, senza che nessuno dei due possa dirsi davvero vincitore.",
    en:{"title": "The Cats of Kilkenny", "place": "Kilkenny", "text": "During an uprising in 1798, it is said, a group of soldiers stationed in Kilkenny took up the cruel habit of tying two cats together by the tail and hanging them over a line to fight. When an officer, alerted to the game, approached to put a stop to it, one soldier barely had time to cut the line with his sabre to avoid punishment: the two animals, according to the legend that later became a popular rhyme, had already fought with such ferocity that they had devoured each other almost entirely, leaving on the ground nothing but their two severed tails. From this gruesome tale came the saying 'Kilkenny cats', still used in English today to describe two rivals who fight each other to mutual ruin, with neither able to claim true victory."}
  },
  {
    id:"charlesfort", title:"La Dama Bianca di Charles Fort", place:"Charles Fort, Kinsale — Cork",
    cats:["fantasmi"], x:160.6, y:469.9,
    scene:{mood:"duskghost", main:"ruin", second:"wisp", accent:"#3a3a3a", accent2:"#9a4a68", tx2:35, ty2:0, scale2:0.55},
    text:"Nella fortezza a forma di stella di Charles Fort, affacciata sul porto di Kinsale, si narra che la figlia del primo governatore, Bridget, si sposò proprio il giorno in cui suo marito, un giovane ufficiale, prese servizio come sentinella notturna per la prima volta. Volendo fargli una sorpresa romantica travestita da soldato, Bridget si avvicinò al suo posto di guardia nell'oscurità: il marito, non riconoscendola e temendo un disertore o una spia, sparò senza esitare, uccidendola sul colpo. Distrutto dal rimorso, l'uomo si tolse la vita gettandosi dalle mura poco dopo. Da allora i soldati di guarnigione, per generazioni, hanno raccontato di aver visto una figura femminile vestita di bianco vagare silenziosa lungo i bastioni nelle notti di luna, ancora in cerca dello sposo perduto in quella prima, tragica notte di nozze.",
    en:{"title": "The White Lady of Charles Fort", "place": "Charles Fort, Kinsale — Cork", "text": "At the star-shaped fortress of Charles Fort overlooking Kinsale harbour, it is said the first governor's daughter, Bridget, married on the very day her new husband, a young officer, took up his first night post as sentry. Wanting to surprise him romantically, Bridget dressed as a soldier and approached his post in the dark: her husband, not recognising her and fearing a deserter or a spy, fired without hesitation, killing her instantly. Overcome with remorse, the man took his own life shortly after by throwing himself from the walls. Ever since, generations of the garrison's soldiers have told of seeing a woman in white walking silently along the ramparts on moonlit nights, still searching for the groom lost on that first, tragic wedding night."}
  },
  {
    id:"malahide", title:"Il Giullare di Malahide", place:"Castello di Malahide — Dublino",
    cats:["fantasmi","reali"], x:333.0, y:252.9,
    scene:{mood:"duskghost", main:"castle", second:"wisp", accent:"#e9dcbb", accent2:"#9a4a68", tx2:30, ty2:0, scale2:0.55},
    text:"Il castello di Malahide, dimora della famiglia Talbot per quasi ottocento anni, ospitò per secoli un giullare di corte di nome Puck, un nano gobbo profondamente innamorato, senza speranza, di una dama della casata. Quando fu scoperto a spiarla in un momento intimo, i parenti della donna, furiosi, lo uccisero seduta stante nella stanza detta ancora oggi 'la camera del giullare'. Prima di morire, si narra, Puck pronunciò una maledizione e insieme una promessa: sarebbe rimasto per sempre a proteggere il castello, e nessuna Talbot sarebbe mai stata infelice in amore finché lui fosse rimasto. Ancora oggi il suo volto sogghignante è scolpito su un pannello della stanza, e i membri della famiglia raccontano di percepirne la presenza vigile, mai minacciosa, ogni volta che il castello attraversa momenti difficili.",
    en:{"title": "The Jester of Malahide", "place": "Malahide Castle — Dublin", "text": "Malahide Castle, home to the Talbot family for nearly eight hundred years, once housed a court jester named Puck, a hunchbacked dwarf hopelessly in love with a lady of the household. When he was caught spying on her in a private moment, her furious relatives killed him on the spot, in the room still known today as 'the jester's chamber'. Before dying, it is said, Puck spoke both a curse and a promise: he would remain forever to protect the castle, and no Talbot woman would ever be unlucky in love as long as he stayed. His grinning face is still carved into a panel in that room today, and family members say they can still sense his watchful, never threatening presence whenever the castle passes through difficult times."}

  {
    id:"hookhead", title:"Il Faro di Dubhán", place:"Hook Head — Wexford",
    cats:["misteri"], x:275.7, y:416.8,
    scene:{mood:"dawn", main:"lighthouse", accent:"#c9a341"},
    text:"Sulla punta rocciosa di Hook Head si erge quello che è considerato il faro operativo più antico del mondo, con una storia di segnali luminosi che risale a più di millecinquecento anni fa, quando il monaco gallese San Dubhán vi si stabilì da eremita. Dubhán, vedendo quante navi si spezzavano contro gli scogli nascosti nella nebbia, iniziò ad accendere ogni notte un fuoco d'avvertimento in cima alla scogliera, il primo di una lunga catena di guardiani del faro che si sarebbe tramandata per secoli. La leggenda racconta che un tempo la punta di Hook Head fosse abitata anche da una sirena, capace di calmare le tempeste con il proprio canto in cambio di offerte lasciate dai pescatori sulla riva, e che l'ultima delle sue apparizioni coincida, non a caso, con l'arrivo della prima luce artificiale del santo.",
    en:{"title": "The Lighthouse of Dubhán", "place": "Hook Head — Wexford", "text": "On the rocky point of Hook Head stands what is considered the oldest operating lighthouse in the world, with a history of guiding lights stretching back more than fifteen hundred years, to when the Welsh monk Saint Dubhán settled there as a hermit. Seeing how many ships broke apart on the hidden rocks in the fog, Dubhán began lighting a warning fire atop the cliff every night, the first in a long line of lighthouse keepers passed down for centuries. Legend tells that Hook Head was once also home to a mermaid, able to calm storms with her song in exchange for offerings left by fishermen on the shore, and that her last appearance coincided, not by chance, with the arrival of the saint's first artificial light."}
  },
  {
    id:"slane", title:"Il Castello che Ispirò Dracula", place:"Castello di Slane — Meath",
    cats:["fantasmi","misteri"], x:318.0, y:207.0,
    scene:{mood:"night", main:"castle", second:"bat", accent:"#241d12", accent2:"#5a76b8", tx2:60, ty2:5, scale2:0.4},
    text:"Non lontano da Newgrange, sulle rive del Boyne, sorge il castello di Slane, dimora della famiglia Conyngham fin dal Settecento. Gli storici della letteratura ricordano che Bram Stoker, l'autore irlandese di 'Dracula', frequentò gli ambienti aristocratici legati a questa zona della valle del Boyne e conosceva bene le rovine, i cimiteri diroccati e le colline cave della regione, che secondo molti studiosi avrebbero ispirato l'atmosfera gotica del suo capolavoro più di qualunque castello della Transilvania mai visitato di persona. Gli abitanti della zona amano raccontare che, nelle sere di nebbia sul fiume, le sagome delle torri di Slane contro la luna sembrino davvero uscite da un romanzo, e qualche guida locale giura, non senza malizia, che uno dei conti della famiglia Conyngham fosse la reale, discreta ispirazione per il conte più famoso della letteratura horror.",
    en:{"title": "The Castle that Inspired Dracula", "place": "Slane Castle — Meath", "text": "Not far from Newgrange, on the banks of the Boyne, stands Slane Castle, home of the Conyngham family since the eighteenth century. Literary historians recall that Bram Stoker, the Irish author of 'Dracula', moved in aristocratic circles connected to this stretch of the Boyne Valley and knew well its ruins, crumbling graveyards, and hollow hills, which many scholars believe inspired the gothic atmosphere of his masterpiece far more than any castle in Transylvania he ever actually visited. Locals love to say that on foggy evenings over the river, the silhouettes of Slane's towers against the moon truly look as if they stepped out of a novel, and some local guides claim, not without mischief, that one of the Conyngham counts was the real, discreet inspiration for horror literature's most famous count."}
  },
  {
    id:"moytura", title:"Le Quattro Reliquie dei Tuatha Dé Danann", place:"Cong, Moytura — Mayo",
    cats:["tesori","maghi"], x:102.4, y:242.7,
    scene:{mood:"gold", main:"cauldron", second:"sword", accent:"#c9a341", accent2:"#8a7431", tx2:60, ty2:0, scale2:0.42},
    text:"Quando il Popolo della Dea Danu giunse in Irlanda avvolto in una nube magica, portò con sé da quattro città leggendarie altrettanti oggetti di potere assoluto: la Lia Fáil, la pietra che riconosceva i veri re a Tara; la Lancia di Lugh, che garantiva la vittoria a chiunque la impugnasse in battaglia; la Spada di Nuada, capace di tagliare qualsiasi armatura una volta sguainata; e il Calderone del Dagda, da cui nessun commensale si allontanava mai insoddisfatto, tanta era l'abbondanza di cibo che sgorgava senza fine dal suo fondo. Fu proprio nella piana di Moytura, vicino a Cong, che questi tesori vennero usati nella grande battaglia contro i Fomori, i giganti del mare, in uno scontro che gli antichi cronisti irlandesi descrissero come la guerra decisiva tra l'ordine e il caos primordiale per il possesso stesso dell'isola.",
    en:{"title": "The Four Treasures of the Tuatha Dé Danann", "place": "Cong, Moytura — Mayo", "text": "When the People of the goddess Danu arrived in Ireland wrapped in a magic mist, they brought with them from four legendary cities four objects of absolute power: the Lia Fáil, the stone that recognised true kings at Tara; the Spear of Lugh, which guaranteed victory to whoever wielded it in battle; the Sword of Nuada, able to cut through any armour once drawn; and the Cauldron of the Dagda, from which no guest ever left unsatisfied, so endless was the abundance of food that flowed from its depths. It was on the plain of Moytura, near Cong, that these treasures were used in the great battle against the Fomorians, the giants of the sea, a clash ancient Irish chroniclers described as the decisive war between order and primordial chaos for possession of the island itself."}
  },
  {
    id:"craglea", title:"Aoibheall di Craglea", place:"Craglea, Killaloe — Clare",
    cats:["fantasmi","maghi"], x:164.5, y:332.1,
    scene:{mood:"duskghost", main:"stones", second:"wisp", accent:"#5a76b8", accent2:"#9a4a68", tx2:60, ty2:5, scale2:0.4},
    text:"Sulla collina boscosa di Craglea, sopra Killaloe, viveva Aoibheall, la banshee protettrice del clan Dál gCais e del suo più celebre discendente, il futuro Alto Re Brian Boru. Si narra che la notte prima della battaglia di Clontarf, Aoibheall apparve in sogno a Brian per avvertirlo che quella sarebbe stata la sua ultima notte in vita, offrendogli in cambio la certezza che la sua stirpe avrebbe governato l'Irlanda per generazioni. Brian scelse comunque di guidare i suoi uomini in battaglia, accettando il patto. Ancora oggi, quando il vento soffia con un particolare lamento tra gli alberi di Craglea, gli abitanti di Killaloe dicono che sia la voce di Aoibheall, che da mille anni continua a vegliare sulla discendenza del re che scelse l'onore alla vita eterna.",
    en:{"title": "Aoibheall of Craglea", "place": "Craglea, Killaloe — Clare", "text": "On the wooded hill of Craglea, above Killaloe, lived Aoibheall, the banshee protector of the Dál gCais clan and its most famous descendant, the future High King Brian Boru. It is said that the night before the Battle of Clontarf, Aoibheall appeared to Brian in a dream to warn him it would be his last night alive, offering in exchange the certainty his line would rule Ireland for generations. Brian chose to lead his men into battle anyway, accepting the bargain. Even today, when the wind blows through the trees of Craglea with a particular moan, the people of Killaloe say it is Aoibheall's voice, still watching over the descendants of the king who chose honour over eternal life, a thousand years on."}
