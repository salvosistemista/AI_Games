<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Acquario</title>
<style>
  :root{
    --ui-bg: #0f2f3a;
    --ui-bg-light: #163f4d;
    --ui-accent: #4fc3d9;
    --ui-text: #eaf6f8;
    --ui-text-dim: #9fc6cf;
    --ui-danger: #e2685a;
    --ui-warn: #e2b45a;
    --ui-ok: #5ad19a;
    --radius: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#04141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ui-text);}
  #app{position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;}

  /* TOP BAR */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px 14px;
    font-size: 14px; z-index: 20; background: linear-gradient(180deg, rgba(4,20,26,.85), rgba(4,20,26,0));
    position:absolute; top:0; left:0; right:0;
  }
  .stat{display:flex; align-items:center; gap:5px; opacity:.95;}
  .stat .icon{font-size:15px;}
  #waterBadge{width:10px; height:10px; border-radius:50%; background:var(--ui-ok); box-shadow:0 0 6px currentColor;}
  #waterBadge.warn{background:var(--ui-warn);}
  #waterBadge.danger{background:var(--ui-danger);}
  #alertDot{display:none; width:8px; height:8px; border-radius:50%; background:var(--ui-danger); margin-left:4px;}
  #alertDot.show{display:inline-block;}

  /* CANVAS */
  #tankWrap{flex:1; position:relative; overflow:hidden;}
  #tank{width:100%; height:100%; display:block; touch-action:none;}

  /* QUICK ACTIONS */
  #quickbar{
    position:absolute; left:0; right:0; bottom: calc(84px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:14px; z-index:20; pointer-events:none;
  }
  #quickbar button{pointer-events:auto;}
  .quick-btn{
    background: rgba(15,47,58,.85); border:1px solid rgba(255,255,255,.08);
    color:var(--ui-text); border-radius: 999px; padding: 10px 18px; font-size:14px;
    display:flex; align-items:center; gap:6px; backdrop-filter: blur(6px);
  }
  .quick-btn:active{ transform: scale(0.96); }

  /* MENU BUTTON */
  #menuBtn{
    position:absolute; right:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; border:none;
    background: var(--ui-accent); color:#04222b; font-size:22px; z-index:25;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  #fullscreenBtn{
    position:absolute; left:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:50%; border:none;
    background: rgba(15,47,58,.85); color:var(--ui-text); font-size:18px; z-index:25;
  }
  #exitZenBtn{
    position:absolute; right:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:40px; height:40px; border-radius:50%; border:none;
    background: rgba(15,47,58,.35); color:var(--ui-text); font-size:16px; z-index:30;
    display:none;
  }
  body.zen #exitZenBtn{ display:block; }

  /* ZEN MODE */
  body.zen #topbar, body.zen #quickbar, body.zen #menuBtn{ display:none; }

  /* OVERLAY / PANELS */
  .overlay{
    position:absolute; inset:0; background: rgba(2,12,16,.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:40;
  }
  .overlay.hidden{ display:none; }
  .sheet{
    width:100%; max-width:520px; max-height:82vh; overflow-y:auto;
    background: var(--ui-bg); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
    box-shadow: 0 -8px 30px rgba(0,0,0,.4);
  }
  .sheet h2{ margin:2px 0 14px 0; font-size:18px; font-weight:600; }
  .sheet-handle{ width:36px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:0 auto 12px auto;}
  .tabrow{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{ flex:1; text-align:center; padding:8px; border-radius:10px; background:var(--ui-bg-light); font-size:13px; color:var(--ui-text-dim); }
  .tab.active{ background:var(--ui-accent); color:#04222b; font-weight:600; }
  .close-x{ position:absolute; top:14px; right:16px; background:none; border:none; color:var(--ui-text-dim); font-size:20px; }

  .row{ display:flex; align-items:center; justify-content:space-between; padding:12px 10px; border-radius:14px; background:var(--ui-bg-light); margin-bottom:8px; }
  .row .name{ font-size:14px; font-weight:600; }
  .row .sub{ font-size:12px; color:var(--ui-text-dim); }
  .row button{ background:var(--ui-accent); color:#04222b; border:none; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; }
  .row button:disabled{ opacity:.4; }

  .grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .grid-cell{ aspect-ratio:1; border-radius:14px; background:var(--ui-bg-light); display:flex; align-items:center; justify-content:center; font-size:26px; position:relative; }
  .grid-cell.locked{ filter: grayscale(1) brightness(.4); }
  .grid-cell .lbl{ position:absolute; bottom:4px; font-size:9px; color:var(--ui-text-dim); }

  /* FISH PANEL */
  #fishPanel.overlay{ align-items:center; background: rgba(2,12,16,.35); }
  #fishPanel .sheet{ border-radius:22px; max-width:340px; }

  /* DAILY SUMMARY toast */
  #dailySummary{
    position:absolute; top: calc(56px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background: var(--ui-bg); border-radius:16px; padding:12px 16px; z-index:50; font-size:13px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); display:flex; align-items:center; gap:10px; max-width:88%;
  }
  #dailySummary.hidden{ display:none; }
  #dailySummary button{ background:var(--ui-accent); border:none; color:#04222b; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; }

  .money{ color:#ffd76a; }
  .rep{ color:#c9a6ff; }
  .badge-mini{ font-size:10px; padding:2px 6px; border-radius:6px; background:rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="stat"><span class="icon">💰</span><span id="moneyVal">0€</span></div>
    <div class="stat"><span class="icon">⭐</span><span id="repVal">0</span></div>
    <div class="stat"><span id="waterBadge"></span><span id="alertDot"></span></div>
  </div>

  <div id="tankWrap">
    <canvas id="tank"></canvas>
  </div>

  <div id="quickbar">
    <button class="quick-btn" id="btnFeed">🍚 Cibo</button>
    <button class="quick-btn" id="btnClean">💧 Pulisci</button>
  </div>

  <button id="fullscreenBtn">⛶</button>
  <button id="menuBtn">☰</button>
  <button id="exitZenBtn">✕</button>

  <!-- MENU PANEL -->
  <div class="overlay hidden" id="menuOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <button class="close-x" id="menuClose">✕</button>
      <h2>Menu</h2>
      <div class="row" data-open="shop"><div><div class="name">🛒 Negozio</div><div class="sub">Pesci, cibo, filtro</div></div><button>Apri</button></div>
      <div class="row" data-open="pharmacy" id="pharmacyRow" style="display:none;"><div><div class="name">💊 Farmacia</div><div class="sub">Medicine</div></div><button>Apri</button></div>
      <div class="row" data-open="encyclopedia"><div><div class="name">📖 Enciclopedia</div><div class="sub">Specie e malattie</div></div><button>Apri</button></div>
      <div class="row" data-open="missions"><div><div class="name">🎯 Missioni</div><div class="sub">Obiettivi del giorno</div></div><button>Apri</button></div>
      <div class="row" data-open="settings"><div><div class="name">⚙️ Impostazioni</div><div class="sub">Zen, salvataggio</div></div><button>Apri</button></div>
    </div>
  </div>

  <!-- GENERIC PANEL (shop/pharmacy/encyclopedia/missions/settings) -->
  <div class="overlay hidden" id="panelOverlay">
    <div class="sheet" id="panelSheet">
      <div class="sheet-handle"></div>
      <button class="close-x" id="panelClose">✕</button>
      <div id="panelContent"></div>
    </div>
  </div>

  <!-- FISH PANEL -->
  <div class="overlay hidden" id="fishPanel">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <button class="close-x" id="fishClose">✕</button>
      <div id="fishContent"></div>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="overlay hidden" id="startOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>Scegli il tuo primo pesce</h2>
      <div id="starterChoices"></div>
    </div>
  </div>

  <div id="dailySummary" class="hidden"></div>

</div>
<script>
"use strict";

/* =========================================================================
   1. DATI STATICI (CONFIG)
   ========================================================================= */

const SPECIES = {
  neon:      { id:'neon',      name:'Neon/Tetra',        social:'branco',      cost:8,  maxSize:0.35, foodTolerance:0.90, growthDays:3,  color:'#5ad1e8', accent:'#ffb85a', diseaseWeak:['finrot','ich'] },
  rosso:     { id:'rosso',     name:'Pesce Rosso',       social:'branco',      cost:12, maxSize:0.55, foodTolerance:0.85, growthDays:4,  color:'#ff8a5a', accent:'#ffd76a', diseaseWeak:['finrot','ich'] },
  gatto:     { id:'gatto',     name:'Pesce Gatto Notturno', social:'notturno', cost:15, maxSize:0.60, foodTolerance:0.75, growthDays:5,  color:'#7a6a8a', accent:'#c9b6ff', diseaseWeak:['fungus'], nocturnal:true },
  loach:     { id:'loach',     name:'Loach/Cobite',       social:'scavatore',   cost:18, maxSize:0.55, foodTolerance:0.65, growthDays:6,  color:'#c9a05a', accent:'#8a6a3a', diseaseWeak:['fungus','finrot'] },
  pagliaccio:{ id:'pagliaccio',name:'Pesce Pagliaccio',   social:'coppia',      cost:22, maxSize:0.45, foodTolerance:0.60, growthDays:7,  color:'#ff7a3a', accent:'#ffffff', diseaseWeak:['ich'] },
  chirurgo:  { id:'chirurgo',  name:'Pesce Chirurgo',     social:'territoriale',cost:28, maxSize:0.65, foodTolerance:0.50, growthDays:8,  color:'#3a6ad1', accent:'#ffd76a', diseaseWeak:['ich','stress_temp'] },
  farfalla:  { id:'farfalla',  name:'Pesce Farfalla',     social:'coppia_fissa',cost:32, maxSize:0.45, foodTolerance:0.40, growthDays:9,  color:'#ffd15a', accent:'#3a3a3a', diseaseWeak:['dropsy'] },
  angelo:    { id:'angelo',    name:'Pesce Angelo',       social:'territoriale',cost:35, maxSize:0.80, foodTolerance:0.35, growthDays:10, color:'#d1d1e8', accent:'#3a3a3a', diseaseWeak:['finrot','fungus'] },
  palla:     { id:'palla',     name:'Pesce Palla',        social:'territoriale',cost:40, maxSize:0.70, foodTolerance:0.30, growthDays:11, color:'#e8c95a', accent:'#3a3a3a', diseaseWeak:['dropsy'], canPuff:true },
  discus:    { id:'discus',    name:'Discus',             social:'delicata',    cost:55, maxSize:0.85, foodTolerance:0.20, growthDays:14, color:'#e85a7a', accent:'#5ae8c9', diseaseWeak:['ich','dropsy','finrot'] },
};
const SPECIES_ORDER = ['neon','rosso','gatto','loach','pagliaccio','chirurgo','farfalla','angelo','palla','discus'];
const STARTER_CHOICES = ['neon','rosso','gatto'];

const DISEASES = {
  finrot:      { id:'finrot',      name:'Marciume delle pinne', cause:'Acqua sporca prolungata',        cureType:'natural', contagious:true,  contagionSpeed:0.15, deathDays:5.5, symptom:'Pinne consumate' },
  ich:         { id:'ich',         name:'Punto bianco (Ich)',   cause:'Stress da sovraffollamento/temperatura', cureType:'medicine', medicineId:'antiparassitario', contagious:true, contagionSpeed:0.4, deathDays:4, symptom:'Macchie bianche' },
  dropsy:      { id:'dropsy',      name:'Gonfiore/Idropisia',   cause:'Overfeeding cronico',            cureType:'medicine', medicineId:'regolatore', contagious:false, contagionSpeed:0, deathDays:6.5, symptom:'Gonfiore, squame sollevate' },
  fungus:      { id:'fungus',      name:'Fungo acquatico',      cause:'Decomposizione/piante marce',    cureType:'natural', contagious:true, contagionSpeed:0.15, deathDays:5, symptom:'Chiazze bianco-cotonose' },
  apathy:      { id:'apathy',      name:'Depressione/apatia',   cause:'Solitudine prolungata',          cureType:'natural', contagious:false, contagionSpeed:0, deathDays:null, symptom:'Rifiuto cibo, immobilità', riskMultiplier:true },
  stress_temp: { id:'stress_temp', name:'Stress da temperatura',cause:'Riscaldatore assente/instabile', cureType:'natural', contagious:false, contagionSpeed:0, deathDays:null, symptom:'Rallentamento generale', riskMultiplier:true },
};

const MEDICINES = {
  antiparassitario: { id:'antiparassitario', name:'Anti-parassitario', cures:'ich', cost:12, days:3, filterDamage:0.15 },
  regolatore:       { id:'regolatore',       name:'Regolatore digestivo', cures:'dropsy', cost:18, days:4, filterDamage:0.10, needsFast:true },
};

const CONSUMABLES = {
  cibo:   { id:'cibo', name:'Cibo', cost:4, unitsPerPack:10 },
  filtro: { id:'filtro', name:'Ricambio filtro', cost:20, life:6 },
};

const OFFLINE_CAP_HOURS = 72;
const SAVE_KEY = 'acquario_save_v1';
const MAX_FISH = 10;

/* =========================================================================
   2. STATO DI GIOCO
   ========================================================================= */

function newGameState(){
  return {
    version: 1,
    money: 60,
    reputation: 0,
    day: 1,
    lastSaveTime: Date.now(),
    lastDayProcessed: 1,
    fish: [],          // {id, speciesId, birthDay, age, size, hunger, happiness, health, stage, diseaseId, diseaseDay, medicineId, medicineDaysLeft, pairId, selected}
    nextFishId: 1,
    plants: [],         // {id, name, health, growth, pruned}
    water: { ammonia:0, nitrite:0, nitrate:0, bacteria:0, temperature:25, oxygen:80 },
    filter: { life: 6, maxLife: 6 },
    foodUnits: 20,
    background: 'oceano',
    zen: false,
    missions: [],           // {id, key, label, done, rewardMoney, rewardRep}
    missionsDay: 0,
    encyclopediaSeen: {},   // speciesId -> true once owned
    started: false,
  };
}

let state = newGameState();
let selectedFishId = null;

/* =========================================================================
   3. LOGICA DI SIMULAZIONE
   ========================================================================= */

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function rand(min,max){ return min + Math.random()*(max-min); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function createFish(speciesId, opts){
  opts = opts || {};
  const f = {
    id: state.nextFishId++,
    speciesId,
    birthDay: opts.birthDay ?? state.day,
    age: opts.age ?? 0,           // in giorni di gioco
    size: opts.size ?? 0.15,
    hunger: opts.hunger ?? 30,     // 0 sazio, 100 affamato
    happiness: opts.happiness ?? 70,
    health: opts.health ?? 100,
    stage: opts.stage ?? 'avannotto',
    diseaseId: null,
    diseaseDay: 0,
    medicineId: null,
    medicineDaysLeft: 0,
    pairId: opts.pairId ?? null,
    x: rand(0.2,0.8), y: rand(0.2,0.8),
    tx: rand(0.2,0.8), ty: rand(0.2,0.8),
    swimPhase: Math.random()*Math.PI*2,
    // --- personalità (influenza la reazione al dito/puntatore) ---
    curiosity: opts.curiosity ?? rand(0.25,0.9),   // quanto è attratto da uno stimolo nuovo
    wariness: opts.wariness ?? rand(0.2,0.85),     // quanto è diffidente/pauroso
    experience: opts.experience ?? 0,              // cresce col tempo, riduce l'effetto della diffidenza
    _reactionState: 'normal',      // normal | flee | watch | approach | rush
    _reactionUntil: 0,
  };
  state.encyclopediaSeen[speciesId] = true;
  return f;
}

function speciesOf(fish){ return SPECIES[fish.speciesId]; }

function stageForAge(fish){
  const sp = speciesOf(fish);
  const growthDays = sp.growthDays;
  if (fish.age >= growthDays) return 'adulto';
  if (fish.age >= growthDays*0.4) return 'giovane';
  return 'avannotto';
}

/* ---- Tick "continuo" (chiamato ogni ~2s durante il gioco attivo, effetto leggero) ---- */
function tickLogic(){
  state.fish.forEach(f=>{
    // fame cresce lentamente
    f.hunger = clamp(f.hunger + 0.15, 0, 100);
    // felicità influenzata da fame, malattia, solitudine
    let happinessDelta = 0;
    if (f.hunger > 80) happinessDelta -= 0.1;
    if (f.diseaseId) happinessDelta -= 0.05;
    if (isLonely(f)) happinessDelta -= 0.08;
    if (isBored(f)) happinessDelta -= 0.05;
    f.happiness = clamp(f.happiness + happinessDelta, 0, 100);
    // salute scende se fame o infelicità estreme
    if (f.hunger > 90) f.health = clamp(f.health - 0.1, 0, 100);
    if (f.happiness < 15) f.health = clamp(f.health - 0.05, 0, 100);
    // l'esperienza cresce molto lentamente col tempo vissuto in vasca (riduce la diffidenza)
    f.experience = clamp(f.experience + 0.002, 0, 1);
  });
  render(); // il rendering vero e proprio gira comunque con requestAnimationFrame; qui aggiorniamo eventuali stati UI
  updateTopBarBadges();
}

function isLonely(f){
  const sp = speciesOf(f);
  if (sp.social==='branco'){
    const count = state.fish.filter(o=>o.speciesId===f.speciesId).length;
    return count < 2;
  }
  if (sp.social==='coppia' || sp.social==='coppia_fissa'){
    return !f.pairId || !state.fish.find(o=>o.id===f.pairId);
  }
  return false;
}
function isBored(f){
  // se non ci sono piante o decorazioni sufficienti, o non interagito da tempo
  const plantsOk = state.plants.filter(p=>p.health>30).length >= 1;
  return !plantsOk;
}

/* ---- Elaborazione giornaliera (mercato, missioni, crescita, malattie, riproduzione) ---- */
function processDailyTick(daysPassed){
  for (let i=0;i<daysPassed;i++){
    state.day++;
    dailyWaterDegrade();
    dailyGrowthAndFeed();
    dailyDiseaseProgress();
    dailyReproductionCheck();
    dailyMarketFluctuation();
    if (state.filter.life>0) state.filter.life = Math.max(0, state.filter.life-1);
  }
  refreshDailyMissionsIfNeeded();
}

function dailyWaterDegrade(){
  const w = state.water;
  const totalBioLoad = state.fish.reduce((s,f)=> s + 0.5 + f.size, 0);
  const filterEfficiency = state.filter.life>0 ? 1 : 0.4;
  const plantFiltering = state.plants.reduce((s,p)=> s + (p.health>30 ? 0.05 : 0), 0);

  w.ammonia = clamp(w.ammonia + totalBioLoad*0.8 - filterEfficiency*1.2 - plantFiltering, 0, 100);
  // batteri maturano lentamente (ciclo azoto, ~14 giorni per maturità piena)
  w.bacteria = clamp(w.bacteria + 0.07, 0, 1);
  const nitriteProd = w.ammonia * (0.15 + w.bacteria*0.3);
  w.nitrite = clamp(w.nitrite + nitriteProd*0.3 - w.bacteria*1.0, 0, 100);
  const nitrateProd = w.nitrite * (0.1 + w.bacteria*0.25);
  w.nitrate = clamp(w.nitrate + nitrateProd*0.25, 0, 100);

  w.oxygen = clamp(80 + plantFiltering*40 - totalBioLoad*1.5 - (w.temperature>28?10:0), 10, 100);

  // rischio malattie ambientali
  if (w.ammonia>55 || w.nitrite>50) tryOnsetDisease('finrot', 0.20);
  const rotting = state.plants.some(p=>p.health<15);
  if (rotting) tryOnsetDisease('fungus', 0.18);
}

function tryOnsetDisease(diseaseId, baseChance){
  state.fish.forEach(f=>{
    if (f.diseaseId) return;
    const sp = speciesOf(f);
    if (!sp.diseaseWeak.includes(diseaseId)) return;
    let chance = baseChance;
    if (hasRiskMultiplier(f)) chance *= 1.6;
    if (Math.random() < chance){
      f.diseaseId = diseaseId;
      f.diseaseDay = 0;
    }
  });
}
function hasRiskMultiplier(f){
  // apatia o stress da temperatura aumentano il rischio (agiscono come moltiplicatori, non come malattie dirette qui)
  return f.happiness < 25 || state.water.temperature < 22 || state.water.temperature > 29;
}

function dailyGrowthAndFeed(){
  state.fish.forEach(f=>{
    const sp = speciesOf(f);
    const wellFed = f.hunger < 70 && f.health > 40;
    if (wellFed){
      f.age += 1;
    } else {
      f.age += 0.5; // crescita rallentata da denutrizione
    }
    f.stage = stageForAge(f);
    const targetSize = Math.min(1, f.age / sp.growthDays);
    f.size = sp.maxSize * clamp(targetSize, 0.15, 1);

    // apatia da solitudine prolungata
    if (isLonely(f) && f.happiness < 30){
      tryOnsetDisease2(f, 'apathy');
    }
    if (state.water.temperature < 22 || state.water.temperature > 29){
      tryOnsetDisease2(f, 'stress_temp');
    }
  });
}
function tryOnsetDisease2(f, diseaseId){
  if (f.diseaseId) return;
  if (Math.random() < 0.25) { f.diseaseId = diseaseId; f.diseaseDay = 0; }
}

function dailyDiseaseProgress(){
  state.fish.forEach(f=>{
    if (!f.diseaseId) return;
    const dis = DISEASES[f.diseaseId];
    f.diseaseDay += 1;

    const beingTreated = f.medicineId === dis.medicineId && f.medicineDaysLeft > 0;
    if (dis.cureType==='medicine'){
      if (beingTreated){
        f.medicineDaysLeft -= 1;
        if (f.medicineDaysLeft <= 0){
          f.diseaseId = null; f.diseaseDay = 0; f.medicineId = null;
        }
      }
    } else {
      // cura naturale: se le condizioni sono migliorate, guarisce gradualmente
      if (conditionsImprovedFor(f)) {
        if (Math.random()<0.35){ f.diseaseId = null; f.diseaseDay = 0; }
      }
    }

    // contagio
    if (f.diseaseId && dis.contagious && Math.random() < dis.contagionSpeed){
      const others = state.fish.filter(o=>o.id!==f.id && !o.diseaseId && speciesOf(o).diseaseWeak.includes(f.diseaseId));
      if (others.length){ const target = choice(others); target.diseaseId = f.diseaseId; target.diseaseDay = 0; }
    }

    // morte per malattia non curata
    if (f.diseaseId && dis.deathDays && f.diseaseDay >= dis.deathDays){
      killFish(f.id, 'malattia');
    }
  });
}
function conditionsImprovedFor(f){
  const dis = DISEASES[f.diseaseId];
  if (dis.id==='finrot') return state.water.ammonia<30 && state.water.nitrite<30;
  if (dis.id==='fungus') return !state.plants.some(p=>p.health<15);
  if (dis.id==='apathy') return !isLonely(f) || f.happiness>50;
  if (dis.id==='stress_temp') return state.water.temperature>=22 && state.water.temperature<=29;
  return false;
}

function dailyReproductionCheck(){
  const bySpecies = {};
  state.fish.forEach(f=>{ (bySpecies[f.speciesId] = bySpecies[f.speciesId]||[]).push(f); });
  Object.keys(bySpecies).forEach(sid=>{
    const adults = bySpecies[sid].filter(f=>f.stage==='adulto' && !f.diseaseId);
    if (adults.length>=2 && Math.random()<0.12){
      const parents = [adults[0], adults[1]];
      if (state.fish.length < MAX_FISH){
        const baby = createFish(sid, {age:0, size:0.1, stage:'avannotto'});
        state.fish.push(baby);
        pushToast(`🐣 Nuovo ${SPECIES[sid].name} nato!`);
      } else {
        // nascita fallita: forte calo di felicità sui genitori
        parents.forEach(p=>{ p.happiness = clamp(p.happiness - 35, 0, 100); });
        pushToast(`💔 Nascita fallita: vasca piena (${SPECIES[sid].name})`);
      }
    }
  });
}

function dailyMarketFluctuation(){

function killFish(fishId, reason){

/* ---- Puntatore/dito: curiosità, diffidenza, reazioni individuali ---- */
const pointer = { x:0, y:0, active:false, lastMove:0, down:false };

function updateFishReactions(){
  const now = Date.now();
  const pointerRecent = pointer.active && (now - pointer.lastMove) < 900;
  state.fish.forEach(f=>{
    if (now < f._reactionUntil) return; // mantiene la reazione corrente per un po', evita scatti nervosi
    if (!pointerRecent){
      f._reactionState = 'normal';
      f._reactionUntil = now + 300;
      return;
    }
    const dist = Math.hypot(f.x-pointer.x, f.y-pointer.y);
    const proximity = clamp(1 - dist/0.35, 0, 1); // 0 = lontano, 1 = vicinissimo
    if (proximity <= 0){
      f._reactionState = 'normal';
      f._reactionUntil = now + 300;
      return;
    }
    const effectiveWariness = f.wariness * (1 - f.experience*0.5);
    const lonelyBonus = isLonely(f) ? 0.3 : 0; // insofferenza alla solitudine spinge verso il puntatore
    const score = (f.curiosity + lonelyBonus) - effectiveWariness + rand(-0.1,0.1);

    let newState;
    if (score < -0.15) newState = 'flee';
    else if (score < 0.15) newState = 'watch';
    else if (score < 0.45) newState = 'approach';
    else newState = 'rush';

    f._reactionState = newState;
    f._reactionUntil = now + rand(1200, 2200); // la reazione resta stabile per un po'
  });
}
setInterval(updateFishReactions, 400);

function setupPointerTracking(){
  function toNorm(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height };
  }
  function onMove(clientX, clientY){
    const p = toNorm(clientX, clientY);
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true; pointer.lastMove = Date.now();
  }
  canvas.addEventListener('pointermove', e=> onMove(e.clientX, e.clientY));
  canvas.addEventListener('pointerdown', e=>{ pointer.down = true; onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', ()=>{ pointer.down = false; });
  canvas.addEventListener('pointerleave', ()=>{ pointer.active = false; });
  canvas.addEventListener('touchmove', e=>{
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
}

/* ---- Progressione offline ---- */
function applyOfflineProgression(){
  const now = Date.now();
  let hoursPassed = (now - state.lastSaveTime) / 3600000;
  hoursPassed = clamp(hoursPassed, 0, OFFLINE_CAP_HOURS);
  const daysPassed = Math.floor(hoursPassed/24 * (24/24)); // 1 giorno di gioco = 24h reali
  // effetto continuo diretto: fame/felicità proporzionali alle ore
  state.fish.forEach(f=>{
    f.hunger = clamp(f.hunger + hoursPassed*0.6, 0, 100);
  });
  if (daysPassed>0){
    processDailyTick(daysPassed);
  }
  state.lastSaveTime = now;
  if (hoursPassed > 1){
    return { hours: Math.round(hoursPassed), days: daysPassed };
  }
  return null;
}

function feedAll(){

  state.fish.forEach(f=>{

    f.hunger = clamp(f.hunger - 40, 0, 100);

    if (Math.random() < overRisk*0.3){

      tryOnsetDisease2(f, 'dropsy');
    }
  });
  state.water.ammonia = clamp(state.water.ammonia + 3, 0, 100);
  playSound('feed');
  markMissionProgress('feed');

function cleanWater(){
  state.water.ammonia = clamp(state.water.ammonia - 35, 0, 100);
  state.water.nitrite = clamp(state.water.nitrite - 25, 0, 100);
  state.water.nitrate = clamp(state.water.nitrate - 40, 0, 100);

function buyFish(speciesId){
  const sp = SPECIES[speciesId];
  if (state.fish.length>=MAX_FISH){ pushToast('Vasca piena!'); return; }
  if (state.money < sp.cost){ pushToast('Fondi insufficienti'); return; }
  state.money -= sp.cost;
  const f = createFish(speciesId, {age:0, size:0.15, stage:'avannotto'});
  state.fish.push(f);
  playSound('coin');
  markMissionProgress('buy');
  renderShopIfOpen();
}

function sellFish(fishId){
  const f = state.fish.find(x=>x.id===fishId);
  if (!f) return;
  const price = computeSellPrice(f);
  state.money += price;
  state.fish = state.fish.filter(x=>x.id!==fishId);
  pushToast(`Venduto per ${price}€`);
  playSound('coin');
  markMissionProgress('sell');
  closeFishPanel();
}

function computeSellPrice(f){
  const sp = speciesOf(f);
  let price = sp.cost * 1.4; // base vendita più alta del costo d'acquisto
  const ageMod = f.stage==='adulto' ? 1.3 : (f.stage==='giovane' ? 1.0 : 0.6);
  const healthMod = 0.5 + (f.health/100)*0.6;
  const sizeMod = 0.7 + (f.size/sp.maxSize)*0.5;
  const market = state._marketMultiplier || 1;
  const demand = (state._demandSpecies===f.speciesId) ? (state._demandMultiplier||1) : 1;
  price = price*ageMod*healthMod*sizeMod*market*demand;
  return Math.round(price);
}

function buyMedicine(medId, fishId){
  const med = MEDICINES[medId];
  const f = state.fish.find(x=>x.id===fishId);
  if (!f) return;
  if (state.money < med.cost){ pushToast('Fondi insufficienti'); return; }
  if (f.diseaseId !== med.cures){ pushToast('Medicina sbagliata: dose sprecata!'); state.money -= med.cost; return; }
  state.money -= med.cost;
  f.medicineId = medId;
  f.medicineDaysLeft = med.days;
  state.water.ammonia = clamp(state.water.ammonia + med.filterDamage*10, 0, 100); // effetto collaterale sul filtro biologico
  playSound('coin');
}

function buyConsumable(id){
  const c = CONSUMABLES[id];
  if (state.money < c.cost){ pushToast('Fondi insufficienti'); return; }
  state.money -= c.cost;
  if (id==='cibo') state.foodUnits += c.unitsPerPack;
  if (id==='filtro') { state.filter.life = state.filter.maxLife; }
  playSound('coin');
  renderShopIfOpen();
}

const MISSION_POOL = [
  { key:'feed', label:'Dai da mangiare a tutti i pesci', reward:{money:3,rep:2}, feasible: ()=> state.fish.length>0 },
  { key:'clean', label:"Controlla/pulisci la qualità dell'acqua", reward:{money:3,rep:2}, feasible: ()=> true },
  { key:'cure', label:'Cura un pesce malato', reward:{money:6,rep:4}, feasible: ()=> state.fish.some(f=>f.diseaseId) },
  { key:'interact_lonely', label:'Interagisci con un pesce solo', reward:{money:4,rep:3}, feasible: ()=> state.fish.some(isLonely) },
  { key:'sell', label:'Vendi almeno 1 pesce', reward:{money:5,rep:3}, feasible: ()=> state.fish.length>0 },
  { key:'buy', label:'Compra un pesce nuovo', reward:{money:2,rep:3}, feasible: ()=> state.fish.length<MAX_FISH },
  { key:'plant', label:'Cura una pianta', reward:{money:3,rep:2}, feasible: ()=> state.plants.length>0 },
];

function refreshDailyMissionsIfNeeded(){
  if (state.missionsDay === state.day) return;
  state.missionsDay = state.day;
  const feasible = MISSION_POOL.filter(m=>m.feasible());
  const pool = feasible.length>=2 ? feasible : MISSION_POOL;
  const picks = [];
  const poolCopy = [...pool];
  while (picks.length<2 && poolCopy.length){
    const i = Math.floor(Math.random()*poolCopy.length);
    picks.push(poolCopy.splice(i,1)[0]);
  }
  state.missions = picks.map(m=>({ key:m.key, label:m.label, done:false, reward:m.reward }));
}
function markMissionProgress(key){
  const m = state.missions.find(x=>x.key===key && !x.done);
  if (m){
    m.done = true;
    state.money += m.reward.money;
    state.reputation += m.reward.rep;
    pushToast(`✅ Missione completata: +${m.reward.money}€ +${m.reward.rep}⭐`);
  }
}

/* =========================================================================
   4. RENDERING (Canvas 2D)
   ========================================================================= */
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d');
let dpr = Math.max(1, window.devicePixelRatio||1);

function resizeCanvas(){
  const wrap = document.getElementById('tankWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);

function render(){
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);

  drawBackground(w,h);
  state.plants.forEach(p=>drawPlant(p,w,h));
  state.fish.forEach(f=>drawFish(f,w,h));
  drawWaterOverlay(w,h);
  updateAndDrawFx(w,h);
}

function drawBackground(w,h){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#1c5b6e');
  grad.addColorStop(1,'#04222b');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

function drawPlant(p,w,h){
  const baseX = w*0.15 + (p.id*40)%(w*0.7);
  const baseY = h;
  const height = h*0.18*(0.5+p.growth);
  const alpha = clamp(p.health/100,0.2,1);
  ctx.strokeStyle = `rgba(90,209,154,${alpha})`;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(baseX+15, baseY-height*0.6, baseX, baseY-height);
  ctx.stroke();
}

function drawFish(f,w,h){
  const sp = speciesOf(f);
  const state_ = f._reactionState || 'normal';

  if (state_ === 'flee'){
    // scappa in direzione opposta al puntatore
    const dx = f.x - pointer.x, dy = f.y - pointer.y;
    const len = Math.hypot(dx,dy) || 0.001;
    f.tx = clamp(f.x + (dx/len)*0.3, 0.06,0.94);
    f.ty = clamp(f.y + (dy/len)*0.25, 0.08,0.9);
    f.x += (f.tx-f.x)*0.09; f.y += (f.ty-f.y)*0.09;
  } else if (state_ === 'watch'){
    // si ferma e osserva, nessun movimento verso il target
  } else if (state_ === 'approach'){
    f.tx = clamp(pointer.x + rand(-0.06,0.06), 0.06,0.94);
    f.ty = clamp(pointer.y + rand(-0.05,0.05), 0.08,0.9);
    f.x += (f.tx-f.x)*0.02; f.y += (f.ty-f.y)*0.02;
  } else if (state_ === 'rush'){
    f.tx = clamp(pointer.x, 0.06,0.94);
    f.ty = clamp(pointer.y, 0.08,0.9);
    f.x += (f.tx-f.x)*0.06; f.y += (f.ty-f.y)*0.06;
  } else {
    // nuoto libero verso pellet di cibo, se presenti, altrimenti vagabondaggio
    const pellet = nearestPellet(f);
    if (pellet){
      f.tx = pellet.x; f.ty = pellet.y;
      f.x += (f.tx-f.x)*0.035; f.y += (f.ty-f.y)*0.035;
      if (Math.hypot(pellet.x-f.x, pellet.y-f.y) < 0.03){ eatPellet(pellet); }
    } else {
      f.x += (f.tx-f.x)*0.01;
      f.y += (f.ty-f.y)*0.01;
      if (Math.abs(f.tx-f.x)<0.02 && Math.abs(f.ty-f.y)<0.02){
        f.tx = clamp(f.tx + rand(-0.2,0.2), 0.08,0.92);
        f.ty = clamp(f.ty + rand(-0.15,0.15), 0.1,0.85);
      }
    }
  }

  f.swimPhase += 0.05;
  const px = f.x*w, py = f.y*h + Math.sin(f.swimPhase)*4;
  const size = 18 + f.size*70;
  const facing = (state_==='watch') ? ((pointer.x > f.x) ? 1 : -1) : ((f.tx > f.x) ? 1 : -1);

  ctx.save();
  ctx.translate(px,py);
  ctx.scale(facing,1);

  let bodyW = size, bodyH = size*0.55;
  if (sp.canPuff && f.puffed){ bodyW = size*(1+f.puffed*0.5); bodyH = size*(0.55+f.puffed*0.4); }

  const grad = ctx.createRadialGradient(-bodyW*0.2,-bodyH*0.2,2, 0,0, bodyW);
  grad.addColorStop(0, lighten(sp.color, 0.25));
  grad.addColorStop(1, sp.color);
  ctx.fillStyle = grad;
  ctx.globalAlpha = f.diseaseId ? 0.7 : 1;

  ctx.beginPath();
  ctx.ellipse(0,0, bodyW*0.5, bodyH*0.5, 0, 0, Math.PI*2);
  ctx.fill();

  // coda: si agita più veloce se in fuga o rush, quasi ferma se "watch"
  const tailWag = state_==='watch' ? 0.4 : (state_==='flee'||state_==='rush' ? 1.6 : 1);
  ctx.fillStyle = sp.accent;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.45, 0);
  ctx.lineTo(-bodyW*0.8, -bodyH*0.4*tailWag);
  ctx.lineTo(-bodyW*0.8, bodyH*0.4*tailWag);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function nearestPellet(f){
  if (!fx.pellets.length) return null;
  let best=null, bestD=0.4;
  fx.pellets.forEach(p=>{
    const d = Math.hypot(p.x-f.x, p.y-f.y);
    if (d<bestD){ bestD=d; best=p; }
  });
  return best;
}
function eatPellet(p){
  fx.pellets = fx.pellets.filter(x=>x!==p);
  spawnSparkle(p.x,p.y);
}

function lighten(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r = (num>>16)+Math.round(255*amt);
  let g = ((num>>8)&0xff)+Math.round(255*amt);
  let b = (num&0xff)+Math.round(255*amt);
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return `rgb(${r},${g},${b})`;
}

function drawWaterOverlay(w,h){
  const dirty = clamp((state.water.ammonia + state.water.nitrite)/2, 0, 100);
  if (dirty>10){
    ctx.fillStyle = `rgba(120,140,60,${clamp(dirty/250,0,0.35)})`;
    ctx.fillRect(0,0,w,h);
  }
}

/* ---- Effetti visivi transitori (non salvati): cibo, pulizia, gioco ---- */
const fx = { pellets:[], bubbles:[], hearts:[] };

function spawnPellets(count){
  for (let i=0;i<count;i++){
    fx.pellets.push({ x: rand(0.2,0.8), y: rand(-0.05,0.05), vy: rand(0.0015,0.003) });
  }
}
function spawnBubbles(){
  for (let i=0;i<16;i++){
    fx.bubbles.push({ x: rand(0.05,0.95), y: 1+rand(0,0.2), vy: rand(0.004,0.009), r: rand(2,5), alpha:1 });
  }
}
function spawnHearts(x,y){
  for (let i=0;i<5;i++){
    fx.hearts.push({ x: x+rand(-0.03,0.03), y: y, vy: rand(0.003,0.006), alpha:1, life:0 });
  }
}
function spawnSparkle(x,y){
  fx.hearts.push({ x, y, vy:0.002, alpha:1, life:0, sparkle:true });
}

function updateAndDrawFx(w,h){
  // pellet di cibo che affondano lentamente
  fx.pellets.forEach(p=> p.y += p.vy);
  fx.pellets = fx.pellets.filter(p=> p.y < 0.95);
  fx.pellets.forEach(p=>{
    ctx.fillStyle = '#d9a85a';
    ctx.beginPath();
    ctx.arc(p.x*w, p.y*h, 3.5, 0, Math.PI*2);
    ctx.fill();
  });

  // bolle di pulizia che risalgono
  fx.bubbles.forEach(b=>{ b.y -= b.vy; b.alpha -= 0.006; });
  fx.bubbles = fx.bubbles.filter(b=> b.alpha>0 && b.y > -0.05);
  fx.bubbles.forEach(b=>{
    ctx.strokeStyle = `rgba(200,240,255,${clamp(b.alpha,0,1)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x*w, b.y*h, b.r, 0, Math.PI*2);
    ctx.stroke();
  });

  // cuoricini/sparkle da interazione
  fx.hearts.forEach(hh=>{ hh.y -= hh.vy; hh.life += 1; hh.alpha = clamp(1-hh.life/40,0,1); });
  fx.hearts = fx.hearts.filter(hh=> hh.alpha>0);
  fx.hearts.forEach(hh=>{
    ctx.globalAlpha = hh.alpha;
    ctx.font = '16px sans-serif';
    ctx.fillText(hh.sparkle ? '✨' : '💗', hh.x*w-8, hh.y*h);
    ctx.globalAlpha = 1;
  });
}

let rafId;
function loop(){
  render();
  rafId = requestAnimationFrame(loop);
}

/* =========================================================================
   5. AUDIO SINTETICO (Web Audio API)
   ========================================================================= */
let audioCtx;
function ensureAudio(){ if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(kind){
  try{
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (kind==='feed'){ osc.type='sine'; osc.frequency.setValueAtTime(440,t); gain.gain.setValueAtTime(0.08,t); }
    if (kind==='clean'){ osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.linearRampToValueAtTime(500,t+0.2); gain.gain.setValueAtTime(0.06,t); }
    if (kind==='coin'){ osc.type='triangle'; osc.frequency.setValueAtTime(660,t); osc.frequency.setValueAtTime(880,t+0.08); gain.gain.setValueAtTime(0.08,t); }
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
    osc.start(t); osc.stop(t+0.32);
  }catch(e){}
}

  else if (currentPanel==='encyclopedia') c.innerHTML = encyclopediaHTML();
  else if (currentPanel==='missions') c.innerHTML = missionsHTML();
  else if (currentPanel==='settings') c.innerHTML = settingsHTML();
  attachPanelHandlers();
}
function renderShopIfOpen(){ if (currentPanel==='shop') renderPanel(); updateTopBarBadges(); }

function shopHTML(){
  let rows = `<h2>🛒 Negozio</h2><div class="tabrow"><div class="tab active">Pesci</div></div>`;
  SPECIES_ORDER.forEach(id=>{
    const sp = SPECIES[id];
    const disabled = state.fish.length>=MAX_FISH || state.money<sp.cost;
    rows += `<div class="row"><div><div class="name">${sp.name}</div><div class="sub">${sp.cost}€ · ${sp.social}</div></div>
      <button data-buy="${id}" ${disabled?'disabled':''}>Compra</button></div>`;
  });
  rows += `<h2 style="margin-top:16px;">Consumabili</h2>`;
  rows += `<div class="row"><div><div class="name">Cibo (x10)</div><div class="sub">${CONSUMABLES.cibo.cost}€</div></div><button data-buyc="cibo">Compra</button></div>`;
  rows += `<div class="row"><div><div class="name">Ricambio filtro</div><div class="sub">${CONSUMABLES.filtro.cost}€</div></div><button data-buyc="filtro">Compra</button></div>`;
  return rows;
}
function pharmacyHTML(){
  let rows = `<h2>💊 Farmacia</h2>`;
  const sick = state.fish.filter(f=>f.diseaseId);
  if (!sick.length) rows += `<div class="sub">Nessun pesce malato al momento.</div>`;
  sick.forEach(f=>{
    const dis = DISEASES[f.diseaseId];
    rows += `<div class="row"><div><div class="name">${SPECIES[f.speciesId].name}</div><div class="sub">${dis.name}</div></div>`;
    if (dis.cureType==='medicine'){
      const med = MEDICINES[dis.medicineId];
      rows += `<button data-med="${med.id}" data-fish="${f.id}">${med.name} (${med.cost}€)</button>`;
    } else {
      rows += `<span class="badge-mini">cura naturale</span>`;
    }
    rows += `</div>`;
  });
  return rows;
}
function encyclopediaHTML(){
  let html = `<h2>📖 Enciclopedia</h2>
  <div class="tabrow">
    <div class="tab ${state._encTab!=='malattie'?'active':''}" data-enctab="specie">Specie</div>
    <div class="tab ${state._encTab==='malattie'?'active':''}" data-enctab="malattie">Malattie</div>
  </div>`;
  if (state._encTab==='malattie'){
    Object.values(DISEASES).forEach(d=>{
      html += `<div class="row"><div><div class="name">${d.name}</div><div class="sub">${d.cause} · ${d.symptom}</div></div><span class="badge-mini">${d.cureType==='medicine'?'medicina':'naturale'}</span></div>`;
    });
  } else {
    html += `<div class="grid">`;
    SPECIES_ORDER.forEach(id=>{
      const sp = SPECIES[id];
      const seen = state.encyclopediaSeen[id];
      html += `<div class="grid-cell ${seen?'':'locked'}" data-species="${id}">
        <span>🐟</span><span class="lbl">${seen? sp.name.split(' ')[0] : '???'}</span></div>`;
    });
    html += `</div>`;
  }
  return html;
}
function missionsHTML(){
  let html = `<h2>🎯 Missioni di oggi</h2>`;
  if (!state.missions.length) html += `<div class="sub">Nessuna missione disponibile.</div>`;
  state.missions.forEach(m=>{
    html += `<div class="row"><div><div class="name">${m.label}</div><div class="sub">${m.done?'Completata ✓':'In corso'}</div></div>
      <span class="badge-mini money">+${m.reward.money}€ <span class="rep">+${m.reward.rep}⭐</span></span></div>`;
  });
  return html;
}
function settingsHTML(){
  return `<h2>⚙️ Impostazioni</h2>
    <div class="row"><div><div class="name">Modalità Zen</div><div class="sub">Nasconde UI/comandi</div></div><button id="toggleZen">${state.zen?'Disattiva':'Attiva'}</button></div>
    <div class="row"><div><div class="name">Esporta salvataggio</div><div class="sub">Scarica file JSON</div></div><button id="exportSave">Esporta</button></div>
    <div class="row"><div><div class="name">Importa salvataggio</div><div class="sub">Carica file JSON</div></div><button id="importSaveBtn">Importa</button></div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="row"><div><div class="name">Reset di gioco</div><div class="sub">Cancella tutto e ricomincia da zero</div></div><button id="resetGameBtn" style="background:var(--ui-danger); color:#fff;">Reset</button></div>`;
}
function attachPanelHandlers(){
  const c = document.getElementById('panelContent');
  c.querySelectorAll('[data-buy]').forEach(b=> b.addEventListener('click', ()=> buyFish(b.dataset.buy)));
  c.querySelectorAll('[data-buyc]').forEach(b=> b.addEventListener('click', ()=> buyConsumable(b.dataset.buyc)));
  c.querySelectorAll('[data-med]').forEach(b=> b.addEventListener('click', ()=>{ buyMedicine(b.dataset.med, parseInt(b.dataset.fish)); renderPanel(); }));
  c.querySelectorAll('[data-enctab]').forEach(b=> b.addEventListener('click', ()=>{ state._encTab = b.dataset.enctab; renderPanel(); }));
  const zenBtn = document.getElementById('toggleZen');
  if (zenBtn) zenBtn.addEventListener('click', ()=>{ setZen(!state.zen); renderPanel(); });
  const exp = document.getElementById('exportSave');
  if (exp) exp.addEventListener('click', exportSave);
  const imp = document.getElementById('importSaveBtn');
  if (imp) imp.addEventListener('click', ()=> document.getElementById('importFile').click());
  const fileInput = document.getElementById('importFile');
  if (fileInput) fileInput.addEventListener('change', handleImportFile);
  const resetBtn = document.getElementById('resetGameBtn');
  if (resetBtn) resetBtn.addEventListener('click', ()=>{
    if (confirm('Vuoi davvero cancellare tutto il salvataggio e ricominciare da capo? L\'azione non è reversibile.')){
      resetGame();
    }
  });
}

function resetGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  fx.pellets = []; fx.bubbles = []; fx.hearts = [];
  state = newGameState();
  setZen(false);
  document.getElementById('panelOverlay').classList.add('hidden');
  document.getElementById('fishPanel').classList.add('hidden');
  document.getElementById('menuOverlay').classList.add('hidden');
  updateTopBarBadges();
  showStarterChoice();
}

/* --- Fish panel --- */
canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left)/rect.width;
  const y = (e.clientY-rect.top)/rect.height;
  let closest = null, dist = 0.08;
  state.fish.forEach(f=>{
    const d = Math.hypot(f.x-x, f.y-y);
    if (d<dist){ dist=d; closest=f; }
  });
  if (closest) openFishPanel(closest.id);
});
document.getElementById('fishClose').addEventListener('click', closeFishPanel);
function openFishPanel(fishId){
  selectedFishId = fishId;
  const f = state.fish.find(x=>x.id===fishId);
  if (!f) return;
  const sp = speciesOf(f);
  const dis = f.diseaseId ? DISEASES[f.diseaseId] : null;
  document.getElementById('fishContent').innerHTML = `
    <h2>${sp.name}</h2>
    <div class="sub">Stadio: ${f.stage} · Taglia: ${Math.round((f.size/sp.maxSize)*100)}%</div>
    <div class="row"><div class="name">Salute</div><div class="sub">${Math.round(f.health)}%</div></div>
    <div class="row"><div class="name">Umore</div><div class="sub">${Math.round(f.happiness)}%</div></div>
    ${dis ? `<div class="row"><div class="name">⚠️ ${dis.name}</div><div class="sub">${dis.symptom}</div></div>` : ''}
    <div class="row"><div><div class="name">Interagisci</div><div class="sub">Aumenta felicità</div></div><button id="interactBtn">Gioca</button></div>
    <div class="row"><div><div class="name">Vendi</div><div class="sub">~${computeSellPrice(f)}€ stimati</div></div><button id="sellBtn">Vendi</button></div>
  `;
  document.getElementById('fishPanel').classList.remove('hidden');
  document.getElementById('interactBtn').onclick = ()=>{
    f.happiness = clamp(f.happiness+20,0,100);
    f.experience = clamp(f.experience+0.03,0,1);
    spawnHearts(f.x, f.y);
    markMissionProgress('interact_lonely');
    playSound('feed');
    closeFishPanel();
  };
  document.getElementById('sellBtn').onclick = ()=> sellFish(f.id);
}
function closeFishPanel(){ document.getElementById('fishPanel').classList.add('hidden'); }

/* --- Quick actions --- */
document.getElementById('btnFeed').addEventListener('click', feedAll);
document.getElementById('btnClean').addEventListener('click', cleanWater);

/* --- Zen & fullscreen --- */
function setZen(v){ state.zen = v; document.body.classList.toggle('zen', v); }
document.getElementById('exitZenBtn').addEventListener('click', ()=> setZen(false));
document.getElementById('fullscreenBtn').addEventListener('click', ()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

/* =========================================================================
   7. SALVATAGGIO
   ========================================================================= */
function saveGame(){
  state.lastSaveTime = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const loaded = JSON.parse(raw);
    state = Object.assign(newGameState(), loaded);
    return true;
  }catch(e){ return false; }
}
function exportSave(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'acquario_salvataggio.json';
  a.click();
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const loaded = JSON.parse(reader.result);
      state = Object.assign(newGameState(), loaded);
      saveGame();
      updateTopBarBadges();
      pushToast('Salvataggio importato');
      document.getElementById('panelOverlay').classList.add('hidden');
    }catch(err){ pushToast('File non valido'); }
  };
  reader.readAsText(file);
}

/* =========================================================================
   8. BOOTSTRAP
   ========================================================================= */
function showStarterChoice(){
  const el = document.getElementById('starterChoices');
  el.innerHTML = '';
  STARTER_CHOICES.forEach(id=>{
    const sp = SPECIES[id];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><div class="name">${sp.name}</div><div class="sub">${sp.cost}€ · ${sp.social}</div></div><button>Scegli</button>`;
    row.querySelector('button').addEventListener('click', ()=>{
      state.money -= sp.cost;
      state.fish.push(createFish(id, {age:0, size:0.15, stage:'avannotto'}));
      state.started = true;
      document.getElementById('startOverlay').classList.add('hidden');
      saveGame();
    });
    el.appendChild(row);
  });
  document.getElementById('startOverlay').classList.remove('hidden');
}

function init(){
  resizeCanvas();
  setupPointerTracking();
  const loaded = loadGame();
  if (!loaded){
    state = newGameState();
    showStarterChoice();
  } else {
    const offline = applyOfflineProgression();
    if (offline){ pushToast(`Sei stato via ${offline.hours}h · ${offline.days} giorni passati`); }
  }
  refreshDailyMissionsIfNeeded();
  updateTopBarBadges();
  loop();
  setInterval(tickLogic, 2000);
  setInterval(saveGame, 15000);
  window.addEventListener('beforeunload', saveGame);
}
init();
</script>
