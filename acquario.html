<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Acquario</title>
<style>
  :root{
    --ui-bg: #0f2f3a;
    --ui-bg-light: #163f4d;
    --ui-accent: #4fc3d9;
    --ui-text: #eaf6f8;
    --ui-text-dim: #9fc6cf;
    --ui-danger: #e2685a;
    --ui-warn: #e2b45a;
    --ui-ok: #5ad19a;
    --radius: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#04141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ui-text);}
  #app{position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;}

  /* TOP BAR */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px 14px;
    font-size: 14px; z-index: 20; background: linear-gradient(180deg, rgba(4,20,26,.85), rgba(4,20,26,0));
    position:absolute; top:0; left:0; right:0;
  }
  .stat{display:flex; align-items:center; gap:5px; opacity:.95;}
  #statusOpener{ padding:4px 6px; margin:-4px -6px; border-radius:8px; }
  #statusOpener:active{ background: rgba(255,255,255,.08); }
  .stat .icon{font-size:15px;}
  #waterBadge{width:10px; height:10px; border-radius:50%; background:var(--ui-ok); box-shadow:0 0 6px currentColor;}
  #waterBadge.warn{background:var(--ui-warn);}
  #waterBadge.danger{background:var(--ui-danger);}
  #alertDot{display:none; width:8px; height:8px; border-radius:50%; background:var(--ui-danger); margin-left:4px;}
  #alertDot.show{display:inline-block;}

  /* CANVAS */
  #tankWrap{flex:1; position:relative; overflow:hidden;}
  #tank{width:100%; height:100%; display:block; touch-action:none;}

  /* QUICK ACTIONS */
  #quickbar{
    position:absolute; left:0; right:0; bottom: calc(84px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:14px; z-index:20; pointer-events:none;
  }
  #quickbar button{pointer-events:auto;}
  .quick-btn{
    background: rgba(15,47,58,.85); border:1px solid rgba(255,255,255,.08);
    color:var(--ui-text); border-radius: 999px; padding: 10px 18px; font-size:14px;
    display:flex; align-items:center; gap:6px; backdrop-filter: blur(6px);
  }
  .quick-btn:active{ transform: scale(0.96); }

  /* MENU BUTTON */
  #menuBtn{
    position:absolute; right:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; border:none;
    background: var(--ui-accent); color:#04222b; font-size:22px; z-index:25;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  #fullscreenBtn{
    position:absolute; left:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:50%; border:none;
    background: rgba(15,47,58,.85); color:var(--ui-text); font-size:18px; z-index:25;
  }
  #exitZenBtn{
    position:absolute; right:16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width:40px; height:40px; border-radius:50%; border:none;
    background: rgba(15,47,58,.35); color:var(--ui-text); font-size:16px; z-index:30;
    display:none;
  }
  body.zen #exitZenBtn{ display:block; }

  /* ZEN MODE */
  body.zen #topbar, body.zen #quickbar, body.zen #menuBtn{ display:none; }

  /* OVERLAY / PANELS */
  .overlay{
    position:absolute; inset:0; background: rgba(2,12,16,.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:40;
  }
  .overlay.hidden{ display:none; }
  .sheet{
    position:relative;
    width:100%; max-width:520px; max-height:82vh;
    background: var(--ui-bg); border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.4);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet-scroll{
    overflow-y:auto;
    padding: 18px 18px calc(56px + env(safe-area-inset-bottom)) 18px;
  }
  .sheet h2{ margin:2px 0 14px 0; font-size:18px; font-weight:600; }
  .sheet-handle{ width:36px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:0 auto 12px auto;}
  .tabrow{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{ flex:1; text-align:center; padding:8px; border-radius:10px; background:var(--ui-bg-light); font-size:13px; color:var(--ui-text-dim); }
  .tab.active{ background:var(--ui-accent); color:#04222b; font-weight:600; }
  .close-x{
    position:absolute; bottom:14px; right:16px; z-index:5;
    width:36px; height:36px; border-radius:50%;
    background: var(--ui-bg-light); border:1px solid rgba(255,255,255,.1);
    color:var(--ui-text); font-size:16px; display:flex; align-items:center; justify-content:center;
  }

  .row{ display:flex; align-items:center; justify-content:space-between; padding:12px 10px; border-radius:14px; background:var(--ui-bg-light); margin-bottom:8px; }
  .row .name{ font-size:14px; font-weight:600; }
  .row .sub{ font-size:12px; color:var(--ui-text-dim); }
  .row button{ background:var(--ui-accent); color:#04222b; border:none; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; }
  .row button:disabled{ opacity:.4; }

  .grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .grid-cell{ aspect-ratio:1; border-radius:14px; background:var(--ui-bg-light); display:flex; align-items:center; justify-content:center; font-size:26px; position:relative; }
  .grid-cell.locked{ filter: grayscale(1) brightness(.4); }
  .grid-cell .lbl{ position:absolute; bottom:4px; font-size:9px; color:var(--ui-text-dim); }

  /* FISH PANEL */
  #fishPanel.overlay{ align-items:center; background: rgba(2,12,16,.35); }
  #fishPanel .sheet{ border-radius:22px; max-width:340px; }

  /* DAILY SUMMARY toast */
  #dailySummary{
    position:absolute; top: calc(56px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background: var(--ui-bg); border-radius:16px; padding:12px 16px; z-index:50; font-size:13px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); display:flex; align-items:center; gap:10px; max-width:88%;
  }
  #dailySummary.hidden{ display:none; }
  #dailySummary button{ background:var(--ui-accent); border:none; color:#04222b; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; }

  .money{ color:#ffd76a; }
  .rep{ color:#c9a6ff; }
  .badge-mini{ font-size:10px; padding:2px 6px; border-radius:6px; background:rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="stat"><span class="icon">💰</span><span id="moneyVal">0€</span></div>
    <div class="stat"><span class="icon">⭐</span><span id="repVal">0</span></div>
    <div class="stat" id="statusOpener"><span id="waterBadge"></span><span id="alertDot"></span></div>
  </div>

  <div id="tankWrap">
    <canvas id="tank"></canvas>
  </div>

  <div id="quickbar">
    <button class="quick-btn" id="btnFeed">🍚 Cibo</button>
    <button class="quick-btn" id="btnClean">💧 Pulisci</button>
  </div>

  <button id="fullscreenBtn">⛶</button>
  <button id="menuBtn">☰</button>
  <button id="exitZenBtn">✕</button>

  <!-- MENU PANEL -->
  <div class="overlay hidden" id="menuOverlay">
    <div class="sheet">
      <button class="close-x" id="menuClose">✕</button>
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <h2>Menu</h2>
        <div class="row" data-open="shop"><div><div class="name">🛒 Negozio</div><div class="sub">Pesci, cibo, filtro</div></div><button>Apri</button></div>
        <div class="row" data-open="garden"><div><div class="name">🌿 Giardino</div><div class="sub">Piante e decorazioni</div></div><button>Apri</button></div>
        <div class="row" data-open="pharmacy" id="pharmacyRow" style="display:none;"><div><div class="name">💊 Farmacia</div><div class="sub">Medicine</div></div><button>Apri</button></div>
        <div class="row" data-open="encyclopedia"><div><div class="name">📖 Enciclopedia</div><div class="sub">Specie e malattie</div></div><button>Apri</button></div>
        <div class="row" data-open="missions"><div><div class="name">🎯 Missioni</div><div class="sub">Obiettivi del giorno</div></div><button>Apri</button></div>
        <div class="row" data-open="settings"><div><div class="name">⚙️ Impostazioni</div><div class="sub">Zen, salvataggio</div></div><button>Apri</button></div>
      </div>
    </div>
  </div>

  <!-- GENERIC PANEL (shop/pharmacy/encyclopedia/missions/settings) -->
  <div class="overlay hidden" id="panelOverlay">
    <div class="sheet">
      <button class="close-x" id="panelClose">✕</button>
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <div id="panelContent"></div>
      </div>
    </div>
  </div>

  <!-- FISH PANEL -->
  <div class="overlay hidden" id="fishPanel">
    <div class="sheet">
      <button class="close-x" id="fishClose">✕</button>
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <div id="fishContent"></div>
      </div>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="overlay hidden" id="startOverlay">
    <div class="sheet">
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <h2>Scegli il tuo primo pesce</h2>
        <div id="starterChoices"></div>
      </div>
    </div>
  </div>

  <div id="dailySummary" class="hidden"></div>

  <!-- RIEPILOGO GIORNALIERO -->
  <div class="overlay hidden" id="dailySummaryOverlay">
    <div class="sheet" style="max-width:380px;">
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <div id="dailySummaryContent"></div>
      </div>
    </div>
  </div>

</div>
<script>
"use strict";

/* =========================================================================
   1. DATI STATICI (CONFIG)
   ========================================================================= */

const SPECIES = {
  neon:      { id:'neon',      name:'Neon/Tetra',        social:'branco',      cost:8,  maxSize:0.35, foodTolerance:0.90, growthDays:3,  color:'#5ad1e8', accent:'#ffb85a', diseaseWeak:['finrot','ich'] },
  rosso:     { id:'rosso',     name:'Pesce Rosso',       social:'branco',      cost:12, maxSize:0.55, foodTolerance:0.85, growthDays:4,  color:'#ff8a5a', accent:'#ffd76a', diseaseWeak:['finrot','ich'] },
  gatto:     { id:'gatto',     name:'Pesce Gatto Notturno', social:'notturno', cost:15, maxSize:0.60, foodTolerance:0.75, growthDays:5,  color:'#7a6a8a', accent:'#c9b6ff', diseaseWeak:['fungus'], nocturnal:true },
  loach:     { id:'loach',     name:'Loach/Cobite',       social:'scavatore',   cost:18, maxSize:0.55, foodTolerance:0.65, growthDays:6,  color:'#c9a05a', accent:'#8a6a3a', diseaseWeak:['fungus','finrot'] },
  pagliaccio:{ id:'pagliaccio',name:'Pesce Pagliaccio',   social:'coppia',      cost:22, maxSize:0.45, foodTolerance:0.60, growthDays:7,  color:'#ff7a3a', accent:'#ffffff', diseaseWeak:['ich'] },
  chirurgo:  { id:'chirurgo',  name:'Pesce Chirurgo',     social:'territoriale',cost:28, maxSize:0.65, foodTolerance:0.50, growthDays:8,  color:'#3a6ad1', accent:'#ffd76a', diseaseWeak:['ich','stress_temp'] },
  farfalla:  { id:'farfalla',  name:'Pesce Farfalla',     social:'coppia_fissa',cost:32, maxSize:0.45, foodTolerance:0.40, growthDays:9,  color:'#ffd15a', accent:'#3a3a3a', diseaseWeak:['dropsy'] },
  angelo:    { id:'angelo',    name:'Pesce Angelo',       social:'territoriale',cost:35, maxSize:0.80, foodTolerance:0.35, growthDays:10, color:'#d1d1e8', accent:'#3a3a3a', diseaseWeak:['finrot','fungus'] },
  palla:     { id:'palla',     name:'Pesce Palla',        social:'territoriale',cost:40, maxSize:0.70, foodTolerance:0.30, growthDays:11, color:'#e8c95a', accent:'#3a3a3a', diseaseWeak:['dropsy'], canPuff:true },
  discus:    { id:'discus',    name:'Discus',             social:'delicata',    cost:55, maxSize:0.85, foodTolerance:0.20, growthDays:14, color:'#e85a7a', accent:'#5ae8c9', diseaseWeak:['ich','dropsy','finrot'] },
};
const SPECIES_ORDER = ['neon','rosso','gatto','loach','pagliaccio','chirurgo','farfalla','angelo','palla','discus'];
const STARTER_CHOICES = ['neon','rosso','gatto'];

const DISEASES = {
  finrot:      { id:'finrot',      name:'Marciume delle pinne', cause:'Acqua sporca prolungata',        cureType:'natural', contagious:true,  contagionSpeed:0.15, deathDays:5.5, symptom:'Pinne consumate' },
  ich:         { id:'ich',         name:'Punto bianco (Ich)',   cause:'Stress da sovraffollamento/temperatura', cureType:'medicine', medicineId:'antiparassitario', contagious:true, contagionSpeed:0.4, deathDays:4, symptom:'Macchie bianche' },
  dropsy:      { id:'dropsy',      name:'Gonfiore/Idropisia',   cause:'Overfeeding cronico',            cureType:'medicine', medicineId:'regolatore', contagious:false, contagionSpeed:0, deathDays:6.5, symptom:'Gonfiore, squame sollevate' },
  fungus:      { id:'fungus',      name:'Fungo acquatico',      cause:'Decomposizione/piante marce',    cureType:'natural', contagious:true, contagionSpeed:0.15, deathDays:5, symptom:'Chiazze bianco-cotonose' },
  apathy:      { id:'apathy',      name:'Depressione/apatia',   cause:'Solitudine prolungata',          cureType:'natural', contagious:false, contagionSpeed:0, deathDays:null, symptom:'Rifiuto cibo, immobilità', riskMultiplier:true },
  stress_temp: { id:'stress_temp', name:'Stress da temperatura',cause:'Riscaldatore assente/instabile', cureType:'natural', contagious:false, contagionSpeed:0, deathDays:null, symptom:'Rallentamento generale', riskMultiplier:true },
};

const MEDICINES = {
  antiparassitario: { id:'antiparassitario', name:'Anti-parassitario', cures:'ich', cost:12, days:3, filterDamage:0.15 },
  regolatore:       { id:'regolatore',       name:'Regolatore digestivo', cures:'dropsy', cost:18, days:4, filterDamage:0.10, needsFast:true },
};

const CONSUMABLES = {
  cibo:   { id:'cibo', name:'Cibo', cost:4, unitsPerPack:10 },
  filtro: { id:'filtro', name:'Ricambio filtro', cost:20, life:6 },
  fertilizzante: { id:'fertilizzante', name:'Fertilizzante', cost:8, unitsPerPack:6 },
  riscaldatore: { id:'riscaldatore', name:'Ricarica riscaldatore', cost:16, life:6 },
};
const ROOM_TEMP = 20;

const PLANT_TYPES = {
  muschio:    { id:'muschio',    name:'Muschio di Giava', cost:6,  oxygen:0.35, filter:0.30, growthRate:0.05 },
  vallisneria:{ id:'vallisneria',name:'Vallisneria',       cost:10, oxygen:0.55, filter:0.45, growthRate:0.035 },
  anubias:    { id:'anubias',    name:'Anubias',           cost:16, oxygen:0.45, filter:0.65, growthRate:0.02 },
};
const DECORATION_TYPES = {
  grotta:   { id:'grotta',   name:'Grotta',            cost:14, hidingSpot:true },
  castello: { id:'castello', name:'Castello sommerso', cost:22, enrichment:true },
};
const MAX_TANK_ITEMS = 6;

const OFFLINE_CAP_HOURS = 72;
const SAVE_KEY = 'acquario_save_v1';
const MAX_FISH = 10;

/* =========================================================================
   2. STATO DI GIOCO
   ========================================================================= */

function newGameState(){
  return {
    version: 1,
    money: 60,
    reputation: 0,
    day: 1,
    lastSaveTime: Date.now(),
    lastDayAdvanceTime: Date.now(),
    lastPartialTickTime: Date.now(), // ultimo istante in cui è stata applicata la progressione continua proporzionale
    lastDayProcessed: 1,
    fish: [],          // {id, speciesId, birthDay, age, size, hunger, happiness, health, stage, diseaseId, diseaseDay, medicineId, medicineDaysLeft, pairId, selected}
    nextFishId: 1,
    plants: [],         // {id, kind, isPlant, health, growth, overgrownDays} oppure {id, kind, isPlant:false, health:100} per decorazioni
    nextPlantId: 1,
    fertilizerUnits: 0,
    light: { intensity: 0.7, upgraded: false },
    substrate: 'standard', // 'standard' | 'fine'
    water: { ammonia:0, nitrite:0, nitrate:0, bacteria:0, temperature:25, oxygen:80 },
    filter: { life: 6, maxLife: 6 },
    heater: { life: 6, maxLife: 6, targetTemp: 25 },
    foodUnits: 20,
    background: 'oceano',
    zen: false,
    missions: [],           // {id, key, label, done, rewardMoney, rewardRep}
    missionsDay: 0,
    weeklyMission: null,    // {key, label, target, progressKey, reward, done}
    weeklyMissionDay: 0,
    weeklyProgress: { sold:0, cleanStreak:0, reproducedCount:0, adultNoDiseaseCount:0 },
    encyclopediaSeen: {},   // speciesId -> true once owned
    started: false,
  };
}

let state = newGameState();
let selectedFishId = null;

/* =========================================================================
   3. LOGICA DI SIMULAZIONE
   ========================================================================= */

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function rand(min,max){ return min + Math.random()*(max-min); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function createFish(speciesId, opts){
  opts = opts || {};
  const f = {
    id: state.nextFishId++,
    speciesId,
    birthDay: opts.birthDay ?? state.day,
    age: opts.age ?? 0,           // in giorni di gioco
    size: opts.size ?? 0.15,
    hunger: opts.hunger ?? 30,     // 0 sazio, 100 affamato
    happiness: opts.happiness ?? 70,
    health: opts.health ?? 100,
    stage: opts.stage ?? 'avannotto',
    diseaseId: null,
    diseaseDay: 0,
    medicineId: null,
    medicineDaysLeft: 0,
    pairId: opts.pairId ?? null,
    x: rand(0.2,0.8), y: rand(0.2,0.8),
    tx: rand(0.2,0.8), ty: rand(0.2,0.8),
    swimPhase: Math.random()*Math.PI*2,
    // --- personalità (influenza la reazione al dito/puntatore) ---
    curiosity: opts.curiosity ?? rand(0.25,0.9),   // quanto è attratto da uno stimolo nuovo
    wariness: opts.wariness ?? rand(0.2,0.85),     // quanto è diffidente/pauroso
    experience: opts.experience ?? 0,              // cresce col tempo, riduce l'effetto della diffidenza
    neverSick: opts.neverSick ?? true,             // per la missione settimanale "adulto senza mai ammalarsi"
    _reactionState: 'normal',      // normal | flee | watch | approach | rush
    _reactionUntil: 0,
  };
  state.encyclopediaSeen[speciesId] = true;
  return f;
}

function speciesOf(fish){ return SPECIES[fish.speciesId]; }

function stageForAge(fish){
  const sp = speciesOf(fish);
  const growthDays = sp.growthDays;
  if (fish.age >= growthDays) return 'adulto';
  if (fish.age >= growthDays*0.4) return 'giovane';
  return 'avannotto';
}

/* ---- Tick "continuo" (chiamato ogni ~2s durante il gioco attivo, effetto leggero) ---- */
function tickLogic(){
  const hasHidingSpot = state.plants.some(p=>!p.isPlant && p.kind==='grotta' && p.health>0);
  state.fish.forEach(f=>{
    const sp = speciesOf(f);
    // fame cresce lentamente
    f.hunger = clamp(f.hunger + 0.15, 0, 100);
    // felicità influenzata da fame, malattia, solitudine
    let happinessDelta = 0;
    if (f.hunger > 80) happinessDelta -= 0.1;
    if (f.diseaseId) happinessDelta -= 0.05;
    if (isLonely(f)) happinessDelta -= 0.08;
    if (isBored(f)) happinessDelta -= 0.05;
    if (state.substrate==='fine' && sp.social==='scavatore') happinessDelta += 0.05;
    if (hasHidingSpot && sp.social==='territoriale') happinessDelta += 0.03;
    f.happiness = clamp(f.happiness + happinessDelta, 0, 100);
    // salute scende se fame o infelicità estreme
    if (f.hunger > 90) f.health = clamp(f.health - 0.1, 0, 100);
    if (f.happiness < 15) f.health = clamp(f.health - 0.05, 0, 100);
    // l'esperienza cresce molto lentamente col tempo vissuto in vasca (riduce la diffidenza)
    f.experience = clamp(f.experience + 0.002, 0, 1);
  });
  render(); // il rendering vero e proprio gira comunque con requestAnimationFrame; qui aggiorniamo eventuali stati UI
  updateTopBarBadges();
}

function isLonely(f){
  const sp = speciesOf(f);
  if (sp.social==='branco'){
    const count = state.fish.filter(o=>o.speciesId===f.speciesId).length;
    return count < 2;
  }
  if (sp.social==='coppia' || sp.social==='coppia_fissa'){
    return !f.pairId || !state.fish.find(o=>o.id===f.pairId);
  }
  return false;
}
function isBored(f){
  // se non ci sono piante o decorazioni sufficienti, o non interagito da tempo
  const plantsOk = state.plants.filter(p=>p.health>30).length >= 1;
  return !plantsOk;
}

/* ---- Elaborazione giornaliera (mercato, missioni, crescita, malattie, riproduzione) ---- */
function dailyFilterWear(scale=1){
  if (state.filter.life>0){
    const dirty = clamp((state.water.ammonia + state.water.nitrite)/2, 0, 100);
    const wearRate = 1 + (dirty/100)*4; // fino a 5x più veloce con acqua molto sporca
    state.filter.life = Math.max(0, state.filter.life - wearRate*scale);
  }
}

function processDailyTick(daysPassed){
  for (let i=0;i<daysPassed;i++){
    state.day++;
    dailyHeaterUpdate();
    dailyWaterDegrade();
    dailyGrowthAndFeed();
    dailyDiseaseProgress();
    dailyPassiveIncome();
    dailyReproductionCheck();
    dailyMarketFluctuation();
    dailyFilterWear();
  }
  refreshDailyMissionsIfNeeded();
  refreshWeeklyMissionIfNeeded();
}

/* Applica una frazione di giorno (0-1) di progressione: usata quando si riapre il gioco
   dopo un'assenza inferiore alle 24h, così le meccaniche non restano completamente
   congelate. Riproduzione, fluttuazione di mercato e streak "acqua pulita" restano
   legate solo ai giorni pieni: sono eventi che non ha senso frazionare. */
function applyPartialDayProgress(scale){
  if (scale<=0) return;
  dailyHeaterUpdate(scale);
  dailyWaterDegrade(scale);
  dailyGrowthAndFeed(scale);
  dailyDiseaseProgress(scale);
  dailyPassiveIncome(scale);
  dailyFilterWear(scale);
}

function dailyHeaterUpdate(scale=1){
  const w = state.water;
  const h = state.heater;
  if (h.life > 0){
    // il riscaldatore mantiene la temperatura vicina al target
    const diff = h.targetTemp - w.temperature;
    w.temperature += clamp(diff, -1.5, 1.5) * scale;
    h.life = Math.max(0, h.life - 1*scale);
  } else {
    // nessun riscaldatore attivo: deriva naturale verso la temperatura ambiente
    const diff = ROOM_TEMP - w.temperature;
    w.temperature += clamp(diff*0.3, -1, 1) * scale;
  }
  w.temperature = clamp(w.temperature, 10, 35);
}

function dailyWaterDegrade(scale=1){
  const w = state.water;
  const totalBioLoad = state.fish.reduce((s,f)=> s + 0.5 + f.size, 0);
  const filterEfficiency = state.filter.life>0 ? 1 : 0.4;
  const livePlants = state.plants.filter(p=>p.isPlant && p.health>30);
  const plantFilterBonus = livePlants.reduce((s,p)=> s + PLANT_TYPES[p.kind].filter*(0.5+Math.min(p.growth,1)*0.5), 0);
  const plantOxygenBonus = livePlants.reduce((s,p)=> s + PLANT_TYPES[p.kind].oxygen*(0.5+Math.min(p.growth,1)*0.5), 0);

  w.ammonia = clamp(w.ammonia + (totalBioLoad*0.8 - filterEfficiency*1.2 - plantFilterBonus*0.6)*scale, 0, 100);
  // batteri maturano lentamente (ciclo azoto, ~14 giorni per maturità piena), il fondale fine li aiuta
  w.bacteria = clamp(w.bacteria + 0.07*(state.substrate==='fine'?1.3:1)*scale, 0, 1);
  const nitriteProd = w.ammonia * (0.15 + w.bacteria*0.3);
  w.nitrite = clamp(w.nitrite + (nitriteProd*0.3 - w.bacteria*1.0)*scale, 0, 100);
  const nitrateProd = w.nitrite * (0.1 + w.bacteria*0.25);
  w.nitrate = clamp(w.nitrate + nitrateProd*0.25*scale, 0, 100);

  w.oxygen = clamp(80 + plantOxygenBonus*25 - totalBioLoad*1.5 - (w.temperature>28?10:0), 10, 100);

  // rischio malattie ambientali (probabilità scalata sulla frazione di giorno)
  if (w.ammonia>55 || w.nitrite>50) tryOnsetDisease('finrot', 0.20*scale);
  const rottingPlant = state.plants.some(p=>p.isPlant && p.health<15);
  if (rottingPlant) tryOnsetDisease('fungus', 0.18*scale);

  // streak di acqua pulita per la missione settimanale: solo sui giorni pieni,
  // non ha senso frazionarla su una progressione parziale
  if (scale>=1) updateCleanStreak();

  dailyPlantGrowth(scale);
}

function updateCleanStreak(){
  const w = state.water;
  const dirtyNow = (w.ammonia + w.nitrite) / 2;
  if (dirtyNow < 30) state.weeklyProgress.cleanStreak = (state.weeklyProgress.cleanStreak||0) + 1;
  else state.weeklyProgress.cleanStreak = 0;
  checkWeeklyMissionCompletion();
}

function dailyPlantGrowth(scale=1){
  const livePlants = state.plants.filter(p=>p.isPlant);
  if (!livePlants.length) return;
  const fertilized = state.fertilizerUnits > 0;
  if (fertilized && scale>=1) state.fertilizerUnits = Math.max(0, state.fertilizerUnits - 1);
  const lightFactor = state.light.upgraded ? 1.3 : 1.0;
  livePlants.forEach(p=>{
    const type = PLANT_TYPES[p.kind];
    if (fertilized){
      p.growth = clamp(p.growth + type.growthRate*lightFactor*scale, 0, 1.6);
      p.health = clamp(p.health + 4*scale, 0, 100);
    } else {
      // pianta trascurata: perde salute lentamente
      p.health = clamp(p.health - 5*scale, 0, 100);
    }
    if (p.growth > 1){
      p.overgrownDays = (p.overgrownDays||0) + scale;
      if (p.overgrownDays > 4){
        // troppo cresciuta e non potata: soffoca la vasca
        p.health = clamp(p.health - 6*scale, 0, 100);
      }
    } else {
      p.overgrownDays = 0;
    }
  });
}

function tryOnsetDisease(diseaseId, baseChance){
  state.fish.forEach(f=>{
    if (f.diseaseId) return;
    const sp = speciesOf(f);
    if (!sp.diseaseWeak.includes(diseaseId)) return;
    let chance = baseChance;
    if (hasRiskMultiplier(f)) chance *= 1.6;
    if (Math.random() < chance){
      f.diseaseId = diseaseId;
      f.diseaseDay = 0;
      f.neverSick = false;
      playSound('disease');
    }
  });
}
function hasRiskMultiplier(f){
  // apatia o stress da temperatura aumentano il rischio (agiscono come moltiplicatori, non come malattie dirette qui)
  return f.happiness < 25 || state.water.temperature < 22 || state.water.temperature > 29;
}

function dailyGrowthAndFeed(scale=1){
  state.fish.forEach(f=>{
    const sp = speciesOf(f);
    const wasAdult = f.stage === 'adulto';
    const wellFed = f.hunger < 70 && f.health > 40;
    if (wellFed){
      f.age += 1*scale;
    } else {
      f.age += 0.5*scale; // crescita rallentata da denutrizione
    }
    f.stage = stageForAge(f);
    if (f.stage==='adulto' && !wasAdult && f.neverSick){
      state.weeklyProgress.adultNoDiseaseCount = (state.weeklyProgress.adultNoDiseaseCount||0) + 1;
      checkWeeklyMissionCompletion();
    }
    const targetSize = Math.min(1, f.age / sp.growthDays);
    f.size = sp.maxSize * clamp(targetSize, 0.15, 1);

    // apatia da solitudine prolungata
    if (isLonely(f) && f.happiness < 30){
      tryOnsetDisease2(f, 'apathy', scale);
    }
    if (state.water.temperature < 22 || state.water.temperature > 29){
      tryOnsetDisease2(f, 'stress_temp', scale);
    }
  });
}
function tryOnsetDisease2(f, diseaseId, scale=1){
  if (f.diseaseId) return;
  if (Math.random() < 0.25*scale) { f.diseaseId = diseaseId; f.diseaseDay = 0; f.neverSick = false; playSound('disease'); }
}

function dailyDiseaseProgress(scale=1){
  state.fish.forEach(f=>{
    if (!f.diseaseId) return;
    const dis = DISEASES[f.diseaseId];
    f.diseaseDay += scale;

    const beingTreated = f.medicineId === dis.medicineId && f.medicineDaysLeft > 0;
    if (dis.cureType==='medicine'){
      if (beingTreated){
        f.medicineDaysLeft -= scale;
        if (f.medicineDaysLeft <= 0){
          f.diseaseId = null; f.diseaseDay = 0; f.medicineId = null;
        }
      }
    } else {
      // cura naturale: se le condizioni sono migliorate, guarisce gradualmente
      if (conditionsImprovedFor(f)) {
        if (Math.random()<0.35*scale){ f.diseaseId = null; f.diseaseDay = 0; }
      }
    }

    // contagio
    if (f.diseaseId && dis.contagious && Math.random() < dis.contagionSpeed*scale){
      const others = state.fish.filter(o=>o.id!==f.id && !o.diseaseId && speciesOf(o).diseaseWeak.includes(f.diseaseId));
      if (others.length){ const target = choice(others); target.diseaseId = f.diseaseId; target.diseaseDay = 0; }
    }

    // morte per malattia non curata
    if (f.diseaseId && dis.deathDays && f.diseaseDay >= dis.deathDays){
      killFish(f.id, 'malattia');
    }
  });
}
function conditionsImprovedFor(f){
  const dis = DISEASES[f.diseaseId];
  if (dis.id==='finrot') return state.water.ammonia<30 && state.water.nitrite<30;
  if (dis.id==='fungus') return !state.plants.some(p=>p.health<15);
  if (dis.id==='apathy') return !isLonely(f) || f.happiness>50;
  if (dis.id==='stress_temp') return state.water.temperature>=22 && state.water.temperature<=29;
  return false;
}

function dailyPassiveIncome(scale=1){
  let total = 0;
  state.fish.forEach(f=>{
    if (f.health < 50 || f.happiness < 50) return; // stato sotto il 50%: nessun regalo
    if (f.health < 75 || f.happiness < 75) { total += 0.50; return; } // uno dei due tra 50 e 75%
    total += 1.00; // entrambi almeno al 75%
  });
  total *= scale;
  if (total > 0){
    state.money += total;
    pushToast(`🎁 +${total.toFixed(2)}€ per la buona cura dei tuoi pesci`);
  }
}

function dailyReproductionCheck(){
  const bySpecies = {};
  state.fish.forEach(f=>{ (bySpecies[f.speciesId] = bySpecies[f.speciesId]||[]).push(f); });
  Object.keys(bySpecies).forEach(sid=>{
    const adults = bySpecies[sid].filter(f=>f.stage==='adulto' && !f.diseaseId);
    if (adults.length>=2 && Math.random()<0.12){
      const parents = [adults[0], adults[1]];
      if (state.fish.length < MAX_FISH){
        const baby = createFish(sid, {age:0, size:0.1, stage:'avannotto'});
        state.fish.push(baby);
        pushToast(`🐣 Nuovo ${SPECIES[sid].name} nato!`);
        playSound('birth');
        state.weeklyProgress.reproducedCount = (state.weeklyProgress.reproducedCount||0) + 1;
        checkWeeklyMissionCompletion();
      } else {
        // nascita fallita: forte calo di felicità sui genitori
        parents.forEach(p=>{ p.happiness = clamp(p.happiness - 35, 0, 100); });
        pushToast(`💔 Nascita fallita: vasca piena (${SPECIES[sid].name})`);
      }
    }
  });
}

function dailyMarketFluctuation(){
  state._marketMultiplier = rand(0.7,1.4);
  // possibile domanda speciale del giorno
  if (Math.random()<0.25){
    state._demandSpecies = choice(SPECIES_ORDER);
    state._demandMultiplier = rand(1.3,2.0);
  } else {
    state._demandSpecies = null;
  }
}

function killFish(fishId, reason){
  const idx = state.fish.findIndex(f=>f.id===fishId);
  if (idx<0) return;
  const f = state.fish[idx];
  state.fish.splice(idx,1);
  pushToast(`⚰️ ${SPECIES[f.speciesId].name} è morto (${reason})`);
  playSound('death');
}

/* ---- Puntatore/dito: curiosità, diffidenza, reazioni individuali ---- */
const pointer = { x:0, y:0, active:false, lastMove:0, down:false };

function updateFishReactions(){
  const now = Date.now();
  const pointerRecent = pointer.active && (now - pointer.lastMove) < 900;
  state.fish.forEach(f=>{
    if (now < f._reactionUntil) return; // mantiene la reazione corrente per un po', evita scatti nervosi
    if (!pointerRecent){
      f._reactionState = 'normal';
      f._reactionUntil = now + 300;
      return;
    }
    const dist = Math.hypot(f.x-pointer.x, f.y-pointer.y);
    const proximity = clamp(1 - dist/0.35, 0, 1); // 0 = lontano, 1 = vicinissimo
    if (proximity <= 0){
      f._reactionState = 'normal';
      f._reactionUntil = now + 300;
      return;
    }
    const effectiveWariness = f.wariness * (1 - f.experience*0.5);
    const lonelyBonus = isLonely(f) ? 0.3 : 0; // insofferenza alla solitudine spinge verso il puntatore
    const score = (f.curiosity + lonelyBonus) - effectiveWariness + rand(-0.1,0.1);

    let newState;
    if (score < -0.15) newState = 'flee';
    else if (score < 0.15) newState = 'watch';
    else if (score < 0.45) newState = 'approach';
    else newState = 'rush';

    f._reactionState = newState;
    f._reactionUntil = now + rand(1200, 2200); // la reazione resta stabile per un po'
  });
}
setInterval(updateFishReactions, 400);

function setupPointerTracking(){
  function toNorm(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height };
  }
  function onMove(clientX, clientY){
    const p = toNorm(clientX, clientY);
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true; pointer.lastMove = Date.now();
  }
  canvas.addEventListener('pointermove', e=> onMove(e.clientX, e.clientY));
  canvas.addEventListener('pointerdown', e=>{ pointer.down = true; onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', ()=>{ pointer.down = false; });
  canvas.addEventListener('pointerleave', ()=>{ pointer.active = false; });
  canvas.addEventListener('touchmove', e=>{
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
}

/* ---- Progressione offline ---- */
function applyOfflineProgression(){
  const now = Date.now();
  let hoursPassed = (now - state.lastSaveTime) / 3600000;
  hoursPassed = clamp(hoursPassed, 0, OFFLINE_CAP_HOURS);
  const daysPassed = Math.floor(hoursPassed/24); // 1 giorno di gioco = 24h reali
  const remainderHours = hoursPassed - daysPassed*24;
  const fraction = remainderHours/24; // frazione di giorno non ancora "chiusa"

  // effetto continuo diretto: fame proporzionale alle ore, indipendente dai giorni pieni
  state.fish.forEach(f=>{
    f.hunger = clamp(f.hunger + hoursPassed*0.6, 0, 100);
  });
  if (daysPassed>0){
    processDailyTick(daysPassed);
  }
  if (fraction>0){
    applyPartialDayProgress(fraction);
  }
  state.lastSaveTime = now;
  state.lastPartialTickTime = now; // evita che checkLiveDayAdvance riconti lo stesso intervallo
  if (hoursPassed > 1){
    return { hours: Math.round(hoursPassed), days: daysPassed };
  }
  return null;
}

/* Eventi legati esclusivamente al passaggio di un giorno di calendario intero:
   contatore giorno, riproduzione, fluttuazione di mercato, missioni, streak acqua pulita.
   NON include acqua/crescita/malattie/filtro/entrate: quelle sono già coperte in modo
   continuo da applyPartialDayProgress, chiamata ad ogni controllo di checkLiveDayAdvance. */
function advanceCalendarDays(daysToAdvance){
  for (let i=0;i<daysToAdvance;i++){
    state.day++;
    updateCleanStreak();
    dailyReproductionCheck();
    dailyMarketFluctuation();
  }
  refreshDailyMissionsIfNeeded();
  refreshWeeklyMissionIfNeeded();
}

/* ---- Avanzamento dei giorni anche a gioco aperto (non solo al riavvio) ---- */
function checkLiveDayAdvance(){
  const now = Date.now();

  // progressione continua e proporzionale (acqua, crescita, malattie, filtro, entrate passive):
  // scala con il tempo realmente trascorso dall'ultimo controllo, non con i giorni interi.
  // Stesso tetto di sicurezza usato per il calcolo offline, nel caso il tab sia rimasto
  // in background per molto tempo (es. laptop in sospensione).
  let hoursSincePartial = clamp((now - state.lastPartialTickTime) / 3600000, 0, OFFLINE_CAP_HOURS);
  if (hoursSincePartial > 0){
    applyPartialDayProgress(hoursSincePartial/24);
    state.lastPartialTickTime = now;
  }

  // eventi legati esclusivamente al passaggio di un giorno pieno di calendario
  const hoursSinceDay = (now - state.lastDayAdvanceTime) / 3600000;
  if (hoursSinceDay < 24) return;
  const daysToAdvance = Math.min(Math.floor(hoursSinceDay / 24), 3); // tetto di sicurezza per un'unica chiamata
  advanceCalendarDays(daysToAdvance);
  state.lastDayAdvanceTime += daysToAdvance * 24 * 3600000;
  updateTopBarBadges();
  saveGame();
}

/* ---- Azioni giocatore ---- */
function feedAll(){
  if (state.fish.length===0){ pushToast('Nessun pesce da nutrire.'); playSound('error'); return; }
  if (state.foodUnits<=0){ pushToast('Cibo esaurito! Vai al negozio.'); playSound('error'); return; }
  state.foodUnits -= 1;
  spawnPellets(Math.min(8, 3 + state.fish.length));
  state.fish.forEach(f=>{
    const sp = speciesOf(f);
    f.hunger = clamp(f.hunger - 40, 0, 100);
    // rischio overfeeding
    const overRisk = 1 - sp.foodTolerance;
    if (Math.random() < overRisk*0.3){
      if (sp.id==='palla'){ f.puffed = clamp((f.puffed||0)+0.3,0,1); }
      tryOnsetDisease2(f, 'dropsy');
    }
  });
  state.water.ammonia = clamp(state.water.ammonia + 1, 0, 100);
  playSound('feed');
  markMissionProgress('feed');
}

function cleanWater(){
  state.water.ammonia = clamp(state.water.ammonia - 35, 0, 100);
  state.water.nitrite = clamp(state.water.nitrite - 25, 0, 100);
  state.water.nitrate = clamp(state.water.nitrate - 40, 0, 100);
  spawnBubbles();
  playSound('clean');
  markMissionProgress('clean');
}

function buyFish(speciesId){
  const sp = SPECIES[speciesId];
  if (state.fish.length>=MAX_FISH){ pushToast('Vasca piena!'); playSound('error'); return; }
  if (state.money < sp.cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= sp.cost;
  const f = createFish(speciesId, {age:0, size:0.15, stage:'avannotto'});
  state.fish.push(f);
  playSound('coin');
  markMissionProgress('buy');
  renderShopIfOpen();
}

function sellFish(fishId){
  if (state.fish.length <= 1){ pushToast('Non puoi vendere il tuo ultimo pesce!'); playSound('error'); return; }
  const f = state.fish.find(x=>x.id===fishId);
  if (!f) return;
  const price = computeSellPrice(f);
  state.money += price;
  state.fish = state.fish.filter(x=>x.id!==fishId);
  pushToast(`Venduto per ${price}€`);
  playSound('coin');
  markMissionProgress('sell');
  state.weeklyProgress.sold = (state.weeklyProgress.sold||0) + 1;
  checkWeeklyMissionCompletion();
  closeFishPanel();
}

function computeSellPrice(f){
  const sp = speciesOf(f);
  let price = sp.cost * 1.4; // base vendita più alta del costo d'acquisto
  const ageMod = f.stage==='adulto' ? 1.3 : (f.stage==='giovane' ? 1.0 : 0.6);
  const healthMod = 0.5 + (f.health/100)*0.6;
  const sizeMod = 0.7 + (f.size/sp.maxSize)*0.5;
  const market = state._marketMultiplier || 1;
  const demand = (state._demandSpecies===f.speciesId) ? (state._demandMultiplier||1) : 1;
  price = price*ageMod*healthMod*sizeMod*market*demand;
  return Math.round(price);
}

function buyMedicine(medId, fishId){
  const med = MEDICINES[medId];
  const f = state.fish.find(x=>x.id===fishId);
  if (!f) return;
  if (state.money < med.cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  if (f.diseaseId !== med.cures){ pushToast('Medicina sbagliata: dose sprecata!'); playSound('error'); state.money -= med.cost; return; }
  state.money -= med.cost;
  f.medicineId = medId;
  f.medicineDaysLeft = med.days;
  state.water.ammonia = clamp(state.water.ammonia + med.filterDamage*10, 0, 100); // effetto collaterale sul filtro biologico
  playSound('coin');
}

function buyConsumable(id){
  const c = CONSUMABLES[id];
  if (state.money < c.cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= c.cost;
  if (id==='cibo') state.foodUnits += c.unitsPerPack;
  if (id==='filtro') { state.filter.life = state.filter.maxLife; }
  if (id==='fertilizzante') { state.fertilizerUnits += c.unitsPerPack; }
  if (id==='riscaldatore') { state.heater.life = state.heater.maxLife; }
  playSound('coin');
  renderShopIfOpen();
}

function buyPlant(kind){
  const type = PLANT_TYPES[kind];
  if (state.plants.length >= MAX_TANK_ITEMS){ pushToast('Vasca già arredata al massimo'); playSound('error'); return; }
  if (state.money < type.cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= type.cost;
  state.plants.push({ id: state.nextPlantId++, kind, isPlant:true, health:80, growth:0.15, overgrownDays:0, sizeMod: rand(0.85,1.15) });
  playSound('coin');
}
function buyDecoration(kind){
  const type = DECORATION_TYPES[kind];
  if (state.plants.length >= MAX_TANK_ITEMS){ pushToast('Vasca già arredata al massimo'); playSound('error'); return; }
  if (state.money < type.cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= type.cost;
  state.plants.push({ id: state.nextPlantId++, kind, isPlant:false, health:100, sizeMod: rand(0.85,1.15) });
  playSound('coin');
}
function prunePlant(plantId){
  const p = state.plants.find(x=>x.id===plantId);
  if (!p || !p.isPlant) return;
  p.growth = 0.5;
  p.overgrownDays = 0;
  p.health = clamp(p.health + 20, 0, 100);
  playSound('clean');
}
function buyLightUpgrade(){
  if (state.light.upgraded) return;
  const cost = 40;
  if (state.money < cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= cost;
  state.light.upgraded = true;
  state.light.intensity = 1;
  playSound('coin');
}
function buySubstrateUpgrade(){
  if (state.substrate==='fine') return;
  const cost = 15;
  if (state.money < cost){ pushToast('Fondi insufficienti'); playSound('error'); return; }
  state.money -= cost;
  state.substrate = 'fine';
  playSound('coin');
}

   MISSIONI
   ========================================================================= */
const MISSION_POOL = [
  { key:'feed', label:'Dai da mangiare a tutti i pesci', reward:{money:3,rep:2}, feasible: ()=> state.fish.length>0 },
  { key:'clean', label:"Controlla/pulisci la qualità dell'acqua", reward:{money:3,rep:2}, feasible: ()=> true },
  { key:'cure', label:'Cura un pesce malato', reward:{money:6,rep:4}, feasible: ()=> state.fish.some(f=>f.diseaseId) },
  { key:'interact_lonely', label:'Interagisci con un pesce solo', reward:{money:4,rep:3}, feasible: ()=> state.fish.some(isLonely) },
  { key:'sell', label:'Vendi almeno 1 pesce', reward:{money:5,rep:3}, feasible: ()=> state.fish.length>0 },
  { key:'buy', label:'Compra un pesce nuovo', reward:{money:2,rep:3}, feasible: ()=> state.fish.length<MAX_FISH },
  { key:'plant', label:'Cura una pianta', reward:{money:3,rep:2}, feasible: ()=> state.plants.length>0 },
];

function refreshDailyMissionsIfNeeded(){
  if (state.missionsDay === state.day) return;
  state.missionsDay = state.day;
  const feasible = MISSION_POOL.filter(m=>m.feasible());
  const pool = feasible.length>=2 ? feasible : MISSION_POOL;
  const picks = [];
  const poolCopy = [...pool];
  while (picks.length<2 && poolCopy.length){
    const i = Math.floor(Math.random()*poolCopy.length);
    picks.push(poolCopy.splice(i,1)[0]);
  }
  state.missions = picks.map(m=>({ key:m.key, label:m.label, done:false, reward:m.reward }));
}
function markMissionProgress(key){
  const m = state.missions.find(x=>x.key===key && !x.done);
  if (m){
    m.done = true;
    state.money += m.reward.money;
    state.reputation += m.reward.rep;
    pushToast(`✅ Missione completata: +${m.reward.money}€ +${m.reward.rep}⭐`);
    playSound('mission');
  }
}

const WEEKLY_MISSION_POOL = [
  { key:'sell3',      label:'Vendi 3 pesci in una settimana',                    target:3, progressKey:'sold',                reward:{rep:15} },
  { key:'clean5',     label:"Mantieni l'acqua pulita per 5 giorni di fila",       target:5, progressKey:'cleanStreak',         reward:{rep:15} },
  { key:'reproduce',  label:'Fai nascere un nuovo pesce',                        target:1, progressKey:'reproducedCount',     reward:{rep:12} },
  { key:'adultclean', label:"Porta un pesce all'età adulta senza mai ammalarlo", target:1, progressKey:'adultNoDiseaseCount', reward:{rep:12} },
];

function refreshWeeklyMissionIfNeeded(){
  if (state.weeklyMission && (state.day - state.weeklyMissionDay) < 7) return;
  state.weeklyMissionDay = state.day;
  state.weeklyProgress = { sold:0, cleanStreak:0, reproducedCount:0, adultNoDiseaseCount:0 };
  const pick = choice(WEEKLY_MISSION_POOL);
  state.weeklyMission = { key:pick.key, label:pick.label, target:pick.target, progressKey:pick.progressKey, reward:pick.reward, done:false };
  pushToast(`📅 Nuova missione settimanale: ${pick.label}`);
}
function checkWeeklyMissionCompletion(){
  const m = state.weeklyMission;
  if (!m || m.done) return;
  if ((state.weeklyProgress[m.progressKey]||0) >= m.target){
    m.done = true;
    state.reputation += m.reward.rep;
    pushToast(`🏆 Missione settimanale completata: +${m.reward.rep}⭐`);
    playSound('missionBig');
  }
}

/* =========================================================================
   4. RENDERING (Canvas 2D)
   ========================================================================= */
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d');
let dpr = Math.max(1, window.devicePixelRatio||1);

function resizeCanvas(){
  const wrap = document.getElementById('tankWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);

function render(){
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);

  drawBackground(w,h);
  state.plants.forEach((p,idx)=>drawPlant(p,w,h,idx));
  state.fish.forEach(f=>drawFish(f,w,h));
  drawWaterOverlay(w,h);
  updateAndDrawFx(w,h);
}

function drawBackground(w,h){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#2a7a8c');
  grad.addColorStop(0.5,'#1c5b6e');
  grad.addColorStop(1,'#0a2e38');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  // raggi di luce soffusi dall'alto, per un'atmosfera più morbida
  ctx.save();
  ctx.globalAlpha = 0.06;
  for (let i=0;i<3;i++){
    const rx = w*(0.2 + i*0.3);
    ctx.beginPath();
    ctx.moveTo(rx-40, 0);
    ctx.lineTo(rx+40, 0);
    ctx.lineTo(rx+90, h);
    ctx.lineTo(rx-90, h);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  ctx.restore();

  // bollicine ambientali continue (puramente decorative)
  ambientTime += 0.006;
  for (let i=0;i<7;i++){
    const seed = i*13.7;
    const bx = (Math.sin(seed)*0.5+0.5)*w;
    const by = h - ((ambientTime*40 + seed*60) % (h+40));
    const r = 2 + (i%3);
    ctx.strokeStyle = 'rgba(220,245,255,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI*2);
    ctx.stroke();
  }
}
let ambientTime = 0;

function drawPlant(p, w, h, idx){
  const count = Math.max(state.plants.length, 1);
  const baseX = w*(0.12 + (idx/count)*0.76) + Math.sin(idx*2)*6;
  const baseY = h;
  const sizeMod = p.sizeMod || 1;

  if (p.isPlant){
    const alpha = clamp(p.health/100,0.25,1);
    if (p.kind==='muschio'){
      // cespuglio basso e folto di ciuffetti tondeggianti
      const height = h*0.07*sizeMod*(0.6+Math.min(p.growth,1));
      const tufts = 5;
      for (let i=0;i<tufts;i++){
        const off = (i-tufts/2)*7*sizeMod;
        const sway = Math.sin(ambientTime*2 + i)*2;
        const tuftH = height*(0.7+0.3*Math.sin(i*1.7));
        const grad = ctx.createLinearGradient(baseX+off,baseY,baseX+off+sway,baseY-tuftH);
        grad.addColorStop(0, `rgba(70,140,90,${alpha})`);
        grad.addColorStop(1, `rgba(140,210,130,${alpha})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(baseX+off+sway*0.5, baseY-tuftH*0.55, 6*sizeMod, tuftH*0.55, 0, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (p.kind==='vallisneria'){
      // lame lunghe e sottili a nastro
      const height = h*0.22*sizeMod*(0.6+Math.min(p.growth,1));
      const blades = 4;
      for (let i=0;i<blades;i++){
        const dir = (i%2===0)?1:-1;
        const off = (i-blades/2)*4;
        const sway = Math.sin(ambientTime*1.2 + i*1.1 + idx)*10;
        const bladeH = height*(0.75+0.25*(i/blades));
        ctx.strokeStyle = `rgba(100,200,140,${alpha})`;
        ctx.lineWidth = 3*sizeMod;
        ctx.beginPath();
        ctx.moveTo(baseX+off, baseY);
        ctx.quadraticCurveTo(baseX+off+dir*bladeH*0.2+sway*0.5, baseY-bladeH*0.6, baseX+off+dir*bladeH*0.1+sway, baseY-bladeH);
        ctx.stroke();
      }
    } else { // anubias
      // poche foglie larghe e scure, robuste
      const height = h*0.13*sizeMod*(0.6+Math.min(p.growth,1));
      const leaves = 3;
      for (let i=0;i<leaves;i++){
        const dir = (i%2===0)?1:-1;
        const sway = Math.sin(ambientTime*0.8 + i + idx)*3;
        const leafH = height*(0.8+0.2*i);
        const tipX = baseX + dir*leafH*0.4 + sway;
        const tipY = baseY - leafH;
        const grad = ctx.createLinearGradient(baseX,baseY,tipX,tipY);
        grad.addColorStop(0, `rgba(35,95,70,${alpha})`);
        grad.addColorStop(1, `rgba(80,150,110,${alpha})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(baseX-5*sizeMod, baseY);
        ctx.quadraticCurveTo(baseX + dir*leafH*0.55 + sway, baseY-leafH*0.5, tipX, tipY);
        ctx.quadraticCurveTo(baseX + dir*leafH*0.25 + sway, baseY-leafH*0.45, baseX+5*sizeMod, baseY);
        ctx.closePath();
        ctx.fill();
      }
    }
    if (p.growth > 1){
      const height = h*0.16*sizeMod;
      ctx.fillStyle = `rgba(255,220,120,${alpha*0.8})`;
      ctx.beginPath();
      ctx.arc(baseX, baseY-height*0.9, 3, 0, Math.PI*2);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = 'rgba(140,128,158,0.95)';
    ctx.strokeStyle = 'rgba(90,80,110,0.9)';
    ctx.lineWidth = 1.5;
    if (p.kind==='grotta'){
      ctx.beginPath();
      ctx.arc(baseX, baseY-2, 18*sizeMod, Math.PI, 0);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(10,20,25,0.6)';
      ctx.beginPath();
      ctx.arc(baseX, baseY-8*sizeMod, 8*sizeMod, Math.PI, 0);
      ctx.fill();
    } else {
      const w2 = 22*sizeMod, h2 = 34*sizeMod;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(baseX-w2/2, baseY-h2, w2, h2, 3) : ctx.rect(baseX-w2/2, baseY-h2, w2, h2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(baseX-w2/2, baseY-h2); ctx.lineTo(baseX, baseY-h2-12*sizeMod); ctx.lineTo(baseX+w2/2, baseY-h2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(30,25,40,0.7)';
      ctx.fillRect(baseX-4*sizeMod, baseY-h2*0.5, 8*sizeMod, h2*0.5);
    }
  }
}

function drawFish(f,w,h){
  const sp = speciesOf(f);
  const state_ = f._reactionState || 'normal';

  if (state_ === 'flee'){
    // scappa in direzione opposta al puntatore
    const dx = f.x - pointer.x, dy = f.y - pointer.y;
    const len = Math.hypot(dx,dy) || 0.001;
    f.tx = clamp(f.x + (dx/len)*0.3, 0.06,0.94);
    f.ty = clamp(f.y + (dy/len)*0.25, 0.08,0.9);
    f.x += (f.tx-f.x)*0.09; f.y += (f.ty-f.y)*0.09;
  } else if (state_ === 'watch'){
    // si ferma e osserva, nessun movimento verso il target
  } else if (state_ === 'approach'){
    f.tx = clamp(pointer.x + rand(-0.06,0.06), 0.06,0.94);
    f.ty = clamp(pointer.y + rand(-0.05,0.05), 0.08,0.9);
    f.x += (f.tx-f.x)*0.02; f.y += (f.ty-f.y)*0.02;
  } else if (state_ === 'rush'){
    f.tx = clamp(pointer.x, 0.06,0.94);
    f.ty = clamp(pointer.y, 0.08,0.9);
    f.x += (f.tx-f.x)*0.06; f.y += (f.ty-f.y)*0.06;
  } else {
    // nuoto libero verso pellet di cibo, se presenti, altrimenti vagabondaggio
    const pellet = nearestPellet(f);
    if (pellet){
      f.tx = pellet.x; f.ty = pellet.y;
      f.x += (f.tx-f.x)*0.035; f.y += (f.ty-f.y)*0.035;
      if (Math.hypot(pellet.x-f.x, pellet.y-f.y) < 0.03){ eatPellet(pellet); }
    } else {
      f.x += (f.tx-f.x)*0.01;
      f.y += (f.ty-f.y)*0.01;
      if (Math.abs(f.tx-f.x)<0.02 && Math.abs(f.ty-f.y)<0.02){
        f.tx = clamp(f.tx + rand(-0.2,0.2), 0.08,0.92);
        f.ty = clamp(f.ty + rand(-0.15,0.15), 0.1,0.85);
      }
    }
  }

  f.swimPhase += 0.05;
  const px = f.x*w, py = f.y*h + Math.sin(f.swimPhase)*4;
  const size = 18 + f.size*70;
  const facing = (state_==='watch') ? ((pointer.x > f.x) ? 1 : -1) : ((f.tx > f.x) ? 1 : -1);

  ctx.save();
  ctx.translate(px,py);
  ctx.scale(facing,1);

  let bodyW = size, bodyH = size*0.55;
  if (sp.canPuff && f.puffed){ bodyW = size*(1+f.puffed*0.5); bodyH = size*(0.55+f.puffed*0.4); }
  const tailWag = state_==='watch' ? 0.4 : (state_==='flee'||state_==='rush' ? 1.6 : 1);
  const finFlutter = Math.sin(f.swimPhase*1.6)*0.15 + 1;

  ctx.globalAlpha = f.diseaseId ? 0.72 : 1;

  /* --- coda: forma morbida a ventaglio, sventola con la nuotata --- */
  ctx.fillStyle = lighten(sp.accent, -0.05);
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.42, 0);
  ctx.quadraticCurveTo(-bodyW*0.75, -bodyH*0.55*tailWag*finFlutter, -bodyW*0.95, -bodyH*0.32*tailWag);
  ctx.quadraticCurveTo(-bodyW*0.72, 0, -bodyW*0.95, bodyH*0.32*tailWag);
  ctx.quadraticCurveTo(-bodyW*0.75, bodyH*0.55*tailWag*finFlutter, -bodyW*0.42, 0);
  ctx.closePath();
  ctx.fill();

  /* --- pinna dorsale morbida --- */
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.05, -bodyH*0.42);
  ctx.quadraticCurveTo(bodyW*0.05, -bodyH*0.95*finFlutter, bodyW*0.28, -bodyH*0.4);
  ctx.quadraticCurveTo(bodyW*0.1, -bodyH*0.5, -bodyW*0.05, -bodyH*0.42);
  ctx.fill();

  /* --- pinna pettorale --- */
  ctx.save();
  ctx.globalAlpha *= 0.85;
  ctx.beginPath();
  ctx.ellipse(bodyW*0.05, bodyH*0.35, bodyW*0.16, bodyH*0.22*finFlutter, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* --- corpo: forma organica a goccia (più pieno davanti, affusolato dietro) --- */
  const grad = ctx.createRadialGradient(-bodyW*0.15,-bodyH*0.25,2, bodyW*0.05,0, bodyW*0.75);
  grad.addColorStop(0, lighten(sp.color, 0.3));
  grad.addColorStop(0.6, sp.color);
  grad.addColorStop(1, lighten(sp.color, -0.15));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(bodyW*0.5, 0);
  ctx.quadraticCurveTo(bodyW*0.45, -bodyH*0.55, bodyW*0.05, -bodyH*0.5);
  ctx.quadraticCurveTo(-bodyW*0.35, -bodyH*0.48, -bodyW*0.42, 0);
  ctx.quadraticCurveTo(-bodyW*0.35, bodyH*0.48, bodyW*0.05, bodyH*0.5);
  ctx.quadraticCurveTo(bodyW*0.45, bodyH*0.55, bodyW*0.5, 0);
  ctx.closePath();
  ctx.fill();

  /* --- decoro specie-specifico --- */
  drawSpeciesAccent(sp, f, bodyW, bodyH);

  /* --- occhio --- */
  const eyeX = bodyW*0.28, eyeY = -bodyH*0.08;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX, eyeY, bodyH*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(eyeX+bodyH*0.03, eyeY, bodyH*0.09, 0, Math.PI*2); ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawSpeciesAccent(sp, f, bodyW, bodyH){
  ctx.save();
  ctx.globalAlpha = 0.8;
  if (sp.id==='pagliaccio'){
    // strisce bianche verticali, come un pesce pagliaccio
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    [-0.1, 0.2].forEach(off=>{
      ctx.beginPath();
      ctx.ellipse(bodyW*off, 0, bodyW*0.06, bodyH*0.5, 0, 0, Math.PI*2);
      ctx.fill();
    });
  } else if (sp.id==='neon'){
    // linea orizzontale luminosa
    ctx.strokeStyle = sp.accent;
    ctx.lineWidth = bodyH*0.12;
    ctx.beginPath();
    ctx.moveTo(-bodyW*0.3,0); ctx.lineTo(bodyW*0.35,0);
    ctx.stroke();
  } else if (sp.id==='chirurgo'){
    // macchia scura vicino alla coda ("bisturi")
    ctx.fillStyle = 'rgba(20,20,30,0.6)';
    ctx.beginPath();
    ctx.ellipse(-bodyW*0.3, 0, bodyW*0.07, bodyH*0.3, 0, 0, Math.PI*2);
    ctx.fill();
  } else if (sp.id==='angelo' || sp.id==='farfalla'){
    // pinne allungate "a vela"
    ctx.fillStyle = sp.color;
    ctx.beginPath();
    ctx.moveTo(bodyW*0.05,-bodyH*0.4);
    ctx.quadraticCurveTo(bodyW*0.15,-bodyH*1.3, bodyW*0.02,-bodyH*0.55);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bodyW*0.05,bodyH*0.4);
    ctx.quadraticCurveTo(bodyW*0.15,bodyH*1.3, bodyW*0.02,bodyH*0.55);
    ctx.fill();
  } else if (sp.id==='gatto'){
    // baffi
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    [-1,1].forEach(dir=>{
      ctx.beginPath();
      ctx.moveTo(bodyW*0.4, dir*bodyH*0.15);
      ctx.lineTo(bodyW*0.65, dir*bodyH*0.3);
      ctx.stroke();
    });
  } else if (sp.id==='palla' && f.puffed){
    // piccole spine quando gonfio
    ctx.fillStyle = sp.accent;
    for (let a=0;a<10;a++){
      const ang = (a/10)*Math.PI*2;
      const rx = Math.cos(ang)*bodyW*0.5, ry = Math.sin(ang)*bodyH*0.5;
      ctx.beginPath();
      ctx.arc(rx,ry, 1.5+f.puffed*1.5, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (sp.id==='discus'){
    // corpo tondo: sottile bordo colorato
    ctx.strokeStyle = sp.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0,0, bodyW*0.4, bodyH*0.4, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function nearestPellet(f){
  if (!fx.pellets.length) return null;
  let best=null, bestD=0.4;
  fx.pellets.forEach(p=>{
    const d = Math.hypot(p.x-f.x, p.y-f.y);
    if (d<bestD){ bestD=d; best=p; }
  });
  return best;
}
function eatPellet(p){
  fx.pellets = fx.pellets.filter(x=>x!==p);
  spawnSparkle(p.x,p.y);
}

function lighten(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r = (num>>16)+Math.round(255*amt);
  let g = ((num>>8)&0xff)+Math.round(255*amt);
  let b = (num&0xff)+Math.round(255*amt);
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return `rgb(${r},${g},${b})`;
}

function drawWaterOverlay(w,h){
  const dirty = clamp((state.water.ammonia + state.water.nitrite)/2, 0, 100);
  if (dirty>10){
    ctx.fillStyle = `rgba(120,140,60,${clamp(dirty/250,0,0.35)})`;
    ctx.fillRect(0,0,w,h);
  }
}

/* ---- Effetti visivi transitori (non salvati): cibo, pulizia, gioco ---- */
const fx = { pellets:[], bubbles:[], hearts:[] };

function spawnPellets(count){
  for (let i=0;i<count;i++){
    fx.pellets.push({ x: rand(0.2,0.8), y: rand(-0.05,0.05), vy: rand(0.0015,0.003) });
  }
}
function spawnBubbles(){
  for (let i=0;i<16;i++){
    fx.bubbles.push({ x: rand(0.05,0.95), y: 1+rand(0,0.2), vy: rand(0.004,0.009), r: rand(2,5), alpha:1 });
  }
}
function spawnHearts(x,y){
  for (let i=0;i<5;i++){
    fx.hearts.push({ x: x+rand(-0.03,0.03), y: y, vy: rand(0.003,0.006), alpha:1, life:0 });
  }
}
function spawnSparkle(x,y){
  fx.hearts.push({ x, y, vy:0.002, alpha:1, life:0, sparkle:true });
}

function updateAndDrawFx(w,h){
  // pellet di cibo che affondano lentamente; se non mangiato entro il fondo, sporca l'acqua
  fx.pellets.forEach(p=> p.y += p.vy);
  fx.pellets = fx.pellets.filter(p=>{
    if (p.y >= 0.95){ state.water.ammonia = clamp(state.water.ammonia + 1, 0, 100); return false; }
    return true;
  });
  fx.pellets.forEach(p=>{
    ctx.fillStyle = '#d9a85a';
    ctx.beginPath();
    ctx.arc(p.x*w, p.y*h, 3.5, 0, Math.PI*2);
    ctx.fill();
  });

  // bolle di pulizia che risalgono
  fx.bubbles.forEach(b=>{ b.y -= b.vy; b.alpha -= 0.006; });
  fx.bubbles = fx.bubbles.filter(b=> b.alpha>0 && b.y > -0.05);
  fx.bubbles.forEach(b=>{
    ctx.strokeStyle = `rgba(200,240,255,${clamp(b.alpha,0,1)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x*w, b.y*h, b.r, 0, Math.PI*2);
    ctx.stroke();
  });

  // cuoricini/sparkle da interazione
  fx.hearts.forEach(hh=>{ hh.y -= hh.vy; hh.life += 1; hh.alpha = clamp(1-hh.life/40,0,1); });
  fx.hearts = fx.hearts.filter(hh=> hh.alpha>0);
  fx.hearts.forEach(hh=>{
    ctx.globalAlpha = hh.alpha;
    ctx.font = '16px sans-serif';
    ctx.fillText(hh.sparkle ? '✨' : '💗', hh.x*w-8, hh.y*h);
    ctx.globalAlpha = 1;
  });
}

let rafId;
function loop(){
  render();
  rafId = requestAnimationFrame(loop);
}

/* =========================================================================
   5. AUDIO SINTETICO (Web Audio API)
   ========================================================================= */
let audioCtx;
function ensureAudio(){ if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(kind){
  if (summaryCollecting) return; // evita raffiche di suoni durante il recupero offline
  try{
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (kind==='feed'){ osc.type='sine'; osc.frequency.setValueAtTime(440,t); gain.gain.setValueAtTime(0.08,t); }
    if (kind==='clean'){ osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.linearRampToValueAtTime(500,t+0.2); gain.gain.setValueAtTime(0.06,t); }
    if (kind==='coin'){ osc.type='triangle'; osc.frequency.setValueAtTime(660,t); osc.frequency.setValueAtTime(880,t+0.08); gain.gain.setValueAtTime(0.08,t); }
    if (kind==='birth'){ osc.type='sine'; osc.frequency.setValueAtTime(520,t); osc.frequency.setValueAtTime(700,t+0.1); osc.frequency.setValueAtTime(880,t+0.2); gain.gain.setValueAtTime(0.07,t); }
    if (kind==='death'){ osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(120,t+0.5); gain.gain.setValueAtTime(0.06,t); }
    if (kind==='disease'){ osc.type='sine'; osc.frequency.setValueAtTime(380,t); osc.frequency.setValueAtTime(340,t+0.15); gain.gain.setValueAtTime(0.05,t); }
    if (kind==='mission'){ osc.type='triangle'; osc.frequency.setValueAtTime(520,t); osc.frequency.setValueAtTime(660,t+0.09); osc.frequency.setValueAtTime(780,t+0.18); gain.gain.setValueAtTime(0.08,t); }
    if (kind==='missionBig'){ osc.type='triangle'; osc.frequency.setValueAtTime(520,t); osc.frequency.setValueAtTime(660,t+0.08); osc.frequency.setValueAtTime(780,t+0.16); osc.frequency.setValueAtTime(980,t+0.26); gain.gain.setValueAtTime(0.09,t); }
    if (kind==='error'){ osc.type='square'; osc.frequency.setValueAtTime(180,t); gain.gain.setValueAtTime(0.05,t); }
    gain.gain.exponentialRampToValueAtTime(0.001, t + (kind==='death'?0.55:(kind==='missionBig'?0.4:0.32)));
    osc.start(t); osc.stop(t + (kind==='death'?0.6:(kind==='missionBig'?0.42:0.34)));
  }catch(e){}
}

let summaryCollecting = false;
let pendingSummaryEvents = [];

function showDailySummary(offline, newMissions){
  const diseased = state.fish.filter(f=>f.diseaseId).length;
  const dirty = clamp((state.water.ammonia + state.water.nitrite)/2, 0, 100);
  const alerts = [];
  if (diseased>0) alerts.push(`🩺 ${diseased} pesce${diseased>1?'i':''} malat${diseased>1?'i':'o'}`);
  if (dirty>60) alerts.push('💧 acqua molto sporca');
  if (state.foodUnits<=2) alerts.push('🍚 cibo quasi esaurito');
  if (state.heater.life<=0) alerts.push('🌡️ riscaldatore spento');
  if (state.filter.life<=0) alerts.push('🧽 filtro esaurito');

  const hasSomethingToShow = offline || alerts.length>0 || newMissions || pendingSummaryEvents.length>0;
  if (!hasSomethingToShow){ pendingSummaryEvents = []; return; }

  let html = '';
  if (offline){
    html += `<div class="sub" style="margin-bottom:8px;">Sei stato via ${offline.hours}h (${offline.days} giorni passati)</div>`;
  }
  if (alerts.length){
    html += `<h2 style="font-size:15px;">⚠️ Da controllare</h2>`;
    alerts.forEach(a=> html += `<div class="row"><div class="name">${a}</div></div>`);
  }
  if (newMissions && state.missions.length){
    html += `<h2 style="font-size:15px; margin-top:${alerts.length?'12px':'2px'};">🎯 Missioni di oggi</h2>`;
    state.missions.forEach(m=> html += `<div class="row"><div class="name">${m.label}</div></div>`);
  }
  if (pendingSummaryEvents.length){
    html += `<div id="summaryToggle" class="row" style="cursor:pointer;"><div class="name">📋 ${pendingSummaryEvents.length} eventi mentre eri via</div><span class="badge-mini">dettagli</span></div>`;
    html += `<div id="summaryDetails" style="display:none;">`;
    pendingSummaryEvents.slice(0,12).forEach(e=> html += `<div class="sub" style="margin:4px 0;">${e}</div>`);
    if (pendingSummaryEvents.length>12) html += `<div class="sub">+${pendingSummaryEvents.length-12} altri</div>`;
    html += `</div>`;
  }
  html += `<button id="summaryContinue" style="width:100%; margin-top:14px; background:var(--ui-accent); color:#04222b; border:none; padding:12px; border-radius:12px; font-weight:600;">Entra in vasca</button>`;

  document.getElementById('dailySummaryContent').innerHTML = html;
  document.getElementById('dailySummaryOverlay').classList.remove('hidden');
  const toggle = document.getElementById('summaryToggle');
  if (toggle) toggle.addEventListener('click', ()=>{
    const det = document.getElementById('summaryDetails');
    det.style.display = det.style.display==='none' ? 'block' : 'none';
  });
  document.getElementById('summaryContinue').addEventListener('click', ()=>{
    document.getElementById('dailySummaryOverlay').classList.add('hidden');
    pendingSummaryEvents = [];
  });
}

function saveGame(){
  state.lastSaveTime = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const loaded = JSON.parse(raw);
    state = Object.assign(newGameState(), loaded);
    return true;
  }catch(e){ return false; }
}
function exportSave(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'acquario_salvataggio.json';
  a.click();
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const loaded = JSON.parse(reader.result);
      state = Object.assign(newGameState(), loaded);
      saveGame();
      updateTopBarBadges();
      pushToast('Salvataggio importato');
      document.getElementById('panelOverlay').classList.add('hidden');
    }catch(err){ pushToast('File non valido'); }
  };
  reader.readAsText(file);
}

/* =========================================================================
   8. BOOTSTRAP
   ========================================================================= */
function showStarterChoice(){
  const el = document.getElementById('starterChoices');
  el.innerHTML = '';
  STARTER_CHOICES.forEach(id=>{
    const sp = SPECIES[id];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><div class="name">${sp.name}</div><div class="sub">${sp.cost}€ · ${sp.social}</div></div><button>Scegli</button>`;
    row.querySelector('button').addEventListener('click', ()=>{
      state.money -= sp.cost;
      state.fish.push(createFish(id, {age:0, size:0.15, stage:'avannotto'}));
      state.started = true;
      document.getElementById('startOverlay').classList.add('hidden');
      saveGame();
    });
    el.appendChild(row);
  });
  document.getElementById('startOverlay').classList.remove('hidden');
}

function init(){
  resizeCanvas();
  setupPointerTracking();
  const loaded = loadGame();
  if (!loaded){
    state = newGameState();
    showStarterChoice();
    refreshDailyMissionsIfNeeded();
    refreshWeeklyMissionIfNeeded();
  } else {
    summaryCollecting = true;
    const missionsDayBefore = state.missionsDay;
    const offline = applyOfflineProgression();
    refreshDailyMissionsIfNeeded();
    refreshWeeklyMissionIfNeeded();
    summaryCollecting = false;
    state.lastDayAdvanceTime = Date.now(); // riparte da qui il controllo per l'avanzamento a gioco aperto
    showDailySummary(offline, missionsDayBefore !== state.missionsDay);
  }
  updateTopBarBadges();
  loop();
  setInterval(tickLogic, 2000);
  setInterval(saveGame, 15000);
  setInterval(checkLiveDayAdvance, 60000);
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) checkLiveDayAdvance(); });
  window.addEventListener('beforeunload', saveGame);
}
init();
</script>
