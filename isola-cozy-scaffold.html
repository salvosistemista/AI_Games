<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Isola Cozy - Scaffold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: -apple-system, sans-serif; touch-action: none; }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #debug {
    position: absolute; top: 8px; left: 8px; color: #fff; font-size: 11px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; line-height: 1.5;
  }

  /* Joystick virtuale (touch) */
  #joystick-zone { position: absolute; left: 0; bottom: 0; width: 45%; height: 55%; pointer-events: auto; }
  .joy-base, .joy-stick {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4); display: none;
  }
  .joy-base { width: 100px; height: 100px; margin-left: -50px; margin-top: -50px; }
  .joy-stick { width: 46px; height: 46px; margin-left: -23px; margin-top: -23px; background: rgba(255,255,255,0.35); }

  /* Pulsanti azione (touch) */
  #action-buttons {
    position: absolute; right: 20px; bottom: 20px; pointer-events: auto;
    display: flex; gap: 14px; align-items: flex-end;
  }
  .action-btn {
    width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.45); color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .action-btn:active { background: rgba(255,255,255,0.35); }

  /* Nasconde i controlli touch su desktop con mouse */
  body.desktop-mode #joystick-zone,
  body.desktop-mode #action-buttons { display: none; }

  /* Overlay del sonno */
  #sleep-overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(5, 10, 25, 0.55); pointer-events: auto;
  }
  #sleep-overlay.open { display: flex; }
  #sleep-panel {
    background: rgba(20, 24, 38, 0.92); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 22px 26px; text-align: center; color: #fff;
    font-family: -apple-system, sans-serif;
  }
  #sleep-panel h3 { font-weight: 500; font-size: 16px; margin-bottom: 14px; }
  #sleep-panel .hours-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .hour-btn {
    padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 14px;
  }
  .hour-btn:active { background: rgba(255,255,255,0.25); }
  #sleep-cancel { font-size: 12px; color: rgba(255,255,255,0.6); padding: 6px; }

  #zzz-indicator {
    position: fixed; inset: 0; z-index: 25; display: none;
    align-items: center; justify-content: center;
    font-size: 48px; color: #fff; pointer-events: none;
  }
  #zzz-indicator.show { display: flex; }

  /* HUD inventario */
  #inventory-hud {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 8px;
  }
  .inv-item {
    background: rgba(0,0,0,0.4); color: #fff; font-size: 13px; border-radius: 8px;
    padding: 5px 9px; display: flex; align-items: center; gap: 5px;
  }
  #invRecintiChip.active { background: rgba(255,209,102,0.35); }

  /* Overlay del banco da lavoro */
  #craft-overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(5, 10, 25, 0.55); pointer-events: auto;
  }
  #craft-overlay.open { display: flex; }
  #craft-panel {
    background: rgba(20, 24, 38, 0.94); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 20px 22px; color: #fff; width: 300px;
    font-family: -apple-system, sans-serif;
  }
  #craft-panel h3 { font-weight: 500; font-size: 16px; margin-bottom: 12px; }
  .recipe-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .recipe-info { font-size: 13px; }
  .recipe-cost { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .recipe-btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 12px;
  }
  .recipe-btn:disabled { opacity: 0.35; }
  #craft-cancel { text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); padding: 12px 0 2px; }

  /* Evidenzia l'elemento selezionato col gamepad nei menu */
  .gp-selected { outline: 2px solid #ffd166; outline-offset: 2px; }
</style>

<body>

<div id="canvas-container"></div>

<div id="hud">
  <div id="debug"></div>

  <div id="joystick-zone">
    <div class="joy-base" id="joyBase"></div>
    <div class="joy-stick" id="joyStick"></div>
  </div>

  <div id="action-buttons">
    <div class="action-btn" id="btnPhoto">📷</div>

    <div class="inv-item"><span>🪵</span><span id="invLegna">0</span></div>
    <div class="inv-item"><span>🪨</span><span id="invPietra">0</span></div>
    <div class="inv-item"><span>🍎</span><span id="invFrutta">0</span></div>
    <div class="inv-item"><span>🐟</span><span id="invPesce">0</span></div>
    <div class="inv-item"><span>🧱</span><span id="invRecinti">0</span></div>
    <div class="inv-item" id="invRecintiChip" style="pointer-events:auto;"><span>🔨</span><span>piazza</span></div>

</div>

<div id="sleep-overlay">
  <div id="sleep-panel">
    <h3>Vai a dormire per quante ore?</h3>
    <div class="hours-row">
      <div class="hour-btn" data-hours="4">4 ore</div>
      <div class="hour-btn" data-hours="8">8 ore</div>

</div>

<div id="craft-overlay">
  <div id="craft-panel">
    <h3>Banco da lavoro</h3>
    <div id="recipe-list"></div>
    <div id="craft-cancel">chiudi</div>
  </div>
</div>

<div id="zzz-indicator">💤</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* =========================================================================
   CONFIG ISOLA
   Coordinate approssimative in unità mondo, coerenti con lo schizzo mappa:
   Valle a ovest/nord, Cala costiera a est/sud, fiume che le separa,
   ponticello di legno come punto di attraversamento.
   ========================================================================= */
const ISLAND = {
  valley:  { cx: 0,   cz: 0,  rx: 75, rz: 95 },
  cala:    { cx: 115, cz: 65, rx: 75, rz: 75 },
  bridge:  { cx: 58,  cz: 28, halfWidth: 9, halfLength: 16, rotY: -0.6 }, // area di attraversamento del fiume
  riverHalfWidth: 11,
  // Il fiume è approssimato come una fascia che va dal punto A al punto B
  riverA: { x: 40, z: -90 },
  riverB: { x: 95, z: 100 },
};

const TENT_POS = { x: -25, z: -25 };

/* =========================================================================
   STAGIONI, METEO E OROLOGIO DI GIOCO
   Un solo "orologio" (GameClock) è la sorgente di verità del tempo: tutto
   il resto (meteo, luce, lucciole, in futuro traghetto/colture/riscaldamento)
   si aggancia ai suoi eventi invece di tenere un proprio timer separato.
   Durata stagioni: 7 giorni ciascuna per ora, facilmente estendibile.
   ========================================================================= */
const SEASONS = [
  { name: 'Primavera', lengthDays: 7, weatherPool: ['sereno', 'sereno', 'nuvoloso', 'pioggia'], coldness: 0.35 },
  { name: 'Estate',     lengthDays: 7, weatherPool: ['sereno', 'sereno', 'sereno', 'nuvoloso'],  coldness: 0.05 },
  { name: 'Autunno',    lengthDays: 7, weatherPool: ['nuvoloso', 'pioggia', 'pioggia', 'sereno'], coldness: 0.55 },
  { name: 'Inverno',    lengthDays: 7, weatherPool: ['sereno', 'nuvoloso', 'neve', 'neve'],        coldness: 1.0 },
];

class GameClock {
  constructor(cfg) {
    this.totalMinutes = cfg.startMinutes ?? 8 * 60;
    this.baseMinutesPerRealSecond = cfg.minutesPerRealSecond;
    this.seasons = cfg.seasons;
    this.sleeping = false;
    this.sleepMinutesPerRealSecond = 0;
    this.sleepRemaining = 0;
    this.listeners = { hour: [], day: [], season: [] };
    this._prevHour = this.hour;
    this._prevDay = this.dayIndex;
    this._prevSeasonIdx = this.seasonIndex;
  }
  on(evt, cb) { this.listeners[evt].push(cb); }
  emit(evt, ...args) { this.listeners[evt].forEach(cb => cb(...args)); }

  get hour() { return Math.floor(this.totalMinutes / 60) % 24; }
  get minuteOfHour() { return Math.floor(this.totalMinutes) % 60; }
  get dayIndex() { return Math.floor(this.totalMinutes / (24 * 60)); }
  get totalSeasonDays() { return this.seasons.reduce((s, x) => s + x.lengthDays, 0); }
  get dayInCycle() { return this.dayIndex % this.totalSeasonDays; }
  get seasonIndex() {
    let acc = 0;
    for (let i = 0; i < this.seasons.length; i++) {
      acc += this.seasons[i].lengthDays;
      if (this.dayInCycle < acc) return i;
    }
    return this.seasons.length - 1;
  }
  get season() { return this.seasons[this.seasonIndex]; }
  get dayInSeason() {
    let acc = 0;
    for (let i = 0; i < this.seasonIndex; i++) acc += this.seasons[i].lengthDays;
    return this.dayInCycle - acc;
  }
  // Progresso continuo 0..1 dentro la stagione corrente, usato per far
  // "entrare" gradualmente la stagione successiva (niente salti secchi)
  get seasonProgress() { return this.dayInSeason / this.season.lengthDays; }

  startSleep(hours, realSeconds = 6) {
    this.sleeping = true;
    this.sleepMinutesPerRealSecond = (hours * 60) / realSeconds;
    this.sleepRemaining = realSeconds;
  }

  update(dt) {
    const rate = this.sleeping ? this.sleepMinutesPerRealSecond : this.baseMinutesPerRealSecond;
    if (this.sleeping) {
      this.sleepRemaining -= dt;
      if (this.sleepRemaining <= 0) this.sleeping = false;
    }
    this.totalMinutes += dt * rate;

    const h = this.hour;
    if (h !== this._prevHour) { this._prevHour = h; this.emit('hour', h); }
    const d = this.dayIndex;
    if (d !== this._prevDay) { this._prevDay = d; this.emit('day', d); }
    const s = this.seasonIndex;
    if (s !== this._prevSeasonIdx) { this._prevSeasonIdx = s; this.emit('season', this.season); }
  }
}

// Velocità tarata per testare rapidamente: 1 giorno di gioco ≈ 2.4 minuti reali.
// In seguito la rallenteremo per il ritmo definitivo del gioco.
const clock = new GameClock({ startMinutes: 7 * 60, minutesPerRealSecond: 10, seasons: SEASONS });

let currentWeather = 'sereno';
function pickNewWeather() {
  const pool = clock.season.weatherPool;
  currentWeather = pool[Math.floor(Math.random() * pool.length)];
}
pickNewWeather();
clock.on('day', pickNewWeather); // per ora il meteo cambia una volta al giorno, si può affinare dopo

/* =========================================================================
   SETUP BASE THREE.JS
   ========================================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3e8);
scene.fog = new THREE.Fog(0x9fd3e8, 180, 420);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   LUCE E CIELO DINAMICI (giorno/notte + meteo)
   Nessun timer proprio: ogni frame si legge semplicemente clock.hour e
   currentWeather, si interpola colore/intensità, niente stato duplicato.
   ========================================================================= */
const sun = new THREE.DirectionalLight(0xfff2d6, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160;
sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160;
sun.shadow.camera.bottom = -160;
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0xcfe8ff, 0.55);
scene.add(ambient);

// Colori chiave del cielo lungo le 24 ore (alba, giorno, tramonto, notte)
const SKY_KEYFRAMES = [
  { h: 0,  sky: 0x0a1a35, sun: 0x24304f, ambientI: 0.25, sunI: 0.05 },
  { h: 5,  sky: 0x1c2a4a, sun: 0x8a6a8f, ambientI: 0.3,  sunI: 0.15 },
  { h: 7,  sky: 0xf3c98a, sun: 0xffcf9a, ambientI: 0.5,  sunI: 0.8  },
  { h: 12, sky: 0x9fd3e8, sun: 0xfff2d6, ambientI: 0.6,  sunI: 1.15 },
  { h: 17, sky: 0xf0b06a, sun: 0xffb877, ambientI: 0.55, sunI: 0.85 },
  { h: 19, sky: 0x2c2a4a, sun: 0x5a4a7f, ambientI: 0.35, sunI: 0.2  },
  { h: 21, sky: 0x0a1a35, sun: 0x24304f, ambientI: 0.25, sunI: 0.05 },
  { h: 24, sky: 0x0a1a35, sun: 0x24304f, ambientI: 0.25, sunI: 0.05 },
];

const _skyColor = new THREE.Color();
const _sunColor = new THREE.Color();
function updateSky() {
  const h = clock.hour + clock.minuteOfHour / 60;
  let a = SKY_KEYFRAMES[0], b = SKY_KEYFRAMES[SKY_KEYFRAMES.length - 1];
  for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
    if (h >= SKY_KEYFRAMES[i].h && h <= SKY_KEYFRAMES[i + 1].h) {
      a = SKY_KEYFRAMES[i]; b = SKY_KEYFRAMES[i + 1]; break;
    }
  }
  const span = (b.h - a.h) || 1;
  const t = (h - a.h) / span;

  _skyColor.setHex(a.sky).lerp(new THREE.Color(b.sky), t);
  _sunColor.setHex(a.sun).lerp(new THREE.Color(b.sun), t);
  let ambientI = a.ambientI + (b.ambientI - a.ambientI) * t;
  let sunI = a.sunI + (b.sunI - a.sunI) * t;

  // Il meteo attenua la luce e appiattisce un po' i colori (nuvole/pioggia/neve)
  const dim = currentWeather === 'sereno' ? 1 : currentWeather === 'nuvoloso' ? 0.75 : 0.55;
  ambientI *= dim;
  sunI *= dim;
  if (currentWeather === 'neve') _skyColor.lerp(new THREE.Color(0xdfe8ee), 0.4);

  scene.background.copy(_skyColor);
  scene.fog.color.copy(_skyColor);
  ambient.color.copy(_skyColor);
  ambient.intensity = ambientI;
  sun.color.copy(_sunColor);
  sun.intensity = sunI;

  // Il sole percorre un arco sopra l'isola: alto a mezzogiorno, basso all'alba/tramonto
  const sunAngle = ((h - 6) / 12) * Math.PI; // 0 all'alba (h=6), PI al tramonto (h=18)
  const sunHeight = Math.max(Math.sin(sunAngle), 0.05) * 130 + 20;
  const sunSide = Math.cos(sunAngle) * 130;
  sun.position.set(sunSide, sunHeight, 40);
  sun.target.position.set(0, 0, 20);
  sun.target.updateMatrixWorld();
}

/* --- Pioggia / neve: un semplice sistema a punti, riusato per entrambe --- */
const WEATHER_PARTICLE_COUNT = 500;
const weatherGeo = new THREE.BufferGeometry();
const weatherPositions = new Float32Array(WEATHER_PARTICLE_COUNT * 3);
for (let i = 0; i < WEATHER_PARTICLE_COUNT; i++) {
  weatherPositions[i * 3 + 0] = (Math.random() - 0.5) * 140;
  weatherPositions[i * 3 + 1] = Math.random() * 60;
  weatherPositions[i * 3 + 2] = (Math.random() - 0.5) * 140;
}
weatherGeo.setAttribute('position', new THREE.BufferAttribute(weatherPositions, 3));
const weatherMat = new THREE.PointsMaterial({ color: 0xcfe6ff, size: 0.6, transparent: true, opacity: 0.7 });
const weatherParticles = new THREE.Points(weatherGeo, weatherMat);
weatherParticles.visible = false;
scene.add(weatherParticles);

function updateWeatherParticles(dt) {
  const isRain = currentWeather === 'pioggia';
  const isSnow = currentWeather === 'neve';
  weatherParticles.visible = isRain || isSnow;
  if (!weatherParticles.visible) return;

  weatherParticles.position.x = player.position.x;
  weatherParticles.position.z = player.position.z;
  weatherMat.color.setHex(isSnow ? 0xffffff : 0xcfe6ff);
  weatherMat.size = isSnow ? 0.5 : 0.6;

  const fallSpeed = isSnow ? 6 : 45;
  const pos = weatherGeo.attributes.position;
  for (let i = 0; i < WEATHER_PARTICLE_COUNT; i++) {
    let y = pos.getY(i) - fallSpeed * dt;
    if (isSnow) pos.setX(i, pos.getX(i) + Math.sin(y * 0.5) * 0.3 * dt);
    if (y < 0) y = 60;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;
}

/* --- Lucciole: solo a tarda primavera/estate, di sera/notte, vicino al fiume --- */
const FIREFLY_COUNT = 60;
const fireflyGeo = new THREE.BufferGeometry();
const fireflyBase = [];
const fireflyPositions = new Float32Array(FIREFLY_COUNT * 3);
for (let i = 0; i < FIREFLY_COUNT; i++) {
  // sparse lungo il percorso del fiume, dove l'atmosfera serale rende meglio
  const t = Math.random();
  const bx = ISLAND.riverA.x + (ISLAND.riverB.x - ISLAND.riverA.x) * t + (Math.random() - 0.5) * 30;
  const bz = ISLAND.riverA.z + (ISLAND.riverB.z - ISLAND.riverA.z) * t + (Math.random() - 0.5) * 30;
  const by = 1 + Math.random() * 3;
  fireflyBase.push({ x: bx, y: by, z: bz, phase: Math.random() * Math.PI * 2 });
  fireflyPositions[i * 3 + 0] = bx;
  fireflyPositions[i * 3 + 1] = by;
  fireflyPositions[i * 3 + 2] = bz;
}
fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
const fireflyMat = new THREE.PointsMaterial({ color: 0xd9ff8a, size: 0.9, transparent: true, opacity: 0.9 });
const fireflies = new THREE.Points(fireflyGeo, fireflyMat);
fireflies.visible = false;
scene.add(fireflies);

function fireflySeasonActive() {
  // "tarda primavera" = seconda metà della Primavera, poi tutta l'Estate
  const s = clock.season.name;
  if (s === 'Estate') return true;
  if (s === 'Primavera' && clock.seasonProgress > 0.5) return true;
  return false;
}

function updateFireflies(elapsedTime) {
  const eveningOrNight = clock.hour >= 20 || clock.hour < 5;
  fireflies.visible = fireflySeasonActive() && eveningOrNight;
  if (!fireflies.visible) return;
  const pos = fireflyGeo.attributes.position;
  for (let i = 0; i < FIREFLY_COUNT; i++) {
    const b = fireflyBase[i];
    pos.setXYZ(
      i,
      b.x + Math.sin(elapsedTime * 0.6 + b.phase) * 2.5,
      b.y + Math.sin(elapsedTime * 1.3 + b.phase * 2) * 0.6,
      b.z + Math.cos(elapsedTime * 0.5 + b.phase) * 2.5
    );
  }
  pos.needsUpdate = true;
  fireflyMat.opacity = 0.6 + Math.sin(elapsedTime * 3) * 0.3;
}

/* =========================================================================
   TERRENO: oceano + Valle + Cala + fiume + ponte
   ========================================================================= */

// Oceano (piano grande sotto tutto)
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshLambertMaterial({ color: 0x3f8fb8 })
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = -0.3;
ocean.receiveShadow = true;
scene.add(ocean);

// Funzione di supporto: crea un "prato" ellittico piatto con bordi morbidi
function makeIslandPatch(cfg, color, y) {
  const shape = new THREE.Shape();
  const segments = 64;
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const x = Math.cos(a) * cfg.rx;
    const z = Math.sin(a) * cfg.rz;
    if (i === 0) shape.moveTo(x, z); else shape.lineTo(x, z);
  }
  const geo = new THREE.ShapeGeometry(shape, 1);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
  mesh.position.set(cfg.cx, y, cfg.cz);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

makeIslandPatch(ISLAND.valley, 0x8fbc6b, 0.05); // Valle - verde
makeIslandPatch(ISLAND.cala, 0xead9a8, 0.03);   // Cala costiera - sabbia

// Fiume: nastro tra riverA e riverB
function makeRiver() {
  const a = ISLAND.riverA, b = ISLAND.riverB;
  const dx = b.x - a.x, dz = b.z - a.z;
  const len = Math.sqrt(dx * dx + dz * dz);
  const angle = Math.atan2(dz, dx);
  const geo = new THREE.PlaneGeometry(len, ISLAND.riverHalfWidth * 2);
  geo.rotateX(-Math.PI / 2);
  geo.rotateY(-angle);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x5fa8d9 }));
  mesh.position.set((a.x + b.x) / 2, 0.08, (a.z + b.z) / 2);
  scene.add(mesh);
}
makeRiver();

// Ponticello di legno
function makeBridge() {
  const b = ISLAND.bridge;
  const geo = new THREE.BoxGeometry(b.halfLength * 2, 0.4, b.halfWidth * 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x8b5a2b }));
  mesh.position.set(b.cx, 0.25, b.cz);
  mesh.rotation.y = b.rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}
makeBridge();

// Laghetto d'acqua dolce (separato dal mare, per una pesca diversa da quella marina)

/* =========================================================================
   COLLISIONI SEMPLICI: il player può stare solo su Valle, Cala o Ponte
   ========================================================================= */
function insideEllipse(x, z, cfg) {
  const dx = (x - cfg.cx) / cfg.rx;
  const dz = (z - cfg.cz) / cfg.rz;
  return dx * dx + dz * dz <= 1;
}

function insideBridge(x, z) {
  const b = ISLAND.bridge;
  // trasforma il punto nello spazio locale del ponte (ruotato)
  const dx = x - b.cx, dz = z - b.cz;
  const cos = Math.cos(-b.rotY), sin = Math.sin(-b.rotY);
  const lx = dx * cos - dz * sin;
  const lz = dx * sin + dz * cos;
  return Math.abs(lx) <= b.halfLength && Math.abs(lz) <= b.halfWidth;
}

function isWalkable(x, z) {
  return insideEllipse(x, z, ISLAND.valley) || insideEllipse(x, z, ISLAND.cala) || insideBridge(x, z);
}

function scatterPoints(count, zoneCfg, minSpacing) {
  const pts = [];
  let attempts = 0;
  while (pts.length < count && attempts < count * 50) {
    attempts++;
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * 0.88; // resta un po' dentro il bordo dell'isola
    const x = zoneCfg.cx + Math.cos(a) * zoneCfg.rx * r;
    const z = zoneCfg.cz + Math.sin(a) * zoneCfg.rz * r;
    if (!isWalkable(x, z)) continue;
    if (Math.hypot(x - TENT_POS.x, z - TENT_POS.z) < 11) continue;
    if (Math.hypot(x - ISLAND.bridge.cx, z - ISLAND.bridge.cz) < 15) continue;
    let tooClose = false;
    for (const p of placedPoints) {
      if (Math.hypot(x - p.x, z - p.z) < minSpacing) { tooClose = true; break; }
    }
    if (tooClose) continue;
    pts.push({ x, z });
    placedPoints.push({ x, z });
  }
  return pts;
}

function updateResources(dt) {
  for (const it of interactables) {
    const d = it.obj.userData;
    if (it.type === 'fruitTree') {
      if (d.harvested) {
        d.regrowTimer -= dt;
        if (d.regrowTimer <= 0) { d.harvested = false; d.fruitsGroup.visible = true; }
      }
    } else if (it.type === 'woodTree' || it.type === 'rock') {
      if (d.felled) {
        d.respawnTimer -= dt;
        if (d.respawnTimer <= 0) { d.felled = false; d.hits = 0; it.obj.visible = true; }
      }
      if (d.shakeTimer > 0) {
        d.shakeTimer -= dt;
        const s = Math.sin(d.shakeTimer * 60) * 0.06;
        it.obj.rotation.z = d.felled ? 0 : s;
        if (d.shakeTimer <= 0) it.obj.rotation.z = 0;
      }
    }
  }
}

const PLAYER_SPEED = 22;      // unità/secondo in avanti
const TURN_SPEED = 2.2;       // radianti/secondo alla massima inclinazione dello stick

/* =========================================================================
   INPUT LAYER UNIFICATO
   Tutti i driver (tastiera, touch, gamepad) scrivono sullo stesso stato:
   input.move = {x, z} normalizzato, input.actionPressed, input.photoPressed
   Il resto del gioco legge solo "input", senza sapere da dove arriva.
   ========================================================================= */
const input = {
  move: { x: 0, z: 0 },
  actionPressed: false,
  photoPressed: false,
};

/* --- Driver tastiera --- */
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function updateKeyboardInput() {
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  const len = Math.hypot(x, z);
  if (len > 0) { x /= len; z /= len; }
  input.move.x = x;
  input.move.z = z;
  input.actionPressed = !!keys['KeyE'] || !!keys['Space'];
  input.photoPressed = !!keys['KeyF'];
}

/* --- Driver touch: joystick dinamico --- */
const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
let joyTouchId = null;
let joyOrigin = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };
const JOY_RADIUS = 50;

joyZone.addEventListener('touchstart', e => {
  if (joyTouchId !== null) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyOrigin = { x: t.clientX, y: t.clientY };
  joyBase.style.left = t.clientX + 'px';
  joyBase.style.top = t.clientY + 'px';
  joyStick.style.left = t.clientX + 'px';
  joyStick.style.top = t.clientY + 'px';
  joyBase.style.display = 'block';
  joyStick.style.display = 'block';
}, { passive: true });

joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    let dx = t.clientX - joyOrigin.x;
    let dy = t.clientY - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    joyStick.style.left = (joyOrigin.x + dx) + 'px';
    joyStick.style.top = (joyOrigin.y + dy) + 'px';
    joyVector.x = dx / JOY_RADIUS;
    joyVector.y = dy / JOY_RADIUS;
  }
}, { passive: true });

function endJoystick(e) {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyTouchId) continue;
    joyTouchId = null;
    joyVector = { x: 0, y: 0 };
    joyBase.style.display = 'none';
    joyStick.style.display = 'none';
  }
}
joyZone.addEventListener('touchend', endJoystick);
joyZone.addEventListener('touchcancel', endJoystick);

function updateTouchInput() {
  if (joyTouchId === null) return;
  input.move.x = joyVector.x;
  input.move.z = joyVector.y;
}

/* Pulsanti azione touch */
let touchActionDown = false, touchPhotoDown = false;
const btnAction = document.getElementById('btnAction');
const btnPhoto = document.getElementById('btnPhoto');
btnAction.addEventListener('touchstart', e => { e.preventDefault(); touchActionDown = true; }, { passive: false });
btnAction.addEventListener('touchend', () => touchActionDown = false);

/* --- Driver gamepad --- */
function updateGamepadInput() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = pads[0];
  if (!pad) return;
  const x = pad.axes[0] || 0;
  const z = pad.axes[1] || 0;
  if (Math.hypot(x, z) > 0.15) { // deadzone
    input.move.x = x;
    input.move.z = z;
  }
  if (pad.buttons[0] && pad.buttons[0].pressed) input.actionPressed = true; // A / Cross
  if (pad.buttons[2] && pad.buttons[2].pressed) input.photoPressed = true; // X / Square
}

/* Il driver tastiera è quello "di base": lo azzeriamo e poi gli altri driver
   possono sovrascrivere se stanno effettivamente producendo input in quel frame. */
function updateInput() {
  updateKeyboardInput();
  updateTouchInput();
  updateGamepadInput();
  if (touchActionDown) input.actionPressed = true;
  if (touchPhotoDown) input.photoPressed = true;
}

/* Rileva desktop (mouse) vs mobile per nascondere i controlli touch */
if (!('ontouchstart' in window)) {
  document.body.classList.add('desktop-mode');
}

/* "Fronte di salita" del pulsante azione/foto: true solo nel frame in cui il
   pulsante passa da rilasciato a premuto, non per tutta la durata in cui resta
   tenuto — altrimenti un singolo tap (che dura più frame) conterebbe come più
   colpi consecutivi su alberi/rocce. */
let prevActionPressed = false;
let prevPhotoPressed = false;
function updateInputEdges() {
  input.actionJustPressed = input.actionPressed && !prevActionPressed;
  input.photoJustPressed = input.photoPressed && !prevPhotoPressed;
  prevActionPressed = input.actionPressed;
  prevPhotoPressed = input.photoPressed;
}

/* =========================================================================
   CAMERA A DISTANZA FISSA (terza persona, segue il player)
   ========================================================================= */
const CAMERA_OFFSET = { distance: 16, height: 9 };
const CAMERA_LERP = 0.08;
const camTarget = new THREE.Vector3();

function updateCamera() {
  const yaw = player.userData.yaw;
  const behindX = player.position.x - Math.sin(yaw) * CAMERA_OFFSET.distance;
  const behindZ = player.position.z - Math.cos(yaw) * CAMERA_OFFSET.distance;
  camTarget.set(behindX, CAMERA_OFFSET.height, behindZ);
  camera.position.lerp(camTarget, CAMERA_LERP);
  camera.lookAt(player.position.x, player.position.y + 2.2, player.position.z);
}

/* =========================================================================
   MOVIMENTO PLAYER
   Il movimento è relativo alla camera: "avanti" per il giocatore è la
   direzione in cui la camera sta guardando, così i controlli sono intuitivi
   indipendentemente da dove si trova il player sull'isola.
   ========================================================================= */
function updatePlayer(dt) {
  const { x: ix, z: iz } = input.move;
  const turnInput = Math.abs(ix) > 0.02 ? ix : 0;   // -1..1, quanto lo stick è inclinato lateralmente
  const throttle  = Math.abs(iz) > 0.02 ? -iz : 0;  // -1..1, avanti positivo, indietro negativo

  // Sterzo: velocità di rotazione proporzionale all'inclinazione dello stick, MAI un salto diretto.
  // Un'inclinazione minima produce una rotazione lenta e controllabile invece di un giro secco.
  if (turnInput !== 0) {
    player.userData.yaw -= turnInput * TURN_SPEED * dt;
    player.rotation.y = player.userData.yaw;
  }

  // Movimento: sempre lungo la direzione in cui il player è attualmente orientato
  if (throttle !== 0) {
    const yaw = player.userData.yaw;
    const speed = PLAYER_SPEED * (throttle > 0 ? 1 : 0.55); // retromarcia più lenta
    const dx = Math.sin(yaw) * speed * throttle * dt;
    const dz = Math.cos(yaw) * speed * throttle * dt;

    const nextX = player.position.x + dx;
    const nextZ = player.position.z + dz;

    // Collisione semplice: prova prima il movimento pieno, poi solo asse per asse
    if (isWalkable(nextX, nextZ) && !blockedByFences(nextX, nextZ)) {
      player.position.x = nextX;
      player.position.z = nextZ;
    } else if (isWalkable(nextX, player.position.z) && !blockedByFences(nextX, player.position.z)) {
      player.position.x = nextX;
    } else if (isWalkable(player.position.x, nextZ) && !blockedByFences(player.position.x, nextZ)) {
      player.position.z = nextZ;
    }
  }
}

const FISH_POOLS = {
  laghetto: ['persico', 'carpa', 'trota'],
  mare: ['sgombro', 'orata', 'granchio'],
};
const BITE_WINDOW = 1.4;

let fishingState = 'idle'; // idle | waiting | bite | result
let fishingTimer = 0;
let fishingZone = null;
let fishingSpotObj = null;
let fishingResultText = '';

function startFishing(target) {
  fishingState = 'waiting';
  fishingTimer = 3 + Math.random() * 4; // 3-7 secondi di attesa, la parte rilassante
  fishingZone = target.obj.userData.zone;
  fishingSpotObj = target.obj;
  bobberGroup.position.copy(target.obj.userData.bobberPos);
  bobberGroup.visible = true;
  fishingLine.visible = true;
}

function cancelFishing() {
  fishingState = 'idle';
  bobberGroup.visible = false;
  fishingLine.visible = false;
}

function updateFishing(dt, elapsedTime) {
  if (fishingState === 'idle') return;

  if (fishingSpotObj) {
    const linePts = fishingLine.geometry.attributes.position;
    const rodTip = new THREE.Vector3(fishingSpotObj.position.x, 1.5, fishingSpotObj.position.z);
    linePts.setXYZ(0, rodTip.x, rodTip.y, rodTip.z);
    linePts.setXYZ(1, bobberGroup.position.x, bobberGroup.position.y, bobberGroup.position.z);
    linePts.needsUpdate = true;
  }

  fishingTimer -= dt;

  if (fishingState === 'waiting') {
    bobberGroup.position.y = 0.15 + Math.sin(elapsedTime * 2) * 0.04; // ondeggia piano
    if (fishingTimer <= 0) { fishingState = 'bite'; fishingTimer = BITE_WINDOW; }
  } else if (fishingState === 'bite') {
    bobberGroup.position.y = 0.05 + Math.sin(elapsedTime * 14) * 0.08; // scatti nervosi: sta abboccando
    if (input.actionJustPressed) {
      const pool = FISH_POOLS[fishingZone] || ['pesce'];
      const catchName = pool[Math.floor(Math.random() * pool.length)];
      inventory.pesce++;
      refreshInventoryHud();
      fishingResultText = `Hai pescato: ${catchName}!`;
      fishingState = 'result'; fishingTimer = 1.6;
    } else if (fishingTimer <= 0) {
      fishingResultText = 'Il pesce è scappato...';
      fishingState = 'result'; fishingTimer = 1.6;
    }
  } else if (fishingState === 'result') {
    if (fishingTimer <= 0) cancelFishing();
  }
}

/* =========================================================================
   PIAZZAMENTO OGGETTI: per ora solo il pannello di recinto craftato.
   Un "fantasma" semitrasparente segue il player a distanza fissa davanti a
   sé, agganciato a una griglia; verde se la posizione è valida, rosso se no.
   ========================================================================= */
const GRID_SIZE = 2.4;
const PLACEMENT_DISTANCE = 3.6;
const placedFences = []; // { x, z, yaw, mesh }

function makeFencePanel(x, z, yaw) {
  const group = new THREE.Group();
  const postMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2c });
  const railMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
  [-1, 1].forEach(side => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.3, 6), postMat);
    post.position.set(side * 1.05, 0.65, 0);
    post.castShadow = true;
    group.add(post);
  });
  [0.45, 0.95].forEach(h => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.14, 0.1), railMat);
    rail.position.set(0, h, 0);
    rail.castShadow = true;
    group.add(rail);
  });
  group.position.set(x, 0, z);
  group.rotation.y = yaw;
  scene.add(group);
  return group;
}

const ghostMat = new THREE.MeshBasicMaterial({ color: 0x7fe08a, transparent: true, opacity: 0.55 });
const ghostMesh = makeFencePanel(0, 0, 0);
ghostMesh.traverse(o => { if (o.isMesh) { o.material = ghostMat; o.castShadow = false; } });
ghostMesh.visible = false;

function isPlacementValid(x, z) {
  if (!isWalkable(x, z)) return false;
  if (insideBridge(x, z)) return false;
  if (Math.hypot(x - TENT_POS.x, z - TENT_POS.z) < 5) return false;
  for (const f of placedFences) if (Math.hypot(x - f.x, z - f.z) < GRID_SIZE * 0.9) return false;
  for (const it of interactables) if (Math.hypot(x - it.obj.position.x, z - it.obj.position.z) < 2.4) return false;
  return true;
}

function blockedByFences(x, z) {
  for (const f of placedFences) if (Math.hypot(x - f.x, z - f.z) < 1.3) return true;
  return false;
}

let placementMode = false;
const invRecintiChip = document.getElementById('invRecintiChip');

function enterPlacementMode() {
  if (inventory.recinti <= 0) return;
  placementMode = true;
  invRecintiChip.classList.add('active');
}
function exitPlacementMode() {
  placementMode = false;
  ghostMesh.visible = false;
  invRecintiChip.classList.remove('active');
}
function togglePlacementMode() {
  if (placementMode) exitPlacementMode(); else enterPlacementMode();
}
invRecintiChip.addEventListener('click', togglePlacementMode);
invRecintiChip.addEventListener('touchstart', e => { e.preventDefault(); togglePlacementMode(); }, { passive: false });

function updatePlacementGhost() {
  ghostMesh.visible = true;
  const yaw = player.userData.yaw;
  const rawX = player.position.x + Math.sin(yaw) * PLACEMENT_DISTANCE;
  const rawZ = player.position.z + Math.cos(yaw) * PLACEMENT_DISTANCE;
  const gx = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
  const gz = Math.round(rawZ / GRID_SIZE) * GRID_SIZE;
  const snappedYaw = Math.round(yaw / (Math.PI / 2)) * (Math.PI / 2);
  ghostMesh.position.set(gx, 0, gz);
  ghostMesh.rotation.y = snappedYaw;
  const valid = isPlacementValid(gx, gz);
  ghostMat.color.setHex(valid ? 0x7fe08a : 0xe0625a);
  ghostMesh.userData.valid = valid;
  ghostMesh.userData.gx = gx;
  ghostMesh.userData.gz = gz;
  ghostMesh.userData.yaw = snappedYaw;
}

function confirmPlacement() {
  if (!ghostMesh.userData.valid) return;
  const { gx, gz, yaw } = ghostMesh.userData;
  const mesh = makeFencePanel(gx, gz, yaw);
  placedFences.push({ x: gx, z: gz, yaw, mesh });
  inventory.recinti--;
  refreshInventoryHud();
  if (inventory.recinti <= 0) exitPlacementMode();
}

/* Pulsante secondario: tastiera [B], gamepad Y/Triangle (indice 3) o D-pad
   sinistro (indice 14). Il suo effetto dipende dal contesto attuale:
   annulla la pesca se si sta pescando, annulla il piazzamento se attivo,
   altrimenti attiva/disattiva la modalità piazzamento. */
let prevKeyB = false;
let prevPadY = false;
let prevPadDpadLeft = false;
function updateSecondaryButtonInput() {
  if (sleepMenuOpen || craftMenuOpen || clock.sleeping) return;
  const keyB = !!keys['KeyB'];
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = pads[0];
  const yBtn = !!(pad && pad.buttons[3] && pad.buttons[3].pressed);
  const dpadLeft = !!(pad && pad.buttons[14] && pad.buttons[14].pressed);
  const pressed = keyB || yBtn || dpadLeft;

  if (pressed && !prevKeyB) {
    if (placementMode) exitPlacementMode();
    else if (fishingState !== 'idle') cancelFishing();
    else togglePlacementMode();
  }
  prevKeyB = pressed;
}

/* =========================================================================
   NAVIGAZIONE MENU VIA GAMEPAD
   Generico: qualunque menu registra la lista dei suoi "bottoni" (anche div
   con un listener click), e questo sistema li evidenzia/naviga a turno.
   D-pad o levetta sinistra = sposta selezione, A = conferma, B = annulla.
   ========================================================================= */
const gamepadNav = { buttons: [], index: 0 };
function setMenuButtons(buttons) {
  gamepadNav.buttons = buttons;
  gamepadNav.index = 0;
  updateMenuHighlight();
}
function updateMenuHighlight() {
  gamepadNav.buttons.forEach((b, i) => b.classList.toggle('gp-selected', i === gamepadNav.index));
}

let navRepeatTimer = 0;
let prevPadConfirm = false;
let prevPadCancel = false;

function updateMenuGamepadNav(dt) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = pads[0];
  const confirmNow = !!(pad && pad.buttons[0] && pad.buttons[0].pressed); // A / Cross
  const cancelNow = !!(pad && pad.buttons[1] && pad.buttons[1].pressed);  // B / Circle

  const anyMenuOpen = sleepMenuOpen || craftMenuOpen;
  if (!anyMenuOpen || !pad) {
    // Aggiorniamo comunque lo stato "precedente" anche a menu chiuso: se non lo
    // facessimo, un tasto A già tenuto premuto nel momento in cui il menu si
    // apre (es. lo stesso input che ha aperto il menu della tenda) sembrerebbe
    // "appena premuto" al frame successivo e confermerebbe subito la prima voce.
    prevPadConfirm = confirmNow;
    prevPadCancel = cancelNow;
    return;
  }

  const dpadUp = pad.buttons[12] && pad.buttons[12].pressed;
  const dpadDown = pad.buttons[13] && pad.buttons[13].pressed;
  const stickY = pad.axes[1] || 0;
  const wantUp = dpadUp || stickY < -0.5;
  const wantDown = dpadDown || stickY > 0.5;

  navRepeatTimer -= dt;
  if ((wantUp || wantDown) && navRepeatTimer <= 0 && gamepadNav.buttons.length > 0) {
    navRepeatTimer = 0.22; // ritmo di ripetizione tenendo premuto
    const n = gamepadNav.buttons.length;
    gamepadNav.index = wantUp ? (gamepadNav.index - 1 + n) % n : (gamepadNav.index + 1) % n;
    updateMenuHighlight();
  }
  if (!wantUp && !wantDown) navRepeatTimer = 0;

  if (confirmNow && !prevPadConfirm) {
    const btn = gamepadNav.buttons[gamepadNav.index];
    if (btn && !btn.disabled) btn.click();
  }
  if (cancelNow && !prevPadCancel) {
    if (sleepMenuOpen) closeSleepMenu();
    if (craftMenuOpen) closeCraftMenu();
  }
  prevPadConfirm = confirmNow;
  prevPadCancel = cancelNow;
}

/* =========================================================================
   INTERAZIONI: tenda, alberi, rocce — tutte gestite dallo stesso sistema.
   Ogni frame si cerca l'interactable più vicino entro un certo raggio,
   e in base al suo "type" si decide cosa fare quando si preme azione.
   ========================================================================= */
const sleepOverlay = document.getElementById('sleep-overlay');
const zzzIndicator = document.getElementById('zzz-indicator');
let sleepMenuOpen = false;

function openSleepMenu() {
  sleepMenuOpen = true;
  sleepOverlay.classList.add('open');
  setMenuButtons([...document.querySelectorAll('.hour-btn'), document.getElementById('sleep-cancel')]);
}
function closeSleepMenu() {
  sleepMenuOpen = false;
  sleepOverlay.classList.remove('open');
}
document.querySelectorAll('.hour-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const hours = parseInt(btn.dataset.hours, 10);
    closeSleepMenu();
    clock.startSleep(hours, 6);
    zzzIndicator.classList.add('show');
  });
});
document.getElementById('sleep-cancel').addEventListener('click', closeSleepMenu);

const craftOverlay = document.getElementById('craft-overlay');
const recipeListEl = document.getElementById('recipe-list');
let craftMenuOpen = false;

function renderRecipes() {
  recipeListEl.innerHTML = '';
  for (const r of RECIPES) {
    const done = r.once && r.isDone();
    const costText = Object.entries(r.cost).map(([k, v]) => `${v} ${k}`).join(', ');
    const affordable = Object.entries(r.cost).every(([k, v]) => inventory[k] >= v);
    const row = document.createElement('div');
    row.className = 'recipe-row';
    row.innerHTML = `
      <div class="recipe-info">${r.name}<div class="recipe-cost">${done ? 'già ottenuto' : costText}</div></div>
      <button class="recipe-btn" ${(done || !affordable) ? 'disabled' : ''}>${done ? '✓' : 'crea'}</button>
    `;
    if (!done) {
      row.querySelector('.recipe-btn').addEventListener('click', () => {
        if (!Object.entries(r.cost).every(([k, v]) => inventory[k] >= v)) return;
        for (const [k, v] of Object.entries(r.cost)) inventory[k] -= v;
        r.craft();
        refreshInventoryHud();
        renderRecipes();
      });
    }
    recipeListEl.appendChild(row);
  }
  setMenuButtons([...recipeListEl.querySelectorAll('.recipe-btn'), document.getElementById('craft-cancel')]);
}

function openCraftMenu() {
  craftMenuOpen = true;
  renderRecipes();
  craftOverlay.classList.add('open');
}
function closeCraftMenu() {
  craftMenuOpen = false;
  craftOverlay.classList.remove('open');
}
document.getElementById('craft-cancel').addEventListener('click', closeCraftMenu);

const WEATHER_LABELS = { sereno: 'Sereno', nuvoloso: 'Nuvoloso', pioggia: 'Pioggia', neve: 'Neve' };

const inventory = { legna: 0, pietra: 0, frutta: 0, recinti: 0, pesce: 0 };
const invEls = {
  legna: document.getElementById('invLegna'), pietra: document.getElementById('invPietra'),
  frutta: document.getElementById('invFrutta'), recinti: document.getElementById('invRecinti'),
  pesce: document.getElementById('invPesce'),
};
function refreshInventoryHud() {
  invEls.legna.textContent = inventory.legna;
  invEls.pietra.textContent = inventory.pietra;
  invEls.frutta.textContent = inventory.frutta;
  invEls.recinti.textContent = inventory.recinti;
  invEls.pesce.textContent = inventory.pesce;
}

const INTERACT_RANGE = 6;

function findNearestInteractable() {
  let best = null, bestDist = Infinity;
  for (const it of interactables) {
    const d = player.position.distanceTo(it.obj.position);
    if (d < INTERACT_RANGE && d < bestDist) { best = it; bestDist = d; }
  }
  return best;
}

function handleAction(target) {
  const d = target.obj.userData;
  if (target.type === 'tent') {
    if (!clock.sleeping && !sleepMenuOpen) openSleepMenu();
  } else if (target.type === 'workbench') {
    if (!craftMenuOpen) openCraftMenu();
  } else if (target.type === 'fishingSpot') {
    if (fishingState === 'idle') startFishing(target);
  } else if (target.type === 'fruitTree') {
    if (!d.harvested) {
      d.harvested = true;
      d.fruitsGroup.visible = false;
      d.regrowTimer = REGROW_TIME;
      inventory.frutta++;
      refreshInventoryHud();
    }
  } else if (target.type === 'woodTree' || target.type === 'rock') {
    if (!d.felled) {
      d.hits++;
      d.shakeTimer = 0.2;
      if (d.hits >= d.maxHits) {
        d.felled = true;
        d.respawnTimer = RESPAWN_TIME;
        target.obj.visible = false;
        if (target.type === 'woodTree') inventory.legna += 3; else inventory.pietra += 3;
      } else {
        if (target.type === 'woodTree') inventory.legna += 1; else inventory.pietra += 1;
      }
      refreshInventoryHud();
    }
  }
}

const INTERACT_HINTS = {
  tent: 'Vicino alla tenda — [E] per dormire',
  workbench: 'Banco da lavoro — [E] per creare oggetti',
  fishingSpot: 'Punto di pesca — [E] per lanciare l\'amo',
  fruitTree: 'Albero da frutta — [E] per raccogliere',
  woodTree: 'Albero da legna — [E] per colpire',
  rock: 'Roccia — [E] per colpire',
};

function checkInteractions() {
  const debugEl = document.getElementById('debug');

  if (placementMode) {
    updatePlacementGhost();
    if (input.actionJustPressed) confirmPlacement();
    debugEl.textContent =
      `Piazzamento recinto — ${ghostMesh.userData.valid ? 'posizione valida' : 'posizione non valida'}\n` +
      `[E] conferma — [B] / Y / D-pad sinistro per uscire\n` +
      `pannelli rimasti: ${inventory.recinti}`;
    return;
  }

  if (fishingState !== 'idle') {
    let msg;
    if (fishingState === 'waiting') msg = 'Amo in acqua... aspetta (B per annullare)';
    else if (fishingState === 'bite') msg = 'Abbocca! [E] per agganciare!';
    else msg = fishingResultText;
    debugEl.textContent = msg;
    return;
  }

  const target = clock.sleeping ? null : findNearestInteractable();
  let hint = '';
  if (target) {
    const d = target.obj.userData;
    const depleted = (target.type === 'fruitTree' && d.harvested) || ((target.type === 'woodTree' || target.type === 'rock') && d.felled);
    if (!depleted) {
      hint = INTERACT_HINTS[target.type];
      if (input.actionJustPressed && !sleepMenuOpen && !craftMenuOpen) handleAction(target);
    }
  }
  const h = String(clock.hour).padStart(2, '0');
  const m = String(clock.minuteOfHour).padStart(2, '0');
  debugEl.textContent =
    `${h}:${m} — giorno ${clock.dayInSeason + 1}/${clock.season.lengthDays} di ${clock.season.name}\n` +
    `meteo: ${WEATHER_LABELS[currentWeather]}${clock.sleeping ? ' — sto dormendo...' : ''}\n` +
    `attrezzo: ${toolTier >= 2 ? 'rinforzato' : 'base'}\n` +
    `pos: ${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)}\n` +
    (hint ? hint : '');
}

/* =========================================================================
   LOOP DI GIOCO
   ========================================================================= */
let lastTime = performance.now();
let elapsedTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1); // clamp per evitare salti su tab inattivo
  lastTime = now;
  elapsedTime += dt;

  clock.update(dt);
  updateSky();
  updateWeatherParticles(dt);
  updateFireflies(elapsedTime);
  updateResources(dt);
  updateFishing(dt, elapsedTime);

  input.actionPressed = false;
  input.photoPressed = false;
  updateInput();
  updateInputEdges();
  updateMenuGamepadNav(dt);
  updateSecondaryButtonInput();

  const controlsLocked = sleepMenuOpen || craftMenuOpen || clock.sleeping || fishingState !== 'idle';
  if (!controlsLocked) {
    updatePlayer(dt);
  }
  updateCamera();
  checkInteractions();

  if (!clock.sleeping) zzzIndicator.classList.remove('show');

  renderer.render(scene, camera);
}

// Posiziona la camera subito dietro al player prima del primo frame
camera.position.set(player.position.x, CAMERA_OFFSET.height, player.position.z + CAMERA_OFFSET.distance);
camera.lookAt(player.position);

animate();
</script>
