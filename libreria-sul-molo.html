<style>
  :root{
    --sabbia:#F2E8D5;
    --pannello:#FFFBF2;
    --inchiostro:#2B2118;
    --mare:#2F6F6B;
    --mare-scuro:#204F4C;
    --corallo:#C9622B;
    --oro:#D4A72C;
    --tenue:#8C7A63;
    --bordo: #E3D6BC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--mare-scuro);}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--inchiostro);
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    width:100vw; height:100vh;
    background:var(--sabbia);
    position:relative;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
    background:var(--mare); color:#FFFBF2;
    flex-shrink:0;
  }
  .topbar .titolo{font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; letter-spacing:.2px;}
  .stat-pill{
    display:flex; gap:14px; align-items:center; font-weight:700; font-size:.95rem;
  }
  .stat-pill span.icona{opacity:.85; font-weight:600; margin-right:4px;}
  .oro-val{color:var(--oro);}
  .schermo{flex:1; display:flex; overflow:hidden;}
  .colonna{padding:14px 18px; overflow-y:auto;}
  .btn{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:.95rem;
    border:none; border-radius:10px; padding:11px 20px; cursor:pointer;
    background:var(--mare); color:#FFFBF2;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn.secondario{background:transparent; color:var(--mare); border:2px solid var(--mare);}
  .btn.corallo{background:var(--corallo);}
  .btn:disabled{opacity:.4; cursor:default;}
  .card{
    background:var(--pannello); border:1px solid var(--bordo); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .genere-riga{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 4px; border-bottom:1px dashed var(--bordo);
  }
  .genere-riga:last-child{border-bottom:none;}
  .genere-nome{font-weight:700;}
  .genere-sub{font-size:.75rem; color:var(--tenue);}
  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--bordo);
    background:#fff; font-weight:800; font-size:1rem; cursor:pointer;
  }
  .stepper .val{min-width:22px; text-align:center; font-weight:800;}
  .bollettino{
    background:#fff; border:1px dashed var(--tenue); border-radius:10px;
    padding:10px 14px; font-size:.85rem; color:var(--tenue);
  }
  .cliente-box{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:14px; text-align:center; padding:20px;
  }
  .cliente-avatar{
    width:64px; height:64px; border-radius:50%;
    background:var(--mare); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:1.6rem; font-weight:700;
  }
  .keyword-chip{
    display:inline-block; background:var(--oro); color:#3a2e0f; font-weight:800;
    padding:4px 10px; border-radius:20px; font-size:.8rem; margin:3px;
  }
  .scaffale{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px;
    padding:8px;
  }
  .libro-mini{
    background:#fff; border:1px solid var(--bordo); border-radius:8px; padding:10px;
    cursor:pointer; font-size:.78rem; text-align:left; line-height:1.35;
  }
  .libro-mini:active{background:var(--sabbia);}
  .libro-titolo{font-weight:800; font-size:.85rem; margin:2px 0;}
  .libro-genere{color:var(--corallo); font-weight:700; font-size:.68rem; text-transform:uppercase; letter-spacing:.3px;}
  .libro-meta{color:var(--tenue); font-size:.7rem; margin-bottom:4px;}
  .libro-sinossi{font-size:.75rem; color:var(--inchiostro); margin-bottom:4px;}
  .libro-footer{display:flex; justify-content:space-between; align-items:center; font-size:.72rem; color:var(--tenue); margin-top:4px; border-top:1px dashed var(--bordo); padding-top:4px;}
  .copertina-libro{width:34px; height:48px; flex-shrink:0; border-radius:3px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.18);}
  .copertina-libro svg{display:block; width:100%; height:100%;}
  .riga-libro{display:flex; gap:8px; align-items:flex-start;}
  .riga-libro > .testo-libro{flex:1; min-width:0;}
  footer.azioni{
    padding:12px 18px; display:flex; justify-content:flex-end; gap:10px;
    border-top:1px solid var(--bordo); background:var(--pannello); flex-shrink:0;
  }
  .riepilogo-riga{display:flex; justify-content:space-between; padding:6px 0; font-size:.95rem;}
  .riepilogo-riga.totale{font-weight:800; border-top:2px solid var(--inchiostro); margin-top:6px; padding-top:8px;}
  .rotate-warning{
    position:fixed; inset:0; background:var(--mare-scuro); color:#fff;
    display:none; align-items:center; justify-content:center; text-align:center; padding:30px;
    font-family:'Fraunces', serif; font-size:1.1rem; z-index:999;
  }
  @media (orientation: portrait){
    .rotate-warning{display:flex;}
  }
  .overlay-conferma{
    position:fixed; inset:0; background:rgba(32,79,76,.75);
    display:flex; align-items:center; justify-content:center; z-index:1000;
    padding:20px;
  }
  .overlay-conferma .box{
    background:var(--pannello); border-radius:14px; padding:20px 22px;
    max-width:320px; text-align:center;
  }
  .overlay-conferma p{margin:0 0 16px 0; font-size:.95rem;}
  .overlay-conferma .riga-btn{display:flex; gap:10px; justify-content:center;}
  .scena-location{
    width:100%; height:130px; border-radius:12px; overflow:hidden;
    margin-bottom:10px; border:1px solid var(--bordo); position:relative;
  }
  .scena-location svg{width:100%; height:100%; display:block;}
  .scena-furgone{
    width:100%; height:100px; border-radius:12px; overflow:hidden;
    margin-top:10px; border:1px solid var(--bordo); background:#fff;
  }
  .scena-furgone svg{width:100%; height:100%; display:block;}
  .ritratto-npc{width:100%; height:100%; border-radius:50%; overflow:hidden; display:block;}
  .ritratto-npc svg{width:100%; height:100%; display:block;}
  .riga-pioggia{ animation: cadutaPioggia 0.9s linear infinite; }
  @keyframes cadutaPioggia{
    0%{ transform:translateY(-14px); opacity:0; }
    30%{ opacity:1; }
    100%{ transform:translateY(24px); opacity:0; }
  }
  .particella-primavera{ animation: cadutaPetalo 4.5s linear infinite; }
  @keyframes cadutaPetalo{
    0%{ transform:translate(0,-10px) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(10px,65px) rotate(180deg); }
    100%{ transform:translate(-8px,150px) rotate(360deg); opacity:0; }
  }
  .particella-autunno{ animation: cadutaFoglia 5.5s linear infinite; }
  @keyframes cadutaFoglia{
    0%{ transform:translate(0,-10px) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-14px,70px) rotate(-140deg); }
    100%{ transform:translate(10px,150px) rotate(220deg); opacity:0; }
  }
  .intro-scena{ width:100%; height:100%; background:#BFE3D0; overflow:hidden; position:relative; }
  .intro-scena svg{ position:absolute; top:0; left:0; height:100%; display:block; }
  .strato-lontano{ width:220%; animation: scorriLontano 11s linear forwards; }
  .strato-vicino{ width:260%; animation: scorriVicino 11s linear forwards; }
  @keyframes scorriLontano{ from{ transform:translateX(0); } to{ transform:translateX(-54%); } }
  @keyframes scorriVicino{ from{ transform:translateX(0); } to{ transform:translateX(-62%); } }
  .auto-roulotte{
    position:absolute; bottom:14%; left:-32%; width:34%; height:26%;
    animation: passaggioAuto 11s cubic-bezier(.4,0,.2,1) forwards;
  }
  .auto-roulotte svg{ width:100%; height:100%; display:block; }
  @keyframes passaggioAuto{
    0%{ left:-32%; }
    15%{ left:-32%; }
    88%{ left:105%; }
    100%{ left:105%; }
  }
  .intro-salta{
    position:absolute; bottom:14px; right:14px; z-index:5;
    background:rgba(32,79,76,.55); color:#fff; border:1px solid rgba(255,255,255,.5);
    border-radius:8px; padding:8px 14px; font-family:'Nunito',sans-serif; font-weight:800;
    font-size:.8rem; cursor:pointer;
  }

/* ===================== FULLSCREEN ===================== */
function toggleFullscreen(){
  const el = document.documentElement;
  const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  if(!inFullscreen){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}
document.addEventListener("fullscreenchange", aggiornaIconaFullscreen);
document.addEventListener("webkitfullscreenchange", aggiornaIconaFullscreen);
function aggiornaIconaFullscreen(){
  const btn = document.getElementById("btn-fullscreen");
  const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  if(btn) btn.textContent = inFullscreen ? "⤢" : "⛶";
}

/* ===================== AUDIO (sintetico, Web Audio API) ===================== */
function caricaPreferenzaAudio(){
  const v = localStorage.getItem("libreria_molo_audio");
  return v === null ? true : v === "1";
}
let audioAbilitato = caricaPreferenzaAudio();
let audioCtx = null;
function toggleAudio(){
  audioAbilitato = !audioAbilitato;
  localStorage.setItem("libreria_molo_audio", audioAbilitato ? "1" : "0");
  if(audioAbilitato) suonaClick();
  schermataOpzioni();
}
function getAudioCtx(){
  if(!audioAbilitato) return null;
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function suonaTono(freq, durata, tipo, volume, ritardo){
  const ctx = getAudioCtx();
  if(!ctx) return;
  tipo = tipo || "sine"; volume = volume===undefined ? 0.12 : volume; ritardo = ritardo || 0;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = tipo;
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + ritardo;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+durata);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+durata+0.02);
}
function suonaVendita(){ suonaTono(880,0.12,'sine',0.12); suonaTono(1320,0.15,'sine',0.1,0.08); }
function suonaMissione(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> suonaTono(f,0.18,'triangle',0.12,i*0.09)); }
function suonaErrore(){ suonaTono(180,0.2,'sawtooth',0.08); }
function suonaClick(){ suonaTono(440,0.05,'square',0.04); }
function suonaGiorno(){ suonaTono(660,0.1,'sine',0.08); suonaTono(880,0.14,'sine',0.08,0.1); }

function inizialiTitolo(titolo){
  const t = titolo.replace(/^(L'|Il |La |Lo |Gli |I |Le )/i, '');
  return t.slice(0,2).toUpperCase();
}
function svgCopertina(libro){
  const stile = GENERE_STILE[libro.genere];
  let icona = '';
  switch(stile.icona){
    case 'onda':    icona = `<path d="M4,20 Q9,15 14,20 T24,20" stroke="#fff" stroke-width="1.6" fill="none" opacity=".85"/>`; break;
    case 'lente':   icona = `<circle cx="12" cy="16" r="5.5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".85"/><line x1="16" y1="20" x2="21" y2="25" stroke="#fff" stroke-width="1.8" opacity=".85"/>`; break;
    case 'stella':  icona = `<polygon points="14,9 16.2,14.8 22.5,15.1 17.6,19.1 19.3,25.2 14,21.7 8.7,25.2 10.4,19.1 5.5,15.1 11.8,14.8" fill="#fff" opacity=".85"/>`; break;
    case 'libro':   icona = `<path d="M5,13 L13,11.5 L13,23 L5,24.5 Z" fill="#fff" opacity=".85"/><path d="M23,13 L15,11.5 L15,23 L23,24.5 Z" fill="#fff" opacity=".85"/>`; break;
    case 'orsetto': icona = `<circle cx="14" cy="18" r="6" fill="#fff" opacity=".85"/><circle cx="9" cy="12" r="2.4" fill="#fff" opacity=".85"/><circle cx="19" cy="12" r="2.4" fill="#fff" opacity=".85"/>`; break;
    case 'cuore':   icona = `<path d="M14,25 C4,17 6,9 14,13 C22,9 24,17 14,25 Z" fill="#fff" opacity=".85"/>`; break;
    case 'luna':    icona = `<path d="M19,9 A9,9 0 1 0 19,27 A7,7 0 1 1 19,9 Z" fill="#fff" opacity=".85"/>`; break;
  }
  const iniziali = inizialiTitolo(libro.titolo);
  return `<svg viewBox="0 0 28 40">
    <rect x="0" y="0" width="28" height="40" rx="2" fill="${stile.colore}"/>
    <rect x="1.5" y="1.5" width="25" height="37" rx="1.5" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1"/>
    ${icona}
    <text x="14" y="35" font-family="Fraunces, serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" opacity=".95">${iniziali}</text>
  </svg>`;
}

function stagioneCorrente(){
  const indice = Math.floor((stato.giorno-1)/GIORNI_PER_STAGIONE) % STAGIONI.length;
  return STAGIONI[indice];
}
function estraiMeteo(){
  const pesi = stagioneCorrente().meteoPesi;
  const totale = METEO_TIPI.reduce((s,m)=>s+pesi[m],0);
  let r = Math.random()*totale;
  for(const m of METEO_TIPI){ r -= pesi[m]; if(r<=0) return m; }
  return METEO_TIPI[METEO_TIPI.length-1];
}

function estraiEvento(){

  const disponibili = EVENTI.filter(e => e.stagione===null || e.stagione===stagioneId);
  const totale = disponibili.reduce((s,e)=>s+e.peso,0);

/* ===================== STATO ===================== */
let stato = null;

function nuovaPartita(){
  const missioniIniziali = {};
  Object.keys(NPC).forEach(k=> missioniIniziali[k] = { stage:0, progresso:0, completata:false });
  stato = { giorno:1, capitale:40, magazzino:{}, scaffali:{}, capacitaScaffale:3, meteoOggi:null,
    locationAttuale:"lungomare", locationSbloccateStoriche:["lungomare"],
    missioni: missioniIniziali,
    arrediPosseduti: [], eventoOggi: null, mercatoOggi: [], finaleVisto: false, npcIncontrati: [] };
  // dotazione iniziale: 2 copie di 3 libri comuni a genere
  GENERI.forEach(g=>{
    const libriGenere = CATALOGO.filter(l=>l.genere===g && l.rarita==="comune").slice(0,2);
    libriGenere.forEach(l=>{ stato.magazzino[l.id] = 2; });
  });
  salvaStato();
}
function salvaStato(){ localStorage.setItem("libreria_molo_v1", JSON.stringify(stato)); }
function caricaStato(){
  let s;
  try{ s = JSON.parse(localStorage.getItem("libreria_molo_v1")); }catch(e){ return null; }
  if(!s) return null;
  // migrazione: riempie eventuali campi mancanti da versioni precedenti del salvataggio
  const difetti = {
    locationAttuale: "lungomare",
    locationSbloccateStoriche: ["lungomare"],
    missioni: { ines: { stage:0, progresso:0, completata:false }, marco: { stage:0, progresso:0, completata:false } },
    arrediPosseduti: [],
    eventoOggi: null,
    capacitaScaffale: 3,
    mercatoOggi: [],
    finaleVisto: false,
    npcIncontrati: [],
  };
  Object.keys(difetti).forEach(k=>{
    if(s[k] === undefined) s[k] = difetti[k];
  });
  Object.keys(NPC).forEach(k=>{
    if(!s.missioni[k]) s.missioni[k] = { stage:0, progresso:0, completata:false };
  });
  return s;
}

function capacitaScaffaleAttuale(){
  return stato.arrediPosseduti.includes("scaffale2") ? 5 : 3;
}
function bonusArredi(genere){
  let m = 1.0;
  ARREDI.forEach(a=>{
    if(stato.arrediPosseduti.includes(a.id) && a.bonus[genere]) m *= a.bonus[genere];
  });
  return m;
}
function acquistaArredo(id){
  const a = ARREDI.find(x=>x.id===id);
  if(stato.arrediPosseduti.includes(id) || stato.capitale < a.costo) return;
  stato.capitale -= a.costo;
  stato.arrediPosseduti.push(id);
  if(a.effettoSpeciale === "capacita") stato.capacitaScaffale = capacitaScaffaleAttuale();
  salvaStato();
  suonaClick();
  schermataPianificazione();
}

/* ===================== MERCATO SERALE ===================== */
function generaMercatoOggi(){
  const scelti = [];
  GENERI.forEach(g=>{
    const libriGenere = CATALOGO.filter(l=>l.genere===g);
    const shuffled = [...libriGenere].sort(()=>Math.random()-0.5);
    const nOfferte = 2 + Math.floor(Math.random()*2); // 2-3 titoli per genere
    shuffled.slice(0, nOfferte).forEach(l=>{
      scelti.push({ id:l.id, disponibili: 1 + Math.floor(Math.random()*3) });
    });
  });
  stato.mercatoOggi = scelti;
}

function schermataMercato(){
  if(!stato.mercatoOggi.length) generaMercatoOggi();
  const sch = document.getElementById("schermo");
  sch.innerHTML = `
    <div class="colonna" style="width:32%; border-right:1px solid var(--bordo);">
      <h2>Mercatino dei libri usati</h2>
      <p style="font-size:.85rem; color:var(--tenue);">Offerta diversa ogni sera. Compra ciò che ti serve per domani.</p>
      <div class="card">💰 Capitale: <strong>${stato.capitale}€</strong></div>
    </div>
    <div class="colonna" style="flex:1;" id="colonna-mercato"></div>
  `;
  const col = document.getElementById("colonna-mercato");
  col.innerHTML = `<div class="scaffale" id="scaffale-mercato"></div>`;
  renderMercato();
  document.getElementById("azioni").innerHTML = `<button class="btn corallo" onclick="giornoSuccessivo()">Vai a dormire →</button>`;
}
function renderMercato(){
  const scaffale = document.getElementById("scaffale-mercato");
  scaffale.innerHTML = "";
  stato.mercatoOggi.forEach(voce=>{
    if(voce.disponibili <= 0) return;
    const l = libroById(voce.id);
    const giaPossedute = stato.magazzino[l.id] || 0;
    const div = document.createElement("div");
    div.className = "libro-mini";
    div.style.cursor = stato.capitale >= l.prezzo_acquisto ? "pointer" : "default";
    div.style.opacity = stato.capitale >= l.prezzo_acquisto ? "1" : ".5";
    div.innerHTML = contenutoCardLibro(l, `<span>${voce.disponibili} disp.${giaPossedute ? ` · hai già ${giaPossedute}` : ""}</span><strong>${l.prezzo_acquisto}€</strong>`);
    div.onclick = ()=>{
      if(stato.capitale < l.prezzo_acquisto) return;
      stato.capitale -= l.prezzo_acquisto;
      stato.magazzino[l.id] = (stato.magazzino[l.id]||0) + 1;
      voce.disponibili -= 1;
      aggiornaHUD();
      salvaStato();
      suonaClick();
      renderMercato();
    };
    scaffale.appendChild(div);
  });
}

function libroById(id){ return CATALOGO.find(l=>l.id===id); }
function libriInMagazzino(genere){
  return Object.keys(stato.magazzino)
    .filter(id => stato.magazzino[id] > 0 && libroById(id).genere === genere)
    .map(id => ({...libroById(id), qta: stato.magazzino[id]}));
}
function contenutoCardLibroCompatto(l){
  return `<div class="riga-libro">
    <div class="copertina-libro">${svgCopertina(l)}</div>
    <div class="testo-libro">

function chiediConferma(messaggio, onSi){
  const overlay = document.createElement("div");
  overlay.className = "overlay-conferma";
  overlay.innerHTML = `
    <div class="box">
      <p>${messaggio}</p>
      <div class="riga-btn">
        <button class="btn secondario" id="conferma-no">Annulla</button>
        <button class="btn corallo" id="conferma-si">Conferma</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("conferma-no").onclick = ()=> overlay.remove();
  document.getElementById("conferma-si").onclick = ()=>{ overlay.remove(); onSi(); };
}

function generaParticelleStagione(meteo){
  if(meteo!=='Sereno' && meteo!=='Nuvoloso') return '';
  const stagioneId = stagioneCorrente().id;
  let tipo, colori;
  if(stagioneId==='primavera'){ tipo='primavera'; colori=['#F3C6D9','#FBE1EA','#E8A9C4']; }
  else if(stagioneId==='autunno'){ tipo='autunno'; colori=['#C9622B','#D4A72C','#8C4A2B']; }
  else return '';
  let out = '';
  for(let i=0;i<6;i++){
    const x = 20 + Math.random()*360;
    const delay = (Math.random()*4).toFixed(2);
    const durata = (3.5+Math.random()*2.5).toFixed(2);
    const colore = colori[i%colori.length];
    const forma = tipo==='primavera'
      ? `<ellipse cx="0" cy="0" rx="3.5" ry="2" fill="${colore}"/>`
      : `<path d="M0,-3 Q3,0 0,3 Q-3,0 0,-3 Z" fill="${colore}"/>`;
    out += `<g class="particella-${tipo}" style="animation-delay:${delay}s; animation-duration:${durata}s;" transform="translate(${x},0)">${forma}</g>`;
  }
  return `<g>${out}</g>`;
}

function cambiaScaffale(g, delta){
  const disponibili = libriInMagazzino(g).reduce((s,l)=>s+l.qta,0);
  const max = Math.min(disponibili, stato.capacitaScaffale);
  stato.scaffali[g] = Math.max(0, Math.min(max, (stato.scaffali[g]||0) + delta));

/* ===================== SCHERMATA: APERTURA NEGOZIO ===================== */
let coda = [];
let contatoriGiorno = { incassi:0, venduti:0, spese:3, eventiMissione:[] };

function apriNegozio(){
  coda = [];
  let nClienti = 6 + Math.floor(Math.random()*4); // 6-9
  if(stato.eventoOggi && stato.eventoOggi.effettoClienti) nClienti = Math.round(nClienti * stato.eventoOggi.effettoClienti);
  for(let i=0;i<nClienti;i++){
    coda.push({ raccomandazione: Math.random() < 0.35 });
  }
  const loc = LOCATIONS.find(l=>l.id===stato.locationAttuale);
  contatoriGiorno = { incassi:0, venduti:0, spese:loc.parcheggio, eventiMissione:[] };

  const nonIncontrati = Object.keys(NPC).filter(id=>!stato.npcIncontrati.includes(id));
  if(nonIncontrati.length && Math.random() < 0.45){
    const scelto = nonIncontrati[Math.floor(Math.random()*nonIncontrati.length)];
    mostraIncontroNPC(scelto);
    return;
  }
  prossimoCliente();
}

function mostraIncontroNPC(npcId){
  stato.npcIncontrati.push(npcId);
  salvaStato();
  const npc = NPC[npcId];
  const sch = document.getElementById("schermo");
  sch.innerHTML = `
    <div class="colonna" style="flex:1; max-width:460px; margin:0 auto; height:100%; overflow-y:auto; text-align:center;">
      <div class="ritratto-npc" style="width:72px; height:72px; margin:0 auto 10px auto;">${RITRATTI[npcId]}</div>
      <h3>Un nuovo volto in negozio</h3>
      <p style="font-style:italic; font-size:.9rem; text-align:left; margin-top:10px;">${INTRO[npcId]}</p>
      <p style="font-size:.8rem; color:var(--tenue); margin-top:10px;">${npc.nome} è ora annotata nel diario di bordo.</p>
    </div>
  `;
  document.getElementById("azioni").innerHTML = `<button class="btn corallo" onclick="prossimoCliente()">Continua →</button>`;
}

function prossimoCliente(){
  const sch = document.getElementById("schermo");
  if(coda.length === 0){ return chiusuraGiornata(); }
  const cliente = coda.shift();

  if(cliente.raccomandazione){
    mostraClienteRaccomandazione(sch);
  } else {
    mostraClienteAutomatico(sch);
  }
}

function generiConScorta(){
  return GENERI.filter(g => (stato.scaffali[g]||0) > 0);
}

function probabilitaVendita(genere){
  const base = P_BASE[genere];
  const scorta = stato.scaffali[genere]||0;
  const moltScorta = scorta<=1 ? 0.6 : (scorta<=5 ? 1.0 : 1.15);
  const moltMeteo = (METEO_EFFETTI[stato.meteoOggi]||{})[genere] || 1.0;
  const loc = LOCATIONS.find(l=>l.id===stato.locationAttuale);
  const moltLocation = (loc.bonus||{})[genere] || 1.0;
  const moltArredi = bonusArredi(genere);
  return Math.min(0.45, base * moltScorta * moltMeteo * moltLocation * moltArredi);
}

function registraProgressoMissione(genere){
  Object.keys(NPC).forEach(npcId=>{
    const npc = NPC[npcId];
    if(!stato.npcIncontrati.includes(npcId)) return;
    const stato_npc = stato.missioni[npcId];
    if(stato_npc.stage >= npc.missioni.length) return;
    if(!npc.generiPreferiti.includes(genere)) return;
    stato_npc.progresso += 1;
    const m = npc.missioni[stato_npc.stage];
    if(stato_npc.progresso >= m.target){
      stato.capitale += m.ricompensa;
      if(!contatoriGiorno.eventiMissione) contatoriGiorno.eventiMissione = [];
      contatoriGiorno.eventiMissione.push({
        npcId, npc:npc.nome, emoji:npc.emoji, ricompensa:m.ricompensa,
        stageCompletato: stato_npc.stage+1, ultima: stato_npc.stage+1 >= npc.missioni.length,
        dialogo: (DIALOGHI[npcId] && DIALOGHI[npcId][stato_npc.stage]) || null,
      });
      suonaMissione();
      stato_npc.stage += 1;
      stato_npc.progresso = 0;
      if(stato_npc.stage >= npc.missioni.length) stato_npc.completata = true;
    }
  });
  if(!stato.finaleVisto && totaleMissioniCompletate() >= 16){
    stato.finaleVisto = true;
    contatoriGiorno.finaleSbloccato = true;
  }
}

function mostraClienteAutomatico(sch){
  const generiOk = generiConScorta();
  let genereScelto = null;
  if(generiOk.length){
    // pesa la scelta del cliente in base a probabilità di vendita
    const pesi = generiOk.map(g=>probabilitaVendita(g));
    const somma = pesi.reduce((a,b)=>a+b,0);
    let r = Math.random()*somma;
    for(let i=0;i<generiOk.length;i++){ r -= pesi[i]; if(r<=0){ genereScelto = generiOk[i]; break; } }
    if(!genereScelto) genereScelto = generiOk[generiOk.length-1];
  }
  const successo = genereScelto && Math.random() < probabilitaVendita(genereScelto)*1.5;

  sch.innerHTML = `<div class="cliente-box">
    <div class="cliente-avatar">🧍</div>
    <h3>Un cliente sta sfogliando gli scaffali...</h3>
  </div>`;
  document.getElementById("azioni").innerHTML = `<button class="btn secondario" disabled>attendi...</button>`;

  setTimeout(()=>{
    if(successo && genereScelto){
      vendiLibroCasuale(genereScelto);
    }
    prossimoCliente();
  }, 550);
}

function vendiLibroCasuale(genere){
  const libri = libriInMagazzino(genere);
  if(!libri.length) return;
  const libro = libri[Math.floor(Math.random()*libri.length)];
  stato.magazzino[libro.id] -= 1;
  stato.scaffali[genere] = Math.max(0, stato.scaffali[genere]-1);
  let ricavo = libro.prezzo_vendita;
  if(stato.eventoOggi && stato.eventoOggi.bonusRaro && libro.rarita === "rara") ricavo += 15;
  stato.capitale += ricavo;
  contatoriGiorno.incassi += ricavo;
  contatoriGiorno.venduti += 1;
  registraProgressoMissione(genere);
  aggiornaHUD();
  salvaStato();
  suonaVendita();
}

function mostraClienteRaccomandazione(sch){
  const generiOk = generiConScorta();
  if(!generiOk.length){ return mostraClienteAutomatico(sch); }
  const genereRichiesto = generiOk[Math.floor(Math.random()*generiOk.length)];
  const libriGenere = libriInMagazzino(genereRichiesto);
  const libroTarget = libriGenere[Math.floor(Math.random()*libriGenere.length)];
  const parole = libroTarget.parole_chiave.slice(0,3);

  sch.innerHTML = `
    <div class="colonna" style="width:34%; border-right:1px solid var(--bordo);">
      <div class="cliente-avatar" style="margin-bottom:10px;">🧍</div>
      <h3>"Cerco qualcosa su..."</h3>
      <div>${parole.map(p=>`<span class="keyword-chip">${p}</span>`).join("")}</div>
      <p style="font-size:.8rem; color:var(--tenue); margin-top:10px;">Tocca il libro giusto sullo scaffale.</p>
    </div>
    <div class="colonna" style="flex:1;">
      <div class="scaffale" id="scaffale-racc"></div>
    </div>
  `;
  const scaffale = document.getElementById("scaffale-racc");
  const opzioni = libriGenere.slice(0,6);
  // assicura che il target sia tra le opzioni
  if(!opzioni.find(l=>l.id===libroTarget.id)) opzioni[0] = libroTarget;

  opzioni.forEach(l=>{
    const div = document.createElement("div");
    div.className = "libro-mini";
    div.innerHTML = contenutoCardLibroCompatto(l);
    div.onclick = ()=>{
      if(l.id === libroTarget.id){
        stato.magazzino[l.id] -= 1;
        stato.scaffali[l.genere] = Math.max(0, stato.scaffali[l.genere]-1);
        const bonus = Math.round(l.prezzo_vendita * 1.15);
        stato.capitale += bonus;
        contatoriGiorno.incassi += bonus;
        contatoriGiorno.venduti += 1;
        registraProgressoMissione(l.genere);
        salvaStato();
        suonaVendita();
      } else {
        suonaErrore();
      }
      aggiornaHUD();
      prossimoCliente();
    };
    scaffale.appendChild(div);
  });
  document.getElementById("azioni").innerHTML = "";
}

/* ===================== SCHERMATA: CHIUSURA ===================== */
function chiusuraGiornata(){
  stato.capitale -= contatoriGiorno.spese;
  const sch = document.getElementById("schermo");
  const eventi = contatoriGiorno.eventiMissione || [];
  const missioneHtml = eventi.map(em => `
    <div class="card" style="border-color:var(--oro); background:#FFF8E4;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <div class="ritratto-npc" style="width:32px; height:32px;">${RITRATTI[em.npcId]}</div>
        <strong>${em.npc}</strong>
        <span class="genere-sub">tappa ${em.stageCompletato} completata</span>
      </div>
      ${em.dialogo ? `<p style="font-style:italic; font-size:.88rem; margin:6px 0;">${em.dialogo}</p>` : ""}
      <div style="font-size:.85rem;">Ricompensa: <strong>+${em.ricompensa}€</strong>
      ${em.ultima ? "<br><span class='genere-sub'>Per ora non ha altro da chiederti.</span>" : ""}</div>
    </div>`).join("");
  const finaleHtml = contatoriGiorno.finaleSbloccato ? `
    <div class="card" style="border:2px solid var(--corallo); background:#FFF1E8;">
      <h3 style="margin-bottom:6px;">🎉 La Festa dei Libri di Bookstonbury</h3>
      <p style="font-size:.9rem;">Il paese non è più lo stesso: i Giardini Comunali sono di nuovo in fiore, il Faro Vecchio ospita una piccola biblioteca, l'archivio della parrocchia è in ordine e ovunque, tra il porto e la piazza, qualcuno sta leggendo un libro che gli hai consigliato tu.
      Per festeggiare, tutta Bookstonbury si ritrova sul lungomare, tra bancarelle e letture ad alta voce — e al centro di tutto, come sempre, il tuo furgoncino.</p>
      <p style="font-size:.85rem; color:var(--tenue); margin-top:8px;">Il tuo viaggio da libraio ambulante continua: c'è sempre un altro libro da consigliare.</p>
    </div>` : "";
  sch.innerHTML = `
    <div class="colonna" style="flex:1; max-width:420px; margin:0 auto; height:100%; overflow-y:auto;">
      <h2>Fine giornata 🌅</h2>
      ${finaleHtml}
      <div class="card">
        <div class="riepilogo-riga"><span>Libri venduti</span><strong>${contatoriGiorno.venduti}</strong></div>
        <div class="riepilogo-riga"><span>Incassi</span><strong>+${contatoriGiorno.incassi}€</strong></div>
        <div class="riepilogo-riga"><span>Spese (parcheggio)</span><strong>−${contatoriGiorno.spese}€</strong></div>
        <div class="riepilogo-riga totale"><span>Capitale attuale</span><strong>${stato.capitale}€</strong></div>
      </div>
      ${missioneHtml}
    </div>
  `;
  document.getElementById("azioni").innerHTML = `<button class="btn corallo" onclick="schermataMercato()">Vai al mercatino →</button>`;
  aggiornaHUD();
  salvaStato();
}
function giornoSuccessivo(){
  stato.giorno += 1;
  stato.scaffali = {};
  stato.mercatoOggi = [];
  stato.meteoOggi = null;
  stato.eventoOggi = null;
  salvaStato();
  suonaGiorno();
  schermataPianificazione();
}

/* ===================== AVVIO ===================== */
schermataMenu();
</script>
