<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Motore Avventure</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--color-bg, #050505);
            color: var(--color-main, #00ff66);
            font-family: var(--font, 'Courier New', monospace);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            width: 100%; max-width: 750px; height: 95vh; max-height: 850px;
            border: 2px solid var(--color-main, #00ff66);
            background-color: #000;
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            position: relative; padding: 20px;
            filter: brightness(var(--display-brightness, 1)) hue-rotate(var(--display-hue, 0deg));
        }
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--color-main, #00ff66);
            padding-bottom: 10px; margin-bottom: 8px; font-size: 13px; font-weight: bold;
        }
        #stats-bar { font-size: 11px; color: var(--color-dim, #00aa44); margin-bottom: 10px; min-height: 14px; }
        .top-btns { display: flex; gap: 6px; }
        .btn-mini {
            padding: 4px 8px; font-size: 11px; font-weight: bold;
            border: 1px solid var(--color-main, #00ff66); background: #000; color: var(--color-main, #00ff66);
            cursor: pointer;
        }
        .btn-mini:hover { background: var(--color-main, #00ff66); color: #000; }
        .screen { display: none; flex-direction: column; height: 100%; justify-content: space-between; }
        .active-screen { display: flex; }
        #main-menu { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }
        .game-title {
            font-size: 24px; letter-spacing: 2px; color: var(--color-main, #00ff66);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); margin-bottom: 25px; line-height: 1.4;
        }
        #node-art {
            display: none;
            border: 1px solid var(--color-dim, #00aa44);
            margin-bottom: 12px;
            max-height: 200px;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        #node-art svg { max-width: 100%; max-height: 200px; }
        #text-output {
            flex-grow: 1; overflow-y: auto; line-height: 1.6; font-size: var(--story-font-size, 14px);
            white-space: pre-line; padding-right: 10px; margin-bottom: 15px;
            border-left: 2px solid #005522; padding-left: 10px;
        }
        .btn-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        button {
            background: #000; color: var(--color-main, #00ff66); border: 1px solid var(--color-main, #00ff66);
            padding: 10px 12px; font-family: inherit; font-size: 13px; cursor: pointer;
            text-align: left; transition: all 0.15s ease;
        }
        button:hover:not(:disabled) { background: var(--color-main, #00ff66); color: #000; }
        button:disabled { border-color: #004411; color: #004411; cursor: not-allowed; }
        .btn-center { text-align: center; }
        .slot-grid { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 420px; overflow-y: auto; margin-bottom: 15px; }
        .slot-btn { display: flex; justify-content: space-between; }
        #notification {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: var(--color-main, #00ff66); color: #000; padding: 5px 15px; font-weight: bold;
            display: none; box-shadow: 0 0 10px var(--color-main, #00ff66); z-index: 200;
        }
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94); border: 2px solid var(--color-main, #00ff66);
            display: none; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 100;
        }
        .modal-title {
            font-size: 16px; font-weight: bold; border-bottom: 1px solid var(--color-main, #00ff66);
            padding-bottom: 8px; margin-bottom: 12px; text-align: center;
        }
        .modal-body { flex-grow: 1; overflow-y: auto; font-size: 13px; line-height: 1.6; margin-bottom: 15px; white-space: pre-line; }
        .item-list { display: flex; flex-direction: column; gap: 6px; white-space: normal; flex-grow: 0; max-height: 40%; }
        .item-row { text-align: left; padding: 8px 10px; font-size: 13px; }
        .item-row.selected { background: var(--color-main, #00ff66); color: #000; }
        .item-detail {
            flex-grow: 1; overflow-y: auto; font-size: 13px; line-height: 1.6;
            border-top: 1px solid #005522; padding-top: 10px; margin: 10px 0;
            color: var(--color-dim, #00aa44); white-space: pre-line;
        }
        .modal-buttons { display: flex; gap: 10px; width: 100%; }
        .modal-buttons button { flex: 1; text-align: center; }
        .display-settings { max-width: 350px; margin: 20px auto 0; }
        .display-settings label { font-size: 12px; display: block; margin-bottom: 4px; color: var(--color-dim, #00aa44); }
        .display-settings input[type="range"] { width: 100%; margin-bottom: 16px; accent-color: var(--color-main, #00ff66); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="notification">SALVATO!</div>

    <div id="custom-modal" class="modal-overlay" style="justify-content: center; align-items: center;">
        <div id="modal-text" style="font-size: 15px; text-align: center; margin-bottom: 25px; line-height: 1.5;"></div>
        <div class="modal-buttons" style="max-width: 360px;">
            <button id="modal-btn-confirm" class="btn-center">SOVRASCRIVI</button>
            <button id="modal-btn-load" class="btn-center">CARICA</button>
            <button id="modal-btn-cancel" class="btn-center">ANNULLA</button>
        </div>
    </div>

    <div id="modal-inventory" class="modal-overlay">
        <div class="modal-title">INVENTARIO</div>
        <div id="inventory-list" class="modal-body item-list"></div>
        <div id="inventory-detail" class="item-detail"></div>
        <button class="btn-center modal-close">CHIUDI [X]</button>
    </div>

    <div id="modal-log" class="modal-overlay">
        <div class="modal-title">LOG SCOPERTE & REGISTRI</div>
        <div id="log-list" class="modal-body"></div>
        <button class="btn-center modal-close">CHIUDI [X]</button>
    </div>

    <div id="screen-main" class="screen active-screen">
        <div></div>
        <div id="main-menu">
            <div id="game-title" class="game-title"></div>
            <div class="btn-list" style="max-width: 320px;">
                <button id="btn-continue" class="btn-center">CONTINUA PARTITA</button>
                <button id="btn-new" class="btn-center">NUOVA AVVENTURA</button>
                <button id="btn-load" class="btn-center">CARICA PARTITA</button>
                <button id="btn-options" class="btn-center">OPZIONI</button>
            </div>
        </div>
        <div id="version-tag" style="text-align: center; font-size: 11px; color: var(--color-dim, #008833);"></div>
    </div>

    <div id="screen-game" class="screen">
        <div id="top-bar">
            <span>LOC: <span id="ui-location">---</span></span>
            <div class="top-btns">
                <button id="btn-inventory" class="btn-mini">[INV]</button>
                <button id="btn-log" class="btn-mini">[LOG]</button>
            </div>
        </div>
        <div id="stats-bar"></div>
        <div id="node-art"></div>
        <div id="text-output"></div>
        <div id="game-choices" class="btn-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px; border-top: 1px solid #005522; padding-top: 10px;">
            <button id="btn-save-menu" class="btn-center" style="flex: 1;">SALVA/CARICA</button>
            <button id="btn-main-menu" class="btn-center" style="flex: 1;">MENU PRINCIPALE</button>
        </div>
    </div>

    <div id="screen-options" class="screen">
        <div class="game-title" style="text-align: center; margin-top: 20px;">OPZIONI SISTEMA</div>
        <div class="btn-list" style="max-width: 350px; margin: 0 auto;">
            <button id="btn-music" class="btn-center">MUSICA: ATTIVATA</button>
            <button id="btn-sfx" class="btn-center">EFFETTI SONORI: ATTIVATI</button>
            <button id="btn-fullscreen" class="btn-center">FULLSCREEN: OFF</button>
            <button id="btn-text-size" class="btn-center">DIMENSIONE TESTO: PICCOLA</button>
        </div>
        <div class="display-settings">
            <label>VOLUME MUSICA</label>
            <input type="range" id="range-music-volume" min="0" max="100" value="80">
            <label>VOLUME EFFETTI SONORI</label>
            <input type="range" id="range-sfx-volume" min="0" max="100" value="80">
            <label>LUMINOSITA'</label>
            <input type="range" id="range-brightness" min="60" max="140" value="100">
            <label>TONALITA' COLORE</label>
            <input type="range" id="range-hue" min="-60" max="60" value="0">
            <button id="btn-reset-all" class="btn-center" style="display: block; margin: 12px auto 0; max-width: 260px;">RIPRISTINA IMPOSTAZIONI</button>
        </div>
        <button id="btn-options-back" class="btn-center">INDIETRO</button>
    </div>

    <div id="screen-save" class="screen">
        <div class="game-title" id="save-title" style="text-align: center; margin-top: 10px;">GESTIONE MEMORIA</div>
        <div id="slot-container" class="slot-grid"></div>
        <button id="btn-save-cancel" class="btn-center">ANNULLA</button>
    </div>
</div>

<!-- Motore, UI, tema e storia: file separati per sviluppo.
     In fase di distribuzione finale si concatenano in un unico HTML. -->
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
<script src="theme.ombra-di-sekhmet.js"></script>
<script src="story.ombra-di-sekhmet.js"></script>
<script>
    Engine.init(STORY, THEME);
</script>

</body>
</html>
