<body>
<title>Scriptor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen portrait app — HUD, pixel-art study, status strip, scrolling panel, bottom tabs. Single lamp-lit night look by choice. */
:root{
  --night:#1d1827; --panel:#262034; --card:#302843; --card-2:#3a3150; --line:#4b4063;
  --text:#eee6d8; --muted:#a99eb8; --lamp:#f2b64f; --lamp-ink:#2a1d0c; --lamp-edge:#c98f2e;
  --paper:#f2e7ce; --paper-2:#e4d3ad; --paper-edge:#b9a276; --ink:#2d2219; --ink-2:#6b5a48;
  --good:#93d18c; --bad:#e8806e;
  --f-pixel:'Pixelify Sans','Courier New',monospace;
  --f-body:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.hud{display:flex;align-items:center;gap:12px;padding-block:8px;padding-inline:16px;background:var(--night);border-bottom:2px solid var(--line);font-family:var(--f-pixel)}
.hud-id{flex:1;min-width:0}
.hud-name{font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--lamp)}
.hud-date{font-size:12px;color:var(--muted);white-space:nowrap}
.hud-stat{text-align:right;font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums;display:grid;gap:2px;justify-items:end}
.coin{display:inline-block;width:9px;height:9px;background:var(--lamp);box-shadow:inset -2px -2px 0 #b8832a;margin-right:6px}
.hud-fame{color:var(--muted);font-size:12px}
.hud-fame b{color:var(--text);font-weight:400}
.famebar{width:92px;height:3px;background:var(--card-2);position:relative}
.famebar i{position:absolute;inset:0 auto 0 0;background:var(--lamp)}
.fs{flex:none;width:32px;height:32px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;align-self:flex-start}

.scene{background:#15111d;display:flex;justify-content:center;border-bottom:2px solid var(--line)}
#scene{display:block;width:min(100%, calc(40vh * 160 / 144));aspect-ratio:160/144;max-width:100%;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer}

.status{padding-block:8px 10px;padding-inline:16px;background:var(--night);display:grid;gap:6px;border-bottom:2px solid var(--line)}
.st-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-pixel);font-size:14px}
.st-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-top>span:last-child{flex:none;color:var(--muted)}
.bar{height:8px;background:var(--card-2);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--lamp)}
.st-sub{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.panel{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.stack{display:grid;gap:10px}
.h{font-family:var(--f-pixel);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.empty{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.card{background:var(--card);border:2px solid var(--line);padding:12px;display:grid;gap:8px;min-width:0}
.card.on{border-color:var(--lamp)}
.card .title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.sw{display:inline-block;width:8px;height:12px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 2px 0 var(--aud,transparent)}
.lead{margin:0;font-size:14px;max-width:62ch}

.btn{font-family:var(--f-pixel);font-size:14px;padding:7px 12px;background:var(--card-2);color:var(--text);border:2px solid var(--line);box-shadow:0 3px 0 #120e19;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #120e19}
.btn.pri{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp-edge)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-pixel);font-size:13px;padding:6px 9px;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.chip small{color:var(--muted);font-size:11px;margin-left:4px}
.chip[aria-pressed=true] small{color:var(--lamp-ink)}
.label{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.slips{display:grid;gap:16px;padding-top:4px}
.slip{background:var(--paper);color:var(--ink);padding:14px 12px 12px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.4);display:grid;gap:6px;transform:rotate(var(--rot,0deg))}
.slip::before{content:'';position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;background:var(--pin,#c0473a);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.slip .kind{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.slip .name{font-weight:600;font-size:16px;line-height:1.25}
.slip .meta{color:var(--ink-2)}
.slip .btn{background:var(--paper-2);color:var(--ink);border-color:var(--paper-edge);box-shadow:0 3px 0 #a58f64}
.slip .btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 3px 0 #000}
.slip.dim{opacity:.72}
.slip .stamp{font-family:var(--f-pixel);font-size:13px;color:#8a3a2a}
.stars{color:var(--lamp);letter-spacing:1px;font-size:13px}
.slip .stars{color:#a7741c}
.theme{background:var(--card);border:2px dashed var(--line);padding:10px 12px;display:grid;gap:2px}
.theme b{font-family:var(--f-pixel);font-weight:600;font-size:16px}

.book{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:2px solid var(--line);width:100%;text-align:left;cursor:pointer;min-width:0}
.book>div{min-width:0}
.spine{width:12px;height:36px;flex:none;border-top:4px solid}
.book .title{font-weight:600;overflow-wrap:anywhere}

.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hr{font-family:var(--f-pixel);font-size:14px;padding:8px 0;border:2px solid var(--line);background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.hr[aria-pressed=true]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){text-align:right}
.log{display:grid;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.log time{color:var(--muted);font-family:var(--f-pixel);font-size:12px;white-space:nowrap}
textarea{width:100%;min-height:72px;background:var(--night);color:var(--text);border:2px solid var(--line);font:12px/1.4 'Courier New',monospace;padding:8px;resize:vertical}
input[type=text]{width:100%;background:var(--night);color:var(--text);border:2px solid var(--line);font:inherit;padding:9px 10px}
details>summary{cursor:pointer;font-family:var(--f-pixel);font-size:15px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--night);border-top:2px solid var(--line)}
.tab{font-family:var(--f-pixel);font-size:13px;color:var(--muted);background:none;border:0;padding:13px 2px;position:relative;cursor:pointer}
.tab[aria-selected=true]{color:var(--lamp);box-shadow:inset 0 3px 0 var(--lamp)}
.badge{position:absolute;top:4px;right:6px;background:var(--bad);color:#1d1827;font-size:11px;min-width:16px;height:16px;line-height:16px;padding:0 3px}

.modal{position:fixed;inset:0;background:rgba(12,9,18,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
.sheet{background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 #0c0912;width:100%;max-width:520px;max-height:88%;overflow:auto;padding:18px 16px;display:grid;gap:14px}
.sheet .big{font-family:var(--f-pixel);font-size:34px;line-height:1;color:var(--lamp);margin:0}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-family:var(--f-pixel);font-size:14px;padding:9px 13px;box-shadow:0 3px 0 rgba(0,0,0,.45);width:max-content;max-width:calc(100vw - 32px);z-index:20;text-align:center}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}.slip{transform:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="hud-id"><div class="hud-name" id="hName">Scriptor</div><div class="hud-date" id="hDate"></div></div>
    <div class="hud-stat">
      <div><span class="coin" aria-hidden="true"></span><span id="hCoins">0</span></div>
      <div class="hud-fame">Notorietà <b id="hFame">0</b> · <span id="hLvl"></span></div>
      <div class="famebar" aria-hidden="true"><i id="hFameBar"></i></div>
    </div>
    <button class="fs" data-act="fs" aria-label="Schermo intero"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </header>
  <div class="scene"><canvas id="scene" width="160" height="144" aria-label="Lo scrivano alla sua scrivania"></canvas></div>

  </div>
  <main class="panel" id="panel"></main>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-v="desk">Scrivania</button>

    <button class="tab" role="tab" data-act="tab" data-v="shop">Negozio</button>

  </nav>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{'use strict';
const KEY='scriptor-v1';
const FORMATS=[['Racconto breve',500,1],['Racconto',3000,1],['Romanzo breve',10000,1],['Romanzo',25000,1],['Grande romanzo',80000,1],['Dilogia',50000,2],['Trilogia',75000,3],['Quadrilogia',100000,4],['Pentalogia',125000,5]].map(([n,w,s])=>({n,w,s}));
const BASE=[10,50,150,400,1300,1000,1600,2300,3100];
const FAME_EVT=[3,5,8,12,20,18,26,34,42];
const QM=[0,0.6,0.8,1,1.3,1.7];
const GENRES=[['Fantasy','#6f9a3c'],['Fantascienza','#3f86b8'],['Weird','#9154a8'],['Horror','#a8322e'],['Thriller','#77808f'],['Giallo','#d6ad2c'],['Storico','#96703c'],['Avventura','#d0712c'],['Dramma','#5566bb'],['Sentimentale','#d86d93'],['Umoristico','#4fb3a0'],['Fiaba','#c7a2e6']].map(([n,c])=>({n,c}));
const AUD=[['Ragazzi','#a6e07f'],['Young Adult','#7fc8f0'],['Adulti','#f2e7ce']].map(([n,c])=>({n,c}));
const LEVELS=[
  {n:'Sconosciuto',f:0,offers:4,vis:0,mult:1,maxF:3},
  {n:'Emergente',f:100,offers:5,vis:1,mult:1.15,maxF:5},
  {n:'Promettente',f:400,offers:6,vis:2,mult:1.35,maxF:6},

  {n:'Leggenda',f:10000,offers:9,vis:8,mult:2.5,maxF:8}];
const LINES={
  tool:{n:'Strumento',tiers:[['Matita',0,0],["Penna d'oca",3,30],['Stilografica',6,150],['Macchina da scrivere',10,600],['Macchina elettrica',14,2000],['Computer vintage',18,6000]]},
  lamp:{n:'Lampada',tiers:[['Candela',0,0],['Lampada a olio',2,80],['Lampada da biblioteca',4,400]]},
  win:{n:'Finestra',tiers:[['Muro spoglio',0,0],['Tetti di città',2,200],['Colline',4,800],['Mare',6,2500]]},

  drawer:{n:'Cassetto',tiers:[['3 manoscritti',0,0],['5 manoscritti',0,250],['8 manoscritti',0,1200]]}};
const EXTRAS={cat:['Gatto',2,500,'Dorme sulla scrivania'],plant:['Pianta',1,100,'Cresce accanto alla scrivania'],radio:['Radio',2,350,'Musica dalla cima della libreria']};
const PUB=['Edizioni del Calamaio','Rivista Il Segnalibro','Casa editrice Lanterna','Edizioni Sottobosco','Mondo di Carta','Edizioni Aurora','Collana Notti Brevi','Editrice Il Faro','Edizioni Quaderno Blu','Rivista Inchiostro'];
const CON=["Premio Penna d'Argento",'Concorso Racconti in Soffitta','Premio Città di Carta','Concorso La Pagina Bianca','Premio Stile Libero','Concorso Parole al Vento'];
const EVT=['Festival del Libro di Borgo','Presentazione in libreria','Lettura pubblica in biblioteca',"Fiera dell'editoria",'Salotto letterario','Serata autori al caffè','Incontro con i lettori'];
const TT=[
 [['La spada','Il drago','La torre','Il regno','La corona','Il sigillo','La profezia','Il bosco'],['di cenere','delle nebbie','del nord','di vetro','dei sette venti',"d'argento",'del re caduto','senza nome']],
 [['Il segnale','La colonia',"L'orbita",'Il pianeta','La nave',"L'ultimo androide",'Il protocollo','La stazione'],['di Kepler','oltre Orione','del silenzio','zero','del vuoto','di ferro','nel buio','di Titano']],
 [['La casa','Il museo','La scala','Il vicolo',"L'orologio",'La stanza','Il pozzo','La mappa'],['che respira','delle cose storte','al contrario','senza ombre','di carne e ottone',"che non c'era",'delle ore sbagliate','sotto il lago']],
 [['La notte','Il morso','La cripta','Il sussurro','La bambola','La veglia','Il sangue','Il pozzo'],['di Ravenmoor','dei morti','nel buio','del lupo','senza fine','sotto la neve','di mezzanotte','in cantina']],
 [['Il codice','La fuga','Il testimone','La trappola','Il dossier',"L'ultimo respiro",'Il bersaglio','La talpa'],['a Berlino','di mezzanotte','in 48 ore','dal ventesimo piano','senza ritorno','del ministro','a sangue freddo','al confine']],
 [['Il delitto','La morte','Il mistero',"L'enigma",'Il caso',"L'omicidio",'La lettera','Il cadavere'],['del maggiordomo','in biblioteca','della villa','del treno notturno','di Lady Ashford','al faro','del giardiniere','a porte chiuse']],
 [['La figlia','Il mercante','La corte',"L'assedio",'Il cronista','La regina','Il cavaliere','La lunga estate'],['di Venezia','dei Medici','di Bisanzio','del 1348','di Cartagine','sul Danubio','di Roma','della peste']],
 [["L'isola",'Il tesoro','La rotta','La giungla','Il galeone','La carta nautica','Il ghiacciaio','Il deserto'],['dei pirati','di Capitan Morgan','del sud','dei re','di smeraldo','senza ritorno','delle tempeste','in fondo al mare']],
 [['La casa','Le stagioni','Il silenzio','Le lettere','Il ritorno','La famiglia','Il giardino',"L'inverno"],['di mio padre','che restano','di Clara','al paese','dopo la pioggia','dei Moretti','sul lago','di via Roma']],
 [['Un bacio','Il cuore','Una promessa',"L'estate",'Una lettera','Il valzer','Un ballo','La rosa'],['a Parigi','in riva al mare','di maggio','per sempre','sotto la pioggia','a Positano','in ritardo',"d'inverno"]],
 [['Il gatto','Lo zio','La suocera','Il condominio','Il sindaco','La gita','Il matrimonio','Il pranzo'],['che sapeva troppo','in pigiama','di Ferragosto','del signor Bruni','sul pianerottolo','di troppo','a sorpresa','da incubo']],
 [['La volpe','Il principe','La luna','Il piccolo orso','La strega','Il folletto','La principessa','Il vento'],['e la lanterna','dei desideri','di zucchero','del bosco incantato','che non dormiva','nel cassetto','di stoffa','delle stelle']]];

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('it-IT');
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=q=>'★'.repeat(q)+'☆'.repeat(5-q);
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const pick=(r,a)=>a[Math.floor(r()*a.length)];

/* ---------- time ---------- */
let S=null;
const gnow=()=>Date.now()+(S?S.offset:0);
function mondayOf(t){const d=new Date(t);const dow=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow).getTime();}
function addDays(t,n){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime();}
function key(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dateStr(t){return new Date(t).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});}
function untilStr(ms){if(ms<=0)return 'ora';const h=ms/3600e3;if(h<1)return Math.max(1,Math.round(ms/60e3))+' min';if(h<48)return Math.round(h)+' h';return Math.round(h/24)+' g';}
const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

/* ---------- state ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1&&o.name)return o;}}catch(e){}return null;}
function save(){if(!S)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function newState(name,pref,hours){const t=Date.now();return {v:1,name,pref,hours,seed:Math.random().toString(36).slice(2,10),offset:0,speed:1,clock:t,acc:0,coins:20,fame:0,
  up:{tool:0,lamp:0,win:0,seat:0,drawer:0},ex:{cat:false,plant:false,radio:false},shelves:1,
  ms:[],active:null,books:[],offers:[],gen:{},aff:{},trophies:[],log:[],seq:0,coffeeUntil:0,coffeeReady:0,
  stats:{words:0,books:0,sold:0,events:0,wins:0,freeSold:0},nextId:1,lastSeen:t,started:t};}
const uid=()=>'x'+(S.nextId++);
function lvl(){let i=0;LEVELS.forEach((L,k)=>{if(S.fame>=L.f)i=k;});return i;}
const drawerCap=()=>[3,5,8][S.up.drawer];
const usedSlots=()=>S.books.reduce((a,b)=>a+b.s,0);
const capSlots=()=>S.shelves*6;
const workHours=()=>S.hours.filter(Boolean).length;
function themeOf(t){const d=new Date(t);return Math.floor(rng(hash(S.seed+'|m|'+d.getFullYear()+'-'+d.getMonth()))()*12);}
function log(m){S.seq++;S.log.push({n:S.seq,t:S.clock,m});if(S.log.length>80)S.log.shift();if(live)toast(m);}
function addFame(n){const a=lvl();S.fame+=n;const b=lvl();if(b>a){log('Nuovo livello di notorietà: '+LEVELS[b].n+'!');ensureOffers(S.clock);}}

function noWrite(g,t,noCoffee){let p=90;if(g===S.pref)p-=10;p-=Math.min(15,Math.floor((S.aff[g]||0)/5000));
  for(const k of ['tool','lamp','win','seat'])p-=LINES[k].tiers[S.up[k]][1];
  for(const k in EXTRAS)if(S.ex[k])p-=EXTRAS[k][1];
  if(!noCoffee&&t<S.coffeeUntil)p-=10;return Math.max(20,p);}
function genTitle(g){const r=Math.random;return pick(r,TT[g][0])+' '+pick(r,TT[g][1]);}
function newMs(g,f,a){return {id:uid(),kind:'new',title:genTitle(g),g,f,a,w:0,t:FORMATS[f].w,done:false,q:0};}
const activeMs=()=>S.ms.find(m=>m.id===S.active&&!m.done);

/* ---------- simulation ---------- */
let live=false;
const fx={lastWord:0,parts:[],notes:[],hx:44,hy:92};
function advance(to){
  let guard=0;
  while(S.clock<to&&guard++<100000){
    const d=new Date(S.clock);
    const nh=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+1).getTime();
    const seg=Math.min(to,nh);
    const m=activeMs();
    if(S.hours[d.getHours()]&&m)writeSec(m,(seg-S.clock)/1000,S.clock);
    S.clock=seg;
    if(seg===nh)weekly(seg);
  }
  weekly(S.clock);
}
function writeSec(m,sec,t){
  S.acc+=sec;const n=Math.floor(S.acc);if(!n)return;S.acc-=n;
  const p=noWrite(m.g,t)/100;let w=0;
  if(n<=200){for(let i=0;i<n;i++)if(Math.random()>=p)w++;}
  else w=Math.max(0,Math.round(n*(1-p)+gauss()*Math.sqrt(n*p*(1-p))));
  if(!w)return;
  const add=Math.min(w,m.t-m.w);
  m.w+=add;S.aff[m.g]=(S.aff[m.g]||0)+add;S.stats.words+=add;
  if(live&&sec<5){fx.lastWord=performance.now();for(let i=0;i<Math.min(add,3);i++)fx.parts.push({x:fx.hx+2+Math.random()*3,y:fx.hy-2,life:1});}
  if(m.w>=m.t)finish(m);
}
function finish(m){
  if(m.kind==='rev'){
    const b=S.books.find(x=>x.id===m.bookId);
    if(b){b.q=Math.min(5,b.q+1);b.lock=null;log('Revisione finita: «'+b.title+'» ora vale '+b.q+(b.q===1?' stella':' stelle'));}
    S.ms.splice(S.ms.indexOf(m),1);
  }else{
    const aff=Math.floor((S.aff[m.g]||0)/5000);
    m.q=Math.min(5,1+Math.floor(Math.random()*3)+(aff>=5?1:0)+(aff>=12?1:0));
    m.done=true;S.stats.books++;
    log('Hai finito «'+m.title+'» ('+FORMATS[m.f].n+', '+m.q+(m.q===1?' stella)':' stelle)'));
  }
  if(S.active===m.id){S.active=null;const nx=S.ms.find(x=>!x.done);if(nx)S.active=nx.id;}
  placeReady();
}
function placeReady(){
  for(const m of S.ms.slice()){
    if(!m.done||m.kind==='rev')continue;
    if(capSlots()-usedSlots()<FORMATS[m.f].s)continue;
    S.books.push({id:m.id,title:m.title,g:m.g,f:m.f,a:m.a,q:m.q,s:FORMATS[m.f].s,lock:null});
    S.ms.splice(S.ms.indexOf(m),1);
  }
}
function weekly(t){resolveDeadlines(t);ensureOffers(t);}
function ensureOffers(t){
  const lv=lvl(),mon=mondayOf(t);
  for(let i=0;i<=LEVELS[lv].vis;i++){const m=addDays(mon,7*i),k=key(m);if(!S.gen[k]){S.gen[k]=1;genWeek(m,lv);}}
}
function pickF(r,max){const W=[5,5,4,3,2,1.5,1.2,1,1];let tot=0;for(let i=0;i<=max;i++)tot+=W[i];let x=r()*tot;for(let i=0;i<=max;i++){x-=W[i];if(x<=0)return i;}return max;}
function genWeek(mon,lv){
  const k=key(mon),r=rng(hash(S.seed+'|w|'+k)),L=LEVELS[lv],th=themeOf(addDays(mon,3));
  const nEvt=Math.max(1,Math.round(L.offers*0.3)),nReq=L.offers-1-nEvt,types=[];
  for(let i=0;i<nReq;i++)types.push('req');types.push('con');for(let i=0;i<nEvt;i++)types.push('evt');
  let day1=0;for(let d=0;d<7;d++){const x=addDays(mon,d);if(new Date(x).getDate()===1)day1=x;}
  if(day1)types.push('mon');
  types.forEach((ty,i)=>{
    const isMon=ty==='mon',type=isMon?'con':ty,mt=isMon?themeOf(day1):th;
    const g=(isMon||r()<0.35)?mt:Math.floor(r()*12);
    const f=pickF(r,L.maxF),a=Math.floor(r()*3);
    const two=isMon||(f>=3?r()<0.75:r()<0.3);
    const o={id:k+'-'+i,type,g,f,a,start:mon,dl:addDays(mon,two?14:7),th:g===mt,st:'open',mon:isMon};
    if(type==='req')o.name=pick(r,PUB);else if(type==='evt')o.name=pick(r,EVT);
    else{o.name=isMon?'Premio del mese · '+GENRES[g].n:pick(r,CON);o.lv=Math.min(5,1+Math.floor(r()*2)+Math.floor(lv/2)+(isMon?1:0));}
    S.offers.push(o);
  });
}
function resolveDeadlines(t){
  for(const o of S.offers.slice()){
    if(o.dl>t)continue;
    if(o.type==='con'&&o.st==='sub')resolveContest(o);
    S.offers.splice(S.offers.indexOf(o),1);
  }
}
function resolveContest(o){
  const b=S.books.find(x=>x.id===o.bookId);if(!b)return;
  const r=rng(hash(S.seed+o.id+'|res')),score=b.q+r()*2.5;let place=0;
  if(score>=o.lv+1.8)place=1;else if(score>=o.lv+1)place=2;else if(score>=o.lv+0.4)place=3;
  let fame=Math.round(FAME_EVT[o.f]*0.5),coins=0;
  if(place){
    coins=Math.round(BASE[o.f]*LEVELS[lvl()].mult*[0,1.5,0.8,0.4][place]*(o.mon?3:1));
    fame+=[0,FAME_EVT[o.f]*2,FAME_EVT[o.f],Math.round(FAME_EVT[o.f]*0.5)][place];
    S.trophies.push({n:o.name,p:place,t:o.dl,title:b.title});
    if(place===1)S.stats.wins++;
  }
  S.coins+=coins;
  if(place===1){S.books.splice(S.books.indexOf(b),1);log('«'+b.title+'» vince il '+o.name+' e viene pubblicato: +'+fmt(coins)+' monete, +'+fame+' notorietà');}
  else{b.lock=null;log(place?'«'+b.title+'» arriva '+['','','secondo','terzo'][place]+' al '+o.name+': +'+fmt(coins)+' monete, +'+fame+' notorietà':'«'+b.title+'» non va sul podio al '+o.name+': +'+fame+' notorietà per la partecipazione');}
  addFame(fame);placeReady();
}

/* ---------- player actions ---------- */
const isOpen=(o,t)=>o.start<=t&&o.dl>t;
const eligible=(o,b)=>o.g===b.g&&o.f===b.f&&o.a===b.a&&!b.lock;
const reqPay=(o,b)=>Math.round(BASE[o.f]*QM[b.q]*LEVELS[lvl()].mult*(o.th?1.25:1));
const evtFame=(o,b)=>Math.round(FAME_EVT[o.f]*(0.6+0.2*b.q));
const sellPrice=b=>Math.max(1,Math.round(BASE[b.f]*QM[b.q]*0.4));
function deliver(oid,bid){
  const o=S.offers.find(x=>x.id===oid),b=S.books.find(x=>x.id===bid);
  if(!o||!b||o.st!=='open'||!isOpen(o,gnow())||!eligible(o,b))return;
  if(o.type==='req'){const c=reqPay(o,b);S.coins+=c;S.books.splice(S.books.indexOf(b),1);o.st='done';o.bookTitle=b.title;S.stats.sold++;log('Hai venduto «'+b.title+'» a '+o.name+': +'+fmt(c)+' monete');}
  else if(o.type==='evt'){const fm=evtFame(o,b);o.st='done';o.bookTitle=b.title;S.stats.events++;log('«'+b.title+'» presentato a '+o.name+': +'+fm+' notorietà');addFame(fm);}
  else{o.st='sub';o.bookId=b.id;o.bookTitle=b.title;b.lock='concorso';log('«'+b.title+'» è in gara al '+o.name+'. Esito '+dateStr(o.dl-1));}
  placeReady();save();closeModal();renderPanel();hud();
}
function createProject(g,f,a){
  if(S.ms.length>=drawerCap()){toast('Il cassetto è pieno: finisci o abbandona un manoscritto');return false;}
  const m=newMs(g,f,a);S.ms.push(m);S.active=m.id;toast('Nuovo progetto: «'+m.title+'»');save();return true;
}
function drinkCoffee(){
  const t=gnow();
  if(t<S.coffeeUntil){toast('Il caffè fa ancora effetto per '+untilStr(S.coffeeUntil-t));return;}
  if(t<S.coffeeReady){toast('Il prossimo caffè sarà pronto tra '+untilStr(S.coffeeReady-t));return;}
  S.coffeeUntil=t+30*60e3;S.coffeeReady=t+4*3600e3;toast('Caffè! Per 30 minuti scrive più veloce');save();hud();
}

/* ---------- UI ---------- */
let tab='desk',showNew=false,nf={g:0,f:0,a:2},modalKind=null,setup=null,sellArmed=null,resetArmed=false,abandonId=null,tickN=0;
let toastT=0;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3400);}
function openModal(html,kind){const md=$('#modal');md.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';md.hidden=false;modalKind=kind||'x';}
function closeModal(){const md=$('#modal');md.hidden=true;md.innerHTML='';modalKind=null;sellArmed=null;}
function wState(){
  const d=new Date(gnow());
  if(!S.hours[d.getHours()])return 'sleep';
  if(!activeMs())return 'idle';
  return performance.now()-fx.lastWord<1100?'write':'think';
}
function nextWork(){const h=new Date(gnow()).getHours();for(let i=1;i<=24;i++){const x=(h+i)%24;if(S.hours[x])return pad(x)+':00';}return '—';}
function hud(){
  const t=gnow(),d=new Date(t),L=lvl(),nx=LEVELS[L+1];
  $('#hName').textContent=S.name;
  $('#hDate').textContent=dateStr(t)+' · '+pad(d.getHours())+':'+pad(d.getMinutes())+(S.speed>1?' · test ×'+S.speed:'');
  $('#hCoins').textContent=fmt(S.coins);
  $('#hFame').textContent=fmt(S.fame);
  $('#hLvl').textContent=LEVELS[L].n;
  $('#hFameBar').style.width=(nx?Math.min(100,(S.fame-LEVELS[L].f)/(nx.f-LEVELS[L].f)*100):100)+'%';
  const m=activeMs(),st=wState();
  let txt;
  if(st==='sleep')txt='Dorme · riprende alle '+nextWork();
  else if(!m)txt='Nessun manoscritto attivo';
  else txt=(st==='write'?'Scrive ':'Pensa a ')+'«'+m.title+'»';
  $('#sText').textContent=txt;
  if(m){
    const p=noWrite(m.g,t);
    $('#sBar').style.width=(m.w/m.t*100)+'%';
    const s=FORMATS[m.f].s;
    $('#sWords').textContent=fmt(m.w)+' / '+fmt(m.t)+' parole'+(m.kind!=='rev'&&s>1?' · vol. '+Math.min(s,Math.floor(m.w/25000)+1)+'/'+s:'');
    $('#sPct').textContent='non scrittura '+p+'%';
    $('#sRate').textContent='~'+fmt(3600*(1-p/100))+' parole/ora'+(t<S.coffeeUntil?' · caffè':'');
  }else{
    $('#sBar').style.width='0%';$('#sWords').textContent='Apri un progetto dalla Scrivania';$('#sPct').textContent='';$('#sRate').textContent='';
  }
  const n=S.offers.filter(o=>o.st==='open'&&isOpen(o,t)&&S.books.some(b=>eligible(o,b))).length;
  const bd=$('#bBadge');bd.hidden=!n;bd.textContent=n;
}
function sw(g,a){return '<span class="sw" style="background:'+GENRES[g].c+(a!=null?';--aud:'+AUD[a].c:'')+'"></span>';}
function specs(x){return sw(x.g,x.a)+GENRES[x.g].n+' · '+FORMATS[x.f].n+' · '+AUD[x.a].n;}
function est(g,words){
  const p=noWrite(g,0,true)/100,perH=3600*(1-p),nh=workHours();
  if(!nh)return 'nessuna ora di lavoro impostata';
  const h=words/perH;
  if(h<nh)return 'circa '+Math.max(1,Math.round(h))+' ore di lavoro';
  return 'circa '+Math.max(1,Math.round(h/nh))+' giorni di lavoro';
}

function slip(o,t,i){
  const pins={req:'#c0473a',con:'#d1a12a',evt:'#3f7fb8'};
  const kind=o.mon?'Concorso mensile':{req:'Richiesta editoriale',con:'Concorso',evt:'Evento'}[o.type];
  const L=LEVELS[lvl()];let reward;
  if(o.type==='req'){const lo=Math.round(BASE[o.f]*QM[1]*L.mult*(o.th?1.25:1)),hi=Math.round(BASE[o.f]*QM[5]*L.mult*(o.th?1.25:1));reward='Compenso: '+fmt(lo)+'–'+fmt(hi)+' monete secondo la qualità'+(o.th?' (tema del mese)':'');}
  else if(o.type==='evt')reward='Notorietà: +'+Math.round(FAME_EVT[o.f]*0.8)+' / +'+Math.round(FAME_EVT[o.f]*1.6)+' secondo la qualità. Il libro resta tuo.';
  else reward='Livello <span class="stars">'+stars(o.lv)+'</span> · primo premio '+fmt(Math.round(BASE[o.f]*L.mult*1.5*(o.mon?3:1)))+' monete · +'+Math.round(FAME_EVT[o.f]*0.5)+' notorietà solo per partecipare';
  const open=isOpen(o,t);
  const when=open?'Scade '+dateStr(o.dl-1)+' (tra '+untilStr(o.dl-t)+')':'Apre '+dateStr(o.start)+' · scade '+dateStr(o.dl-1);
  let h='<article class="slip'+(o.st!=='open'?' dim':'')+'" style="--pin:'+pins[o.type]+';--rot:'+(i%2?'.5deg':'-.6deg')+'">'+
    '<div class="kind">'+kind+'</div><div class="name">'+esc(o.name)+'</div><div class="meta">'+specs(o)+'</div><div class="meta">'+reward+'</div><div class="meta">'+when+'</div>';
  if(o.st==='done')h+='<div class="stamp">Consegnato: «'+esc(o.bookTitle)+'»</div>';
  else if(o.st==='sub')h+='<div class="stamp">In gara con «'+esc(o.bookTitle)+'»</div>';
  else{
    const n=S.books.filter(b=>eligible(o,b)).length;
    h+='<div class="row">'+(open?'<button class="btn pri" data-act="offer" data-v="'+o.id+'" '+(n?'':'disabled')+'>'+(n?'Consegna ('+n+' pronti)':'Nessun libro adatto')+'</button>':'')+
      '<button class="btn" data-act="offer-write" data-v="'+o.id+'">Scrivi per questa</button></div>';
  }
  return h+'</article>';
}

  if(a==='su-back'){setup.step=1;return setupModal();}
  if(a==='su-h'){const i=+v,n=setup.hours.filter(Boolean).length;if(!setup.hours[i]&&n>=10){toast('Hai già 10 ore: togline una prima');return;}setup.hours[i]=!setup.hours[i];return setupModal();}

    case 'ms-pause':S.active=null;save();renderPanel();hud();break;

    case 'ms-drop-yes':{const m=S.ms.find(x=>x.id===abandonId);if(m){if(m.kind==='rev'){const b=S.books.find(x=>x.id===m.bookId);if(b)b.lock=null;}S.ms.splice(S.ms.indexOf(m),1);if(S.active===m.id)S.active=null;log('Hai abbandonato «'+m.title+'»');}closeModal();save();renderPanel();hud();break;}
    case 'coffee':drinkCoffee();renderPanel();break;

      openModal('<div class="row between"><span class="label">Consegna</span><button class="btn" data-act="close">Chiudi</button></div><h2 class="h">'+esc(o.name)+'</h2><div class="meta">'+specs(o)+'</div>'+
        bs.map(b=>'<div class="card"><div class="title">'+esc(b.title)+'</div><div class="meta"><span class="stars">'+stars(b.q)+'</span> · '+(o.type==='req'?fmt(reqPay(o,b))+' monete, il libro esce dalla libreria':o.type==='evt'?'+'+evtFame(o,b)+' notorietà, il libro resta tuo':'in gara fino a '+dateStr(o.dl-1))+'</div><div class="row"><button class="btn pri" data-act="deliver" data-v="'+o.id+'|'+b.id+'">Consegna questo</button></div></div>').join(''),'offer');break;}

    case 'rev':{const b=S.books.find(x=>x.id===v);if(!b||b.lock)break;if(S.ms.length>=drawerCap()){toast('Il cassetto è pieno: serve un posto per la revisione');break;}
      const m=newMs(b.g,b.f,b.a);m.kind='rev';m.bookId=b.id;m.t=Math.ceil(FORMATS[b.f].w*0.1);m.title='Revisione di «'+b.title+'»';b.lock='revisione';S.ms.push(m);if(!activeMs())S.active=m.id;
      log('Inizia la revisione di «'+b.title+'»');save();closeModal();tab='desk';renderPanel();hud();break;}
    case 'sell':sellArmed=v;bookModal(v);break;
    case 'sell-yes':{const b=S.books.find(x=>x.id===v);if(!b||b.lock)break;const p=sellPrice(b);S.coins+=p;S.books.splice(S.books.indexOf(b),1);S.stats.freeSold=(S.stats.freeSold||0)+1;log('Vendita libera di «'+b.title+'»: +'+fmt(p)+' monete');placeReady();save();closeModal();renderPanel();hud();break;}
    case 'buy':{const L=LINES[v],nx=L.tiers[S.up[v]+1];if(!nx||S.coins<nx[2])break;S.coins-=nx[2];S.up[v]++;log('Hai comprato: '+nx[0]);placeReady();save();renderPanel();hud();break;}
    case 'buy-ex':{const x=EXTRAS[v];if(S.ex[v]||S.coins<x[2])break;S.coins-=x[2];S.ex[v]=true;log('Hai comprato: '+x[0]);save();renderPanel();hud();break;}
    case 'buy-shelf':{const p=100*2**(S.shelves-1);if(S.shelves>=8||S.coins<p)break;S.coins-=p;S.shelves++;log('Nuovo ripiano: ora hai '+capSlots()+' posti');placeReady();save();renderPanel();hud();break;}

    case 'export':{try{$('#saveBox').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));toast('Codice generato');}catch(err){toast('Non sono riuscito a generare il codice');}break;}
    case 'copy':{const box=$('#saveBox');if(!box.value){toast('Prima genera il codice');break;}const done=()=>toast('Codice copiato');
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(done,()=>{box.select();toast('Selezionato: copialo a mano');});else{box.select();toast('Selezionato: copialo a mano');}break;}
    case 'import':{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#saveBox').value.trim()))));if(!o||o.v!==1||!o.name)throw 0;S=o;live=false;advance(gnow());save();toast('Partita caricata');renderPanel();hud();}catch(err){toast('Il codice non è valido: controlla di averlo incollato tutto');}break;}
    case 'speed':S.speed=+v;save();renderPanel();hud();break;
    case 'skip':{const s=snap();S.offset+=+v;live=false;advance(gnow());save();renderPanel();hud();summary(s);break;}
    case 'cheat':S.coins+=500;save();renderPanel();hud();break;
    case 'reset':if(!resetArmed){resetArmed=true;renderPanel();}else{try{localStorage.removeItem(KEY);}catch(err){}S=null;resetArmed=false;tab='desk';showNew=false;setup={step:1,name:'',g:null,hours:Array.from({length:24},(_,i)=>i>=9&&i<19)};setupModal();}break;
  }
});
function fullscreen(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){toast('Qui il tutto schermo non è disponibile. Su iPhone: Condividi → Aggiungi alla schermata Home');return;}
  try{const p=req.call(el);if(p&&p.catch)p.catch(()=>toast('Il browser non ha concesso il tutto schermo'));}catch(err){toast('Il browser non ha concesso il tutto schermo');}
}

/* ---------- pixel scene ---------- */
const cv=$('#scene'),cx=cv.getContext('2d');
const SW=160,SH=144,FLOOR=132,DESK=98;
const C={wall:'#3b3150',dot:'#433859',wain:'#332a47',trim:'#54476f',floor:'#2c2233',plank:'#231b2a',wood:'#8a5a36',woodL:'#a8703f',woodD:'#5a3822',back:'#3a2419',
  skin:'#f1c7a0',skinD:'#d9a882',hair:'#4a2f22',sw:'#5b7fa6',swD:'#46688f',swL:'#7196bf',pants:'#3b3a52',shoe:'#221a17',paper:'#f2e7ce',brass:'#c9a24a',ink:'#2d2219'};
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function hx2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hx2rgb(a),B=hx2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function mixHex(a,b,t){const A=hx2rgb(a),B=hx2rgb(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const SKY=[[0,'#0e1230','#1f2550'],[5,'#0e1230','#1f2550'],[6.5,'#4a5a9a','#f0a070'],[8,'#6fb0e8','#bfe2f5'],[17,'#6fb0e8','#bfe2f5'],[18.8,'#5a4a8a','#f08a5a'],[20.5,'#0e1230','#1f2550'],[24,'#0e1230','#1f2550']];
function sky(h){for(let i=0;i<SKY.length-1;i++){const [a,t1,b1]=SKY[i],[b,t2,b2]=SKY[i+1];if(h>=a&&h<=b){const k=(h-a)/(b-a);return [mixHex(t1,t2,k),mixHex(b1,b2,k)];}}return [SKY[0][1],SKY[0][2]];}
function light(h){if(h<5||h>=20.5)return 0;if(h<8)return (h-5)/3;if(h<17)return 1;return 1-(h-17)/3.5;}
const DIG={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111'};
function num(s,x,y,c){for(const ch of s){const g=DIG[ch];for(let i=0;i<15;i++)if(g[i]==='1')R(x+i%3,y+(i/3|0),1,1,c);x+=4;}}
const STARS=[[3,4],[9,2],[15,7],[22,3],[28,6],[33,2],[6,10],[19,12],[31,11]];

let lastReal=Date.now(),hidden=null;
function tick(){
  if(!S)return;
  const r=Date.now(),dt=r-lastReal;lastReal=r;
  if(S.speed>1)S.offset+=dt*(S.speed-1);
  live=dt<5000;advance(gnow());live=false;
  hud();tickN++;
  if(!modalKind&&(tab==='desk'||tickN%20===0))renderPanel();
  if(modalKind&&modalKind.startsWith('book:')&&tickN%20===0&&document.activeElement.id!=='rename')bookModal(modalKind.slice(5));
  if(tickN%5===0){S.lastSeen=gnow();save();}
}

  if(!S)return;
  if(document.hidden){hidden=snap();S.lastSeen=gnow();save();}
  else{lastReal=Date.now();live=false;advance(gnow());hud();renderPanel();if(hidden)summary(hidden);hidden=null;}
});
