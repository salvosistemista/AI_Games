<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar System Simulator - Rescaled System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000002;
            color: #ffffff;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Menu Principale / Pausa */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(2, 4, 10, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #main-menu h1 {
            font-size: 2.2rem;
            color: #00f0ff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            margin-bottom: 15px;
            text-align: center;
        }

        .menu-btn {
            width: 280px;
            padding: 14px 24px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            text-align: center;
        }

        .menu-btn:hover, .menu-btn:active {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: scale(1.03);
        }

        .menu-btn:disabled {
            border-color: #444;
            color: #666;
            background: rgba(255, 255, 255, 0.03);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(5, 8, 15, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            padding: 12px 18px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            pointer-events: none;
            max-width: 320px;
        }

        .hud-row {
            font-size: 0.75rem;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: #8ab4f8;
            text-transform: uppercase;
        }

        .hud-val {
            font-weight: bold;
            color: #00f0ff;
            font-size: 0.88rem;
        }

        .hud-divider {
            height: 1px;
            background: rgba(0, 240, 255, 0.3);
            margin: 6px 0;
        }

        /* BARRA VERTICALE DEL CARBURANTE */
        #fuel-container {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(5, 8, 15, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            padding: 10px 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            pointer-events: none;
        }

        .fuel-title {
            font-size: 0.6rem;
            color: #8ab4f8;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        #fuel-bar-bg {
            width: 18px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        #fuel-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #ff0055, #00f0ff);
            border-radius: 6px;
            transition: height 0.1s linear, background 0.2s ease;
        }

        #fuel-val-text {
            font-size: 0.65rem;
            font-weight: bold;
            color: #00f0ff;
            margin-top: 6px;
        }

        /* Pulsante Menu Mobile */
        #menu-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            padding: 10px 16px;
            background: rgba(5, 8, 15, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* PULSANTE MAPPA CENTRO-DESTRA PER MOBILE */
        #map-toggle-btn {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            z-index: 12;
            padding: 12px 14px;
            background: rgba(5, 8, 15, 0.88);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        #map-toggle-btn:active {
            background: rgba(0, 240, 255, 0.3);
            transform: translateY(-50%) scale(0.95);
        }

        /* SOVRAIMPRESSIONE MAPPA TATTIKA 2D */
        #map-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 90;
            background: rgba(2, 4, 10, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #map-header {
            position: absolute;
            top: 15px;
            font-size: 1.1rem;
            color: #00f0ff;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f0ff;
            text-align: center;
        }

        #map-canvas {
            background: radial-gradient(circle, rgba(0,20,40,0.6) 0%, rgba(0,2,8,0.95) 100%);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            cursor: crosshair;
            touch-action: none;
        }

        #map-close-btn {
            position: absolute;
            bottom: 20px;
            padding: 10px 24px;
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Etichette Nomi Pianeti/Satelliti */
        #labels-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .celestial-label {
            position: absolute;
            transform: translate(-50%, -100%);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #00f0ff;
            background: rgba(0, 10, 25, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            display: none;
            text-shadow: 0 0 4px #00f0ff;
        }

        /* Controlli Touch Overlay */
        #touch-controls {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-zone {
            pointer-events: auto;
        }

        #joystick-base {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 50%;
        }

        #joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: radial-gradient(circle, #00f0ff, #0077ff);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #00f0ff;
            pointer-events: none;
        }

        #throttle-container {
            position: absolute;
            bottom: 30px; right: 30px;
            width: 70px; height: 180px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        #throttle-knob {
            position: absolute;
            top: 130px;
            width: 50px; height: 50px;
            background: radial-gradient(circle, #ff0055, #990033);
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0055;
            cursor: pointer;
            pointer-events: none;
        }

        #warp-btn {
            position: absolute;
            bottom: 220px; right: 30px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #7928ca, #ff0080);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 0, 128, 0.5);
            cursor: pointer;
        }

        /* PULSANTI D-PAD MOBILE */
        .target-nav-btn {
            position: absolute;
            bottom: 30px;
            width: 50px; height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            border-radius: 12px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        #prev-target-btn { left: 170px; }
        #next-target-btn { left: 230px; }

        /* MARKER TARGET NORMALE */
        #target-marker {
            position: absolute;
            width: 28px; height: 28px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 6;
            display: none;
        }

        #target-marker::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: #ff0055;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* MARKER TARGET MISSIONE (GIALLO ORO) */
        #mission-marker {
            position: absolute;
            width: 36px; height: 36px;
            border: 2px dashed #ffcc00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 7;
            display: none;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
            animation: pulse-mission 1.5s infinite alternate;
        }

        #mission-marker::after {
            content: '★';
            position: absolute;
            top: 50%; left: 50%;
            font-size: 12px;
            color: #ffcc00;
            transform: translate(-50%, -55%);
            font-weight: bold;
        }

        @keyframes pulse-mission {
            0% { transform: translate(-50%, -50%) scale(0.9); border-color: #ffcc00; }
            100% { transform: translate(-50%, -50%) scale(1.15); border-color: #ffe600; }
        }

        /* NOTIFICA BANNER MISSIONE */
        #mission-banner {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(255, 204, 0, 0.2);
            border: 1px solid #ffcc00;
            border-radius: 20px;
            padding: 8px 20px;
            color: #ffe600;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            display: none;
            pointer-events: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="labels-container"></div>

    <div id="mission-banner">NUOVA MISSIONE ASSEGNATA</div>

    <div id="main-menu">
        <h1>SOLAR SYSTEM SIMULATOR</h1>
        <button id="btn-continue" class="menu-btn">CONTINUA PARTITA</button>
        <button id="btn-newgame" class="menu-btn">NUOVA PARTITA</button>
        <button id="btn-fullscreen" class="menu-btn">ATTIVA FULLSCREEN ⛶</button>
    </div>

    <div id="hud">
        <div class="hud-row">VELOCITÀ: <span id="hud-speed" class="hud-val">0</span> km/h</div>
        <div class="hud-row">MODALITÀ: <span id="hud-mode" class="hud-val" style="color:#00ff88;">SUB-LIGHT</span></div>
        <div class="hud-row">CORPO VICINO: <span id="hud-nearest" class="hud-val">MARTE</span></div>
        <div class="hud-row">TARGET SELEZIONATO: <span id="hud-target-name" class="hud-val" style="color:#ff0080;">--</span></div>
        <div class="hud-row">DISTANZA TARGET: <span id="hud-target-dist" class="hud-val">--</span> km</div>

        <div class="hud-divider"></div>

        <div class="hud-row" style="color:#ffcc00; font-weight:bold;">★ MISSIONE ATTIVA ★</div>
        <div class="hud-row">CARICO: <span id="hud-mission-cargo" class="hud-val" style="color:#fff;">--</span></div>
        <div class="hud-row">OBIETTIVO: <span id="hud-mission-target" class="hud-val" style="color:#ffcc00;">--</span></div>
        <div class="hud-row">DIST. MISSIONE: <span id="hud-mission-dist" class="hud-val" style="color:#ffcc00;">--</span> km</div>
    </div>

    <div id="fuel-container">
        <div class="fuel-title">FUEL</div>
        <div id="fuel-bar-bg">
            <div id="fuel-bar-fill"></div>
        </div>
        <div id="fuel-val-text">100%</div>
    </div>

    <button id="menu-toggle-btn">MENU (ESC)</button>

    <button id="map-toggle-btn">
        <span>MAPPA</span>
        <span style="font-size:0.6rem; color:#8ab4f8;">(M / △)</span>
    </button>

    <div id="map-modal">
        <div id="map-header">MAPPA TATTICA RADAR<br><span style="font-size:0.75rem; color:#8ab4f8;">ZOOM: ROTELLA / PINCH TO ZOOM</span></div>
        <canvas id="map-canvas"></canvas>
        <button id="map-close-btn">CHIUDI MAPPA (ESC/M)</button>
    </div>

    <div id="target-marker"></div>
    <div id="mission-marker"></div>

    <div id="touch-controls">
        <div id="joystick-base" class="interactive-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="throttle-container" class="interactive-zone">
            <div style="font-size:0.55rem; color:#00f0ff; font-weight:bold; pointer-events:none;">500k km/h</div>
            <div id="throttle-knob"></div>
            <div style="font-size:0.55rem; color:#00f0ff; font-weight:bold; pointer-events:none;">0</div>
        </div>
        <button id="warp-btn" class="interactive-zone">WARP (X)</button>
        <button id="prev-target-btn" class="target-nav-btn interactive-zone">◄</button>
        <button id="next-target-btn" class="target-nav-btn interactive-zone">►</button>
    </div>

    <script>
    (function() {
        const SCALE = 0.01; 
        const WARP_SPEED_KMH = 1000000;
        const MAX_SUB_LIGHT_KMH = 500000;

        const EARTH_ORBIT_PERIOD_SEC = 1800; 
        const EARTH_DAY_SEC = EARTH_ORBIT_PERIOD_SEC / 365.25;

        // CARBURANTE VARS
        const MAX_FUEL_KM = 500000000;
        let currentFuelKm = MAX_FUEL_KM;
        const REGEN_SPEED_LIMIT = 100000;
        const REGEN_RATE_KM_PER_SEC = 5000000;

        const SAVE_KEY = "SOLAR_SIM_SAVE_DATA";

        const REAL_EARTH_RADIUS = 6371.0;
        const NEW_EARTH_RADIUS = 500.0;
        const SIZE_SCALE = NEW_EARTH_RADIUS / REAL_EARTH_RADIUS;

        const REAL_EARTH_DIST = 149598023.0;
        const NEW_EARTH_DIST = 5870000.0;
        const DIST_SCALE = NEW_EARTH_DIST / REAL_EARTH_DIST;

        const RAW_CELESTIAL_DATA = {
            Sun:     { name: "Sole", radius: 696340, color: 0xffcc00 },
            Mercury: { name: "Mercurio", radius: 2439.7, dist: 57909050, orbitPeriod: 0.241, rotPeriod: 58.6, color: 0xa6a6a6, moons: [] },
            Venus:   { name: "Venere", radius: 6051.8, dist: 108208000, orbitPeriod: 0.615, rotPeriod: -243, color: 0xe3bb76, moons: [] },
            Earth:   { name: "Terra", radius: 6371.0, dist: 149598023, orbitPeriod: 1.0, rotPeriod: 1.0, color: 0x2b82c5,
                       moons: [{ name: "Luna", radius: 1737.4, dist: 384400, orbitPeriod: 0.0748, color: 0xcccccc }] },
            Mars:    { name: "Marte", radius: 3389.5, dist: 227939200, orbitPeriod: 1.881, rotPeriod: 1.02, color: 0xc8522d,
                       moons: [{ name: "Phobos", radius: 11.2, dist: 9376, orbitPeriod: 0.0008, color: 0x888888 },
                               { name: "Deimos", radius: 6.2, dist: 23463, orbitPeriod: 0.003, color: 0x666666 }] },
            Jupiter: { name: "Giove", radius: 69911, dist: 778570000, orbitPeriod: 11.86, rotPeriod: 0.41, color: 0xb07f35,
                       moons: [
                           { name: "Io", radius: 1821.6, dist: 421700, orbitPeriod: 0.0048, color: 0xd4ca68 },
                           { name: "Europa", radius: 1560.8, dist: 670900, orbitPeriod: 0.0097, color: 0xa8b5bd },
                           { name: "Ganimede", radius: 2634.1, dist: 1070400, orbitPeriod: 0.0196, color: 0x857d77 },
                           { name: "Callisto", radius: 2410.3, dist: 1882700, orbitPeriod: 0.0457, color: 0x4e545c }
                       ] },
            Saturn:  { name: "Saturno", radius: 58232, dist: 1433530000, orbitPeriod: 29.45, rotPeriod: 0.44, color: 0xe2bf7d, hasRings: true,
                       moons: [
                           { name: "Mimas", radius: 198.2, dist: 185520, orbitPeriod: 0.0025, color: 0xaaaaaa },
                           { name: "Encelado", radius: 252.1, dist: 238020, orbitPeriod: 0.0037, color: 0xffffff },
                           { name: "Teti", radius: 531.1, dist: 294660, orbitPeriod: 0.0052, color: 0xdddddd },
                           { name: "Dione", radius: 561.4, dist: 377400, orbitPeriod: 0.0075, color: 0xcccccc },
                           { name: "Rea", radius: 763.8, dist: 527040, orbitPeriod: 0.0123, color: 0xbbbbbb },
                           { name: "Titano", radius: 2574.7, dist: 1221870, orbitPeriod: 0.0436, color: 0xc49a45 },
                           { name: "Giapeto", radius: 734.5, dist: 3561300, orbitPeriod: 0.217, color: 0x999999 }
                       ] },
            Uranus:  { name: "Urano", radius: 25362, dist: 2870972200, orbitPeriod: 84.02, rotPeriod: -0.72, color: 0x4b70dd,
                       moons: [
                           { name: "Miranda", radius: 235.8, dist: 129390, orbitPeriod: 0.0038, color: 0xaaaaaa },
                           { name: "Ariel", radius: 578.9, dist: 191020, orbitPeriod: 0.0068, color: 0xcccccc },
                           { name: "Umbriel", radius: 584.7, dist: 266000, orbitPeriod: 0.0114, color: 0x888888 },
                           { name: "Titania", radius: 788.4, dist: 435910, orbitPeriod: 0.0238, color: 0xbbbbbb },
                           { name: "Oberon", radius: 761.4, dist: 583520, orbitPeriod: 0.0369, color: 0x999999 }
                       ] },
            Neptune: { name: "Nettuno", radius: 24622, dist: 4498252900, orbitPeriod: 164.8, rotPeriod: 0.67, color: 0x274687,
                       moons: [
                           { name: "Tritone", radius: 1353.4, dist: 354759, orbitPeriod: -0.016, color: 0xc4d4e0 }
                       ] }
        };

        const CELESTIAL_DATA = {};
        Object.keys(RAW_CELESTIAL_DATA).forEach(key => {
            const item = RAW_CELESTIAL_DATA[key];
            CELESTIAL_DATA[key] = {
                ...item,
                radius: item.radius * SIZE_SCALE,
                dist: item.dist ? item.dist * DIST_SCALE : 0
            };
            if (item.moons) {
                CELESTIAL_DATA[key].moons = item.moons.map(m => ({
                    ...m,
                    radius: m.radius * SIZE_SCALE,
                    dist: m.dist * DIST_SCALE
                }));
            }
        });

        const CARGO_TYPES = [
            "Minerali Rari", "Componenti Quantum", "Acqua Liquida", "Reattori Arc",
            "Cibo Sintetico", "Moduli Solari", "Lantanidi Puri", "Elio-3"
        ];

        let scene, camera, renderer;
        let shipGroup, shipMeshGroup, cameraRigNode;
        let solarSystemGroup = {};
        let runwayLights = [];

        let targetList = [];
        let currentTargetIndex = 0;

        let currentMission = null;
        const missionMarker = document.getElementById('mission-marker');
        const missionBanner = document.getElementById('mission-banner');
        let bannerTimeout = null;

        let spaceDust;
        const DUST_COUNT = 3000;
        const DUST_BOUNDS = 100;

        let targetSpeedKmh = 0;
        let currentSpeedKmh = 0;
        let warpActive = false;
        
        let pitchInput = 0;
        let yawInput = 0;
        let rollVisual = 0;
        let pitchVisual = 0;

        let camYawOffset = 0;
        let camPitchOffset = 0;
        let isDraggingCam = false;

        let currentCamDist = 0.002;
        const MIN_CAM_DIST = 0.0003;
        const MAX_CAM_DIST = 0.015;

        let shipPos = new THREE.Vector3();
        let shipRot = new THREE.Quaternion();

        let isMapOpen = false;
        const mapModal = document.getElementById('map-modal');
        const mapCanvas = document.getElementById('map-canvas');
        const mapCtx = mapCanvas.getContext('2d');

        let mapRangeKm = CELESTIAL_DATA.Neptune.dist * 1.25;
        const MIN_MAP_RANGE_KM = 200000;            
        const MAX_MAP_RANGE_KM = 500000000;         

        let isPaused = true;

        // GAMEPAD STATES PER DEBOUNCE
        let gamepadPrevButtons = {};

        const targetMarker = document.getElementById('target-marker');
        const labelsContainer = document.getElementById('labels-container');
        const mainMenu = document.getElementById('main-menu');
        const btnContinue = document.getElementById('btn-continue');
        const btnNewGame = document.getElementById('btn-newgame');
        const btnFullscreen = document.getElementById('btn-fullscreen');

        const fuelBarFill = document.getElementById('fuel-bar-fill');
        const fuelValText = document.getElementById('fuel-val-text');

        function init() {
            const container = document.getElementById('webgl-container');
            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.00001, 100000000);

            const ambientLight = new THREE.AmbientLight(0x333344, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffffff, 2.5, 0, 0.000001);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            createStarfield();
            createSolarSystem();
            createSpaceship();
            createSpaceDust();

            cameraRigNode = new THREE.Group();
            shipGroup.add(cameraRigNode);
            
            camera.position.set(0, 0.0003, currentCamDist);
            camera.lookAt(0, 0, -0.001);
            cameraRigNode.add(camera);

            setupControls();
            setupMenuEvents();
            setupMapEvents();

            checkSaveFileStatus();

            window.addEventListener('resize', onWindowResize);
            animate(0);
        }

        function createStarfield() {
            const count = 6000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 500000000;
                positions[i+1] = (Math.random() - 0.5) * 500000000;
                positions[i+2] = (Math.random() - 0.5) * 500000000;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 200000, sizeAttenuation: true });
            scene.add(new THREE.Points(geometry, material));
        }

        function create10KmRunway(parentGroup, bodyRadius, displayName) {
            const runwayGroup = new THREE.Group();
            const rWidth = 0.01;   
            const rLength = 0.1;  

            const runwayMesh = new THREE.Mesh(
                new THREE.BoxGeometry(rWidth, 0.001, rLength),
                new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.5 })
            );
            runwayGroup.add(runwayMesh);

            const lightGeo = new THREE.BoxGeometry(0.002, 0.002, 0.002);
            for (let i = 0; i <= 10; i++) {
                const zPos = -rLength / 2 + (i * (rLength / 10));
                
                const lL = new THREE.Mesh(lightGeo, new THREE.MeshBasicMaterial({ color: 0xff0055 }));
                lL.position.set(-rWidth / 2, 0.001, zPos);
                runwayGroup.add(lL);
                runwayLights.push(lL);

                const lR = new THREE.Mesh(lightGeo, new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
                lR.position.set(rWidth / 2, 0.001, zPos);
                runwayGroup.add(lR);
                runwayLights.push(lR);
            }

            runwayGroup.position.set(0, bodyRadius + 0.0005, 0);
            parentGroup.add(runwayGroup);

            const labelEl = document.createElement('div');
            labelEl.className = 'celestial-label';
            labelEl.innerText = displayName.toUpperCase();
            labelsContainer.appendChild(labelEl);

            return { runwayGroup: runwayGroup, labelEl: labelEl };
        }

        function createSolarSystem() {
            const sunRadiusScaled = CELESTIAL_DATA.Sun.radius * SCALE;
            const sunMesh = new THREE.Mesh(
                new THREE.SphereGeometry(sunRadiusScaled, 64, 64),
                new THREE.MeshBasicMaterial({ color: CELESTIAL_DATA.Sun.color })
            );
            scene.add(sunMesh);

            Object.keys(CELESTIAL_DATA).forEach(key => {
                if (key === 'Sun') return;
                const data = CELESTIAL_DATA[key];

                const orbitPivot = new THREE.Group();
                scene.add(orbitPivot);

                const bodyGroup = new THREE.Group();
                bodyGroup.position.set(data.dist * SCALE, 0, 0);
                orbitPivot.add(bodyGroup);

                const radiusScaled = data.radius * SCALE;
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(radiusScaled, 32, 32),
                    new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 })
                );
                bodyGroup.add(mesh);

                if (data.hasRings) {
                    const ringMesh = new THREE.Mesh(
                        new THREE.RingGeometry(radiusScaled * 1.2, radiusScaled * 2.3, 64),
                        new THREE.MeshBasicMaterial({ color: 0xc2a468, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
                    );
                    ringMesh.rotation.x = Math.PI / 2;
                    bodyGroup.add(ringMesh);
                }

                const planetRunway = create10KmRunway(bodyGroup, radiusScaled, data.name);
                targetList.push({
                    id: targetList.length,
                    name: data.name,
                    group: bodyGroup,
                    runway: planetRunway.runwayGroup,
                    labelEl: planetRunway.labelEl,
                    orbitDistKm: data.dist,
                    parentPivot: null
                });

                const moonPivots = [];
                if (data.moons) {
                    data.moons.forEach(m => {
                        const mPivot = new THREE.Group();
                        bodyGroup.add(mPivot);

                        const mRadius = m.radius * SCALE;
                        const mGroup = new THREE.Group();
                        mGroup.position.set(m.dist * SCALE, 0, 0);
                        mPivot.add(mGroup);

                        const mMesh = new THREE.Mesh(
                            new THREE.SphereGeometry(mRadius, 16, 16),
                            new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.9 })
                        );
                        mGroup.add(mMesh);

                        const moonRunway = create10KmRunway(mGroup, mRadius, `${m.name} (${data.name})`);
                        targetList.push({
                            id: targetList.length,
                            name: `${m.name} [${data.name}]`,
                            group: mGroup,
                            runway: moonRunway.runwayGroup,
                            labelEl: moonRunway.labelEl,
                            orbitDistKm: m.dist,
                            parentGroup: bodyGroup
                        });

                        moonPivots.push({ pivot: mPivot, period: m.orbitPeriod });
                    });
                }

                solarSystemGroup[key] = {
                    pivot: orbitPivot,
                    group: bodyGroup,
                    mesh: mesh,
                    data: data,
                    moons: moonPivots
                };
            });
        }

        function generateRandomMission() {
            if (targetList.length < 2) return;
            const pickupIdx = Math.floor(Math.random() * targetList.length);
            let deliveryIdx = Math.floor(Math.random() * targetList.length);
            while (deliveryIdx === pickupIdx) {
                deliveryIdx = Math.floor(Math.random() * targetList.length);
            }

            const cargoName = CARGO_TYPES[Math.floor(Math.random() * CARGO_TYPES.length)];

            currentMission = {
                pickupIndex: pickupIdx,
                deliveryIndex: deliveryIdx,
                cargoName: cargoName,
                status: 'PICKUP'
            };

            showMissionBanner(`NUOVA MISSIONE: RITIRA ${cargoName.toUpperCase()} SU ${targetList[pickupIdx].name.toUpperCase()}`);
        }

        function showMissionBanner(msg) {
            missionBanner.innerText = msg;
            missionBanner.style.display = 'block';
            if (bannerTimeout) clearTimeout(bannerTimeout);
            bannerTimeout = setTimeout(() => {
                missionBanner.style.display = 'none';
            }, 5000);
        }

        function checkMissionProgress() {
            if (!currentMission) return;

            const targetIdx = (currentMission.status === 'PICKUP') ? currentMission.pickupIndex : currentMission.deliveryIndex;
            const targetObj = targetList[targetIdx];

            const runwayPos = new THREE.Vector3();
            targetObj.runway.getWorldPosition(runwayPos);

            const distKm = shipPos.distanceTo(runwayPos) / SCALE;

            if (distKm <= 3.0) {
                if (currentMission.status === 'PICKUP') {
                    currentMission.status = 'DELIVERY';
                    showMissionBanner(`CARICO CARICATO! CONSEGNA A: ${targetList[currentMission.deliveryIndex].name.toUpperCase()}`);
                } else if (currentMission.status === 'DELIVERY') {
                    showMissionBanner(`MISSIONE COMPLETATA! CARICO CONSEGNATO SU ${targetObj.name.toUpperCase()}`);
                    generateRandomMission();
                }
            }
        }

        function cycleTarget(direction) {
            if (direction === 'next') {
                currentTargetIndex = (currentTargetIndex + 1) % targetList.length;
            } else if (direction === 'prev') {
                currentTargetIndex = (currentTargetIndex - 1 + targetList.length) % targetList.length;
            }
        }

        function toggleWarpMode() {
            warpActive = !warpActive;
            const warpBtn = document.getElementById('warp-btn');
            if (warpBtn) {
                warpBtn.style.background = warpActive ? 'linear-gradient(135deg, #00f0ff, #0077ff)' : 'linear-gradient(135deg, #7928ca, #ff0080)';
            }
        }

        function createSpaceship() {
            shipGroup = new THREE.Group();
            shipMeshGroup = new THREE.Group();

            const widthUnits = 20 / 100000;
            const lengthUnits = 10 / 100000;
            const heightUnits = 4 / 100000;

            const matBody = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, flatShading: true, roughness: 0.2 });
            const matWings = new THREE.MeshStandardMaterial({ color: 0x2563eb, flatShading: true });
            const matCockpit = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.1, metalness: 0.9 });
            const matEngine = new THREE.MeshBasicMaterial({ color: 0xff5500 });

            const bodyGeo = new THREE.ConeGeometry(widthUnits * 0.3, lengthUnits, 5);
            bodyGeo.rotateX(Math.PI / 2);
            shipMeshGroup.add(new THREE.Mesh(bodyGeo, matBody));

            const wings = new THREE.Mesh(new THREE.BoxGeometry(widthUnits, heightUnits * 0.5, lengthUnits * 0.4), matWings);
            wings.position.set(0, 0, lengthUnits * 0.1);
            shipMeshGroup.add(wings);

            const cockpit = new THREE.Mesh(new THREE.BoxGeometry(widthUnits * 0.3, heightUnits, lengthUnits * 0.3), matCockpit);
            cockpit.position.set(0, heightUnits * 0.5, -lengthUnits * 0.1);
            shipMeshGroup.add(cockpit);

            const engineGeo = new THREE.CylinderGeometry(widthUnits * 0.1, widthUnits * 0.12, lengthUnits * 0.2, 6);
            engineGeo.rotateX(Math.PI / 2);

            const e1 = new THREE.Mesh(engineGeo, matEngine);
            e1.position.set(-widthUnits * 0.25, 0, lengthUnits * 0.45);
            const e2 = new THREE.Mesh(engineGeo, matEngine);
            e2.position.set(widthUnits * 0.25, 0, lengthUnits * 0.45);

            shipMeshGroup.add(e1);
            shipMeshGroup.add(e2);

            shipGroup.add(shipMeshGroup);
            scene.add(shipGroup);
        }

        function createSpaceDust() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(DUST_COUNT * 3);

            for (let i = 0; i < DUST_COUNT * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * DUST_BOUNDS * 2;
                positions[i+1] = (Math.random() - 0.5) * DUST_BOUNDS * 2;
                positions[i+2] = (Math.random() - 0.5) * DUST_BOUNDS * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x88ccff, size: 0.05, transparent: true, opacity: 0.6 });
            spaceDust = new THREE.Points(geometry, material);
            scene.add(spaceDust);
        }

        function spawnShipAtEarthRunway() {
            const earthData = solarSystemGroup['Earth'];
            if (!earthData) return;

            scene.updateMatrixWorld(true);

            const earthRunway = targetList[0].runway;
            const runwayWorldPos = new THREE.Vector3();
            earthRunway.getWorldPosition(runwayWorldPos);

            shipPos.copy(runwayWorldPos);
            shipPos.y += 0.0005;

            shipRot.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);

            shipGroup.position.copy(shipPos);
            shipGroup.quaternion.copy(shipRot);

            targetSpeedKmh = 0;
            currentSpeedKmh = 0;
            warpActive = false;
            currentFuelKm = MAX_FUEL_KM;

            if (!currentMission) {
                generateRandomMission();
            }

            saveGameState();
        }

        function saveGameState() {
            const saveData = {
                shipPos: { x: shipPos.x, y: shipPos.y, z: shipPos.z },
                shipRot: { x: shipRot.x, y: shipRot.y, z: shipRot.z, w: shipRot.w },
                fuel: currentFuelKm,
                currentTargetIndex: currentTargetIndex,
                currentMission: currentMission
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        function loadGameState() {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;

            try {
                const saveData = JSON.parse(raw);
                shipPos.set(saveData.shipPos.x, saveData.shipPos.y, saveData.shipPos.z);
                shipRot.set(saveData.shipRot.x, saveData.shipRot.y, saveData.shipRot.z, saveData.shipRot.w);

                shipGroup.position.copy(shipPos);
                shipGroup.quaternion.copy(shipRot);

                currentFuelKm = (saveData.fuel !== undefined) ? saveData.fuel : MAX_FUEL_KM;
                currentTargetIndex = saveData.currentTargetIndex || 0;
                currentMission = saveData.currentMission || null;

                if (!currentMission) generateRandomMission();
                return true;
            } catch(e) {
                return false;
            }
        }

        function checkSaveFileStatus() {
            const raw = localStorage.getItem(SAVE_KEY);
            btnContinue.disabled = !raw;
        }

        function setupMenuEvents() {
            document.getElementById('menu-toggle-btn').addEventListener('click', toggleMenu);

            btnContinue.addEventListener('click', () => {
                if (loadGameState()) {
                    hideMenu();
                } else {
                    spawnShipAtEarthRunway();
                    hideMenu();
                }
            });

            btnNewGame.addEventListener('click', () => {
                spawnShipAtEarthRunway();
                hideMenu();
            });

            btnFullscreen.addEventListener('click', toggleFullscreen);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (isMapOpen) {
                        closeMap();
                    } else {
                        toggleMenu();
                    }
                }
            });
        }

        function toggleMenu() {
            if (mainMenu.style.display === 'none' || mainMenu.style.display === '') {
                showMenu();
            } else {
                hideMenu();
            }
        }

        function showMenu() {
            mainMenu.style.display = 'flex';
            isPaused = true;
            checkSaveFileStatus();
        }

        function hideMenu() {
            mainMenu.style.display = 'none';
            isPaused = false;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function setupMapEvents() {
            const mapToggleBtn = document.getElementById('map-toggle-btn');
            const mapCloseBtn = document.getElementById('map-close-btn');

            mapToggleBtn.addEventListener('click', toggleMap);
            mapCloseBtn.addEventListener('click', closeMap);

            mapCanvas.addEventListener('wheel', (e) => {
                if (!isMapOpen) return;
                e.preventDefault();
                if (e.deltaY < 0) {
                    mapRangeKm *= 0.8;
                } else {
                    mapRangeKm *= 1.25;
                }
                mapRangeKm = Math.max(MIN_MAP_RANGE_KM, Math.min(MAX_MAP_RANGE_KM, mapRangeKm));
            }, { passive: false });

            let initialPinchDistance = null;
            let initialMapRangeKm = mapRangeKm;

            mapCanvas.addEventListener('touchstart', (e) => {
                if (!isMapOpen) return;
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.hypot(dx, dy);
                    initialMapRangeKm = mapRangeKm;
                }
            }, { passive: false });

            mapCanvas.addEventListener('touchmove', (e) => {
                if (!isMapOpen) return;
                if (e.touches.length === 2 && initialPinchDistance) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currentDistance = Math.hypot(dx, dy);

                    if (currentDistance > 0) {
                        const scaleFactor = initialPinchDistance / currentDistance;
                        mapRangeKm = initialMapRangeKm * scaleFactor;
                        mapRangeKm = Math.max(MIN_MAP_RANGE_KM, Math.min(MAX_MAP_RANGE_KM, mapRangeKm));
                    }
                }
            }, { passive: false });

            mapCanvas.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'm' || e.key === 'M') {
                    toggleMap();
                }
            });
        }

        function toggleMap() {
            if (isMapOpen) closeMap();
            else openMap();
        }

        function openMap() {
            isMapOpen = true;
            mapModal.style.display = 'flex';
            resizeMapCanvas();
        }

        function closeMap() {
            isMapOpen = false;
            mapModal.style.display = 'none';
        }

        function resizeMapCanvas() {
            const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.7);
            mapCanvas.width = size;
            mapCanvas.height = size;
        }

        function drawOrbitOnMap(centerMapPos, radiusKm, mapRangeKm, canvasWidth, styleOptions = {}) {
            const scalePx = (canvasWidth / 2) / mapRangeKm;
            const radiusPx = radiusKm * scalePx;

            if (radiusPx < 0.5) return;

            mapCtx.save();
            mapCtx.beginPath();
            mapCtx.arc(centerMapPos.x, centerMapPos.y, radiusPx, 0, Math.PI * 2);
            mapCtx.strokeStyle = styleOptions.color || 'rgba(0, 240, 255, 0.15)';
            mapCtx.lineWidth = styleOptions.lineWidth || 1;

            if (styleOptions.dash) {
                mapCtx.setLineDash(styleOptions.dash);
            } else {
                mapCtx.setLineDash([]);
            }

            if (styleOptions.glow) {
                mapCtx.shadowColor = styleOptions.color;
                mapCtx.shadowBlur = styleOptions.glow;
            }

            mapCtx.stroke();
            mapCtx.restore();
        }

        function renderMap() {
            if (!isMapOpen) return;

            const w = mapCanvas.width;
            const h = mapCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            mapCtx.clearRect(0, 0, w, h);

            mapCtx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
            mapCtx.lineWidth = 1;
            for (let r = 1; r <= 4; r++) {
                mapCtx.beginPath();
                mapCtx.arc(cx, cy, (w / 2) * (r / 4), 0, Math.PI * 2);
                mapCtx.stroke();
            }

            mapCtx.beginPath();
            mapCtx.moveTo(cx, 0); mapCtx.lineTo(cx, h);
            mapCtx.moveTo(0, cy); mapCtx.lineTo(w, cy);
            mapCtx.stroke();

            const sunWorldPos = new THREE.Vector3(0,0,0);
            const sunMapPos = worldToMapCoords(sunWorldPos, shipPos, mapRangeKm, w, h);

            const activeTarget = targetList[currentTargetIndex];
            let missionTargetObj = null;
            if (currentMission) {
                const mIdx = (currentMission.status === 'PICKUP') ? currentMission.pickupIndex : currentMission.deliveryIndex;
                missionTargetObj = targetList[mIdx];
            }

            Object.keys(solarSystemGroup).forEach(key => {
                const sys = solarSystemGroup[key];
                
                drawOrbitOnMap(sunMapPos, sys.data.dist, mapRangeKm, w, {
                    color: 'rgba(0, 240, 255, 0.18)',
                    lineWidth: 1
                });

                const pWorldPos = new THREE.Vector3();
                sys.group.getWorldPosition(pWorldPos);
                const pMapPos = worldToMapCoords(pWorldPos, shipPos, mapRangeKm, w, h);

                sys.moons.forEach((m, idx) => {
                    const moonData = sys.data.moons[idx];
                    drawOrbitOnMap(pMapPos, moonData.dist, mapRangeKm, w, {
                        color: 'rgba(255, 255, 255, 0.12)',
                        lineWidth: 0.8
                    });
                });
            });

            if (activeTarget) {
                let centerPos = sunMapPos;
                if (activeTarget.parentGroup) {
                    const parentWorldPos = new THREE.Vector3();
                    activeTarget.parentGroup.getWorldPosition(parentWorldPos);
                    centerPos = worldToMapCoords(parentWorldPos, shipPos, mapRangeKm, w, h);
                }

                drawOrbitOnMap(centerPos, activeTarget.orbitDistKm, mapRangeKm, w, {
                    color: '#ff0080',
                    lineWidth: 2,
                    dash: [6, 4],
                    glow: 8
                });
            }

            if (missionTargetObj && missionTargetObj !== activeTarget) {
                let centerPos = sunMapPos;
                if (missionTargetObj.parentGroup) {
                    const parentWorldPos = new THREE.Vector3();
                    missionTargetObj.parentGroup.getWorldPosition(parentWorldPos);
                    centerPos = worldToMapCoords(parentWorldPos, shipPos, mapRangeKm, w, h);
                }

                drawOrbitOnMap(centerPos, missionTargetObj.orbitDistKm, mapRangeKm, w, {
                    color: '#ffcc00',
                    lineWidth: 2,
                    dash: [8, 4],
                    glow: 8
                });
            }

            mapCtx.fillStyle = '#ffcc00';
            mapCtx.shadowColor = '#ffcc00';
            mapCtx.shadowBlur = 10;
            mapCtx.beginPath();
            mapCtx.arc(sunMapPos.x, sunMapPos.y, 6, 0, Math.PI * 2);
            mapCtx.fill();
            mapCtx.shadowBlur = 0;

            Object.keys(solarSystemGroup).forEach(key => {
                const sys = solarSystemGroup[key];
                const pWorldPos = new THREE.Vector3();
                sys.group.getWorldPosition(pWorldPos);

                const pMapPos = worldToMapCoords(pWorldPos, shipPos, mapRangeKm, w, h);

                mapCtx.fillStyle = '#' + sys.data.color.toString(16).padStart(6, '0');
                mapCtx.beginPath();
                mapCtx.arc(pMapPos.x, pMapPos.y, 4, 0, Math.PI * 2);
                mapCtx.fill();

                mapCtx.fillStyle = '#00f0ff';
                mapCtx.font = '10px sans-serif';
                mapCtx.fillText(sys.data.name.toUpperCase(), pMapPos.x + 6, pMapPos.y + 3);

                sys.moons.forEach(m => {
                    const mWorldPos = new THREE.Vector3();
                    m.pivot.children[0].getWorldPosition(mWorldPos);
                    const mMapPos = worldToMapCoords(mWorldPos, shipPos, mapRangeKm, w, h);

                    mapCtx.fillStyle = '#aaaaaa';
                    mapCtx.beginPath();
                    mapCtx.arc(mMapPos.x, mMapPos.y, 2, 0, Math.PI * 2);
                    mapCtx.fill();
                });
            });

            mapCtx.save();
            mapCtx.translate(cx, cy);

            const shipForward = new THREE.Vector3(0, 0, -1).applyQuaternion(shipRot);
            const angle = Math.atan2(shipForward.x, -shipForward.z);
            mapCtx.rotate(angle);

            mapCtx.fillStyle = '#ff0055';
            mapCtx.shadowColor = '#ff0055';
            mapCtx.shadowBlur = 8;
            mapCtx.beginPath();
            mapCtx.moveTo(0, -8);
            mapCtx.lineTo(-5, 6);
            mapCtx.lineTo(5, 6);
            mapCtx.closePath();
            mapCtx.fill();
            mapCtx.restore();
        }

        function worldToMapCoords(worldPos, centerWorldPos, rangeKm, canvasWidth, canvasHeight) {
            const dxKm = (worldPos.x - centerWorldPos.x) / SCALE;
            const dzKm = (worldPos.z - centerWorldPos.z) / SCALE;

            const scalePx = (canvasWidth / 2) / rangeKm;

            const mapX = (canvasWidth / 2) + (dxKm * scalePx);
            const mapY = (canvasHeight / 2) + (dzKm * scalePx);

            return { x: mapX, y: mapY };
        }

        function setupControls() {
            const joystickBase = document.getElementById('joystick-base');
            const joystickStick = document.getElementById('joystick-stick');
            const throttleContainer = document.getElementById('throttle-container');
            const throttleKnob = document.getElementById('throttle-knob');
            const warpBtn = document.getElementById('warp-btn');
            const prevBtn = document.getElementById('prev-target-btn');
            const nextBtn = document.getElementById('next-target-btn');

            let touchIdJoystick = null;
            let joystickCenter = { x: 0, y: 0 };
            const maxJoyRadius = 40;

            joystickBase.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                touchIdJoystick = touch.identifier;
                const rect = joystickBase.getBoundingClientRect();
                joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                if (touchIdJoystick !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchIdJoystick) {
                            updateJoystick(e.changedTouches[i]);
                            break;
                        }
                    }
                }
            });

            const resetJoystick = () => {
                touchIdJoystick = null;
                joystickStick.style.transform = `translate(-50%, -50%)`;
                yawInput = 0;
                pitchInput = 0;
            };

            window.addEventListener('touchend', (e) => {
                if (touchIdJoystick !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchIdJoystick) {
                            resetJoystick();
                            break;
                        }
                    }
                }
            });

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const dist = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                const clampedDist = Math.min(dist, maxJoyRadius);

                const stickX = Math.cos(angle) * clampedDist;
                const stickY = Math.sin(angle) * clampedDist;

                joystickStick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;

                yawInput = -(stickX / maxJoyRadius);
                pitchInput = -(stickY / maxJoyRadius);
            }

            let touchDragId = null;
            let lastTouchX = 0;
            let lastTouchY = 0;

            window.addEventListener('touchstart', (e) => {
                if (isMapOpen || isPaused) return;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.target.closest('.interactive-zone, #hud, #fuel-container, #menu-toggle-btn, #map-toggle-btn')) {
                        continue;
                    }
                    if (touchDragId === null) {
                        touchDragId = touch.identifier;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                        break;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (touchDragId === null) return;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchDragId) {
                        const deltaX = touch.clientX - lastTouchX;
                        const deltaY = touch.clientY - lastTouchY;

                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;

                        yawInput = -deltaX * 0.012;
                        pitchInput = deltaY * 0.012;

                        yawInput = Math.max(-1, Math.min(1, yawInput));
                        pitchInput = Math.max(-1, Math.min(1, pitchInput));
                        break;
                    }
                }
            }, { passive: false });

            const resetTouchDrag = (e) => {
                if (touchDragId !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchDragId) {
                            touchDragId = null;
                            yawInput = 0;
                            pitchInput = 0;
                            break;
                        }
                    }
                }
            };

            window.addEventListener('touchend', resetTouchDrag);
            window.addEventListener('touchcancel', resetTouchDrag);

            let touchIdThrottle = null;

            throttleContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                touchIdThrottle = touch.identifier;
                updateThrottle(touch);
            });

            window.addEventListener('touchmove', (e) => {
                if (touchIdThrottle !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchIdThrottle) {
                            updateThrottle(e.changedTouches[i]);
                            break;
                        }
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                if (touchIdThrottle !== null) {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchIdThrottle) {
                            touchIdThrottle = null;
                            break;
                        }
                    }
                }
            });

            function updateThrottle(touch) {
                const rect = throttleContainer.getBoundingClientRect();
                const relativeY = Math.max(0, Math.min(rect.height, touch.clientY - rect.top));
                const percent = 1 - (relativeY / rect.height);
                throttleKnob.style.top = `${relativeY - 25}px`;
                targetSpeedKmh = percent * MAX_SUB_LIGHT_KMH;
            }

            warpBtn.addEventListener('click', toggleWarpMode);

            prevBtn.addEventListener('click', () => cycleTarget('prev'));
            nextBtn.addEventListener('click', () => cycleTarget('next'));

            const keys = {};
            window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
            window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

            window.addEventListener('wheel', (e) => {
                if (isMapOpen) return;
                currentCamDist += e.deltaY * 0.000005;
                currentCamDist = Math.max(MIN_CAM_DIST, Math.min(MAX_CAM_DIST, currentCamDist));
                camera.position.z = currentCamDist;
            });

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#hud, #touch-controls, #main-menu, #map-modal, #menu-toggle-btn, #map-toggle-btn')) return;
                isDraggingCam = true;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingCam) return;
                camYawOffset -= e.movementX * 0.003;
                camPitchOffset -= e.movementY * 0.003;
                camPitchOffset = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camPitchOffset));
            });

            window.addEventListener('mouseup', () => { isDraggingCam = false; });

            setInterval(() => {
                if (isPaused) return;

                if (keys['w'] || keys['arrowup']) pitchInput = 1;
                else if (keys['s'] || keys['arrowdown']) pitchInput = -1;
                else if (touchIdJoystick === null && touchDragId === null && !isGamepadActive()) pitchInput = 0;

                if (keys['a'] || keys['arrowleft']) yawInput = 1;
                else if (keys['d'] || keys['arrowright']) yawInput = -1;
                else if (touchIdJoystick === null && touchDragId === null && !isGamepadActive()) yawInput = 0;

                if (keys['shift']) targetSpeedKmh = Math.min(MAX_SUB_LIGHT_KMH, targetSpeedKmh + 20000);
                if (keys['control']) targetSpeedKmh = Math.max(0, targetSpeedKmh - 20000);
            }, 1000 / 60);
        }

        function isGamepadActive() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].connected) return true;
            }
            return false;
        }

        function updateGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].connected) {
                    gp = gamepads[i];
                    break;
                }
            }

            if (!gp) return;

            const deadzone = 0.15;
            const applyDeadzone = (val) => Math.abs(val) > deadzone ? val : 0;

            const isBtnJustPressed = (btnIndex) => {
                const isPressed = gp.buttons[btnIndex] && gp.buttons[btnIndex].pressed;
                const wasPressed = gamepadPrevButtons[btnIndex] || false;
                gamepadPrevButtons[btnIndex] = isPressed;
                return isPressed && !wasPressed;
            };

            // 1. MENU PRINCIPALE / PAUSA (START - Button 9)
            if (isBtnJustPressed(9)) {
                if (isMapOpen) closeMap();
                toggleMenu();
                return;
            }

            // 2. TASTO B / CERCHIO (Button 1) -> CHIUDI MAPPA / MENU
            if (isBtnJustPressed(1)) {
                if (isMapOpen) closeMap();
                else if (!isPaused) showMenu();
                else hideMenu();
                return;
            }

            if (isPaused) return;

            // 3. TOGGLE WARP -> TASTO X / QUADRATO (Button 2)
            if (isBtnJustPressed(2)) {
                toggleWarpMode();
            }

            // 4. MAPPA TATTICA RADAR -> TASTO Y / TRIANGOLO (Button 3)
            if (isBtnJustPressed(3)) {
                toggleMap();
            }

            // 5. CAMBIO TARGET (D-Pad Sinistra / Button 14, D-Pad Destra / Button 15, LB / Button 4, RB / Button 5)
            if (isBtnJustPressed(14) || isBtnJustPressed(4)) {
                cycleTarget('prev');
            }
            if (isBtnJustPressed(15) || isBtnJustPressed(5)) {
                cycleTarget('next');
            }

            // 6. VOLO E DIREZIONE (Stick SX - Axis 0 & 1 con sensibilità ridotta)
            const joyX = applyDeadzone(gp.axes[0]);
            const joyY = applyDeadzone(gp.axes[1]);

            if (joyX !== 0 || joyY !== 0) {
                const sensitivity = 0.45; // Sensibilità ridotta per un controllo più preciso
                yawInput = -joyX * sensitivity;
                pitchInput = -joyY * sensitivity;
            }

            // 7. CONTROLLO TELECAMERA (Stick DX - Axis 2 & 3)
            const camX = applyDeadzone(gp.axes[2]);
            const camY = applyDeadzone(gp.axes[3]);

            if (camX !== 0 || camY !== 0) {
                camYawOffset -= camX * 0.03;
                camPitchOffset -= camY * 0.03;
                camPitchOffset = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camPitchOffset));
            }

            // 8. MANETTA ACCELERAZIONE / DECELERAZIONE (Grilletti RT / Button 7 e LT / Button 6)
            const triggerRT = gp.buttons[7] ? gp.buttons[7].value : 0;
            const triggerLT = gp.buttons[6] ? gp.buttons[6].value : 0;

            if (triggerRT > 0.1) {
                targetSpeedKmh = Math.min(MAX_SUB_LIGHT_KMH, targetSpeedKmh + triggerRT * 15000);
            }
            if (triggerLT > 0.1) {
                targetSpeedKmh = Math.max(0, targetSpeedKmh - triggerLT * 15000);
            }
        }

        let lastTime = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = Math.min(0.1, (time - lastTime) / 1000);
            lastTime = time;

            updateGamepad();

            if (!isPaused) {
                updateCelestials(delta);
                updateSpaceship(delta);
                checkMissionProgress();
                saveGameState();
            }

            renderHUD();
            renderMap();
            renderer.render(scene, camera);
        }

        function updateCelestials(delta) {
            Object.keys(solarSystemGroup).forEach(key => {
                const sys = solarSystemGroup[key];
                
                const orbitSpeed = (Math.PI * 2) / (sys.data.orbitPeriod * EARTH_ORBIT_PERIOD_SEC);
                sys.pivot.rotation.y += orbitSpeed * delta;

                const rotSpeed = (Math.PI * 2) / (sys.data.rotPeriod * EARTH_DAY_SEC);
                sys.mesh.rotation.y += rotSpeed * delta;

                sys.moons.forEach(m => {
                    const mOrbitSpeed = (Math.PI * 2) / (m.period * EARTH_ORBIT_PERIOD_SEC);
                    m.pivot.rotation.y += mOrbitSpeed * delta;
                });
            });

            const pulse = (Math.sin(lastTime * 0.005) + 1) * 0.5;
            runwayLights.forEach(l => {
                l.material.opacity = pulse;
            });
        }

        function updateSpaceship(delta) {
            const targetSpeed = warpActive ? WARP_SPEED_KMH : targetSpeedKmh;
            currentSpeedKmh += (targetSpeed - currentSpeedKmh) * 0.05;

            // LOGICA DI CONSUMO E RIGENERAZIONE CARBURANTE
            const WARP_CONSUMPTION_FACTOR = 50;

            if (warpActive) {
                // CONSUMO WARP
                currentFuelKm -= (currentSpeedKmh / 3600) * delta * WARP_CONSUMPTION_FACTOR;
                if (currentFuelKm <= 0) {
                    currentFuelKm = 0;
                    warpActive = false;
                    const warpBtn = document.getElementById('warp-btn');
                    if (warpBtn) warpBtn.style.background = 'linear-gradient(135deg, #7928ca, #ff0080)';
                }
            } else if (currentSpeedKmh > REGEN_SPEED_LIMIT) {
                // CONSUMO SUB-LIGHT ELEVATO (> 100.000 km/h) -> 1/3 RISPETTO A WARP
                const subLightConsumptionFactor = WARP_CONSUMPTION_FACTOR / 3;
                currentFuelKm -= (currentSpeedKmh / 3600) * delta * subLightConsumptionFactor;
                if (currentFuelKm <= 0) {
                    currentFuelKm = 0;
                    targetSpeedKmh = 0;
                }
            } else {
                // RIGENERAZIONE SUBLIGHT BASSISSIMA O DA FERMO (<= 100.000 km/h)
                currentFuelKm = Math.min(MAX_FUEL_KM, currentFuelKm + REGEN_RATE_KM_PER_SEC * delta);
            }

            const rotSpeed = 1.2;
            const pitchDelta = pitchInput * rotSpeed * delta;
            const yawDelta = yawInput * rotSpeed * delta;

            const rotChange = new THREE.Quaternion();
            rotChange.setFromEuler(new THREE.Euler(pitchDelta, yawDelta, 0, 'YXZ'));
            shipRot.multiply(rotChange);
            shipGroup.quaternion.copy(shipRot);

            rollVisual += (-yawInput * 0.4 - rollVisual) * 0.1;
            pitchVisual += (pitchInput * 0.2 - pitchVisual) * 0.1;
            shipMeshGroup.rotation.z = rollVisual;
            shipMeshGroup.rotation.x = pitchVisual;

            const speedUnitsPerSec = (currentSpeedKmh / 3600) * SCALE;
            const moveVector = new THREE.Vector3(0, 0, -speedUnitsPerSec * delta).applyQuaternion(shipRot);
            shipPos.add(moveVector);
            shipGroup.position.copy(shipPos);

            if (spaceDust) spaceDust.position.copy(shipPos);

            cameraRigNode.rotation.y += (camYawOffset - cameraRigNode.rotation.y) * 0.1;
            cameraRigNode.rotation.x += (camPitchOffset - cameraRigNode.rotation.x) * 0.1;
        }

        function renderHUD() {
            document.getElementById('hud-speed').innerText = Math.round(currentSpeedKmh).toLocaleString();
            
            const modeEl = document.getElementById('hud-mode');
            if (warpActive) {
                modeEl.innerText = "WARP SPEED";
                modeEl.style.color = "#ff0080";
            } else {
                modeEl.innerText = "SUB-LIGHT";
                modeEl.style.color = "#00ff88";
            }

            const fuelPercent = Math.max(0, Math.min(100, (currentFuelKm / MAX_FUEL_KM) * 100));
            fuelBarFill.style.height = `${fuelPercent}%`;
            fuelValText.innerText = `${Math.round(fuelPercent)}%`;

            let nearestName = "--";
            let minDist = Infinity;
            targetList.forEach(t => {
                const worldPos = new THREE.Vector3();
                t.group.getWorldPosition(worldPos);
                const d = shipPos.distanceTo(worldPos) / SCALE;
                if (d < minDist) {
                    minDist = d;
                    nearestName = t.name;
                }
            });
            document.getElementById('hud-nearest').innerText = nearestName.toUpperCase();

            targetList.forEach((t, idx) => {
                const labelPos = new THREE.Vector3();
                t.group.getWorldPosition(labelPos);
                const screenPos = labelPos.clone().project(camera);

                if (screenPos.z < 1 && screenPos.x >= -1 && screenPos.x <= 1 && screenPos.y >= -1 && screenPos.y <= 1) {
                    const x = (screenPos.x * .5 + .5) * window.innerWidth;
                    const y = (-(screenPos.y * .5) + .5) * window.innerHeight;
                    t.labelEl.style.left = `${x}px`;
                    t.labelEl.style.top = `${y}px`;
                    t.labelEl.style.display = 'block';
                } else {
                    t.labelEl.style.display = 'none';
                }
            });

            const activeTarget = targetList[currentTargetIndex];
            document.getElementById('hud-target-name').innerText = activeTarget.name.toUpperCase();

            const targetRunwayWorldPos = new THREE.Vector3();
            activeTarget.runway.getWorldPosition(targetRunwayWorldPos);

            const targetDistKm = shipPos.distanceTo(targetRunwayWorldPos) / SCALE;
            document.getElementById('hud-target-dist').innerText = Math.round(targetDistKm).toLocaleString();

            const targetScreenPos = targetRunwayWorldPos.clone().project(camera);
            if (targetScreenPos.z < 1 && targetScreenPos.x >= -1 && targetScreenPos.x <= 1 && targetScreenPos.y >= -1 && targetScreenPos.y <= 1) {
                targetMarker.style.left = `${(targetScreenPos.x * .5 + .5) * window.innerWidth}px`;
                targetMarker.style.top = `${(-(targetScreenPos.y * .5) + .5) * window.innerHeight}px`;
                targetMarker.style.display = 'block';
            } else {
                targetMarker.style.display = 'none';
            }

            if (currentMission) {
                const isPickup = (currentMission.status === 'PICKUP');
                const mTargetIdx = isPickup ? currentMission.pickupIndex : currentMission.deliveryIndex;
                const mTargetObj = targetList[mTargetIdx];

                document.getElementById('hud-mission-cargo').innerText = currentMission.cargoName.toUpperCase();
                document.getElementById('hud-mission-target').innerText = `${isPickup ? '[PRELIEVO] ' : '[CONSEGNA] '}${mTargetObj.name.toUpperCase()}`;

                const mRunwayWorldPos = new THREE.Vector3();
                mTargetObj.runway.getWorldPosition(mRunwayWorldPos);

                const mDistKm = shipPos.distanceTo(mRunwayWorldPos) / SCALE;
                document.getElementById('hud-mission-dist').innerText = Math.round(mDistKm).toLocaleString();

                const mScreenPos = mRunwayWorldPos.clone().project(camera);
                if (mScreenPos.z < 1 && mScreenPos.x >= -1 && mScreenPos.x <= 1 && mScreenPos.y >= -1 && mScreenPos.y <= 1) {
                    missionMarker.style.left = `${(mScreenPos.x * .5 + .5) * window.innerWidth}px`;
                    missionMarker.style.top = `${(-(mScreenPos.y * .5) + .5) * window.innerHeight}px`;
                    missionMarker.style.display = 'block';
                } else {
                    missionMarker.style.display = 'none';
                }
            } else {
                missionMarker.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (isMapOpen) resizeMapCanvas();
        }

        window.onload = init;
    })();
    </script>
</body>
