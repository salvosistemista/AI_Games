<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14151c">
<meta name="mobile-web-app-capable" content="yes">
<title>Taxi Metropoli</title>
<style>
:root{--yel:#ffd400;--lime:#c8f03c;--red:#ff4d3d;--blue:#38d6ff;--panel:rgba(18,19,27,.86);--chip:rgba(18,19,27,.78);--txt:#f4f5f8;--mut:#9aa0b4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;color:var(--txt);touch-action:none;}
#app{position:relative;height:100vh;height:100dvh;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);margin:0 auto;overflow:hidden;background:#222;}
@media (max-aspect-ratio:3/5){#app{width:100vw;}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hide{display:none!important;}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,11,16,.55) 0%,rgba(10,11,16,0) 26%,rgba(10,11,16,0) 38%,rgba(10,11,16,.82) 66%,rgba(10,11,16,.94) 100%);transition:opacity .4s;}
#corner{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:30;}
#corner button{width:34px;height:34px;border-radius:9px;border:0;background:var(--chip);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:17px;}
#corner svg{width:18px;height:18px;fill:#fff;}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
.chip{background:var(--chip);border-radius:9px;padding:5px 9px;font-weight:800;display:inline-flex;align-items:center;gap:6px;}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;gap:6px;}
#money{font-size:17px;font-variant-numeric:tabular-nums;color:var(--yel);}
#money.neg{color:var(--red);}
#money small.rep{font-size:11px;color:#f4f5f8;font-weight:800;opacity:.85;}
#clock{font-size:15px;font-variant-numeric:tabular-nums;}
#clock small{color:var(--mut);font-weight:600;font-size:11px;}
#gauges{position:absolute;top:calc(52px + env(safe-area-inset-top));left:10px;width:112px;display:flex;flex-direction:column;gap:4px;}
.g{background:var(--chip);border-radius:8px;padding:2px 7px;height:20px;box-sizing:border-box;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;}
.g .ic{width:16px;text-align:center;font-size:13px;}
.g .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;}
.g .bar i{display:block;height:100%;border-radius:4px;background:var(--lime);}
.g.low .bar i{background:var(--red);} .g.mid .bar i{background:var(--yel);}
.g.low{animation:blink .6s infinite alternate;}
@keyframes blink{to{background:rgba(160,30,24,.85);}}
#mini{position:absolute;top:calc(52px + env(safe-area-inset-top));right:10px;width:116px;height:116px;border-radius:50%;border:3px solid rgba(18,19,27,.85);box-shadow:0 2px 10px rgba(0,0,0,.4);background:#1d2a20;}
#nav{position:absolute;top:calc(52px + env(safe-area-inset-top));left:130px;right:134px;min-height:54px;background:var(--chip);border-radius:10px;display:flex;align-items:center;gap:6px;padding:5px 6px;transition:opacity .2s;}
#nav.off{opacity:0;}
#nav svg{width:38px;height:38px;flex:none;}
#nav .d{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;line-height:1;}
#nav .s{font-size:10px;color:#dfe3ee;line-height:1.15;margin-top:2px;max-height:24px;overflow:hidden;}
#street{position:absolute;top:calc(176px + env(safe-area-inset-top));right:10px;max-width:150px;text-align:right;font-size:10px;font-weight:700;color:#e8ebf2;text-shadow:0 1px 3px #000;}
#job{position:absolute;top:calc(148px + env(safe-area-inset-top));left:10px;right:134px;background:var(--panel);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.3;}
#job b{color:var(--yel);} #job .row2{display:flex;gap:10px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;}
#job .iss{margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:700;color:#ffb3a8;}
#job .late{color:var(--red);} #job .ok{color:var(--lime);}
#calls{position:absolute;top:calc(230px + env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;}
.call{background:var(--panel);border-radius:12px;padding:8px 10px;border:2px solid transparent;font-size:12px;line-height:1.3;cursor:pointer;position:relative;animation:slide .3s;}
@keyframes slide{from{transform:translateX(-30px);opacity:0;}}
.call.sel{border-color:var(--yel);}
.call .h{display:flex;justify-content:space-between;font-weight:800;font-size:13px;}
.call .tm{position:absolute;left:0;bottom:0;height:3px;background:var(--yel);border-radius:2px;}
.call .tag{font-size:10px;font-weight:900;border-radius:4px;padding:0 5px;margin-left:5px;}
.tag.urgent{background:var(--red);} .tag.group{background:#2b63d9;} .tag.vip{background:#c9a24a;color:#111;} .tag.night{background:#6a3d8a;} .tag.sp{background:#38d6ff;color:#0b1a24;}
.call .no{color:var(--red);font-weight:800;}
.call .k{float:right;color:var(--mut);font-size:10px;margin-top:2px;}
.call .rej{position:absolute;right:-6px;top:-8px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:#3a1d22;color:#ff8a80;font-weight:900;font-size:12px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center;z-index:2;}
.call .rej:hover{background:#7a2028;color:#fff;}
.call .h{padding-right:14px;}
#speedo{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:9px;padding:4px 10px 4px 5px;}
#gear{background:#f4f5f8;color:#16171e;font-weight:900;border-radius:5px;padding:1px 6px;font-size:14px;min-width:22px;text-align:center;}
#gear.r{background:var(--red);color:#fff;}
#spd{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;}
#spd small{font-size:9px;color:var(--mut);margin-left:2px;font-weight:600;}
#act{position:absolute;left:50%;bottom:calc(62px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--yel);color:#141414;border:0;border-radius:24px;padding:10px 18px;font:inherit;font-weight:900;font-size:15px;white-space:nowrap;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;animation:pop .25s;}
#tl{display:flex;align-items:center;gap:3px;background:#0d0e12;border-radius:6px;padding:3px 5px;}
#tl.off{display:none;}
#conf{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#7a2bd6;color:#fff;font-weight:900;border-radius:10px;padding:6px 12px;font-size:14px;animation:tlfl .5s steps(1) infinite;pointer-events:none;z-index:6;}
#conf.off{display:none;}
#ped{background:#ffd400;color:#111;border-radius:6px;padding:1px 5px;font-size:14px;animation:tlfl .8s steps(1) infinite;}
#ped.off{display:none;}
#tl i{width:9px;height:9px;border-radius:50%;background:#2a2c33;display:block;}
#tl i.r{background:#ff2a1a;box-shadow:0 0 6px #ff2a1a;} #tl i.y{background:#ffb412;box-shadow:0 0 6px #ffb412;} #tl i.g{background:#2dff6e;box-shadow:0 0 6px #2dff6e;}
#tl b{font-size:11px;margin-left:2px;}
#tl i.fl{animation:tlfl .66s steps(1) infinite;}
@keyframes tlfl{50%{background:#2a2c33;box-shadow:none;}}
#news{position:absolute;left:10px;right:10px;bottom:calc(172px + env(safe-area-inset-bottom));background:rgba(18,19,27,.9);border-left:4px solid #38d6ff;border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.35;color:#e8ebf2;z-index:15;opacity:0;transition:opacity .4s;pointer-events:none;}
#news.show{opacity:1;} #news b{color:#38d6ff;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;}
#flash.on{animation:flash .45s ease-out;}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#hud.touchOn #news{bottom:calc(262px + env(safe-area-inset-bottom));}
#hud.touchOn #act{bottom:calc(158px + env(safe-area-inset-bottom));}
#hud.touchOn #bubble{bottom:calc(206px + env(safe-area-inset-bottom));}
#act.red{background:var(--red);color:#fff;}
#act kbd{font:inherit;font-size:11px;background:rgba(0,0,0,.18);border-radius:5px;padding:1px 5px;margin-left:6px;}
@keyframes pop{from{transform:translateX(-50%) scale(.7);}}

#bubble{position:absolute;left:14px;right:14px;bottom:calc(118px + env(safe-area-inset-bottom));background:#fff;color:#16171e;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;}
#bubble.show{opacity:1;} #bubble b{color:#a07800;}
#bubble:after{content:'';position:absolute;left:28px;bottom:-9px;border:10px solid transparent;border-top-color:#fff;border-bottom:0;}
#summary{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);background:var(--panel);border-radius:16px;padding:12px 18px;min-width:230px;text-align:center;z-index:12;opacity:0;transition:opacity .3s;pointer-events:none;}
#summary.show{opacity:1;}
#summary .big{font-size:34px;color:var(--yel);}
#summary .stars{font-size:20px;color:var(--yel);letter-spacing:2px;}
#summary .det{font-size:12px;color:#dfe3ee;margin-top:4px;line-height:1.4;}
/* comandi touch */
#touch{position:absolute;inset:auto 0 calc(8px + env(safe-area-inset-bottom)) 0;height:150px;pointer-events:none;}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(18,19,27,.38);border:2px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;touch-action:none;}
#touch .tb.on{background:rgba(255,212,0,.45);}
#tL{left:12px;bottom:46px;width:66px;height:66px;} #tR{left:86px;bottom:46px;width:66px;height:66px;}
#tG{right:12px;bottom:56px;width:78px;height:78px;} #tB{right:98px;bottom:30px;width:56px;height:56px;} #tH{right:98px;bottom:94px;width:48px;height:48px;font-size:10px;}
/* schermate */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;}
.bottom{margin-top:auto;}
.logo{margin:7vh auto 0;text-align:center;line-height:.9;transform:skewX(-8deg);}
.logo .a{font-size:52px;font-weight:900;color:var(--yel);text-shadow:0 4px 0 rgba(0,0,0,.4);font-family:"Arial Black","Trebuchet MS",sans-serif;letter-spacing:2px;}
.logo .b{font-size:24px;font-weight:900;letter-spacing:7px;color:#fff;margin-top:4px;}
.logo .chk{height:10px;margin:10px auto 0;width:200px;background:conic-gradient(#111 0 25%,var(--yel) 0 50%,#111 0 75%,var(--yel) 0) 0 0/10px 10px;border-radius:2px;}
.logo .sub{margin-top:8px;font-size:12px;color:#dfe3ee;letter-spacing:2px;transform:skewX(8deg);}
h2{margin:4px 0 12px;font-style:italic;font-weight:900;font-size:26px;transform:skewX(-6deg);text-shadow:0 2px 8px rgba(0,0,0,.55);}
h2 small{display:block;font-size:12px;color:#dde1ec;font-style:normal;font-weight:600;transform:none;margin-top:2px;}
.btn{display:block;width:100%;border:0;margin:7px 0;padding:13px 14px;border-radius:12px;background:var(--panel);color:#fff;font:inherit;font-weight:800;font-size:16px;text-align:left;cursor:pointer;position:relative;transition:transform .1s;}
.btn.main{background:var(--yel);color:#15161c;font-size:19px;font-style:italic;text-align:center;}
.btn .r{float:right;color:var(--mut);font-weight:600;font-size:13px;margin-top:2px;}
.btn.main .r{color:#4a4a2a;}
.btn:disabled{opacity:.42;}
.focus{outline:3px solid var(--yel);outline-offset:2px;transform:scale(1.015);}
.btn.main.focus{outline-color:#fff;}
.row{background:var(--panel);border-radius:12px;padding:10px 12px;margin:7px 0;}
.row .lab{font-size:11px;color:var(--mut);letter-spacing:1.5px;font-weight:700;text-transform:uppercase;}
.row .sel{display:flex;align-items:center;gap:8px;margin-top:4px;}
.row .sel .v{flex:1;text-align:center;font-weight:900;font-size:19px;font-style:italic;}
.row .arr{width:34px;height:34px;border-radius:9px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:18px;font-weight:900;cursor:pointer;}
.row .det{font-size:12px;color:#c7cbd8;margin-top:6px;text-align:center;line-height:1.35;}
.card{background:var(--panel);border-radius:12px;padding:12px;margin:7px 0;}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin-top:8px;font-size:11px;color:var(--mut);align-items:center;}
.stats .b{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;}
.stats .b i{display:block;height:100%;background:var(--yel);border-radius:3px;}
.big{font-size:38px;font-weight:900;font-style:italic;text-align:center;font-variant-numeric:tabular-nums;}
.center{text-align:center;} .mut{color:var(--mut);font-size:13px;}
.pos{color:var(--lime);} .neg{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
td{padding:6px 5px;border-bottom:1px solid rgba(255,255,255,.07);} td.t{text-align:right;font-weight:800;}
.meter{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0;}
.meter i{display:block;height:100%;background:var(--lime);}
.kbd{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;font-size:13px;}
.kbd b{color:var(--yel);font-weight:800;text-align:right;}
.kbd .h{color:var(--mut);font-size:11px;letter-spacing:1px;}
#bigmap{position:absolute;inset:0;z-index:25;background:rgba(10,11,16,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(54px + env(safe-area-inset-top)) 10px 10px;}
#bigmap canvas{width:100%;flex:1 1 auto;min-height:0;border-radius:10px;touch-action:none;cursor:grab;display:block;}
#bigmap canvas:active{cursor:grabbing;}
#bigmap .mbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
#bigmap .mbtns button{background:var(--panel);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font:800 14px Trebuchet MS,Arial;min-width:44px;cursor:pointer;}
#bigmap .mbtns button:active{background:#2a2e3a;}
#bigmap .leg{font-size:11px;color:#dfe3ee;margin-top:8px;text-align:center;line-height:1.6;}
#toast{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:10px;font-weight:800;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86%;}
#toast.show{opacity:1;}
#loading{position:absolute;inset:0;background:#0b0c10;display:grid;place-items:center;z-index:50;font-weight:800;font-style:italic;color:var(--yel);}
/* DESKTOP: finestra larga (solo mouse/tastiera e finestra orizzontale; su smartphone non cambia nulla) */
@media (hover:hover) and (pointer:fine) and (min-aspect-ratio:1/1){
  #app{width:min(100vw,210vh);width:min(100vw,210dvh);}
  #nav{right:auto;width:270px;}
  #job{right:auto;width:400px;}
  #calls{right:auto;width:420px;}
  #bubble{left:50%;right:auto;transform:translateX(-50%);width:min(560px,70%);}
  #toast{max-width:min(560px,86%);}
  #news{left:50%;right:auto;transform:translateX(-50%);width:min(560px,70%);}
  .screen{padding-left:max(16px,calc(50% - 240px));padding-right:max(16px,calc(50% - 240px));}
  #shade{background:linear-gradient(90deg,rgba(10,11,16,0) 0%,rgba(10,11,16,.55) 28%,rgba(10,11,16,.9) 50%,rgba(10,11,16,.55) 72%,rgba(10,11,16,0) 100%);}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="shade"></div>
  <div id="flash"></div>
  <div id="hud" class="hide">
    <div id="news"></div>
    <div id="top"><div class="chip" id="money">€ 0</div><div class="chip" id="clock">07:00</div></div>
    <div id="gauges">
      <div class="g" id="gFuel"><span class="ic">⛽</span><div class="bar"><i></i></div><span class="pc">--</span></div>
      <div class="g" id="gTire"><span class="ic">◎</span><div class="bar"><i></i></div><span class="pc">--</span></div>
      <div class="g" id="gHp"><span class="ic">🛠</span><div class="bar"><i></i></div><span class="pc">--</span></div>
      <div class="g" id="gHun"><span class="ic">🍔</span><div class="bar"><i></i></div><span class="pc">--</span></div>
    </div>
    <div id="nav" class="off"><svg viewBox="0 0 100 100" id="navIc"></svg><div><div class="d" id="navD">--</div><div class="s" id="navS"></div></div></div>
    <canvas id="mini" width="232" height="232"></canvas>
    <div id="street"></div>
    <div id="job"></div>
    <div id="calls"></div>
    <div id="bubble"></div>
    <div id="speedo"><div id="gear">1</div><div id="spd">0<small>km/h</small></div><div id="tl" class="off"></div><div id="ped" class="off">🚸</div></div>
    <div id="conf" class="off">😵 COMANDI INVERTITI</div>
    <button id="act" class="hide"></button>
    <div id="touch" class="hide">
      <div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div>
      <div class="tb" id="tG">GAS</div><div class="tb" id="tB">FRENO</div><div class="tb" id="tH">MANO</div>
    </div>
  </div>
  <div id="summary"></div>
  <div id="corner">
    <button id="btnMap" class="hide" aria-label="Mappa">🗺</button>
    <button id="btnPause" class="hide" aria-label="Pausa"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button id="btnFs" aria-label="Schermo intero"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
  </div>
  <div id="bigmap" class="hide"><canvas id="bigcv" width="900" height="900"></canvas><div class="mbtns"><button id="mzOut" aria-label="Riduci">－</button><button id="mzIn" aria-label="Ingrandisci">＋</button><button id="mzCar">🚕 Taxi</button><button id="mzAll">⤢ Tutta</button><button id="mzX">✕ Chiudi</button></div><div class="leg"></div></div>
  <div id="screens" class="screen"></div>
  <div id="toast"></div>
  <div id="loading">Costruisco la città…</div>
</div>
<script>/**

  if(meter>expect*1.3)notes.push('Hai allungato parecchio la strada');

const NPC_COLORS=[0xd8342c,0x2b63d9,0xeeeeee,0x2d2f36,0x8c9196,0x3f7d4e,0xe8862a,0x6a3d8a,0xb8b0a0,0x1f4e5c];

function mixC(a,b,t){return _c2.set(a).lerp(_c.set(b),t).getHex();}
function sky(hours){
  // alba alle 6, tramonto alle 20: 0..PI di giorno, PI..2PI di notte

  const el=Math.sin(ang);const day=clamp((el+0.08)/0.35,0,1),night=1-day,dusk=clamp(1-Math.abs(el)/0.3,0,1)*(1-clamp((-el-0.1)/0.2,0,1));
  const top=mixC(mixC(0x081022,0x3f7fd0,day),0x34407a,dusk*0.5);
  const hor=mixC(mixC(0x141c36,0xb9d5ec,day),0xf2915a,dusk*0.75);
  return{el,day,night,dusk,top,hor,ang};
}
function setWeather(rain,cloud){if(!S)return;S.wx.rain=rain;S.wx.cloud=cloud;}
function lightning(){if(S)S.ltT=0.35;}

  const ck=Math.round(cl*50)+'_'+Math.round(S.ltT*20);

    const pos=S.skyG.attributes.position,col=S.skyG.attributes.color,t=C3(k.top),h=C3(k.hor);
    for(let i=0;i<pos.count;i++){const y=pos.getY(i)/1200,f=Math.pow(clamp(y,0,1),0.55);_c.copy(h).lerp(t,f);if(y<0)_c.copy(h).multiplyScalar(1-Math.min(1,-y*2)*0.3);col.setXYZ(i,_c.r,_c.g,_c.b);}
    col.needsUpdate=true;}
  scene.fog.color.set(k.hor);scene.fog.near=lerp(100,170,k.day)*(1-0.6*rn);scene.fog.far=lerp(400,560,k.day)*(1-0.48*rn);

  hemi.color.set(mixC(0x4a5a8c,0xdbeaff,k.day));hemi.groundColor.set(mixC(0x1a1d26,0x8a8270,k.day));hemi.intensity=lerp(0.36,0.56,k.day)*(1-0.12*cl)+S.ltT*3;

function makeSpecial(c,noFollow){

    const legs=pts=>{let len=0,ns=0;for(let i=0;i<pts.length-1;i++){const q=routeInfo(CITY,pts[i],pts[i+1]);len+=q.len;ns+=q.nsig;}return{len,ns};};
    if(k==='tour'){
      let lms=CITY.landmarks.filter(l=>l.addr&&l.addr!==c.dest&&l.addr.lm!==c.pick.lm&&(d=>d>200&&d<1300)(Math.hypot(l.addr.x-c.pick.x,l.addr.z-c.pick.z)));shuffle(lms,r);lms.length=Math.min(lms.length,2);
      if(lms.length===2){const P=lms.map(l=>l.addr).sort((a,b)=>Math.hypot(a.x-c.pick.x,a.z-c.pick.z)-Math.hypot(b.x-c.pick.x,b.z-c.pick.z));
        const L=legs([c.pick,...P,c.dest]);c.wps=P;c.dist=L.len;c.mult=1.1;c.fare=fareFor(c.dist,c.night,c.mult)+10;c.target=c.dist/7+60+L.ns*9;
        c.special='tour';c.tag='GIRO TURISTICO';c.line=pickLine('tour',c.dest.name,P[0].name+' e '+P[1].name);return c;}}
    if(k==='stop'||k==='tour'){
      const mx=(c.pick.x+c.dest.x)/2,mz=(c.pick.z+c.dest.z)/2,A=CITY.addresses.filter(a=>a!==c.pick&&a!==c.dest&&Math.hypot(a.x-mx,a.z-mz)<350);
      if(A.length){const w=A[Math.floor(r()*A.length)],L=legs([c.pick,w,c.dest]);c.wps=[w];c.dist=L.len;c.fare=fareFor(c.dist,c.night,c.mult)+4;c.target=c.dist/9.5+18+L.ns*9+16;
        c.special='stop';c.tag='TAPPA';c.line=pickLine('stop',c.dest.name,w.name);return c;}}

}

// inseguimento
function startFollow(J){
  const car=G.car,fx=Math.sin(car.a),fz=-Math.cos(car.a);let best=null,bs=-1e9;
  for(const n of G.npcs){if(n.active===false||n.parked||n.police)continue;const dx=n.x-car.x,dz=n.z-car.z,d=Math.hypot(dx,dz);if(d<25||d>160)continue;const sc=(dx*fx+dz*fz)/d*100-d*0.3;if(sc>bs){bs=sc;best=n;}}
  if(!best){best=G.npcs.find(n=>!n.parked&&!n.police);spawnNpc(CITY,best,G.rng,car.x,car.z,null,40,100);}
  best.chase=true;best.respawned=false;best.vmax0=best.vmax;best.vmax=13.5;J.tgt=best;J.ft=0;J.lostT=0;J.dist=Math.hypot(best.x-car.x,best.z-car.z);clearNav();

function updateFollow(J,dt){
  const n=J.tgt,car=G.car,c=J.c;J.dist=Math.hypot(n.x-car.x,n.z-car.z);
  if(J.done){if(Math.abs(car.vf)<2)finishFollow(J);return;}
  if(J.dist<90&&!n.respawned){J.ft+=dt;J.lostT=Math.max(0,J.lostT-dt*0.5);}else J.lostT+=dt;

  if(c.special==='tour'){r.label='Giro turistico';r.fare=Math.round((r.fare+10)*100)/100;r.notes.push('Supplemento giro turistico € 10');}

function updateJob(dt){
  const J=G.job;if(!J)return;const c=J.c,car=G.car,v=Math.abs(car.vf);
  if(J.phase==='pickup'){
    const d=Math.hypot(c.pick.x-car.x,c.pick.z-car.z);
    if(d<10&&v<1.5){
      const hp=cs().hp;if(G.rng()<refuseChance(c.type,hp)){refuse(c,hp);return;}
      J.phase='board';J.bt=0;clearNav();SFX.beep(880,0.08);}
    else if(G.t-J.t0>J.limit){cancelJob('😠 '+c.name+' ha preso un altro taxi.');VOICE.say('Il cliente ha annullato la corsa');}
  }else if(J.phase==='board'){
    J.bt+=dt;if(v>4){J.phase='pickup';setNav({x:c.pick.x,z:c.pick.z,e:c.pick.e,s:c.pick.s,name:c.pick.name},'pickup');return;}

  }else if(J.phase==='ride'){
    if(c.special==='follow'){updateFollow(J,dt);return;}
    if(c.mood==='calm'&&v>15.3){J.fastT+=dt;if(!J.calmWarn&&J.fastT>1.5){J.calmWarn=true;bubble(`<b>${c.name}:</b> Piano, per favore... mi gira la testa!`);}}

$('btnFs').onclick=e=>{e.stopPropagation();toggleFs();};
$('btnPause').onclick=e=>{e.stopPropagation();pauseGame();};
$('btnMap').onclick=e=>{e.stopPropagation();if(G.mode==='play')openMap(false);};
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();pauseGame();}});
window.addEventListener('resize',()=>GFX.resize());

/* ---------- ciclo principale ---------- */
let last=performance.now(),acc=0,tAll=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;tAll+=dt;
  const pad=pollPad(dt);if(!GFX.ready||!G.car)return;
  mapTick(dt);
  if(G.mode==='play'){readInput(dt,pad);if(G.autopilot&&G.route){G.apSt=G.apSt||{};if(G.apR!==G.route){G.apR=G.route;G.apSt={};}G.input=botDrive(G.car,G.route,G.apSt,G.npcs,15,CITY);}if(G.car.fuelOut)G.input.gas=0;}
  if(G.mode==='play'||G.mode==='menu'){acc+=dt;let n=0;while(acc>=STEP&&n<8){acc-=STEP;n++;if(G.mode==='play')playStep();else attractStep();}if(n>=8)acc=0;}
  if(G.mode==='play')playFrame(dt);
  let hrs;if(G.mode==='menu'){G.menuHour=(G.menuHour+dt*0.35)%24;hrs=G.menuHour;}else hrs=hours(G.K.clock);
  if(setSignalNight(CITY,flashHour(hrs))&&G.mode==='play')toast(CITY.sigNight?'🟡 Semafori lampeggianti: agli incroci dai la precedenza a destra':'🚦 Semafori di nuovo in funzione');
  if(G.mode==='menu'||!G.K){GFX.setWeather(0,0);SFX.rain(0);CITY.wet=0;}else{GFX.setWeather(G.wxRain||0,G.wxCloud||0);SFX.rain(G.mode==='play'?G.wxRain||0:0);}
  GFX.setTime(hrs);
  const playing=G.mode!=='menu';
  GFX.update(G.car,G.mode==='play'||G.mode==='menu'?dt:0,tAll,{look:G.look||0,cam:G.mode==='menu'?1:store.opts.cam,free:!G.job||G.job.phase==='pickup',braking:G.input.brake>0.1&&G.car.vf>0.5,
    dmg:G.mode!=='menu'&&G.K?{hp:cs().hp,lights:cs().iss.lights||'ok',dead:cs().dead}:null});
  peopleAndBeacons();
  GFX.render();
  if(playing&&G.K){updateHUD();if((G.minT+=dt)>1/30){G.minT=0;drawMini();}}
  SFX.engine(G.car,G.mode==='play',G.input.gas);
  G.look=(G.look||0)+(((G.mode==='play'?G.lookT:0)||0)-(G.look||0))*Math.min(1,dt*7);
  updatePromenade(dt);updateTrains(dt);atmosphere(dt);
}

/* ---------- avvio ---------- */
function boot(){
  try{
    CITY=genCity(CITY_SEED);
    GFX.init($('cv'));GFX.setQuality(store.opts.quality);GFX.build(CITY);SFX.setVol(store.opts.vol/10);VOICE.set(store.opts.voice);VOICE.vol(store.opts.vol/10);
    buildMapBase();mapInit();
    $('loading').classList.add('hide');updateTouchVis();menuMain();requestAnimationFrame(frame);
  }catch(e){$('loading').textContent='Errore: '+e.message;console.error(e);}
}
window.__G=G;
setTimeout(boot,30);

</script>
</body>
</html>
